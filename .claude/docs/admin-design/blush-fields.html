<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="A clickable sketch of the Blush admin's Fields screens: the field set list, a set's own screen with its field tree and in-place editing, and the entry editor it produces.">
<!--
  Blush — the Fields screens, 2026-10-11

  A sketch, not an implementation: the data lives in the script and nothing is
  saved anywhere. It is one self-contained file, so open it in any browser.

  Two themes, two schemes. Set them on <html>:
    data-admin-theme="editorial"   the warm, serif theme
    data-theme="dark"              force dark; data-theme="light" forces light
  Left alone it follows the system's light or dark setting.
-->
<title>Blush Fields</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Fira+Code:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Karla:wght@400;500;600&display=swap">
<style>
/* ---------------------------------------------------------------- neutral -- */
/* Default admin theme. Cool gray chrome, cobalt accent, dense rows. */
:root {
  --bg:             #f5f6f9;
  --surface:        #ffffff;
  --surface-2:      #f0f2f6;
  --surface-3:      #e7eaf0;

  --border:         #e2e5ec;
  --border-strong:  #ccd2dd;

  --fg:             #11141b;
  --fg-2:           #535b6b;
  --fg-3:           #858d9d;

  --accent:         #2f5fe0;
  --accent-hover:   #2650c4;
  --accent-fg:      #ffffff;
  --accent-soft:    #e9effc;
  --accent-line:    #bdcdf7;

  --good:           #136b43;  --good-soft:   #e2f3e9;  --good-dot:   #1f9d5f;
  --warn:           #8a5806;  --warn-soft:   #faf0d9;  --warn-dot:   #cf8d16;
  --danger:         #a92420;  --danger-soft: #fbeae9;  --danger-dot: #d6403a;

  --shadow-1: none;
  --shadow-2: 0 2px 8px rgba(17,20,27,.05), 0 1px 2px rgba(17,20,27,.04);
  --shadow-3: 0 10px 28px rgba(17,20,27,.09), 0 2px 6px rgba(17,20,27,.05);

  --r-1: 6px;   --r-2: 10px;  --r-3: 16px;

  --s-1: 4px;  --s-2: 8px;  --s-3: 12px;  --s-4: 18px;
  --s-5: 26px; --s-6: 36px; --s-7: 52px;

  --font-ui:      "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-title:   "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono:    "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --base:         13px;
  --h1:           26px;
  --h1-track:     -.024em;
  --title-size:   13.5px;
  --title-weight: 500;
  --title-track:  -.005em;

  --pad-row:   14px;
  --pad-panel: 17px;
  --pad-x:     22px;
  --ctl:       34px;
  --ctl-sm:    30px;
  --stat-v:    30px;

  --railbar:   74px;
  --rail:      262px;
  --bar:       62px;
  --work-max:  1400px;
  --measure:   72ch;

  /* A scrim darkens, so its agent is --fg in light and --bg in dark. There is
     no token for it yet; filed in 50-open-questions.md. */
  --scrim: rgba(17, 20, 27, .42);

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-color-scheme="light"]):not([data-theme="light"]) {
    --bg:            #0b0d12;
    --surface:       #13161d;
    --surface-2:     #1a1e27;
    --surface-3:     #222733;
    --border:        #242936;
    --border-strong: #353c4c;
    --fg:            #e9ebf0;
    --fg-2:          #a3abba;
    --fg-3:          #747d8e;
    --accent:        #7295f7;
    --accent-hover:  #8aa8f9;
    --accent-fg:     #0b0d12;
    --accent-soft:   #182444;
    --accent-line:   #2c3d68;
    --good:   #5ecb92;  --good-soft:   #102a1e;  --good-dot:   #35b877;
    --warn:   #e3b360;  --warn-soft:   #2b2312;  --warn-dot:   #d69f3c;
    --danger: #f28d84;  --danger-soft: #301917;  --danger-dot: #e0655c;
    --shadow-1: none;
    --shadow-2: 0 2px 8px rgba(0,0,0,.3);
    --shadow-3: 0 10px 28px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    --scrim: rgba(3, 4, 7, .58);
    color-scheme: dark;
  }
}

:root[data-color-scheme="dark"],
:root[data-theme="dark"]:not([data-color-scheme="light"]) {
  --bg:            #0b0d12;
  --surface:       #13161d;
  --surface-2:     #1a1e27;
  --surface-3:     #222733;
  --border:        #242936;
  --border-strong: #353c4c;
  --fg:            #e9ebf0;
  --fg-2:          #a3abba;
  --fg-3:          #747d8e;
  --accent:        #7295f7;
  --accent-hover:  #8aa8f9;
  --accent-fg:     #0b0d12;
  --accent-soft:   #182444;
  --accent-line:   #2c3d68;
  --good:   #5ecb92;  --good-soft:   #102a1e;  --good-dot:   #35b877;
  --warn:   #e3b360;  --warn-soft:   #2b2312;  --warn-dot:   #d69f3c;
  --danger: #f28d84;  --danger-soft: #301917;  --danger-dot: #e0655c;
  --shadow-1: none;
  --shadow-2: 0 2px 8px rgba(0,0,0,.3);
  --shadow-3: 0 10px 28px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  --scrim: rgba(3, 4, 7, .58);
  color-scheme: dark;
}

/* -------------------------------------------------------------- editorial -- */
/* Second bundled theme. Warm paper, teal accent, serif titles, looser rows. */
:root[data-admin-theme="editorial"] {
  --bg:            #f6f2ec;
  --surface:       #fffdfa;
  --surface-2:     #f1ece3;
  --surface-3:     #e7e0d4;
  --border:        #e5ded2;
  --border-strong: #cdc3b3;
  --fg:            #23201b;
  --fg-2:          #5d564c;
  --fg-3:          #8e867a;
  --accent:        #17595e;
  --accent-hover:  #124a4e;
  --accent-fg:     #fffdfa;
  --accent-soft:   #e2eded;
  --accent-line:   #b6d3d5;
  --good:   #4c6d2c;  --good-soft:   #edf1e2;  --good-dot:   #6f9b45;
  --warn:   #8a5a14;  --warn-soft:   #f8eeda;  --warn-dot:   #c58a2a;
  --danger: #9c3327;  --danger-soft: #f8e7e2;  --danger-dot: #c2503f;
  --shadow-1: none;
  --shadow-2: 0 2px 8px rgba(60,48,32,.05), 0 1px 2px rgba(60,48,32,.04);
  --shadow-3: 0 10px 28px rgba(60,48,32,.09), 0 2px 6px rgba(60,48,32,.05);
  --scrim: rgba(35, 32, 27, .42);

  --r-1: 8px;  --r-2: 12px;  --r-3: 20px;

  --font-ui:      "Karla", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Newsreader", ui-serif, Georgia, "Times New Roman", serif;
  --font-title:   "Newsreader", ui-serif, Georgia, "Times New Roman", serif;

  --base: 13.5px;
  --h1: 32px;  --h1-track: -.014em;
  --title-size: 15.5px;  --title-weight: 500;  --title-track: 0;

  --pad-row: 16px;  --pad-panel: 19px;  --pad-x: 26px;  --stat-v: 34px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-color-scheme="light"]):not([data-theme="light"])[data-admin-theme="editorial"] {
    --bg:            #15120e;
    --surface:       #1d1915;
    --surface-2:     #26211a;
    --surface-3:     #322b22;
    --border:        #302a21;
    --border-strong: #463e31;
    --fg:            #f0e9dd;
    --fg-2:          #b4a996;
    --fg-3:          #877c6c;
    --accent:        #72bec2;
    --accent-hover:  #8bcccf;
    --accent-fg:     #15120e;
    --accent-soft:   #113032;
    --accent-line:   #1d4a4d;
    --good:   #9cc16b;  --good-soft:   #1c2413;  --good-dot:   #84ad55;
    --warn:   #dcae63;  --warn-soft:   #2c2314;  --warn-dot:   #c79646;
    --danger: #e8897b;  --danger-soft: #2f1a16;  --danger-dot: #cf6a5c;
    --shadow-1: none;
    --shadow-2: 0 2px 8px rgba(0,0,0,.34);
    --shadow-3: 0 10px 28px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.34);
    --scrim: rgba(8, 6, 4, .58);
    color-scheme: dark;
  }
}

:root[data-color-scheme="dark"][data-admin-theme="editorial"],
:root[data-theme="dark"]:not([data-color-scheme="light"])[data-admin-theme="editorial"] {
  --bg:            #15120e;
  --surface:       #1d1915;
  --surface-2:     #26211a;
  --surface-3:     #322b22;
  --border:        #302a21;
  --border-strong: #463e31;
  --fg:            #f0e9dd;
  --fg-2:          #b4a996;
  --fg-3:          #877c6c;
  --accent:        #72bec2;
  --accent-hover:  #8bcccf;
  --accent-fg:     #15120e;
  --accent-soft:   #113032;
  --accent-line:   #1d4a4d;
  --good:   #9cc16b;  --good-soft:   #1c2413;  --good-dot:   #84ad55;
  --warn:   #dcae63;  --warn-soft:   #2c2314;  --warn-dot:   #c79646;
  --danger: #e8897b;  --danger-soft: #2f1a16;  --danger-dot: #cf6a5c;
  --shadow-1: none;
  --shadow-2: 0 2px 8px rgba(0,0,0,.34);
  --shadow-3: 0 10px 28px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.34);
  --scrim: rgba(8, 6, 4, .58);
  color-scheme: dark;
}

/* ------------------------------------------------------------------ base -- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:var(--base);
  line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
.scrim-nav,dialog.modal::backdrop{background:var(--scrim)}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--r-1);
  font-size:11px;color:var(--fg-2);background:var(--surface-2);border:1px solid var(--border);white-space:nowrap}

/* --- reset and utilities (menus.css 100-110) --- */
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
code{font-family:var(--font-mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* --- shell (menus.css 125-167) --- */
/* ================= shell ================= */
.app{display:flex;flex:1;min-height:0}
.railbar{width:var(--railbar);flex:none;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding:var(--s-3) 0;gap:var(--s-1);z-index:2}
.rb-mark{width:34px;height:34px;border-radius:var(--r-2);background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:600;font-size:15px;letter-spacing:-.02em;margin-bottom:var(--s-3);flex:none}
.rb{width:60px;padding:10px 2px 8px;border-radius:var(--r-2);display:flex;flex-direction:column;align-items:center;gap:6px;
  color:var(--fg-3);font-size:9.5px;font-weight:500;line-height:1.2;text-align:center}
.rb .ic{width:19px;height:19px;stroke-width:1.5}
.rb:hover{background:var(--surface-2);color:var(--fg-2)}
.rb[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.rail{width:var(--rail);flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sec-head{display:flex;align-items:center;padding:var(--s-4);border-bottom:1px solid var(--border);min-height:var(--bar);flex:none}
.sec-head h2{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-.01em}
.sec-head .sub{display:block;font-size:11px;color:var(--fg-3);font-weight:400;font-family:var(--font-ui);letter-spacing:0;margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:var(--s-3);display:flex;flex-direction:column;gap:3px;min-height:0}
.nav-group-label{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);padding:var(--s-5) var(--s-2) var(--s-2)}
.nav-group-label:first-child{padding-top:var(--s-1)}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-1);color:var(--fg-2);width:100%;text-align:left;font-size:13px;position:relative}
.nav-item:hover{background:var(--surface-2);color:var(--fg)}
.nav-item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item[aria-current="page"]{background:var(--surface-2);color:var(--fg);font-weight:500}
.nav-item[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:2px;border-radius:0 2px 2px 0;background:var(--accent)}
.nav-count{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.nav-count.alert{color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:99px;font-weight:500}

.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.topbar{height:var(--bar);flex:none;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:var(--s-2);padding:0 var(--s-4)}
.icon-btn{width:32px;height:32px;border-radius:var(--r-1);display:grid;place-items:center;color:var(--fg-2);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.burger{display:none}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;font-size:13px;color:var(--fg-3)}
.crumbs .sep{color:var(--border-strong);flex:none;padding:0 2px}
.crumbs .crumb{flex:0 1 auto;min-width:0;padding:4px 7px;border-radius:var(--r-1);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs .crumb:hover{background:var(--surface-2);color:var(--fg)}
.crumbs .here{flex:none;padding:4px 2px;color:var(--fg);font-weight:500;white-space:nowrap}
.topbar .spacer{flex:1}
.kbar{display:flex;align-items:center;gap:8px;height:var(--ctl);padding:0 12px;border:1px solid var(--border);border-radius:var(--r-1);color:var(--fg-3);background:var(--bg);min-width:220px}
.kbar span{flex:1;text-align:left;font-size:12.5px}
kbd{font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 4px;color:var(--fg-3);background:var(--surface)}
.avatar{width:29px;height:29px;border-radius:99px;background:var(--surface-3);color:var(--fg-2);display:grid;place-items:center;font-size:10.5px;font-weight:600;flex:none}
.work{flex:1;overflow-y:auto;min-height:0}
.wrap{padding:var(--s-6) var(--s-6) 96px;max-width:var(--work-max);margin:0 auto}
.scrim-nav{display:none}

/* --- page parts, buttons, panel, pill, table (menus.css 169-227) --- */
/* ================= page parts (as in the prototype) ================= */
.page-head{display:flex;align-items:flex-start;gap:var(--s-4);flex-wrap:wrap;margin-bottom:var(--s-6)}
.page-head h1{font-family:var(--font-display);font-size:var(--h1);font-weight:600;letter-spacing:var(--h1-track);text-wrap:balance;line-height:1.2}
.page-head .sub{color:var(--fg-2);font-size:13px;margin-top:7px;max-width:70ch;line-height:1.6}
.page-head .sub code{font-size:12px}
.page-head .sub.facts{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap}
.page-head .acts{margin-left:auto;display:flex;gap:var(--s-2);flex-wrap:wrap;align-items:center;padding-top:3px}
.unsaved{font-size:11.5px;color:var(--fg-3);display:inline-flex;align-items:center;gap:6px}
.unsaved .d{width:6px;height:6px;border-radius:99px;background:var(--warn-dot)}

.btn{display:inline-flex;align-items:center;gap:7px;height:var(--ctl);padding:0 14px;border-radius:var(--r-1);border:1px solid var(--border);background:var(--surface);color:var(--fg);font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent;color:var(--fg)}
.btn-danger{color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger-soft)}
.btn-danger-fill{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn-danger-fill:hover{background:var(--danger);opacity:.9}
.btn.sm{height:var(--ctl-sm);padding:0 11px;font-size:12px}
.btn.icon{width:var(--ctl-sm);padding:0;justify-content:center}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3)}
.panel-head{display:flex;align-items:center;gap:var(--s-3);padding:var(--pad-panel) var(--pad-x);border-bottom:1px solid var(--border);min-height:58px;flex-wrap:wrap}
.panel-head h2{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-.005em}
.panel-head .hint{font-size:11.5px;color:var(--fg-3)}
.panel-head .end{margin-left:auto;display:flex;align-items:center;gap:8px}
.panel-body{padding:var(--s-4) var(--pad-x) var(--s-5);display:flex;flex-direction:column;gap:var(--s-4)}
.stack{display:flex;flex-direction:column;gap:var(--s-4)}
.link{color:var(--accent);font-weight:500}
.link:hover{text-decoration:underline}

.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 8px;border-radius:99px;font-size:11px;font-weight:500;white-space:nowrap;border:1px solid transparent;vertical-align:middle}
.pill .d{width:5px;height:5px;border-radius:99px;flex:none}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.good .d{background:var(--good-dot)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.warn .d{background:var(--warn-dot)}
.pill.danger{background:var(--danger-soft);color:var(--danger)} .pill.danger .d{background:var(--danger-dot)}
.pill.neutral{background:var(--surface-2);color:var(--fg-2);border-color:var(--border)} .pill.neutral .d{background:var(--border-strong)}
/* A location chip is a label, not a status: no dot. */
.loc{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--r-1);font-size:11px;color:var(--fg-2);background:var(--surface-2);border:1px solid var(--border);white-space:nowrap}
.loc .ic{width:12px;height:12px;color:var(--fg-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:640px}
thead th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3);padding:13px var(--pad-x);border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:var(--pad-row) var(--pad-x);border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.t-title{font-family:var(--font-title);font-size:var(--title-size);font-weight:var(--title-weight);letter-spacing:var(--title-track);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-title:hover{color:var(--accent)}
.t-slug{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-3);margin-top:4px}
.quiet{color:var(--fg-3);font-size:12px}
.row-more{opacity:0;width:30px;height:30px;border-radius:var(--r-1);display:grid;place-items:center;color:var(--fg-3)}
tr:hover .row-more,.row-more[aria-expanded="true"],.row-more:focus-visible{opacity:1}
.row-more:hover{background:var(--surface-3);color:var(--fg)}
@media (hover:none){.row-more{opacity:1}}

/* --- the drawn select, and menus (menus.css 239-263) --- */
/* The drawn select: a button that names the value and opens a .menu. */
.xs{display:flex;align-items:center;gap:var(--s-2);width:100%;height:var(--ctl);padding:0 10px 0 12px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface);font-size:12.5px;color:var(--fg);text-align:left}
.xs:hover{border-color:var(--border-strong)}
.xs .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xs .v.def{color:var(--fg-2)}
.xs .ic{color:var(--fg-3)}
.xs[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* Menus and popovers */
.menu{position:fixed;z-index:60;min-width:212px;max-width:320px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);box-shadow:var(--shadow-2);padding:7px}
.menu button{display:flex;align-items:center;gap:11px;width:100%;padding:8px 11px;border-radius:var(--r-1);font-size:12.5px;color:var(--fg-2);text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--surface-2);color:var(--fg);outline:0}
.menu button.danger{color:var(--danger)}
.menu button.danger:hover{background:var(--danger-soft)}
.menu button[aria-checked="true"]{background:var(--accent-soft);color:var(--accent)}
.menu button .l{flex:1;min-width:0}
.menu button .ds{display:block;font-size:11px;color:var(--fg-3);line-height:1.45;margin-top:1px}
.menu button[aria-checked="true"] .ds{color:var(--accent)}
.menu button .tail{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-3);flex:none}
.menu.wide{min-width:288px}
.menu.wide button{align-items:flex-start;padding:9px 11px}
.menu.wide .ic{margin-top:2px}
.menu .div{height:1px;background:var(--border);margin:7px -7px}
.menu .sec{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);padding:10px 11px 4px}
.menu .sec:first-child{padding-top:4px}

/* --- forms (menus.css 265-308) --- */
/* Forms */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field > label,.field > .lab{font-size:12px;color:var(--fg-2);font-weight:500;display:flex;align-items:center;gap:var(--s-2)}
.field .hint{font-size:11.5px;color:var(--fg-3);line-height:1.5}
.inp{height:var(--ctl);border:1px solid var(--border);border-radius:var(--r-1);background:var(--bg);padding:0 12px;font-size:12.5px;outline:none;width:100%;color:var(--fg)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.inp::placeholder{color:var(--fg-3)}
.inp.mono{font-size:12px}
textarea.inp{height:auto;padding:9px 12px;resize:vertical;min-height:64px;line-height:1.5}
.inp[readonly]{background:var(--surface-2);color:var(--fg-2)}
.inp-row{display:flex;gap:var(--s-2);align-items:center}
.inp-row .inp{flex:1;min-width:0}
.lang{display:inline-flex;margin-left:auto;border:1px solid var(--border);border-radius:var(--r-1);overflow:hidden}
.lang button{font-family:var(--font-mono);font-size:10.5px;padding:1px 7px;color:var(--fg-3)}
.lang button + button{border-left:1px solid var(--border)}
.lang button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.lang button .fill{display:inline-block;width:4px;height:4px;border-radius:99px;background:var(--accent);margin-left:4px;vertical-align:2px}
.ref{display:flex;align-items:center;gap:var(--s-3);padding:9px 10px 9px 12px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--bg)}
.ref .ic{color:var(--fg-3)}
.ref .rt{flex:1;min-width:0}
.ref .rt b{display:block;font-weight:500;font-size:12.5px}
.ref .rt code{display:block;font-size:10.5px;color:var(--fg-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check{display:flex;align-items:flex-start;gap:11px;cursor:pointer;padding:3px 0}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.check .box{width:16px;height:16px;border:1px solid var(--border-strong);border-radius:4px;display:grid;place-items:center;background:var(--surface);flex:none;margin-top:1px;color:transparent}
.check .box .ic{width:11px;height:11px;stroke-width:2.6}
.check input:checked + .box{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.check input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.check .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.check .tx b{font-weight:500;font-size:12.5px}
.check .tx span{font-size:11.5px;color:var(--fg-3);line-height:1.45}
.fold{border-top:1px solid var(--border);padding-top:var(--s-3)}
.fold > summary{cursor:pointer;font-size:12px;font-weight:500;color:var(--fg-2);display:flex;align-items:center;gap:6px;list-style:none}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary .ic{width:12px;height:12px;transition:transform .12s}
.fold[open] > summary .ic{transform:rotate(90deg)}
.fold > .fold-body{display:flex;flex-direction:column;gap:var(--s-4);padding-top:var(--s-4)}
.fgroup{border:1px solid var(--border);border-radius:var(--r-2);padding:var(--s-3) var(--s-4) var(--s-4);display:flex;flex-direction:column;gap:var(--s-3)}
.fgroup-h{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);display:flex;align-items:center;gap:6px}
.fgroup-h .ic{width:12px;height:12px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
@media (max-width:520px){.two-col{grid-template-columns:1fr}}
.snippet{display:flex;align-items:center;gap:var(--s-2);padding:6px 6px 6px 12px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface-2)}
.snippet code{flex:1;min-width:0;font-size:12px;overflow-x:auto;white-space:nowrap}

/* --- the item tree (menus.css 322-349) --- */
/* --- the item tree: the one new component. Rows are flat; aria-level and the
   indent carry the nesting, the way the Pages tree does. --- */
.mtree{position:relative;padding:var(--s-2) 0;--limit:99;--indent:22px;--lead:calc(var(--pad-x) - 8px + 18px + var(--s-2))}
.mt-item{position:relative;outline:0}
.mt-row{display:flex;align-items:center;gap:var(--s-2);padding:10px var(--pad-x) 10px calc(var(--pad-x) - 8px);min-height:54px;position:relative;cursor:default;user-select:none}
.mt-item:hover > .mt-row{background:var(--surface-2)}
.mt-item[aria-selected="true"] > .mt-row{background:var(--accent-soft)}
.mt-item:focus-visible > .mt-row{box-shadow:inset 0 0 0 2px var(--accent)}
.mt-grip{width:18px;height:28px;display:grid;place-items:center;color:var(--fg-3);cursor:grab;flex:none;opacity:.55}
.mt-item:hover .mt-grip,.mt-item[aria-selected="true"] .mt-grip{opacity:1}
.mt-ind{flex:none;width:calc(var(--d) * var(--indent))}
.twist{width:18px;height:18px;flex:none;display:grid;place-items:center;color:var(--fg-3);border-radius:4px}
.twist:hover{background:var(--surface-3);color:var(--fg)}
.twist .ic{width:12px;height:12px;transition:transform .12s}
.twist[aria-expanded="true"] .ic{transform:rotate(90deg)}
.twist.leaf{visibility:hidden}
.mt-kind{width:26px;height:26px;border-radius:var(--r-1);display:grid;place-items:center;color:var(--fg-2);background:var(--surface-2);border:1px solid var(--border);flex:none}
.mt-item[aria-selected="true"] .mt-kind{background:var(--surface);border-color:var(--accent-line);color:var(--accent)}
.mt-kind .ic{width:14px;height:14px}
.mt-main{flex:1;min-width:0}
.mt-t{display:flex;align-items:baseline;gap:var(--s-2);min-width:0}
.mt-t .tt{font-family:var(--font-title);font-size:var(--title-size);font-weight:var(--title-weight);letter-spacing:var(--title-track);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-t .tt.heading{text-transform:uppercase;font-family:var(--font-ui);font-size:11px;letter-spacing:.07em;font-weight:600;color:var(--fg-2)}
.mt-t .ovr{flex:none;font-size:10.5px;color:var(--fg-3);border:1px dashed var(--border-strong);border-radius:4px;padding:0 5px;white-space:nowrap}
.mt-s{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-3);margin-top:2px;min-width:0}
.mt-s code{font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mt-s s{text-decoration-thickness:1px}
.mt-chips{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}

/* --- drop indication while dragging (menus.css 358-364) --- */
/* Drop indication while dragging. */
.mt-item.drop-before > .mt-row::before,.mt-item.drop-after > .mt-row::after{content:"";position:absolute;left:calc(var(--lead) + var(--dd,0) * var(--indent));right:var(--pad-x);height:2px;background:var(--accent);border-radius:2px}
.mt-item.drop-before > .mt-row::before{top:-1px}
.mt-item.drop-after > .mt-row::after{bottom:-1px}
.mt-item.drop-in > .mt-row{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.mt-item.dragging{opacity:.4}
@media (max-width:640px){.mt-chips{display:none}.mtree{--indent:16px}}

/* --- empty states (menus.css 389-404) --- */
/* Empty states */
.empty{padding:72px var(--s-5) 64px;text-align:center;color:var(--fg-2);display:flex;flex-direction:column;align-items:center}
.empty > .ic{width:26px;height:26px;color:var(--fg-3);margin-bottom:var(--s-4)}
.empty h3{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--fg);margin-bottom:7px}
.empty p{font-size:12.5px;color:var(--fg-3);max-width:48ch;line-height:1.6}
.empty .acts{display:flex;gap:var(--s-2);flex-wrap:wrap;justify-content:center;margin-top:var(--s-5)}
.empty .or{margin-top:var(--s-6);padding-top:var(--s-4);border-top:1px solid var(--border);width:min(440px,100%);display:flex;flex-direction:column;gap:var(--s-2);align-items:stretch}
.empty .or .k{font-size:11.5px;color:var(--fg-3)}
.seed{display:flex;align-items:center;gap:var(--s-3);padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-2);text-align:left;background:var(--surface)}
.seed:hover{border-color:var(--border-strong);background:var(--surface-2)}
.seed .ic{color:var(--fg-3)}
.seed .l{flex:1;min-width:0}
.seed .l b{display:block;font-size:12.5px;font-weight:500;color:var(--fg)}
.seed .l span{font-size:11.5px;color:var(--fg-3)}
.empty.compact{padding:var(--s-6) var(--s-5)}
.empty.compact h3{font-size:14.5px}

/* --- notice line (menus.css 406-408) --- */
/* Notice line (theme details on an inactive theme) */
.notice{display:flex;gap:var(--s-2);align-items:flex-start;padding:12px var(--pad-x);background:var(--surface-2);border-bottom:1px solid var(--border);font-size:12px;color:var(--fg-2)}
.notice .ic{width:14px;height:14px;margin-top:2px;color:var(--fg-3)}

/* --- modal, pick list, search (menus.css 418-444) --- */
/* Modal */
dialog.modal{border:0;padding:0;background:var(--surface);color:var(--fg);border-radius:var(--r-3);box-shadow:var(--shadow-3);width:min(480px,calc(100vw - 32px));max-height:calc(100% - 48px)}
dialog.modal::backdrop{background:rgba(17,20,27,.32)}
.modal-h{padding:var(--s-5) var(--s-5) var(--s-2)}
.modal-h h2{font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.modal-h p{font-size:12.5px;color:var(--fg-2);margin-top:6px;line-height:1.55}
.modal-b{padding:var(--s-3) var(--s-5) var(--s-5);display:flex;flex-direction:column;gap:var(--s-4)}
.modal-f{display:flex;gap:var(--s-2);justify-content:flex-end;padding:var(--s-4) var(--s-5);border-top:1px solid var(--border);background:var(--bg);border-radius:0 0 var(--r-3) var(--r-3);flex-wrap:wrap}
.use-list{border:1px solid var(--border);border-radius:var(--r-2)}
.use-h{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);padding:10px 14px 6px}
.use-row{display:flex;align-items:center;gap:var(--s-3);padding:9px 14px;border-top:1px solid var(--border);font-size:12.5px}
.use-h + .use-row{border-top:0}
.use-row .ic{color:var(--fg-3)}
.use-row .l{flex:1;min-width:0}
.use-row code{font-size:10.5px;color:var(--fg-3)}
.pick-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-2);max-height:280px;overflow:auto}
.pick-row{display:flex;align-items:center;gap:var(--s-3);padding:10px 12px;border-top:1px solid var(--border);text-align:left;width:100%}
.pick-row:first-child{border-top:0}
.pick-row:hover{background:var(--surface-2)}
.pick-row[aria-checked="true"]{background:var(--accent-soft)}
.pick-row .ic{color:var(--fg-3)}
.pick-row .l{flex:1;min-width:0}
.pick-row .l b{display:block;font-weight:500;font-size:12.5px}
.pick-row .l code{font-size:10.5px;color:var(--fg-3)}
.search{display:flex;align-items:center;gap:9px;height:var(--ctl);padding:0 12px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface);color:var(--fg-3)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:12.5px;color:var(--fg)}

/* --- toasts: the border is the countdown (menus.css 446-466) --- */
/* Toasts: the border is the countdown. */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:var(--s-2);align-items:flex-end;pointer-events:none}
.toast{position:relative;pointer-events:auto;display:flex;align-items:center;gap:var(--s-3);background:var(--surface);border-radius:var(--r-2);box-shadow:var(--shadow-2);padding:11px 11px 11px 15px;font-size:12.5px;max-width:min(420px,calc(100vw - 32px))}
.toast > .ic{color:var(--good-dot)}
.toast.info > .ic{color:var(--accent)}
.toast .msg{min-width:0;flex:1;line-height:1.45}
.toast .div{flex:none;width:1px;align-self:stretch;margin-block:3px;background:var(--border)}
.toast .undo{flex:none;display:inline-flex;align-items:center;gap:6px;height:var(--ctl-sm);padding:0 11px;border-radius:var(--r-1);font-size:12px;font-weight:500;color:var(--accent)}
.toast .undo:hover{background:var(--accent-soft)}
.toast-ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.toast-ring rect{x:.75px;y:.75px;width:calc(100% - 1.5px);height:calc(100% - 1.5px);rx:calc(var(--r-2) - .75px);fill:none;stroke-width:1.5}
.toast-ring .track{stroke:var(--border)}
.toast-ring .run{stroke:var(--good-dot);stroke-dasharray:100;stroke-dashoffset:0}
.toast.info .toast-ring .run{stroke:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:rise .16s ease-out}
  .toast-ring .run{animation:toast-run var(--life,2600ms) linear forwards}
  .toast.held .toast-ring .run{animation-play-state:paused}
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes toast-run{to{stroke-dashoffset:100}}

/* --- breakpoints (menus.css 468-484) --- */
@media (max-width:860px){
  .railbar,.rail{position:fixed;top:0;bottom:0;z-index:52;transform:translateX(-100%);transition:transform .18s ease}
  .railbar{left:0}
  .rail{left:var(--railbar);box-shadow:var(--shadow-3);transform:translateX(calc(-100% - var(--railbar)))}
  .app.nav-open .railbar,.app.nav-open .rail{transform:translateX(0)}
  .app.nav-open .scrim-nav{display:block;position:fixed;inset:0;z-index:51;background:rgba(17,20,27,.28)}
  .burger{display:grid}
}
@media (max-width:640px){
  .wrap{padding:var(--s-5) var(--s-4) 80px}
  .kbar{min-width:0;width:var(--ctl);padding:0;justify-content:center}
  .kbar span,.kbar kbd{display:none}
  .crumbs .crumb-sec,.crumbs .crumb-sec + .sep{display:none}
  .page-head h1{font-size:22px}
  .panel-head .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* --- menu height (menus.css 487-487) --- */
.menu{max-height:min(440px,70vh);overflow:auto}

/* --- one line per row (menus.css 494-506) --- */
/* One line per row. No address: the kind tile says what it is, the Item fields say where. */
.mt-row{min-height:50px;padding-block:8px}
.mt-pick{flex:1;min-width:0;display:flex;align-items:center;gap:var(--s-2);text-align:left;border-radius:var(--r-1);padding:2px 0;cursor:pointer}
.mt-pick:focus-visible{outline:none}
.mt-item:has(> .mt-row .mt-pick:focus-visible) > .mt-row,
.mt-item:has(> .mt-row .rn-inp:focus) > .mt-row{box-shadow:inset 0 0 0 2px var(--accent)}
.mt-item.sel > .mt-row{background:var(--accent-soft)}
.mt-item.sel .mt-kind{background:var(--surface);border-color:var(--accent-line);color:var(--accent)}
.mt-item:hover > .mt-row{background:var(--surface-2)}
.mt-item.sel:hover > .mt-row{background:var(--accent-soft)}
.mt-t{align-items:center;flex-wrap:nowrap}
.mt-sub{flex:none;font-size:11.5px;color:var(--fg-3);white-space:nowrap}
.mt-item.editing > .mt-row{background:var(--surface-2);border-bottom:1px dashed var(--border)}

/* --- row buttons (menus.css 508-518) --- */
/* Row buttons, with names that show on hover and on keyboard focus. */
.rowctl{display:flex;gap:2px;flex:none;align-items:center}
.rowctl .sp{width:1px;height:18px;background:var(--border);margin:0 4px}
.rb2{position:relative;width:30px;height:30px;border-radius:var(--r-1);display:grid;place-items:center;color:var(--fg-2)}
.rb2:hover{background:var(--surface-3);color:var(--fg)}
.rb2[disabled]{opacity:.32;pointer-events:none}
.rb2[aria-expanded="true"]{background:var(--accent);color:var(--accent-fg)}
.rb2[data-tip]:hover::after,.rb2[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:0;z-index:20;
  white-space:nowrap;font-size:11px;font-weight:500;line-height:1.3;padding:5px 8px;border-radius:var(--r-1);background:var(--fg);color:var(--bg);pointer-events:none}
.tree-hover .mt-item:not(.sel):not(.editing):not(:hover):not(:focus-within) .rowctl > *{visibility:hidden}
@media (hover:none){.tree-hover .mt-item:not(.sel):not(.editing) .rowctl{display:none}}

/* --- the form's footer (menus.css 546-548) --- */
.ed-foot{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap}
.ed-foot .hint{font-size:11.5px;color:var(--fg-3);margin-right:auto}
.ins-row{display:flex;gap:var(--s-2);flex-wrap:wrap}

/* --- one-column layout (menus.css 551-551) --- */
.lay-one{max-width:920px;margin-inline:auto}

/* --- back link, meta line (menus.css 636-649) --- */
.lc-act{margin-top:var(--s-2);font-size:12px;font-weight:500;color:var(--accent)}

/* The Roles screen's frame: back link, title, meta line. */
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--fg-2);margin-bottom:var(--s-3);padding:2px 4px 2px 0;border-radius:var(--r-1)}
.back:hover{color:var(--fg)}
.back .ic{width:14px;height:14px}
.ph-ref{margin-bottom:var(--s-5)}
.meta-line{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s-2) 0;margin-top:var(--s-3);font-size:12.5px;color:var(--fg-2)}
.meta-line .mi{display:inline-flex;align-items:center;gap:6px;padding:0 var(--s-3);border-left:1px solid var(--border)}
.meta-line .mi:first-child{padding-left:0;border-left:0}
.meta-line .mi .ic{width:14px;height:14px;color:var(--fg-3)}
.meta-line code{font-size:12px;color:var(--fg-2)}
.link-btn{color:var(--accent);font-weight:500;font-size:12.5px}
.link-btn:hover{text-decoration:underline}

/* --- the open item is one unit (menus.css 713-765) --- */
/* Actions stay at the top right; the meta line wraps under the title instead. */
.ph-ref{flex-wrap:nowrap}
.ph-ref .ph-main{flex:1;min-width:0}
.ph-ref .acts{flex:none}
@media (max-width:760px){.ph-ref{flex-wrap:wrap}.ph-ref .acts{margin-left:0}}

/* The open item is one unit: its row and its fields share one tinted ground,
   and the fields start under the item's title, at its level. */
.mt-item.editing{background:var(--surface-2);border-block:1px solid var(--border)}
.mt-item.editing > .mt-row,.mt-item.editing.sel > .mt-row,.mt-item.editing:hover > .mt-row{background:transparent;border-bottom:0}
.mt-item.editing .mt-kind{background:var(--surface)}
.mt-edit{margin:0;border:0;border-radius:0;background:transparent;display:block;
  padding:var(--s-1) var(--pad-x) var(--s-5) calc(var(--pad-x) - 8px + 18px + 18px + 26px + 4 * var(--s-2) + var(--d) * var(--indent))}
.ed-inner{max-width:680px;display:flex;flex-direction:column;gap:var(--s-4)}
.ed-row{display:grid;gap:var(--s-4)}
.ed-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.ed-3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
.mt-edit .field{gap:6px}
.mt-edit .inp{background:var(--surface)}
.mt-edit .inp:focus{background:var(--surface)}
.mt-edit textarea.inp{min-height:0}
.ed-ref{height:var(--ctl);padding:0 4px 0 10px;gap:var(--s-2);background:var(--surface)}
.ed-ref .rt{display:flex;align-items:baseline;gap:var(--s-2);min-width:0}
.ed-ref .rt b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;max-width:60%}
.ed-ref .rt code{margin:0;font-size:10.5px}
.ed-ref .btn.sm{height:calc(var(--ctl) - 8px)}
.ed-note{font-size:12px;color:var(--fg-3);line-height:1.5;min-height:var(--ctl);display:flex;align-items:center}
.ed-pick{width:100%;justify-content:flex-start;background:var(--surface)}
.ed-sub{display:flex;flex-direction:column;gap:var(--s-2);padding-top:var(--s-4);border-top:1px solid var(--border)}
.ed-sub-h{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
.ed-sub-h .ic{width:12px;height:12px}
.ed-fold{border-top:1px solid var(--border);padding-top:var(--s-3)}
.ed-fold > summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--fg-2);padding:2px 0}
.ed-fold > summary::-webkit-details-marker{display:none}
.ed-fold > summary .ic{width:12px;height:12px;transition:transform .12s}
.ed-fold[open] > summary .ic{transform:rotate(90deg)}
.ed-fold > .ed-row{margin-top:var(--s-3)}
.ed-foot{display:flex;align-items:center;gap:var(--s-3);padding-top:var(--s-1)}
.ed-foot .hint{font-size:11.5px;color:var(--fg-3);margin-right:auto}
@media (max-width:640px){
  .mt-edit{padding-left:var(--pad-x)}
  .ed-2,.ed-3{grid-template-columns:minmax(0,1fr)}
}

/* The first row sits straight under the panel head's border. */
.mtree{padding:0}
/* An open item: a full-width rule under its row and under its form; the form
   uses the panel's full width. */
.mt-item.editing{border-top:0;border-bottom:1px solid var(--border)}
.mt-item.editing > .mt-row,.mt-item.editing.sel > .mt-row,.mt-item.editing:hover > .mt-row{border-bottom:1px solid var(--border);background:var(--accent-soft)}
.mt-edit{padding:var(--s-4) var(--pad-x) var(--s-5)}
.ed-inner{max-width:none}
.mtree > .mt-item:last-child.editing{border-bottom:0}

/* --- the first row, and the open item's rules (menus.css 757-766) --- */
/* The first row sits straight under the panel head's border. */
.mtree{padding:0}
/* An open item: a full-width rule under its row and under its form; the form
   uses the panel's full width. */
.mt-item.editing{border-top:0;border-bottom:1px solid var(--border)}
.mt-item.editing > .mt-row,.mt-item.editing.sel > .mt-row,.mt-item.editing:hover > .mt-row{border-bottom:1px solid var(--border);background:var(--accent-soft)}
.mt-edit{padding:var(--s-4) var(--pad-x) var(--s-5)}
.ed-inner{max-width:none}
.mtree > .mt-item:last-child.editing{border-bottom:0}


/* --- modal rule, kebab, save state, warn note (menus.css 783-812) --- */
/* Modals: a rule under the heading, as under a panel head. A modal with no
   body keeps one rule, not two. */
dialog.modal .modal-h{padding:var(--s-5) var(--s-5) var(--s-4);border-bottom:1px solid var(--border)}
dialog.modal .modal-b{padding-top:var(--s-4)}
dialog.modal .modal-h + .modal-f{border-top:0}

/* The overflow trigger: vertical ellipsis, after Save, background only on hover and focus. */
.kebab{width:var(--ctl);height:var(--ctl);display:grid;place-items:center;border-radius:var(--r-1);color:var(--fg-2);background:transparent;border:0}
.kebab:hover,.kebab:focus-visible,.kebab[aria-expanded="true"]{background:var(--surface-3);color:var(--fg)}
.save-btn[disabled]{opacity:.5;cursor:default}

/* The last row's ground follows the panel's rounded corners. */
.mtree > .mt-item:last-child{border-radius:0 0 calc(var(--r-3) - 1px) calc(var(--r-3) - 1px)}
.mtree > .mt-item:last-child:not(.editing) > .mt-row{border-radius:0 0 calc(var(--r-3) - 1px) calc(var(--r-3) - 1px)}
.mtree > .mt-item:last-child.editing{border-bottom:0}

/* Icon and Image are buttons, sized to their words. */
.ed-pick{width:auto;align-self:flex-start}
/* A rename's consequences, said where the name is changed. */
.warn-note{display:flex;gap:var(--s-2);align-items:flex-start;margin-top:var(--s-2);padding:var(--s-3);border-radius:var(--r-1);background:var(--warn-soft);color:var(--warn);font-size:12px;line-height:1.5}
.warn-note > .ic{width:14px;height:14px;margin-top:2px;flex:none;color:var(--warn-dot)}
.warn-note > div{display:flex;flex-direction:column;gap:var(--s-2)}
.warn-note b{font-weight:600}
.warn-note code{font-size:11px}
.warn-note .check .tx b{color:var(--fg);font-weight:500}
.warn-note .check .tx span{color:var(--fg-2)}
.inp.bad{border-color:var(--danger-dot)}
.err{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--danger)}
.err .ic{width:12px;height:12px}


/* --- row metrics and button grounds (menus.css 853-872) --- */
/* Rows: grip, disclosure and kind sit close; the disclosure column stays so
   titles at one level still line up. */
.mt-row{gap:var(--s-2)}
.mt-grip{width:16px}
.mt-ind{margin-left:calc(var(--s-2) * -1)}
.twist{width:16px;margin-right:calc(var(--s-1) - var(--s-2))}
.mtree{--lead:calc(var(--pad-x) - 8px + 16px + var(--s-2))}

/* Row buttons take their ground from the row: a translucent fill reads on
   white, on the gray hover and on the selected blue alike. Pressed (Edit open,
   menu open) is a stronger fill in the same ink, not the accent. */
.rb2:hover,.rb2:focus-visible{background:color-mix(in srgb, var(--fg) 8%, transparent);color:var(--fg)}
.rb2[aria-expanded="true"]{background:color-mix(in srgb, var(--fg) 12%, transparent);color:var(--fg)}
.mt-item.sel .rb2{color:var(--accent)}
.mt-item.sel .rb2[disabled]{color:var(--accent)}
.mt-item.sel .rb2:hover,.mt-item.sel .rb2:focus-visible{background:color-mix(in srgb, var(--accent) 14%, transparent);color:var(--accent)}
.mt-item.sel .rb2[aria-expanded="true"]{background:color-mix(in srgb, var(--accent) 22%, transparent);color:var(--accent)}
.kebab[aria-expanded="true"]{background:color-mix(in srgb, var(--fg) 10%, transparent)}
.kebab:hover,.kebab:focus-visible{background:color-mix(in srgb, var(--fg) 8%, transparent)}
.loc-text{font-size:12.5px;color:var(--fg-2)}

/* --- one line per row, always (menus.css 874-907) --- */
/* One line per row, always. The row's buttons never wrap; the title area
   measures itself and gives way: first the sub-items count, then the pills,
   then the title truncates with an ellipsis. */
@media (max-width:640px){
  .mt-row{flex-wrap:nowrap}
  .mt-row > .rowctl{flex-basis:auto;justify-content:flex-start;margin-left:0}
  .rowctl .rb2{width:28px;height:28px}
  .rowctl .sp{margin:0 2px}
}
.mt-pick{container-type:inline-size;container-name:rowtitle}
.mt-main,.mt-t{min-width:0}
.mt-t .tt{min-width:0;flex:0 1 auto}
@container rowtitle (max-width: 240px){ .mt-sub{display:none} }
@container rowtitle (max-width: 170px){ .mt-t .pill{display:none} }

/* Narrow screens: the grip goes (dragging is a pointer gesture; the arrows do
   the same job by touch), buttons tighten, and the title keeps a floor. */
@media (max-width:640px){
  .mt-row{padding-right:10px;gap:6px}
  .mt-grip{display:none}
  .mt-ind{margin-left:-6px}
  .mtree{--indent:14px}
  .rowctl{gap:0}
  .rowctl .rb2{width:27px;height:30px}
  .rowctl .sp{margin:0 1px}
  .mt-pick{min-width:64px}
  .ph-ref .ph-main{flex-basis:100%}
  .ph-ref .acts{width:100%;justify-content:flex-end}
}
@container rowtitle (max-width: 120px){ .mt-kind{display:none} }
@media (max-width:640px){ .mtree{--indent:12px} .mt-pick{min-width:44px} }

/* Plain-text items show their label as written, like any other item. */
.mt-t .tt.heading{text-transform:none;letter-spacing:var(--title-track);font-family:var(--font-title);font-size:var(--title-size);font-weight:var(--title-weight);color:var(--fg)}

/* --- the icon picker (menus.css 832-851) --- */
/* Icon, once one is chosen */
.ico-set{display:flex;align-items:center;gap:var(--s-2);height:var(--ctl);padding:0 4px 0 6px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface);align-self:stretch}
.ico-prev{width:24px;height:24px;border-radius:var(--r-1);display:grid;place-items:center;background:var(--surface-2);color:var(--fg)}
.ico-set code{flex:1;font-size:12px;color:var(--fg-2)}
.ico-set .btn.sm{height:calc(var(--ctl) - 8px)}
.ico-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:var(--s-2);max-height:320px;overflow:auto}
.ico-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 9px;border:1px solid var(--border);border-radius:var(--r-1);font-size:11px;color:var(--fg-2)}
.ico-opt .ic{width:20px;height:20px;color:var(--fg)}
.ico-opt:hover{border-color:var(--border-strong);background:var(--surface-2)}
.ico-opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* Icon: a preview tile you press to change, its name, and quiet actions. */
.ico-pick{display:flex;align-items:center;gap:var(--s-2);min-height:var(--ctl)}
.ico-tile{width:var(--ctl);height:var(--ctl);flex:none;border-radius:var(--r-1);display:grid;place-items:center;border:1px dashed var(--border-strong);color:var(--fg-3);background:transparent;position:relative}
.ico-tile:hover{border-color:var(--fg-3);color:var(--fg)}
.ico-tile.set{border-style:solid;border-color:var(--border);background:var(--surface);color:var(--fg)}
.ico-tile.set .ic{width:18px;height:18px}
.ico-tile.set:hover{border-color:var(--accent);color:var(--accent)}
.ico-name{font-family:var(--font-mono);font-size:12px;color:var(--fg);margin:0 var(--s-1) 0 2px}
.ico-pick .btn-ghost.sm{padding:0 8px}


/* ================= the Fields screens ================= */
/* Everything above is lifted from the menus sketch. What follows is only what
   these screens add: the type row and its picker, a repeating group's nested
   field list, and the document panel's repeating control. */

/* Tabs over a list, as the entry lists have them. */
.tabs{display:flex;gap:var(--s-1);border-bottom:1px solid var(--border);margin-bottom:var(--s-5);flex-wrap:wrap}
.tabs button{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;font-size:12.5px;color:var(--fg-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}
.tabs .n{font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
.tabs button[aria-selected="true"] .n{color:var(--fg-2)}

/* A row's second line: the type in plain words with its main option. */
/* Required is a chip, not a glyph: it says the word rather than asking anyone
   to know what an asterisk means. */
.mt-req{display:inline-flex;align-items:center;height:20px;padding:0 7px;flex:none;
  border-radius:var(--r-1);border:1px solid var(--border);background:var(--surface);
  font-size:10.5px;font-weight:500;color:var(--fg-2);white-space:nowrap}
.mt-item.sel .mt-req{border-color:var(--accent-line);color:var(--accent);background:var(--surface)}
.mt-item:hover > .mt-row .mt-req{border-color:var(--border-strong)}
/* The title gives way before the chip does: a long label truncates, and only
   on a really narrow row does Required go. */
@container rowtitle (max-width: 180px){ .mt-req{display:none} }

/* The Type row in a field's form: what it is, and the way to change it. */
/* The type box follows the drawn select: the box is the hit area, the chevron
   says it opens something. */
.ed-type{display:flex;align-items:center;gap:var(--s-2);width:100%;height:var(--ctl);padding:0 10px 0 12px;
  border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface);text-align:left}
.ed-type .ic{color:var(--fg-3)}
.ed-type b{font-weight:500;font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.ed-type:hover{border-color:var(--border-strong);background:var(--surface-2)}
button.ed-type:hover .ic{color:var(--fg-2)}

/* What a group is, said where someone looks for a default. */
.ed-note-box{display:flex;gap:var(--s-2);align-items:flex-start;padding:var(--s-3);border-radius:var(--r-1);
  background:var(--surface-2);color:var(--fg-2);font-size:12px;line-height:1.5}
.ed-note-box > .ic{width:14px;height:14px;margin-top:2px;flex:none;color:var(--fg-3)}

/* An open group's own fields, moved inside it. The rows are the tree's rows. */
.kids{border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface);overflow:hidden}
.kids .mt-item{border:0}
.kids .mt-item + .mt-item,.kids .kids-foot{border-top:1px solid var(--border)}
.kids .mt-row{padding:6px 8px 6px 6px;min-height:46px}
.kids .mt-item.editing{background:var(--surface-2)}
.kids .mt-item.editing > .mt-row{background:var(--accent-soft)}
.kids .mt-edit{padding:var(--s-3) var(--s-4) var(--s-4)}
.kids .mt-edit .inp{background:var(--bg)}
.kids-foot{padding:6px}
.kids-none{padding:15px;font-size:12px;color:var(--fg-3);text-align:center}
/* A group that only holds what is open is a frame, not a second open form. */
.mt-item.holding > .mt-row,.mt-item.holding.sel > .mt-row,.mt-item.holding:hover > .mt-row{background:var(--surface-2)}
.mt-item.holding{background:var(--surface-2);border-bottom:1px solid var(--border)}
.mt-edit.slim{padding-top:0}

/* The type picker: about fifteen tiles plus whatever plugins add, so it is a
   modal with search rather than a menu. */
.tsec{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);padding:var(--s-4) 0 var(--s-2)}
.tsec:first-child{padding-top:0}
/* An inserter, not a list: a glyph over a name, many to a row. A tile carries
   no border of its own — pointing at one tints it, and only the one actually
   chosen is outlined. */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:var(--s-2)}
.topt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:12px 8px;min-height:86px;border:1px solid transparent;border-radius:var(--r-2);
  text-align:center;background:transparent;color:var(--fg)}
.topt:hover,.topt:focus-visible{background:var(--accent-soft);color:var(--accent)}
.topt:hover > .ic,.topt:focus-visible > .ic{color:var(--accent)}
.topt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.topt > .ic{width:20px;height:20px;color:var(--fg-2)}
.topt[aria-checked="true"] > .ic{color:var(--accent)}
.topt .tn{font-size:11.5px;font-weight:500;line-height:1.3;text-wrap:balance;color:inherit}
.topt .new-tag{position:absolute;top:5px;right:5px}
.new-tag{font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:1px 6px}

/* What the footer says about whatever is under the pointer or the focus ring.
   It keeps its height so the buttons beside it never move. */
.tdesc{flex:1;min-width:0;margin-right:var(--s-3);display:flex;flex-direction:column;gap:1px;
  min-height:34px;justify-content:center;font-size:12px;line-height:1.45}
.tdesc b{font-weight:600;font-size:12.5px}
.tdesc span{color:var(--fg-2)}
.tdesc .q{color:var(--fg-3)}
.tfoot{display:flex;align-items:flex-start;gap:var(--s-2);margin-top:var(--s-4);padding-top:var(--s-4);border-top:1px solid var(--border);font-size:12px;color:var(--fg-3);line-height:1.5}
.tfoot .ic{width:14px;height:14px;margin-top:2px;flex:none}
.tnone{padding:var(--s-5) 0;font-size:12.5px;color:var(--fg-3)}

/* A repeating group's own field list, nested one level inside its form. */
.nest{border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface)}
.nest-row{display:flex;align-items:center;gap:var(--s-2);padding:7px 8px 7px 6px;border-bottom:1px solid var(--border)}
/* The row before the footer stops at the footer's rule rather than adding its
   own. :last-of-type counted every div in the box, the footer included, so it
   never matched the row it was meant to. */
.nest-row:last-child,.nest-row:has(+ .nest-foot),.nest-row:has(+ .kids-foot){border-bottom:0}
.nest-row:hover{background:var(--surface-2)}
.nest-row .mt-kind{width:24px;height:24px}
.nest-row .nm{font-family:var(--font-title);font-size:var(--title-size);font-weight:var(--title-weight);flex:none}
.nest-foot{padding:6px;border-top:1px solid var(--border)}
.nest + .nest-add{margin-top:var(--s-2)}
.sum-pick{display:flex;gap:6px;flex-wrap:wrap}
.sum-pick button{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:var(--r-1);border:1px solid var(--border);background:var(--surface);font-size:11.5px;color:var(--fg-2)}
.sum-pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.sum-pick .ic{width:12px;height:12px;opacity:0}
.sum-pick button[aria-pressed="true"] .ic{opacity:1}

/* ================= the entry editor ================= */

.ed-screen{display:grid;grid-template-columns:minmax(0,1fr) 372px;height:100%;min-height:0}
.ed-screen[data-drawer="closed"]{grid-template-columns:minmax(0,1fr)}
.ed-screen[data-drawer="closed"] .drawer{display:none}
.ed-main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ed-bar{height:50px;flex:none;display:flex;align-items:center;gap:var(--s-2);padding-inline:var(--s-5);border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto}
.ed-bar .sp{width:1px;height:20px;background:var(--border);margin-inline:var(--s-2);flex:none}
.ed-bar .spacer{flex:1;min-width:var(--s-4)}
.tb{width:36px;height:36px;border-radius:var(--r-1);display:inline-flex;align-items:center;justify-content:center;gap:2px;color:var(--fg-2);flex:none}
.tb .ic{width:18px;height:18px}
.tb:hover{background:var(--surface-2);color:var(--fg)}
.tb[data-on]{background:var(--accent-soft);color:var(--accent)}
.ed-col{overflow-y:auto;flex:1;padding:var(--s-6) var(--s-5)}
.ed-doc{max-width:68ch;margin:0 auto}
.ed-title{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-bottom:var(--s-5);text-wrap:balance}
.src{font-family:var(--font-mono);font-size:13px;line-height:28px;white-space:pre-wrap}
.src .sy{color:var(--fg-3)} .src .hd{font-weight:600} .src .dir{color:var(--accent)}
.src .at{color:var(--fg-2)} .src .at .nm{color:var(--fg)} .src .cap{font-weight:500}
.drawer{border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.dtabs{display:flex;align-items:center;gap:var(--s-1);flex:none;border-bottom:1px solid var(--border);padding-right:var(--s-2)}
.dtab{font-size:12.5px;color:var(--fg-2);padding:13px var(--s-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.dtab:first-child{padding-left:var(--pad-x)}
.dtab[aria-selected="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}
.dtabs .spacer{flex:1}
.dbody{overflow-y:auto;padding-bottom:var(--s-6)}

/* A set is a group in the document panel. Groups open and close. */
.dgroup{border-bottom:1px solid var(--border)}
.dgroup-h{display:flex;align-items:center;gap:var(--s-2);width:100%;padding:var(--s-4) var(--pad-x);text-align:left}
.dgroup-h:hover{background:var(--surface-2)}
.dgroup-h .chev{width:13px;height:13px;color:var(--fg-3);transition:transform .12s}
.dgroup-h[aria-expanded="true"] .chev{transform:rotate(90deg)}
.dgroup-h b{font-size:12.5px;font-weight:600;flex:1;min-width:0}
.dgroup-h .n{font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
.dgroup-b{padding:0 var(--pad-x) var(--s-5);display:flex;flex-direction:column;gap:var(--s-4)}
.dgroup.bad .dgroup-h b{color:var(--danger)}

/* The repeating group control, which has to work in a 372px drawer. */
.rep{border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface)}
.rep-row{display:flex;align-items:center;gap:6px;padding:7px 6px 7px 4px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.rep-row:hover{background:var(--surface-2)}
.rep-row[aria-expanded="true"]{background:var(--accent-soft)}
.rep-row .grip{width:16px;height:24px;display:grid;place-items:center;color:var(--fg-3);cursor:grab;flex:none;opacity:.55}
.rep-row:hover .grip{opacity:1}
.rep-sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.rep-sum.none{color:var(--fg-3)}
.rep-more{width:26px;height:26px;border-radius:var(--r-1);display:grid;place-items:center;color:var(--fg-3);flex:none}
.rep-row:hover .rep-more,.rep-more[aria-expanded="true"]{background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--fg)}
.rep-open{padding:var(--s-3);background:var(--surface-2);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:var(--s-3)}
.rep-open .inp{background:var(--surface)}
.rep-foot{padding:6px}
.rep-cap{font-size:11.5px;color:var(--fg-3);padding:0 6px 6px}

/* A required field left empty blocks Publish, not Save Draft. */
.fld-err{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--danger)}
.fld-err .ic{width:12px;height:12px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-1);overflow:hidden;align-self:flex-start}
.seg button{padding:0 11px;height:var(--ctl);font-size:12.5px;color:var(--fg-2)}
.seg button + button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.wells{display:flex;gap:var(--s-3)}
.wells > *{flex:1;min-width:0}

/* The list screen's own bits. */
.used{display:flex;gap:6px;flex-wrap:wrap}
.from{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2)}
.from .ic{width:13px;height:13px;color:var(--fg-3)}
.set-note{display:flex;align-items:flex-start;gap:var(--s-2);padding:11px var(--pad-x);border-bottom:1px solid var(--border);background:var(--surface-2);font-size:12px;color:var(--fg-2)}
.set-note .ic{width:14px;height:14px;margin-top:2px;color:var(--fg-3);flex:none}
.add-row{padding:var(--s-3) var(--pad-x);border-top:1px solid var(--border)}

/* A switch: a real input, visually hidden, with a drawn track beside it. It
   carries an On/Off word, because a fill alone is status by color. */
.sw{display:flex;align-items:flex-start;gap:11px;cursor:pointer;padding:3px 0}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .track{width:30px;height:18px;border-radius:99px;background:var(--surface-3);border:1px solid var(--border-strong);
  flex:none;margin-top:1px;position:relative;transition:background .12s,border-color .12s}
.sw .knob{position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:99px;background:var(--surface);
  box-shadow:0 1px 2px rgba(0,0,0,.18);transition:transform .12s}
.sw input:checked + .track{background:var(--accent);border-color:var(--accent)}
.sw input:checked + .track .knob{transform:translateX(12px)}
.sw input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.sw input:disabled + .track{opacity:.5}
.sw .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.sw .tx b{font-weight:500;font-size:12.5px;display:flex;align-items:baseline;gap:7px}
.sw .tx span{font-size:11.5px;color:var(--fg-3);line-height:1.45}
.sw.row{align-items:center}
.sw.row .tx b{font-weight:400}

/* A switch standing alone in the drawer, with its label above it. */
.sw-solo{display:flex;align-items:center;gap:var(--s-3)}

/* The key on a row: machine data, quiet, and the second thing to give way. */
/* Three across, for Lowest / Highest / Step. */
.three-col{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-3)}
@media (max-width:520px){.three-col{grid-template-columns:1fr}}

/* A number edited as a slider: its ends labelled, its value read out. */
.slider{display:flex;align-items:center;gap:var(--s-3)}
.slider input[type="range"]{flex:1;min-width:0;accent-color:var(--accent);height:var(--ctl-sm)}
.slider-end{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-3);flex:none}
.slider-v{display:block;font-size:12.5px;font-weight:500;margin-top:2px}

/* A modal's body scrolls; its footer stays. */
dialog.modal{display:flex;flex-direction:column;min-height:0}
.modal-h,.modal-f{flex:none}
.modal-b{overflow-y:auto;min-height:0;flex:1}
/* A search that filters the list belongs with the heading, not inside the
   list it filters, so it sits in its own band above the scrolling body. */
.modal-band{flex:none;padding:var(--s-4) var(--s-5) var(--s-3);border-bottom:1px solid var(--border)}
.modal-band + .modal-b{padding-top:0}
/* The pointer to Relationships belongs beside the footer's buttons, where
   someone hunting for a Reference type will still see it. */
.modal-f .tfoot{margin:0;padding:0;border:0;flex:1;min-width:0;margin-right:var(--s-3)}

/* Choice options: a row each, with a label and a key. */
.opt-head{display:grid;grid-template-columns:18px minmax(0,1.4fr) minmax(0,1fr) 26px;gap:var(--s-2);
  padding:6px 8px 6px 6px;border-bottom:1px solid var(--border);
  font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.opt-row{display:grid;grid-template-columns:18px minmax(0,1.4fr) minmax(0,1fr) 26px;gap:var(--s-2);
  align-items:center;padding:5px 8px 5px 6px;border-bottom:1px solid var(--border)}
.opt-row:last-child,.opt-row:has(+ .nest-foot){border-bottom:0}
.opt-row:hover{background:var(--surface-2)}
.opt-row .inp{height:var(--ctl-sm);font-size:12px;padding-inline:9px}
.opt-row .mt-grip{opacity:.55;cursor:grab}
.opt-row:hover .mt-grip{opacity:1}
.opt-row.dragging{opacity:.45}
.opt-row.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.opt-row.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}

/* The lifted row rules were written for a flat tree, so they reach descendants
   by name alone: inside a group, the group's own selection was colouring its
   children's tiles and buttons. A row inside the box answers for itself. */
.kids .mt-item .mt-kind{background:var(--surface-2);border-color:var(--border);color:var(--fg-2)}
.kids .mt-item.sel .mt-kind{background:var(--surface);border-color:var(--accent-line);color:var(--accent)}
.kids .mt-item .rb2{color:var(--fg-2)}
.kids .mt-item .rb2[disabled]{color:var(--fg-2)}
.kids .mt-item.sel .rb2,.kids .mt-item.sel .rb2[disabled]{color:var(--accent)}
.kids .mt-item .rb2:hover,.kids .mt-item .rb2:focus-visible{background:color-mix(in srgb, var(--fg) 8%, transparent);color:var(--fg)}
.kids .mt-item.sel .rb2:hover,.kids .mt-item.sel .rb2:focus-visible{background:color-mix(in srgb, var(--accent) 14%, transparent);color:var(--accent)}
.kids .mt-item .mt-req{border-color:var(--border);color:var(--fg-2)}
.kids .mt-item.sel .mt-req{border-color:var(--accent-line);color:var(--accent)}
.kids .mt-item .mt-grip{opacity:.55}
.kids .mt-item:hover .mt-grip,.kids .mt-item.sel .mt-grip{opacity:1}

/* A list held to a set, picked from a menu: the chosen values are tokens, and
   the button offers what is left. */
.tokens{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.token{display:inline-flex;align-items:center;gap:2px;height:26px;padding:0 2px 0 9px;border-radius:var(--r-1);
  border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:500}
.tkx{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;color:var(--accent)}
.tkx .ic{width:11px;height:11px;stroke-width:2.2}
.tkx:hover{background:color-mix(in srgb, var(--accent) 16%, transparent)}
.token-add{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px 0 7px;border-radius:var(--r-1);
  border:1px dashed var(--border-strong);color:var(--fg-2);font-size:11.5px}
.token-add .ic{width:12px;height:12px}
.token-add:hover{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.token-add[disabled]{opacity:.45;pointer-events:none}
.sum-pick button[disabled]{opacity:.55;pointer-events:none}

/* In the author's form a required field is marked, not labelled: the word on
   every label would shout, and the marker sits where one is looked for. */
.req-mark{display:inline-flex;align-items:center;color:var(--fg-3);margin-left:5px}
.req-mark .ic{width:11px;height:11px;stroke-width:2.4}

/* A number box keeps its steppers, and its digits line up with the limits
   beside it. */
.num-inp{font-variant-numeric:tabular-nums}

/* A field set can ask to sit in the content column instead of the panel. It
   keeps the panel's shape there, at the width of what is being written. */
.ed-slot{max-width:68ch;margin:0 auto;display:flex;flex-direction:column;gap:var(--s-5)}
.ed-slot:empty{display:none}
.ed-slot[data-slot="top"]{margin-bottom:var(--s-6)}
.ed-slot[data-slot="main"]{margin-top:var(--s-6)}
.ed-panel-b{gap:var(--s-5)}

/* The Type control is a button sized to its words, not a box across the form:
   the tile says which type, the word says it can be changed. */
.ed-type{display:inline-flex;align-items:center;gap:var(--s-2);width:auto;align-self:flex-start;
  height:var(--ctl);padding:0 12px 0 5px;border:1px solid var(--border);border-radius:var(--r-1);
  background:var(--surface);text-align:left;max-width:100%}
.ed-type .et-tile{width:24px;height:24px;flex:none;border-radius:5px;display:grid;place-items:center;
  background:var(--surface-2);color:var(--fg-2)}
.ed-type .et-tile .ic{width:14px;height:14px}
.ed-type b{font-weight:500;font-size:12.5px;flex:0 1 auto;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ed-type .et-do{font-size:11.5px;color:var(--fg-3);padding-left:var(--s-2);margin-left:2px;
  border-left:1px solid var(--border);flex:none}
button.ed-type:hover{border-color:var(--accent);background:var(--accent-soft)}
button.ed-type:hover b,button.ed-type:hover .et-do{color:var(--accent)}
button.ed-type:hover .et-tile{background:var(--surface);color:var(--accent)}
button.ed-type:hover .et-do{border-left-color:var(--accent-line)}

/* A group in the author's form: its fields, indented under its heading. */
.obj{display:flex;flex-direction:column;gap:var(--s-4);padding-left:var(--s-4);
  border-left:2px solid var(--border);margin-top:2px}

/* Label, Key and Type across one line: the three facts that say what a field
   is, before anything about how it behaves. The first two share the room; the
   type takes only what its name needs. */
/* It shares the grid with the row under it, so the form reads as columns
   rather than two rows that nearly line up. The type button sizes itself
   inside its column instead of filling it. */
.ed-ident{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
/* Narrow enough and three would crush each other, so Type drops under the
   other two rather than squeezing them. */
@media (max-width:900px){
  .ed-ident,.ed-3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ed-ident > .field:last-child,.ed-3 > *:nth-child(3){grid-column:1 / -1}
}
/* This sits after the lifted rules, so it has to restate the phone case or
   the two-column rule above would outrank it. */
@media (max-width:640px){
  .ed-ident,.ed-2,.ed-3{grid-template-columns:minmax(0,1fr)}
  .ed-ident > .field:last-child,.ed-3 > *:nth-child(3){grid-column:auto}
}

"use strict";

/* ===========================================================================
   Fields — the model

   A field never stands alone: it belongs to a field set, a named ordered group
   aimed at one or more content types. Linking entries is a relationship, not a
   field, so there is no Reference type in the picker.
   ========================================================================= */

/* One type is one control over one shape of value. There is nothing to pick
   after the type: a Textarea is a Textarea, a Radio Buttons field is radio
   buttons. The picker carries the whole decision. */
var TYPES = {
  object:      { label: "Group", ic: "i-object", sec: "Structure",
                 desc: "A few fields kept together under one heading." },
  items:       { label: "Repeating group", ic: "i-items", sec: "Structure",

  text:        { label: "Text", ic: "i-text", sec: "Text", desc: "One line of plain text." },
  textarea:    { label: "Textarea", ic: "i-textarea", sec: "Text",
                 desc: "Several lines of plain text." },
  markdown:    { label: "Formatted text", ic: "i-markdown", sec: "Text",

  url:         { label: "Link", ic: "i-url", sec: "Text", desc: "A web address." },
  email:       { label: "Email", ic: "i-at", sec: "Text", desc: "An email address." },

  radio:       { label: "Radio Buttons", ic: "i-choice", sec: "Choices",

  select:      { label: "Select Dropdown", ic: "i-select", sec: "Choices",
                 desc: "One of a set, chosen from a menu." },
  checkboxes:  { label: "Checkboxes", ic: "i-checks", sec: "Choices",
                 desc: "Any number from a set, with every option in view." },
  multiselect: { label: "Multi-Select", ic: "i-multi", sec: "Choices",
                 desc: "Any number from a set, chosen from a menu." },
  bool:        { label: "Toggle", ic: "i-toggle", sec: "Choices", desc: "On or off." },

  number:      { label: "Number", ic: "i-number", sec: "Numbers, dates, and color",
                 desc: "A number typed into a box." },
  range:       { label: "Range Slider", ic: "i-range", sec: "Numbers, dates, and color",
                 desc: "A number dragged between two limits." },
  date:        { label: "Date and time", ic: "i-date", sec: "Numbers, dates, and color",
                 desc: "A day, with a time if you want one." },
  color:       { label: "Color", ic: "i-color", sec: "Numbers, dates, and color",
                 desc: "A color, as hex." },

  image:       { label: "Image", ic: "i-image", sec: "Media", desc: "One picture from the library." },
  video:       { label: "Video", ic: "i-video", sec: "Media", desc: "One video from the library." },
  audio:       { label: "Audio", ic: "i-audio", sec: "Media", desc: "One sound file from the library." },
  file:        { label: "File", ic: "i-file", sec: "Media", desc: "Any other file, to download." },
  icon:        { label: "Icon", ic: "i-shapes", sec: "Media", desc: "One glyph from the icon set." }
};
/* Structure first: what someone adds to a set is usually a field, but when it
   is a shape they are after, it is the first thing they see. */
var TSECS = ["Structure", "Text", "Choices", "Numbers, dates, and color", "Media", "From plugins"];

/* A set of options behind the control. */
var SETTED = ["radio", "select", "checkboxes", "multiselect"];
function isSetted(f) { return SETTED.indexOf(f.type) > -1; }
/* More than one value at a time. */
function isMulti(f) { return f.type === "checkboxes" || f.type === "multiselect"; }
/* The types that put a text box in front of someone, and so can suggest what
   goes in it. */
var PLACEHOLDS = ["text", "textarea", "markdown", "url", "email", "number", "color"];
function takesPlaceholder(f) { return PLACEHOLDS.indexOf(f.type) > -1; }
/* One kind of file per type, each able to save what it points at either way. */
var MEDIA = { image: "picture", video: "video", audio: "sound file", file: "file" };
function isMedia(f) { return !!MEDIA[f.type]; }
function storesId(f) { return f.storeAs !== "path"; }

function T(f) { return TYPES[f.type] || TYPES.text; }
/* Options are rows, each with a label and a key. The key is what gets written. */
function opts(f) { return Array.isArray(f.options) ? f.options : []; }
function optPairs(f) { return opts(f).map(function (o) { return [o.key, o.label]; }); }
/* The type in plain words. Each type is one control now, so the only thing
   left to add is how many of something it holds. */
function typeWords(f) {
  var t = T(f);
  if (f.type === "items") return t.label + " · " + (f.fields || []).length;
  if (f.type === "object") return t.label + " · " + (f.fields || []).length;
  if (f.type === "date" && f.withTime) return t.label + " · with a time";
  if (isSetted(f)) return t.label + " · " + plural(opts(f).length, "option");
  if (isMedia(f)) return t.label + " · " + (storesId(f) ? "ID" : "file path");
  return t.label;
}

var SETS = [
  { key: "recipe-details", name: "Recipe details", help: "What every recipe holds besides its title and text.",
    from: "This site", on: ["Recipes"], slot: "sidebar", pos: 10,
    fields: [
      { key: "prep_time", label: "Prep time", type: "number", req: true, low: 0, whole: true, unit: "min",
        help: "In minutes, before the oven is on." },

      { key: "servings", label: "Servings", type: "number", req: true, low: 1, whole: true },
      { key: "difficulty", label: "Difficulty", type: "radio", def: "easy",

      { key: "diet", label: "Dietary flags", type: "checkboxes",

      { key: "adapted_from", label: "Adapted from", type: "text", ph: "Cookbook, site, or person" },

          { key: "holder", label: "Rights holder", type: "text" },
          { key: "license", label: "License", type: "select",

                      { key: "public_domain", label: "Public domain" }] },
          { key: "notes", label: "Terms", type: "textarea" }
        ] }
    ] },

  { key: "event-details", name: "Event details", help: "When and where it happens.",
    from: "This site", on: ["Events"], typeOff: true,
    fields: [
      { key: "venue", label: "Venue", type: "text", req: true },
      { key: "starts", label: "Starts", type: "date", withTime: true, req: true },
      { key: "capacity", label: "Capacity", type: "range",

    ] },

  { key: "seo", name: "Search appearance", help: "How this shows in search results.",
    from: "SEO plugin", locked: true, inCode: true, on: ["Posts", "Pages", "Recipes"],
    slot: "sidebar", pos: 30,
    fields: [
      { key: "meta_title", label: "Title in search", type: "text" },
      { key: "meta_description", label: "Description", type: "textarea" },
      { key: "noindex", label: "Hide from search engines", type: "bool" }
    ] }
];

var ALL_TYPES = ["Posts", "Pages", "Recipes", "Events", "Reviews"];
/* Where a set sits on an entry's screen. A theme or a plugin can add slots;
   these three are the ones this admin draws. */
var SLOTS = [["sidebar", "Sidebar", "Beside the content, in the entry's panel."],
             ["main", "Under the content", "Full width, below what is being written."],
             ["top", "Above the content", "Full width, before the title."]];
function slotOf(s) { return s.slot || "sidebar"; }
function slotName(k) {
  for (var i = 0; i < SLOTS.length; i++) if (SLOTS[i][0] === k) return SLOTS[i][1];
  return k;
}
function posOf(s) { return s.pos == null || s.pos === "" ? 10 : Number(s.pos); }
/* Lowest first, then by name, so two sets at the same number still have an
   order someone can predict. */
function bySlot(list, slot) {
  return list.filter(function (s) { return slotOf(s) === slot; })
    .sort(function (a, b) { return posOf(a) - posOf(b) || a.name.localeCompare(b.name); });
}

   without a number. */
var ENTRY_COUNTS = { prep_time: 41, cook_time: 38, servings: 44, difficulty: 31, diet: 22,

function setOf(k) { for (var i = 0; i < SETS.length; i++) if (SETS[i].key === k) return SETS[i]; return null; }

function el(tag, cls, html) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
