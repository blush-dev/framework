/* ------------------------------------------------------------ menus, toasts -- */

var openMenu = null;
function closeMenu() {
  if (!openMenu) return;
  openMenu.trigger.setAttribute("aria-expanded", "false");
  openMenu.node.remove();
  openMenu = null;
}
/* Pressing an open menu's trigger closes it. */
function menu(anchor, items) {
  var mine = openMenu && openMenu.trigger === anchor;
  closeMenu();
  if (mine) return;
  var m = el("div", "menu");
  items.forEach(function (it) {
    if (it === "-") { m.appendChild(el("div", "div")); return; }
    if (it.sec) { m.appendChild(el("div", "sec", esc(it.sec))); return; }
    var b = el("button", it.danger ? "danger" : null,
      (it.ic ? ic(it.ic) : "") + '<span class="l">' + esc(it.label) +
      (it.ds ? '<span class="ds">' + esc(it.ds) + "</span>" : "") + "</span>" +
      (it.tail ? '<span class="tail">' + esc(it.tail) + "</span>" : ""));
    b.type = "button";
    if (it.disabled) b.disabled = true;
    if (it.checked) b.setAttribute("aria-checked", "true");
    b.addEventListener("click", function () { closeMenu(); if (it.run) it.run(); });
    m.appendChild(b);
  });
  /* An open <dialog> sits in the top layer, above everything on the page, so a
     menu parked on the body would open behind it. It belongs inside whatever
     it was opened from. */
  var host = anchor.closest("dialog[open]") || document.body;
  host.appendChild(m);
  var r = anchor.getBoundingClientRect(), mr = m.getBoundingClientRect();
  var top = r.bottom + 5;
  if (top + mr.height > innerHeight - 8) top = Math.max(8, r.top - mr.height - 5);
  m.style.top = top + "px";
  m.style.left = Math.max(8, Math.min(r.right - mr.width, innerWidth - mr.width - 8)) + "px";
  anchor.setAttribute("aria-expanded", "true");
  openMenu = { node: m, trigger: anchor };
}

function toast(msg, opts) {
  opts = opts || {};
  var wrap = document.getElementById("toasts");
  var t = el("div", "toast" + (opts.info ? " info" : ""));
  t.innerHTML = '<svg class="toast-ring" aria-hidden="true"><rect class="track"/><rect class="run"/></svg>' +
    ic(opts.info ? "i-info" : "i-check") + '<div class="msg">' + msg + "</div>";
  if (opts.undo) {
    t.appendChild(el("div", "div"));
    var u = el("button", "undo", ic("i-undo") + "Undo");
    u.type = "button";
    u.addEventListener("click", function () { opts.undo(); t.remove(); });
    t.appendChild(u);
  }
  wrap.appendChild(t);
  var life = opts.undo ? 6000 : 2600;
  t.style.setProperty("--life", life + "ms");
  var timer = setTimeout(function () { t.remove(); }, life);
  /* Hovering or focusing holds the countdown. */
  t.addEventListener("pointerenter", function () { clearTimeout(timer); t.classList.add("held"); });
  t.addEventListener("focusin", function () { clearTimeout(timer); t.classList.add("held"); });
  t.addEventListener("pointerleave", function () {
    t.classList.remove("held"); timer = setTimeout(function () { t.remove(); }, 1200);
  });
}

/* ------------------------------------------------------- the drawn select -- */
/* The real select holds the value and fires change; a button draws the label
   and opens a .menu, so the list is the admin's and not the system's. */

function xsel(label, options, value, onPick) {
  var wrap = el("span");
  var sel = document.createElement("select");
  sel.setAttribute("aria-label", label);
  sel.style.cssText = "position:absolute;width:1px;height:1px;opacity:0;clip:rect(0 0 0 0)";
  sel.tabIndex = -1;
  options.forEach(function (o) {
    var n = document.createElement("option");
    n.value = o[0]; n.textContent = o[1];
    if (String(o[0]) === String(value)) n.selected = true;
    sel.appendChild(n);
  });
  var b = el("button", "xs", '<span class="v"></span>' + ic("i-chev-d"));
  b.type = "button";
  b.setAttribute("aria-haspopup", "listbox");
  b.setAttribute("aria-expanded", "false");
  b.setAttribute("aria-label", label);
  function sync() {
    var o = sel.options[sel.selectedIndex];
    b.querySelector(".v").textContent = o ? o.textContent : "";
  }
  sync();
  b.addEventListener("click", function () {
    menu(b, options.map(function (o) {
      return { label: o[1], checked: String(o[0]) === String(sel.value), run: function () {
        sel.value = o[0]; sync(); if (onPick) onPick(o[0]);
      } };
    }));
  });
  wrap.appendChild(sel);
  wrap.appendChild(b);
  wrap.style.display = "block";
  return wrap;
}

function rb2(glyph, tip, label, disabled, tab, extra, onClick) {
  var b = el("button", "rb2", ic(glyph));
  b.type = "button";
  b.setAttribute("data-tip", tip);
  b.setAttribute("aria-label", label);

  if (extra) Object.keys(extra).forEach(function (k) { b.setAttribute(k, extra[k]); });
  if (onClick) b.addEventListener("click", function (e) { e.stopPropagation(); onClick(); });
  return b;
}
function closeRow(focusEdit) {
  var prev = S.open;
  S.open = null;
  draw();
  if (focusEdit && prev) {
    var b = document.querySelector('.mt-item[data-id="' + CSS.escape(prev) + '"] [data-edit]');
    if (b) b.focus();
  }
}
function move(list, i, d) {
  var j = i + d;
  if (j < 0 || j >= list.length) return;
  list.splice(j, 0, list.splice(i, 1)[0]);
  markDirty();
}

/* ===========================================================================
   The field tree — the same component as the menus item tree.

   Rows are flat: aria-level, aria-setsize and aria-posinset carry the nesting,
   the way the Pages tree does. An id is the path of keys, so "inside" is a
   prefix test and nothing has to hold a parent pointer.
   ========================================================================= */

function isGroup(f) { return f.type === "items" || f.type === "object"; }

function find(s, id) {
  var parts = String(id).split("."), list = s.fields, parent = null, node = null, i = -1, d = 0;
  for (var p = 0; p < parts.length; p++) {
    node = null;
    for (var k = 0; k < list.length; k++) if (list[k].key === parts[p]) { node = list[k]; i = k; break; }
    if (!node) return null;
    if (p < parts.length - 1) { parent = node; list = node.fields || []; d++; }
  }
  return { n: node, i: i, list: list, parent: parent, d: d, id: id };
}
/* Visible rows, top to bottom. */
function vis(s) {
  var out = [];
  (function walk(list, d, path) {
    list.forEach(function (f, i) {
      var id = path ? path + "." + f.key : f.key;
      out.push({ n: f, d: d, i: i, list: list, id: id, size: list.length });
      if (isGroup(f) && S.expand[id] && f.fields) walk(f.fields, d + 1, id);
    });
  })(s.fields, 0, "");
  return out;
}

  if (act === "up") return x.i > 0;
  if (act === "down") return x.i < x.list.length - 1;
  /* One level only: a group's fields can't be groups. */
  if (act === "in") return x.i > 0 && x.d === 0 && !isGroup(x.n) && isGroup(x.list[x.i - 1]);

}
function where(s, id) {
  var x = find(s, id);

    (x.parent ? " inside " + x.parent.label : " in " + s.name);
}
function announce(m) {

  l.textContent = "";

}

function act(s, id, a) {
  var x = find(s, id);
  if (!x || !can(s, id, a)) return;
  if (a === "up" || a === "down") {
    var j = x.i + (a === "up" ? -1 : 1);
    x.list.splice(j, 0, x.list.splice(x.i, 1)[0]);
  } else if (a === "in") {
    var host = x.list[x.i - 1];
    x.list.splice(x.i, 1);

    id = host.key + "." + x.n.key;

    p.list.splice(p.i + 1, 0, x.n);
    id = x.n.key;
  }
  markDirty();
  S.sel = id;
  draw();
  focusRow(id);
  announce("Moved " + x.n.label + ", " + where(s, id));
}

function moveTo(s, id, targetId, pos) {
  var x = find(s, id);
  var node = x.n;
  x.list.splice(x.i, 1);
  if (pos === "in") {
    var t = find(s, targetId);
    t.n.fields = t.n.fields || [];
    t.n.fields.unshift(node);
    S.expand[targetId] = true;
    id = targetId + "." + node.key;
  } else {
    var t2 = find(s, targetId);
    t2.list.splice(t2.i + (pos === "after" ? 1 : 0), 0, node);
    id = (targetId.indexOf(".") > -1 ? targetId.slice(0, targetId.lastIndexOf(".")) + "." : "") + node.key;
  }
  markDirty();
  S.sel = id;
  draw();
  focusRow(id);
  announce("Moved " + node.label + ", " + where(s, id));

function focusRow(id, what) {

function tree(s) {

/* ------------------------------------------------- the form under the row -- */
/* Three parts: what every field has, what its type adds, and Advanced. */

function form(s, f, parent, key, depth, slim) {

    box.appendChild(inner);

    f.label = labIn.value;
    var tt = document.querySelector('.mt-item[data-id="' + CSS.escape(key) + '"] .tt');

    /* The key follows the label until it is changed by hand or saved. */

    markDirty();
  });
  keyIn.addEventListener("input", function () {
    f.keyTouched = true;

    else { f.key = v;  markDirty(); }

    : "How it's saved in each recipe. Follows the label until you change it.");

  if (f.type !== "object") {
  var adv = el("details", "ed-fold");

  inner.appendChild(adv);
  }

  /* --- footer --- */
  var foot = el("div", "ed-foot");
  if (!ro) foot.appendChild(btn("Remove Field", "btn-ghost btn-danger sm", function () {

  }));

    else closeRow(true);
  }));
  inner.appendChild(foot);

  box.appendChild(inner);
  if (!f._savedKey) f._savedKey = f.key;
  return box;
}

/* The kind tile's tooltip is the only place the type's detail lives now, so it
   follows the options rather than going stale. */
function refreshTypeTitle(key, f) {
  var c = document.querySelector('.mt-item[data-id="' + CSS.escape(key) + '"] .mt-kind');
  if (c) c.title = typeWords(f);
}
function sameKey(s, k, not) {
  var hit = null;
  SETS.forEach(function (o) {
    if (!o.on.some(function (t) { return s.on.indexOf(t) > -1; })) return;
    o.fields.forEach(function (x) { if (x !== not && x.key === k) hit = o.name; });
  });
  if (["title", "slug", "status", "date", "summary", "body"].indexOf(k) > -1) hit = "the built-in fields";
  return hit;
}

function defaultControl(f, ro) {
  if (isMulti(f)) {
    if (!Array.isArray(f.def)) f.def = [];
    /* An option that was removed can't stay on by default. */
    f.def = f.def.filter(function (k) {
      return opts(f).some(function (o) { return o.key === k; });
    });
    return multiPick(optPairs(f), f.def, function () { markDirty(); }, ro);
  }
  if (f.type === "icon") {
    return iconControl(f.def, function (v) { f.def = v; markDirty(); }, ro);
  }
  if (f.type === "bool") {
    return sw(f.def === true, "On by default", null,
      function (v) { f.def = v; markDirty(); }, { disabled: ro });
  }
  if (isSetted(f)) {
    return xsel("Default", [["", "None"]].concat(optPairs(f)), f.def || "",
      function (v) { f.def = v; markDirty(); });
  }
  var i = inp(f.def, { label: "Default", ph: "None", ro: ro });
  i.addEventListener("input", function () { f.def = i.value; markDirty(); });
  return i;
}

/* Rebuild just the Default control after the options behind it changed, so
   the open form does not blink. */
function rebuildDefault(f, key) {
  var holder = document.querySelector('[data-def="' + CSS.escape(key) + '"]');
  if (holder && holder.children[1]) holder.replaceChild(defaultControl(f, false), holder.children[1]);
}

/* Choice's options: a row each. The label is what someone reads; the key is
   what the entry stores, so renaming a label later leaves the data alone. */
function optionsEditor(f, key, ro, cfg) {
  cfg = cfg || {};
  var box = el("div", "field");
  box.appendChild(el("div", "lab", "Options"));
  var n = el("div", "nest");

  function paint() {
    n.innerHTML = "";
    var list = opts(f);
    if (cfg.onCount) cfg.onCount(list.length);
    refreshTypeTitle(key, f);
    if (!list.length) {
      n.appendChild(el("div", "tnone", cfg.empty || "No options yet."));
    } else {
      n.appendChild(el("div", "opt-head",
        "<span></span><span>Label</span><span>Key</span><span></span>"));
    }
    list.forEach(function (o, i) {
      var r = el("div", "opt-row");
      var grip = el("span", "mt-grip", ro ? "" : ic("i-grip"));
      r.appendChild(grip);
      if (!ro) {
        r.draggable = true;
        r.dataset.oi = i;
        r.addEventListener("dragstart", function (e) {
          if (e.target.closest("input")) { e.preventDefault(); return; }
          ODRAG = i; r.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("text/plain", String(i));
        });
        r.addEventListener("dragend", function () {
          ODRAG = null;
          n.querySelectorAll(".opt-row").forEach(function (x) {
            x.classList.remove("dragging", "drop-before", "drop-after");
          });
        });
        r.addEventListener("dragover", function (e) {
          if (ODRAG == null || ODRAG === i) return;
          e.preventDefault();
          var bx = r.getBoundingClientRect();
          var before = (e.clientY - bx.top) / bx.height < 0.5;
          n.querySelectorAll(".opt-row").forEach(function (x) {
            x.classList.remove("drop-before", "drop-after");
          });
          r.classList.add(before ? "drop-before" : "drop-after");
        });
        r.addEventListener("drop", function (e) {
          if (ODRAG == null || ODRAG === i) return;
          e.preventDefault();
          var bx = r.getBoundingClientRect();
          var at = i + ((e.clientY - bx.top) / bx.height < 0.5 ? 0 : 1);
          var moved = f.options.splice(ODRAG, 1)[0];
          if (ODRAG < at) at--;
          f.options.splice(at, 0, moved);
          ODRAG = null;
          markDirty(); paint(); rebuildDefault(f, key);
          announce("Moved " + (moved.label || "the option") + " to " + (at + 1) + " of " + f.options.length + ".");
        });
      }

      var li = inp(o.label, { label: "Label for option " + (i + 1), ph: "Label", ro: ro });
      li.addEventListener("input", function () {
        o.label = li.value;
        if (!o.keyTouched) { o.key = slugify(li.value); ki.value = o.key; }
        markDirty();
      });
      li.addEventListener("blur", function () { rebuildDefault(f, key); });
      r.appendChild(li);

      var ki = inp(o.key, { mono: true, label: "Key for option " + (i + 1), ph: "key", ro: ro });
      ki.addEventListener("input", function () {
        o.keyTouched = true;
        o.key = slugify(ki.value);
        markDirty();
      });
      ki.addEventListener("blur", function () { ki.value = o.key; rebuildDefault(f, key); });
      r.appendChild(ki);

      if (ro) { r.appendChild(el("span")); n.appendChild(r); return; }
      var m = el("button", "rep-more", ic("i-dots-v"));
      m.type = "button";
      m.setAttribute("aria-label", "Actions for the option " + (o.label || i + 1));
      m.setAttribute("aria-expanded", "false");
      m.addEventListener("click", function (e) {
        e.stopPropagation();
        menu(m, [
          { label: "Move up", ic: "i-chev-u", disabled: i === 0,
            run: function () { move(f.options, i, -1); markDirty(); paint(); rebuildDefault(f, key); } },
          { label: "Move down", ic: "i-chev-d", disabled: i === f.options.length - 1,
            run: function () { move(f.options, i, 1); markDirty(); paint(); rebuildDefault(f, key); } },
          "-",
          { label: "Remove option", ic: "i-trash", danger: true, run: function () {
            f.options.splice(i, 1);
            markDirty(); paint(); rebuildDefault(f, key);
            announce("Removed the option " + (o.label || "") + ".");
          } }]);
      });
      r.appendChild(m);
      n.appendChild(r);
    });
    if (!ro) {
      var ft = el("div", "nest-foot");
      ft.appendChild(btn(ic("i-plus") + "Add Option", "btn-ghost sm", function () {
        f.options = opts(f).slice();
        var base = "option", k = base, c = 2;
        while (f.options.some(function (x) { return x.key === k; })) k = base + "_" + c++;
        f.options.push({ key: k, label: "" });
        markDirty(); paint(); rebuildDefault(f, key);
        var rows = n.querySelectorAll(".opt-row");
        var last = rows[rows.length - 1];
        if (last) last.querySelector("input").focus();
      }));
      n.appendChild(ft);
    }
  }
  paint();
  box.appendChild(n);
  box.appendChild(el("div", "hint", cfg.hint ||
    "The label is what the editor shows. The key is what the entry stores, so a label can be reworded later without touching saved values."));
  return box;
}

/* ------------------------------------------------------------ the icon field -- */
/* The icon set is the one this admin already draws with, so the control shows
   the glyph itself rather than a name to be trusted. */

function iconNames() {
  var out = [];
  document.querySelectorAll("symbol[id]").forEach(function (sy) {
    if (sy.id !== "i-shapes") out.push(sy.id);
  });
  return out;
}

function iconControl(value, onPick, ro) {
  var wrap = el("div", "ico-pick");
  var tile = el("button", "ico-tile" + (value ? " set" : ""), ic(value || "i-shapes"));
  tile.type = "button";
  var shown = value ? value.replace(/^i-/, "") : "";
  tile.setAttribute("aria-label", value ? "Change the icon, now " + shown : "Choose an icon");
  var name = el("code", "ico-name", esc(shown));
  var quiet = el("span", "hint", value ? "" : "None");
  wrap.appendChild(tile);
  wrap.appendChild(value ? name : quiet);
  if (ro) { tile.disabled = true; return wrap; }

  function set(v) {
    onPick(v || "");
    var next = iconControl(v, onPick, ro);
    if (wrap.parentNode) wrap.parentNode.replaceChild(next, wrap);
  }
  wrap.appendChild(btn(value ? "Change" : "Choose an Icon", "btn-ghost sm", function () {
    iconPicker(value, set);
  }));
  if (value) wrap.appendChild(btn("Clear", "btn-ghost sm", function () { set(""); }));
  return wrap;
}

/* The box an open group's own fields are moved into. Built empty: tree() puts
   the rows in, so they stay the same rows, with the same keys, drag and menus. */
function kidsBox(s, f, key, ro) {

    var ft = el("div", "kids-foot");
    ft.appendChild(btn(ic("i-plus") + "Add Field", "btn-ghost sm", function () {
      f.fields = f.fields || [];

    }));

  }

    : "These are saved under their own keys, next to the set's other fields."));

/* One section, titled with the type's name, holding its options. */
function typeSection(s, f, key, ro) {
  var ty = T(f);
  var wrap = el("div", "ed-sub");
  wrap.appendChild(el("div", "ed-sub-h", ic(ty.ic) + esc(ty.label)));
  var body = el("div", "ed-row");
  var put = function (n) { body.appendChild(n); };
  var any = false;

  /* The four set-based controls differ only in how they draw, so one options
     editor serves all of them. */
  if (isSetted(f)) {
    any = true;
    put(optionsEditor(f, key, ro, {
      empty: "No options yet. Add the ones people can pick.",
      hint: isMulti(f)
        ? "Any number of these can be on at once. The key is what the entry stores."
        : "One of these at a time. The key is what the entry stores."
    }));
  }
  if (f.type === "number" || f.type === "range") {
    any = true;
    var three = el("div", "three-col");
    var lo = inp(f.low, { label: "Lowest", ph: "None", ro: ro, num: true });
    var hi = inp(f.high, { label: "Highest", ph: "None", ro: ro, num: true });
    var st = inp(f.step, { label: "Step", ph: f.whole ? "1" : "Any", ro: ro, num: true, min: 0 });
    lo.addEventListener("input", function () { f.low = lo.value; markDirty(); bounds(); });
    hi.addEventListener("input", function () { f.high = hi.value; markDirty(); bounds(); });
    st.addEventListener("input", function () { f.step = st.value; markDirty(); });
    three.appendChild(fieldBox("Lowest", lo));
    three.appendChild(fieldBox("Highest", hi));
    three.appendChild(fieldBox("Step", st, "How far each nudge moves."));
    put(three);
    /* A slider has to know where it starts and ends, so it says so rather than
       drawing something meaningless. */
    var need = el("div", "fld-err", ic("i-alert") + "A slider needs a lowest and a highest.");
    function bounds() { need.hidden = f.type !== "range" || (f.low !== "" && f.low != null && f.high !== "" && f.high != null); }
    bounds();
    put(need);
    put(sw(f.whole, "Whole numbers only", null, function (v) {
      f.whole = v;
      st.placeholder = v ? "1" : "Any";
      st.step = v ? "1" : "any";
      lo.step = hi.step = v ? "1" : "any";
      markDirty();
    }, { disabled: ro }));
    if (f.whole) { lo.step = hi.step = st.step = "1"; }
  }
  if (f.type === "date") {
    any = true;
    put(sw(f.withTime, "Includes a time", null, function (v) { f.withTime = v; markDirty(); draw(); },
      { disabled: ro }));
  }

  /* A file can be saved by its ID or by where it sits. The ID survives a
     rename or a move; the path is what a template prints without a lookup. */
  if (isMedia(f)) {
    any = true;
    put(sw(storesId(f), "Store the file's ID",
      "Off saves the file path instead. An ID survives the file being renamed or moved.",
      function (v) { f.storeAs = v ? "id" : "path"; markDirty(); draw(); focusRow(key, "[data-edit]"); },
      { disabled: ro }));
  }
  if (f.type === "color") {
    any = true;
    var pal = inp(f.palette, { mono: true, label: "Palette", ph: "Any color", ro: ro });
    pal.addEventListener("input", function () { f.palette = pal.value; markDirty(); });
    put(fieldBox("Palette", pal, "Hex values, separated by spaces. Leave it empty for any color."));
  }
  if (f.type === "items" || f.type === "object") {
    any = true;
    /* While the group is open its fields sit here, inside it, rather than as
       rows below. tree() moves the real rows into this box once it has them. */
    put(kidsBox(s, f, key, ro));
    if (f.type === "items") {
      var two2 = el("div", "two-col");
      var nm = inp(f.itemName, { label: "Call each item", ph: "Item", ro: ro });
      nm.addEventListener("input", function () { f.itemName = nm.value; markDirty(); });
      two2.appendChild(fieldBox("Call each item", nm,
        '"Add ' + esc(f.itemName || "Item") + '" in the editor.'));
      var cnt = el("div", "two-col");
      var fw = inp(f.fewest, { label: "Fewest", ph: "0", ro: ro });
      var mo = inp(f.most, { label: "Most", ph: "Any", ro: ro });
      fw.addEventListener("input", function () { f.fewest = fw.value; markDirty(); });
      mo.addEventListener("input", function () { f.most = mo.value; markDirty(); });
      cnt.appendChild(fieldBox("Fewest", fw));
      cnt.appendChild(fieldBox("Most", mo));
      two2.appendChild(cnt);
      put(two2);
      var sp = el("div", "sum-pick");
      (f.fields || []).forEach(function (c) {
        var b = el("button", null, ic("i-check") + esc(c.label));
        b.type = "button";
        var on = (f.sumWith || []).indexOf(c.key) > -1;
        b.setAttribute("aria-pressed", String(on));
        b.addEventListener("click", function () {
          f.sumWith = f.sumWith || [];
          var i = f.sumWith.indexOf(c.key);
          if (i > -1) f.sumWith.splice(i, 1); else f.sumWith.push(c.key);
          b.setAttribute("aria-pressed", String(i < 0));
          markDirty();
        });
        sp.appendChild(b);
      });
      put(fieldBox("Sum up each item with", sp, "What each item's one line says when it is closed."));
    }
  }
  if (!any) return null;
  wrap.appendChild(body);
  return wrap;
}

/* ------------------------------------------------------------- the picker -- */
/* About fifteen tiles plus whatever plugins add, so a modal with search. */

function typePicker(target, onPick, pick) {
  pick = pick || {};
  var sr = searchRow("Search field types…", "Search field types", function () { paint(); });
  var si = sr.input;
  var paint;

  /* A tile is a glyph and a name, so twenty of them fit at a glance. What a
     type is for belongs in one place, under whatever the pointer or the focus
     ring is on, rather than repeated across every tile. */
  var desc = el("div", "tdesc");
  function say(k) {
    var t = TYPES[k];
    desc.innerHTML = t
      ? "<b>" + esc(t.label) + "</b><span>" + esc(t.desc) +
        (t.plugin ? " From the " + esc(t.plugin) + "." : "") + "</span>"
      : '<span class="q">Point at a type to see what it holds.</span>';
  }
  say(TYPES[target.type] ? target.type : null);

  var d = modal("Choose a field type", function (b) {
    var list = el("div");
    b.appendChild(list);
    paint = function () {
      var q = si.value.trim().toLowerCase();
      list.innerHTML = "";
      var shown = 0;
      TSECS.forEach(function (sec) {
        /* One level, and no more: a field inside a group is never a group. */
        if (pick.flat && sec === "Structure") return;
        var keys = Object.keys(TYPES).filter(function (k) {
          var t = TYPES[k];
          if (t.sec !== sec) return false;
          return !q || (t.label + " " + t.desc).toLowerCase().indexOf(q) > -1;
        });
        if (!keys.length) return;
        list.appendChild(el("div", "tsec", esc(sec)));
        var g = el("div", "tgrid");
        keys.forEach(function (k) {
          var t = TYPES[k];
          shown++;
          var o = el("button", "topt", ic(t.ic) + '<span class="tn">' + esc(t.label) + "</span>" +
            (t.isNew ? '<span class="new-tag">New</span>' : ""));
          o.type = "button";
          o.title = t.desc;
          o.setAttribute("aria-checked", String(target.type === k));
          o.setAttribute("aria-describedby", "tdesc");
          o.setAttribute("role", "radio");
          o.addEventListener("mouseenter", function () { say(k); });
          o.addEventListener("focus", function () { say(k); });
          o.addEventListener("click", function () {
            if (target.type === k) { d.close(); return; }
            var before = target.type;
            target.type = k;
            /* Settings that belonged to the type it was stop meaning anything. */
            /* The four set-based controls share one set of options, so the
               options someone just typed survive a move between them. */
            var keepOpts = isSetted({ type: before }) && isSetted({ type: k });
            ["options", "low", "high", "step", "whole", "ph", "withTime", "palette", "storeAs"]
              .forEach(function (p) { if (!(keepOpts && p === "options")) delete target[p]; });
            if (keepOpts) delete target.def;
            if (isSetted({ type: k }) && !Array.isArray(target.options))
              target.options = [{ key: "first", label: "First" }, { key: "second", label: "Second" }];
            if ((k === "items" || k === "object") && !target.fields)
              target.fields = [{ key: "label", label: "Label", type: "text", req: true }];
            if (k === "items" && !target.itemName) { target.itemName = "Item"; target.fewest = ""; target.most = ""; target.sumWith = ["label"]; }
            if (k !== "items" && k !== "object") delete target.fields;
            if (before) target._typeChanged = before;
            d.close();
            onPick();
          });
          g.appendChild(o);
        });
        list.appendChild(g);
      });
      if (!shown) list.appendChild(el("div", "tnone", "No field type matches that."));
    };
    si.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { e.preventDefault(); d.close(); }
    });
    paint();
    setTimeout(function () { si.focus(); }, 30);
  }, [{ label: "Cancel" }], { wide: true, band: sr, foot: desc,
    sub: pick.flat ? "This one sits inside a group, so it can't be a group itself." : null });
  desc.id = "tdesc";
  desc.setAttribute("aria-live", "polite");
}

/* -------------------------------------------------------------- dialogs --- */

/* A search row for a modal's band. Escape closes the dialog rather than only
   clearing the field, which is what someone means by it here. */
function searchRow(placeholder, label, onType) {
  var r = el("label", "search");
  r.innerHTML = ic("i-search");

  i.placeholder = placeholder;
  i.setAttribute("aria-label", label);

  r.input = i;
  i.addEventListener("input", function () { onType(i.value.trim().toLowerCase()); });

function modal(title, buildBody, buttons, opts) {
  opts = opts || {};
  var d = el("dialog", "modal");
  if (opts.wide) d.style.width = "min(680px, calc(100vw - 32px))";
  var h = el("div", "modal-h", "<h2>" + esc(title) + "</h2>" + (opts.sub ? "<p>" + opts.sub + "</p>" : ""));
  d.appendChild(h);
  if (opts.band) {
    var band = el("div", "modal-band");
    band.appendChild(opts.band);
    d.appendChild(band);
  }
  var b = el("div", "modal-b");
  buildBody(b);
  d.appendChild(b);
  var f = el("div", "modal-f");
  if (opts.foot) f.appendChild(opts.foot);
  (buttons || []).forEach(function (x) {
    if (x.spacer) { f.appendChild(el("span", "mf-sp")); return; }
    f.appendChild(btn(x.label, x.cls || "", function () {
      if (x.run && x.run() === false) return;
      d.close();
    }));
  });
  d.appendChild(f);
  document.body.appendChild(d);
  d.addEventListener("close", function () { d.remove(); });
  d.showModal();
  return d;
}

function setDialog(s) {
  var creating = !s;
  var draft = s || { key: "", name: "", help: "", from: "This site", on: ["Recipes"],
    slot: "sidebar", pos: 10, fields: [] };
  var before = { name: draft.name, help: draft.help, on: draft.on.slice(),
    slot: draft.slot, pos: draft.pos };
  modal(creating ? "New Field Set" : "Settings", function (b) {
    var nm = inp(draft.name, { label: "Label" });
    nm.addEventListener("input", function () {
      draft.name = nm.value;
      if (creating) draft.key = slugify(nm.value).replace(/_/g, "-");
      if (!creating) { markDirty(); refreshHead(draft); }
    });
    b.appendChild(fieldBox("Label", nm, "The group's heading in the editor."));
    var hp = inp(draft.help, { label: "Help" });
    hp.addEventListener("input", function () { draft.help = hp.value; if (!creating) markDirty(); });
    b.appendChild(fieldBox("Help", hp, "Shown under the group's heading."));

    var box = el("div", "field");
    box.appendChild(el("div", "lab", "Also use on"));
    ALL_TYPES.forEach(function (t) {
      if (t === draft.on[0] && !creating) return;
      var clash = null;
      draft.fields.forEach(function (fl) {
        SETS.forEach(function (o) {
          if (o === draft || o.on.indexOf(t) < 0) return;
          o.fields.forEach(function (x) { if (x.key === fl.key) clash = o.name; });
        });
      });
      var c = sw(draft.on.indexOf(t) > -1, esc(t),
        clash ? esc(t) + " already has <code>" + esc(draft.fields[0].key) + "</code>, in " + esc(clash) : null,
        function (v) {
          var i = draft.on.indexOf(t);
          if (v && i < 0) draft.on.push(t);
          else if (!v && i > -1) draft.on.splice(i, 1);
          if (!creating) { markDirty(); refreshHead(draft); }
        }, { row: true, disabled: !!clash });
      if (clash) c.style.opacity = ".6";
      box.appendChild(c);
    });
    box.appendChild(el("div", "hint",
      "Its fields are added to every entry of these types. Editing a field changes it everywhere."));
    b.appendChild(box);

    /* Where the set lands on the entry's screen, and in what order among the
       sets that land in the same place. */
    var where = el("div", "ed-row ed-2");
    var slotSel = xsel("Where it appears", SLOTS.map(function (x) { return [x[0], x[1]]; }),
      slotOf(draft), function (v) {
        draft.slot = v;
        slotNote.textContent = slotHelp(v);
        if (!creating) { markDirty(); refreshHead(draft); }
      });
    var slotNote = el("div", "hint", slotHelp(slotOf(draft)));
    var slotBox = el("div", "field");
    slotBox.appendChild(el("div", "lab", "Where it appears"));
    slotBox.appendChild(slotSel);
    slotBox.appendChild(slotNote);
    where.appendChild(slotBox);
    var posIn = inp(posOf(draft), { label: "Position", num: true, step: "1" });
    posIn.addEventListener("input", function () {
      draft.pos = posIn.value;
      if (!creating) { markDirty(); refreshHead(draft); }
    });
    where.appendChild(fieldBox("Position", posIn, "Lowest first. Ties fall back to the name."));
    b.appendChild(where);
  }, [
    !creating && !s.locked ? { label: "Delete Field Set", cls: "btn-ghost btn-danger", run: function () { deleteSet(s); } } : { spacer: true },
    { spacer: true },
    { label: "Cancel", run: function () {
      if (creating) return;
      s.name = before.name; s.help = before.help; s.on = before.on;
      s.slot = before.slot; s.pos = before.pos;
      refreshHead(s);
    } },
    { label: creating ? "Create" : "Done", cls: "btn-primary", run: function () {
      if (creating) {
        if (!draft.name) return false;
        SETS.push(draft); S.set = draft.key; S.dirty = true; go("set");
        toast("<b>" + esc(draft.name) + "</b> created.");
      }
    } }
  ]);
}

function slotHelp(k) {
  for (var i = 0; i < SLOTS.length; i++) if (SLOTS[i][0] === k) return SLOTS[i][2];
  return "";
}

function deleteSet(s) {
  var others = s.on.slice(1);
  modal("Delete " + s.name + "?", function (b) {
    b.appendChild(el("p", "hint",
      "Its " + plural(s.fields.length, "field") + " leave every " +
      esc(s.on[0].toLowerCase().replace(/s$/, "")) + "'s form. Values stay in files."));
  }, [{ label: "Cancel" }, { label: "Delete Field Set", cls: "btn-danger-fill", run: function () {
    var i = SETS.indexOf(s);
    SETS.splice(i, 1);
    go("list");
    toast("<b>" + esc(s.name) + "</b> deleted.", { undo: function () { SETS.splice(i, 0, s); draw(); } });
  } }]);
}

/* Changing a saved key would orphan values, so the old key is kept as an
   older key unless you say otherwise. */
function keyDialog(f, done) {
  var n = ENTRY_COUNTS[f._savedKey] || 0;
  var keep = true;
  modal("Change the key?", function (b) {
    b.appendChild(el("p", "hint", plural(n, "recipe") + " have a value under <code>" +
      esc(f._savedKey) + "</code>. The new key is <code>" + esc(f.key) + "</code>."));
    b.appendChild(sw(true, "Keep reading their values from <code>" + esc(f._savedKey) + "</code>", null,
      function (v) { keep = v; }));
  }, [
    { label: "Cancel", run: function () { f.key = f._savedKey; draw(); } },
    { label: "Change Key", cls: "btn-primary", run: function () {
      if (keep) { f.was = (f.was || []).concat([f._savedKey]); }
      f._savedKey = f.key;
      markDirty(); done();
      toast("Key changed to <code>" + esc(f.key) + "</code>.");
    } }
  ]);
}

function removeField(s, list, f, i) {
  var n = ENTRY_COUNTS[f.key] || 0;
  modal("Remove " + f.label + "?", function (b) {
    b.appendChild(el("p", "hint", n
      ? plural(n, "recipe") + " keep their value in their files, but it won't show or be used."
      : "It leaves the form. Nothing has a value under it yet."));
  }, [{ label: "Cancel" }, { label: "Remove Field", cls: "btn-danger-fill", run: function () {
    list.splice(i, 1);
    S.open = null; S.sel = null;
    markDirty(); draw();
    announce("Removed " + f.label + ".");
    toast("Removed <b>" + esc(f.label) + "</b>.", { undo: function () { list.splice(i, 0, f); draw(); } });
  } }]);
}

function moveToSet(s, f, list, i) {
  var targets = SETS.filter(function (o) { return o !== s && !o.locked; });
  modal("Move " + f.label + " to another set", function (b) {
    var list = el("div", "pick-list");
    targets.forEach(function (o) {
      var r = el("button", "pick-row", ic("i-fields") + '<span class="l"><b>' + esc(o.name) +
        "</b><code>" + esc(o.key) + "</code></span>");
      r.type = "button";
      r.addEventListener("click", function () {
        list.splice(i, 1);
        o.fields.push(f);
        S.open = null; markDirty();
        document.querySelector("dialog.modal").close();
        draw();
        toast("Moved <b>" + esc(f.label) + "</b> to <b>" + esc(o.name) + "</b>.");
      });
      list.appendChild(r);
    });
    b.appendChild(list);
  }, [{ label: "Cancel" }]);
}

function addField(s, list, index, nearId) {
  list = list || s.fields;
  if (index == null) index = list.length;
  /* A new field has no type yet, so the inserter opens with nothing chosen
     and nothing claimed. */
  var draft = { key: "", label: "", type: "" };
  var nested = !!(nearId && nearId.indexOf(".") > -1);
  typePicker(draft, function () {
    draft.label = draft.type === "text" ? "New field" : TYPES[draft.type].label;
    draft.key = freeKey(s, slugify(draft.label));
    list.splice(index, 0, draft);
    draft._savedKey = null;
    markDirty();
    var path = nearId && nearId.indexOf(".") > -1 ? nearId.slice(0, nearId.lastIndexOf(".")) + "." : "";
    if (path) S.expand[path.slice(0, -1)] = true;
    S.sel = path + draft.key;
    S.open = S.sel;
    draw();
    var first = document.querySelector('.mt-item[data-id="' + CSS.escape(S.sel) + '"] .mt-edit input');
    if (first) { first.focus(); first.select(); }
    announce("Added " + draft.label + ", " + where(s, S.sel));
  }, { flat: nested });
}

/* --------------------------------------------------------- the entry editor -- */

var VALUES = { prep_time: "15", cook_time: "40", servings: "", difficulty: "Easy",
  diet: ["vegetarian", "gluten_free"],
  ingredients: [
    { amount: "2", unit: "lb", name: "Ground beef", note: "" },
    { amount: "1", unit: "can", name: "Kidney beans", note: "drained and rinsed" },
    { amount: "", unit: "", name: "", note: "" }
  ] };
var OPEN_ITEM = 1, OPEN_GROUPS = { "recipe-details": true };

function editorSets() {
  return SETS.filter(function (s) { return s.on.indexOf("Recipes") > -1 && !s.typeOff; });
}
function itemSummary(f, it) {
  var parts = (f.sumWith || []).map(function (k) { return it[k]; }).filter(Boolean);
  return parts.length ? parts.join(" · ") : "";
}

function screenEditor() {
  crumbs([{ t: "Content", section: true }, { t: "Recipes", go: "list" }, { t: "Editing", here: true }]);
  var w = el("div", "ed-screen");
  w.setAttribute("data-drawer", "open");

  var main = el("div", "ed-main");
  var bar = el("div", "ed-bar");
  bar.innerHTML =
    '<button class="tb" type="button" aria-label="Insert a component">' + ic("i-plus") + "</button>" +
    '<button class="tb" type="button" aria-label="Media">' + ic("i-media") + "</button>" +
    '<span class="sp"></span>' +
    '<button class="tb" type="button" aria-label="Bold"><b style="font-size:14px">B</b></button>' +
    '<button class="tb" type="button" aria-label="Italic"><i style="font-size:14px;font-family:var(--font-display)">I</i></button>' +
    '<span class="spacer"></span>' +
    '<span class="quiet">Saved 14:32</span>' +
    '<span class="pill neutral"><span class="d"></span>Draft</span>' +
    '<button class="btn sm" type="button">Save Draft</button>' +
    '<button class="btn btn-primary sm" type="button" id="pub">Publish</button>';
  main.appendChild(bar);
  var col = el("div", "ed-col");
  col.appendChild(slotPanels("top"));
  var doc = el("div", "ed-doc");
  doc.innerHTML = '<div class="ed-title">Weeknight Chili</div>' +
    '<pre class="src"><span class="sy">## </span><span class="hd">Before you start</span>\n\n' +
    "A pot of chili is forgiving. The only thing it will not forgive is\n" +
    "under-seasoning at the end.\n\n" +
    '<span class="sy">:::</span><span class="dir">callout</span><span class="at">{<span class="nm">type</span>=note}</span>\n' +
    "Brown the beef in two batches or it steams.\n" +
    '<span class="sy">:::</span></pre>';
  col.appendChild(doc);
  col.appendChild(slotPanels("main"));
  main.appendChild(col);
  w.appendChild(main);

  var dr = el("div", "drawer");
  var tabs = el("div", "dtabs");
  tabs.innerHTML = '<button class="dtab" role="tab" aria-selected="true" type="button">Recipe</button>' +
    '<button class="dtab" role="tab" aria-selected="false" type="button">Elements</button>' +
    '<span class="spacer"></span>';
  dr.appendChild(tabs);
  var body = el("div", "dbody");
  body.id = "dbody";
  dr.appendChild(body);
  w.appendChild(dr);
  return w;
}

/* The sets that asked for a slot other than the sidebar, drawn in the column
   where they asked to be, in the order they asked for. */
function slotPanels(slot) {
  var wrap = el("div", "ed-slot");
  wrap.dataset.slot = slot;
  bySlot(editorSets(), slot).forEach(function (s) {
    var p = el("div", "panel ed-panel");
    var h = el("div", "panel-head");
    h.innerHTML = "<h2>" + esc(s.name) + "</h2>" +
      (s.help ? '<span class="hint">' + esc(s.help) + "</span>" : "");
    p.appendChild(h);
    var body = el("div", "panel-body ed-panel-b");
    s.fields.forEach(function (f) { body.appendChild(control(f)); });
    p.appendChild(body);
    wrap.appendChild(p);
  });
  return wrap;
}

function drawDrawer() {
  var db = document.getElementById("dbody");
  if (!db) return;
  db.innerHTML = "";
  /* The columns hold their own sets, and those change with the same values.
     Rebuilding them would drop the caret, so whatever was focused is found
     again by the field it belongs to. */
  var was = document.activeElement;
  var wasIn = was && was.closest ? was.closest(".ed-slot") : null;
  var wasKey = wasIn && was.closest("[data-fk]") ? was.closest("[data-fk]").dataset.fk : null;
  var wasTag = was ? was.tagName : null;
  document.querySelectorAll(".ed-slot").forEach(function (n) {
    var fresh = slotPanels(n.dataset.slot);
    n.parentNode.replaceChild(fresh, n);
  });
  if (wasKey) {
    var again = document.querySelector('.ed-slot [data-fk="' + CSS.escape(wasKey) + '"] ' +
      (wasTag === "TEXTAREA" ? "textarea" : wasTag === "INPUT" ? "input" : "button"));
    if (again) again.focus();
  }
  var built = el("div", "dgroup");
  built.innerHTML = '<button class="dgroup-h" type="button" aria-expanded="false">' + ic("i-chev-r", "chev") +
    "<b>Status, address, and dates</b></button>";
  db.appendChild(built);

  bySlot(editorSets(), "sidebar").forEach(function (s) {
    var open = !!OPEN_GROUPS[s.key];
    var missing = s.fields.filter(function (f) { return f.req && !hasValue(f); });
    var g = el("div", "dgroup" + (missing.length ? " bad" : ""));
    var h = el("button", "dgroup-h", ic("i-chev-r", "chev") + "<b>" + esc(s.name) + "</b>" +
      (missing.length ? '<span class="pill danger"><span class="d"></span>' + missing.length + "</span>" : "") +
      '<span class="n">' + s.fields.length + "</span>");
    h.type = "button";
    h.setAttribute("aria-expanded", String(open));
    h.addEventListener("click", function () { OPEN_GROUPS[s.key] = !open; drawDrawer(); });
    g.appendChild(h);
    if (open) {
      var b = el("div", "dgroup-b");
      s.fields.forEach(function (f) { b.appendChild(control(f)); });
      g.appendChild(b);
    }
    db.appendChild(g);
  });
}
/* Changing a field's type is allowed; values that don't fit are reported
   rather than thrown away. */
function fits(f) {
  var v = VALUES[f.key];
  if (v == null || v === "") return true;
  if (f.type === "items" || f.type === "object") return Array.isArray(v) || typeof v === "object";
  if (isMulti(f)) return Array.isArray(v);
  if (Array.isArray(v) || (typeof v === "object" && f.type !== "bool")) return false;
  if (f.type === "number") return !isNaN(Number(v));
  return true;
}
function hasValue(f) {
  var v = VALUES[f.key];
  if (f.type === "items") return (v || []).some(function (it) { return itemSummary(f, it); });
  if (isMulti(f)) return Array.isArray(v) && v.length > 0;
  return v != null && v !== "";
}

function control(f) {
  var box = el("div", "field");
  box.dataset.fk = f.key;
  /* The author's form marks a required field beside its label; the chip in the
     admin's rows is a different job in a different place. */
  box.appendChild(el("div", "lab", esc(f.label) +
    (f.req ? '<span class="req-mark" title="Required to publish">' + ic("i-required") +
      '<span class="sr">Required</span></span>' : "")));
  var v = VALUES[f.key];

  if (f.type === "items") {
    box.appendChild(repControl(f));
  } else if (f.type === "object") {
    /* A group holds no value of its own, so it draws its fields under its
       heading rather than a box with nothing to put in it. */
    var og = el("div", "obj");
    (f.fields || []).forEach(function (c) { og.appendChild(control(c)); });
    box.appendChild(og);
  } else if (f.type === "radio") {
    box.appendChild(seg(optPairs(f), v || f.def, function (x) { VALUES[f.key] = x; drawDrawer(); }));
  } else if (f.type === "select") {
    box.appendChild(xsel(f.label, [["", "None"]].concat(optPairs(f)), v || f.def || "",
      function (x) { VALUES[f.key] = x; drawDrawer(); }));
  } else if (f.type === "bool") {
    box.innerHTML = "";
    box.appendChild(sw(v === true, esc(f.label), f.help ? esc(f.help) : null,
      function (x) { VALUES[f.key] = x; drawDrawer(); }, { row: true }));
  } else if (isMulti(f)) {
    box.appendChild(listControl(f));
  } else if (f.type === "icon") {
    box.appendChild(iconControl(v || f.def, function (x) { VALUES[f.key] = x; }, false));
  } else if (isMedia(f)) {
    box.appendChild(btn(ic(T(f).ic) + (v || "Choose a " + MEDIA[f.type]), "sm",
      function () { VALUES[f.key] = v ? "" : "chili-step-3.mp4"; drawDrawer(); }));
  } else if (f.type === "textarea" || f.type === "markdown") {
    var ta = el("textarea", "inp");
    ta.rows = 3; ta.value = v || "";
    if (f.ph) ta.placeholder = f.ph;
    ta.setAttribute("aria-label", f.label);
    ta.addEventListener("input", function () { VALUES[f.key] = ta.value; });
    box.appendChild(ta);
  } else if (f.type === "range" && f.low != null && f.low !== "" && f.high != null && f.high !== "") {
    var sl = el("div", "slider");
    var r = el("input");
    r.type = "range";
    r.min = f.low; r.max = f.high;
    r.step = f.step || (f.whole ? 1 : "any");
    r.value = v === "" || v == null ? f.def || f.low : v;
    r.setAttribute("aria-label", f.label);
    var read = el("output", "slider-v", esc(String(r.value)) + (f.unit ? " " + esc(f.unit) : ""));
    r.addEventListener("input", function () {
      VALUES[f.key] = r.value;
      read.textContent = r.value + (f.unit ? " " + f.unit : "");
    });
    r.addEventListener("change", drawDrawer);
    sl.appendChild(el("span", "slider-end", esc(String(f.low))));
    sl.appendChild(r);
    sl.appendChild(el("span", "slider-end", esc(String(f.high))));
    box.appendChild(sl);
    box.appendChild(read);
  } else if (f.type === "number") {
    var wl = el("div", "inp-row");
    var i = inp(v, { label: f.label, ph: f.ph || f.def, num: true,
      step: f.step || (f.whole ? "1" : "any"), min: f.low });
    i.addEventListener("input", function () { VALUES[f.key] = i.value; });
    i.addEventListener("blur", drawDrawer);
    wl.appendChild(i);
    if (f.unit) wl.appendChild(el("span", "quiet", esc(f.unit)));
    box.appendChild(wl);
  } else {
    var i2 = inp(v, { label: f.label, ph: f.ph || (f.type === "url" ? "https://" : "") });
    i2.addEventListener("input", function () { VALUES[f.key] = i2.value; });
    i2.addEventListener("blur", drawDrawer);
    box.appendChild(i2);
  }

  if (!fits(f)) {
    box.appendChild(el("div", "fld-err", ic("i-warn") +
      "This recipe's value doesn't fit a " + esc(T(f).label) + ". You'll see it in Site Health."));
  } else if (f.req && !hasValue(f)) {
    box.appendChild(el("div", "fld-err", ic("i-alert") + "Add " + esc(f.label.toLowerCase()) + " to publish."));
  } else if (f.help) box.appendChild(el("div", "hint", esc(f.help)));
  return box;
}

/* A list: pressable options when it is held to a set, a menu of them when the
   set is long enough to want one, and plain lines when it is not held at all. */
function listControl(f) {
  if (!Array.isArray(VALUES[f.key])) VALUES[f.key] = [];
  var v = VALUES[f.key], pairs = optPairs(f);
  if (!pairs.length) return el("div", "hint", "No options yet.");
  if (f.type === "checkboxes") return multiPick(pairs, v, drawDrawer);

  var w = el("div", "tokens");
  v.forEach(function (k, i) {
    var p = pairs.filter(function (x) { return x[0] === k; })[0];
    var lab = p ? p[1] : k;
    var t = el("span", "token", esc(lab));
    var x = el("button", "tkx", ic("i-x"));
    x.type = "button";
    x.setAttribute("aria-label", "Remove " + lab);
    x.addEventListener("click", function () { v.splice(i, 1); drawDrawer(); });
    t.appendChild(x);
    w.appendChild(t);
  });
  var left = pairs.filter(function (p) { return v.indexOf(p[0]) < 0; });
  var add = el("button", "token-add", ic("i-plus") + (v.length ? "Add" : "Choose"));
  add.type = "button";
  add.disabled = !left.length;
  add.setAttribute("aria-haspopup", "menu");
  add.setAttribute("aria-expanded", "false");
  add.addEventListener("click", function (e) {
    e.stopPropagation();
    menu(add, left.map(function (p) {
      return { label: p[1], ic: "i-plus", run: function () { v.push(p[0]); drawDrawer(); } };
    }));
  });
  w.appendChild(add);
  return w;
}

/* The repeating group control, which has to work in a 372px drawer. */
function repControl(f) {
  if (!Array.isArray(VALUES[f.key])) VALUES[f.key] = [];
  var items = VALUES[f.key];
  var wrap = el("div", "rep");
  items.forEach(function (it, i) {
    var open = OPEN_ITEM === i;
    var sum = itemSummary(f, it);
    var r = el("button", "rep-row" + (sum ? "" : ""), "");
    r.type = "button";
    r.setAttribute("aria-expanded", String(open));
    r.innerHTML = '<span class="grip" aria-hidden="true">' + ic("i-grip") + "</span>" +
      '<span class="rep-sum' + (sum ? "" : " none") + '">' +
      (sum || "Untitled " + esc((f.itemName || "item").toLowerCase())) + "</span>";
    r.addEventListener("click", function () { OPEN_ITEM = open ? -1 : i; drawDrawer(); });
    var m = el("span", "rep-more", ic("i-dots-v"));
    r.appendChild(m);
    wrap.appendChild(r);
    if (open) {
      var o = el("div", "rep-open");
      (f.fields || []).forEach(function (c) {
        var fb = el("div", "field");
        fb.appendChild(el("div", "lab", esc(c.label)));
        if (c.type === "select" || c.type === "radio") {
          fb.appendChild(xsel(c.label, [["", "None"]].concat(optPairs(c)), it[c.key] || "",
            function (x) { it[c.key] = x; drawDrawer(); }));
        } else {
          var ii = inp(it[c.key], { label: c.label });
          ii.addEventListener("input", function () { it[c.key] = ii.value; });
          ii.addEventListener("blur", drawDrawer);
          fb.appendChild(ii);
        }
        o.appendChild(fb);
      });
      var fo = el("div", "ed-foot");
      fo.appendChild(el("span", "hint", ""));
      fo.appendChild(btn("Done", "sm", function () { OPEN_ITEM = -1; drawDrawer(); }));
      o.appendChild(fo);
      wrap.appendChild(o);
    }
  });
  var foot = el("div", "rep-foot");
  var most = Number(f.most) || 0;
  var atMost = most && items.length >= most;
  var add = btn(ic("i-plus") + "Add " + esc(f.itemName || "Item"), "btn-ghost sm", function () {
    items.push({}); OPEN_ITEM = items.length - 1; drawDrawer();
  });
  add.disabled = atMost;
  foot.appendChild(add);
  wrap.appendChild(foot);
  if (atMost) wrap.appendChild(el("div", "rep-cap", "Most is " + most + "."));
  return wrap;
}

/* ---------------------------------------------------------------- router -- */

function snapshot() {
  var s = setOf(S.set);
  S.snap = s ? JSON.stringify(s) : null;
}
function revert() {
  if (!S.snap) return;
  var i = SETS.findIndex(function (x) { return x.key === S.set; });
  if (i > -1) SETS[i] = JSON.parse(S.snap);
  S.dirty = false; S.open = null; S.sel = null;
}
/* Leaving a set with unsaved changes asks, the way leaving a menu does. */
function leave(then) {
  if (!S.dirty || SCREEN !== "set") return then();
  var s = setOf(S.set);
  modal("Save changes to " + s.name + "?", function (b) {
    b.appendChild(el("p", "hint", "Its fields have changed. Nothing is written until you save."));
  }, [
    { label: "Keep Editing" },
    { label: "Discard Changes", cls: "btn-ghost btn-danger", run: function () { revert(); then(); } },
    { label: "Save", cls: "btn-primary", run: function () {
      S.dirty = false; snapshot(); then();
      toast("<b>" + esc(s.name) + "</b> saved.");
    } }
  ]);
}
function openSet(k) {
  S.set = k; S.sel = null; S.open = null; S.dirty = false; S.expand = {};
  snapshot();
  go("set");
}
function go(s) { SCREEN = s; draw(); }

function draw() {
  closeMenu();
  SECTION = SCREEN === "editor" ? "content" : "structure";
  renderNav();
  var work = document.getElementById("work");
  var top = work.scrollTop;
  work.innerHTML = "";
  var node;
  if (SCREEN === "list") { node = screenList(); top = 0; }
  else if (SCREEN === "editor") { node = screenEditor(); top = 0; }
  else node = screenSet(setOf(S.set) || SETS[0]);
  if (SCREEN === "editor") { work.style.overflow = "hidden"; node.style.height = "100%"; }
  else work.style.overflow = "auto";
  work.appendChild(node);
  if (SCREEN === "editor") drawDrawer();
  if (SCREEN === "set") { work.scrollTop = top; paintSave(); }
}

draw();
