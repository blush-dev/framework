<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>X3P0 Content Types</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap">
<style>
/* X3P0 admin: Content Types, a sketch.
   Layout: the admin shell (rail, section panel, top bar) around one work column;
   lists are full width, a type's page has a sticky section index beside its panels.
   Tokens follow design/tokens.css names. Values follow the running admin as it
   appears in the owner's screenshots: system fonts, Fira Code for machine data,
   a navy accent. Anything prefixed lab- is the harness, not the admin. */
:root{
  --bg:#f3f4f7; --surface:#fbfcfd; --surface-2:#eff1f5; --surface-3:#e5e8ee;
  --border:#e1e4ea; --border-strong:#c9cfd9;
  --fg:#141a24; --fg-2:#4f5868; --fg-3:#7f8899;
  --accent:#1d3a5c; --accent-hover:#152d49; --accent-fg:#ffffff; --accent-soft:#d9e4f1; --accent-line:#b2c6de;
  --good:#136b43; --good-soft:#e2f3e9; --good-dot:#1f9d5f;
  --warn:#8a5806; --warn-soft:#faf0d9; --warn-dot:#cf8d16;
  --danger:#a92420; --danger-soft:#fbeae9; --danger-dot:#d6403a;
  --shadow-1:none;
  --shadow-2:0 2px 8px rgba(17,20,27,.06), 0 1px 2px rgba(17,20,27,.05);
  --shadow-3:0 10px 28px rgba(17,20,27,.12), 0 2px 6px rgba(17,20,27,.06);
  --scrim:rgba(17,20,27,.32);
  --knob:#ffffff;
  --r-1:6px; --r-2:10px; --r-3:16px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:18px; --s-5:26px; --s-6:36px; --s-7:52px;
  --font-ui:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-display:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-title:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --base:13px; --h1:26px; --h1-track:-.022em;
  --title-size:13.5px; --title-weight:500; --title-track:-.005em;
  --pad-row:14px; --pad-panel:17px; --pad-x:22px; --ctl:34px; --ctl-sm:30px;
  --railbar:74px; --rail:262px; --bar:62px; --work-max:1180px; --measure:72ch;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d12; --surface:#13161d; --surface-2:#1a1e27; --surface-3:#222733;
    --border:#242936; --border-strong:#353c4c;
    --fg:#e9ebf0; --fg-2:#a3abba; --fg-3:#747d8e;
    --accent:#8fb4e3; --accent-hover:#a8c6ec; --accent-fg:#0b0d12; --accent-soft:#17253a; --accent-line:#2a4264;
    --good:#5ecb92; --good-soft:#102a1e; --good-dot:#35b877;
    --warn:#e3b360; --warn-soft:#2b2312; --warn-dot:#d69f3c;
    --danger:#f28d84; --danger-soft:#301917; --danger-dot:#e0655c;
    --shadow-2:0 2px 8px rgba(0,0,0,.3); --shadow-3:0 10px 28px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    --scrim:rgba(0,0,0,.55); --knob:#e9ebf0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d12; --surface:#13161d; --surface-2:#1a1e27; --surface-3:#222733;
  --border:#242936; --border-strong:#353c4c;
  --fg:#e9ebf0; --fg-2:#a3abba; --fg-3:#747d8e;
  --accent:#8fb4e3; --accent-hover:#a8c6ec; --accent-fg:#0b0d12; --accent-soft:#17253a; --accent-line:#2a4264;
  --good:#5ecb92; --good-soft:#102a1e; --good-dot:#35b877;
  --warn:#e3b360; --warn-soft:#2b2312; --warn-dot:#d69f3c;
  --danger:#f28d84; --danger-soft:#301917; --danger-dot:#e0655c;
  --shadow-2:0 2px 8px rgba(0,0,0,.3); --shadow-3:0 10px 28px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.55); --knob:#e9ebf0;
  color-scheme:dark;
}

/* ------------------------------------------------------------------ base -- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:var(--base);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono,code{font-family:var(--font-mono);font-variant-ligatures:none}
.num,td,th,time{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ======================================================== lab harness == */
.lab{display:flex;flex-direction:column;height:100%}
.lab-bar{flex:none;display:flex;align-items:center;gap:var(--s-3) var(--s-4);flex-wrap:wrap;
  padding-block:var(--s-2);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface-3);border-bottom:1px solid var(--border-strong)}
.lab-mark{display:flex;align-items:baseline;gap:var(--s-2);margin-right:auto;min-width:0}
.lab-mark b{font-size:13px;font-weight:600}
.lab-mark span{color:var(--fg-3);font-size:11.5px}
.lab-grp{display:flex;align-items:center;gap:var(--s-2)}
.lab-grp > span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3);font-weight:600}
.lab-seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-1);padding:2px;gap:2px}
.lab-seg button{font-size:11.5px;color:var(--fg-2);padding:0 9px;height:22px;border-radius:4px;white-space:nowrap}
.lab-seg button:hover{color:var(--fg)}
.lab-seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.lab-btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-1);border:1px solid var(--border);background:var(--surface);font-size:11.5px;font-weight:500}
.lab-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.lab-btn .ic{width:14px;height:14px}
@media (max-width:1300px){.lab-mark span{display:none}}
@media (max-width:760px){.lab-grp > span{display:none}.lab-grp.wide{display:none}}
.lab-notes{position:fixed;top:0;right:0;bottom:0;width:min(470px,100vw);background:var(--surface);border-left:1px solid var(--border-strong);box-shadow:var(--shadow-3);z-index:80;overflow-y:auto;
  padding:var(--s-5) max(var(--s-5),env(safe-area-inset-right,0px)) var(--s-6) var(--s-5);display:flex;flex-direction:column;gap:var(--s-3)}
.lab-notes[hidden]{display:none}
.lab-notes h2{font-size:17px;font-weight:600;display:flex;align-items:center;gap:var(--s-2)}
.lab-notes h2 button{margin-left:auto}
.lab-notes h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3);font-weight:600;margin-top:var(--s-3)}
.lab-notes p,.lab-notes li{font-size:12.5px;color:var(--fg-2);line-height:1.6}
.lab-notes ol{display:flex;flex-direction:column;gap:var(--s-3)}
.lab-notes li{display:flex;gap:var(--s-3)}
.lab-notes li b{color:var(--fg);font-weight:600}
.lab-notes li > i{font-style:normal;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);flex:none;padding-top:2px;width:24px}
.lab-notes code{font-size:11.5px;color:var(--fg)}

/* ============================================================ the shell == */
.app{flex:1 1 auto;min-height:0;display:flex;background:var(--bg)}
.rail{flex:none;width:var(--railbar);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--s-3) 0;overflow-y:auto}
.rail .logo{width:40px;height:40px;border-radius:var(--r-2);background:var(--fg);color:var(--surface);display:grid;place-items:center;font-weight:600;font-size:15px;margin-bottom:var(--s-3)}
.rail button{width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 7px;border-radius:var(--r-2);font-size:10.5px;color:var(--fg-2)}
.rail button .ic{width:20px;height:20px}
.rail button:hover{background:var(--surface-2);color:var(--fg)}
.rail button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.side{flex:none;width:var(--rail);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.side-h{height:var(--bar);padding:0 var(--s-5);display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--border);box-sizing:content-box;padding-block:6px}
.side-h b{font-size:15px;font-weight:600}
.side-h span{font-size:11.5px;color:var(--fg-3)}
.side nav{display:flex;flex-direction:column;gap:2px;padding:var(--s-4) var(--s-3)}
.side nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r-1);font-size:13px;color:var(--fg-2);position:relative}
.side nav a:hover{background:var(--surface-2);color:var(--fg)}
.side nav a .ic{width:17px;height:17px}
.side nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.side nav a[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 2px 2px 0;background:var(--accent)}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{flex:none;height:var(--bar);box-sizing:content-box;padding-block:6px;display:flex;align-items:center;gap:var(--s-3);padding-inline:var(--s-5);background:var(--surface);border-bottom:1px solid var(--border)}
.crumbs{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--fg-2);min-width:0;margin-right:auto;white-space:nowrap;overflow:hidden}
.crumbs a:hover{color:var(--accent)}
.crumbs .sep{color:var(--fg-3)}
.crumbs [aria-current]{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.jump{display:flex;align-items:center;gap:9px;width:240px;height:var(--ctl);padding:0 10px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--bg);color:var(--fg-3);font-size:12.5px}
.jump .ic{width:14px;height:14px}
.jump kbd{margin-left:auto}
kbd{font-family:var(--font-mono);font-size:10px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--fg-3);background:var(--surface)}
.avatar{width:32px;height:32px;border-radius:99px;background:var(--surface-3);color:var(--fg-2);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.work{flex:1 1 auto;min-height:0;overflow-y:auto;scroll-padding-top:var(--s-4)}
.page{max-width:var(--work-max);margin:0 auto;padding:var(--s-6) var(--s-6) 120px;display:flex;flex-direction:column;gap:var(--s-5)}
@media (max-width:1180px){.side{display:none}}
@media (max-width:760px){
  .rail{display:none}.jump{display:none}.topbar .vs span{display:none}
  .topbar{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  .page{padding:var(--s-5) max(16px,env(safe-area-inset-right,0px)) 140px max(16px,env(safe-area-inset-left,0px))}
  .crumbs .sec,.crumbs .sec + .sep{display:none}
}

/* ============================================================ primitives == */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:var(--ctl);padding:0 14px;border-radius:var(--r-1);border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.sm{height:var(--ctl-sm);padding:0 11px;font-size:12.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.danger{color:var(--danger);border-color:var(--border-strong)}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger-dot)}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.danger-fill:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .ic{width:15px;height:15px}
.btn.icon{width:var(--ctl-sm);height:var(--ctl-sm);padding:0}
.btn .spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
a.lnk,button.lnk{color:var(--accent);font-weight:500}
a.lnk:hover,button.lnk:hover{text-decoration:underline}

.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;background:var(--surface-2);color:var(--fg-2);font-size:11px;font-weight:500;border:1px solid var(--border);white-space:nowrap;vertical-align:middle}
.tag .ic{width:12px;height:12px}
.tag.chg{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.tag.dash{background:transparent;border-style:dashed;border-color:var(--border-strong)}
.dot{width:6px;height:6px;border-radius:99px;background:var(--accent);flex:none;display:inline-block}

.inp{height:var(--ctl);padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--r-1);background:var(--surface);font-size:13px;width:100%;max-width:440px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.mono{font-size:12.5px}
.inp.bad,.affix.bad{border-color:var(--danger-dot)}
.inp.bad:focus,.affix.bad:focus-within{box-shadow:0 0 0 3px var(--danger-soft)}
.inp.sm{max-width:110px}
textarea.inp{height:auto;min-height:64px;padding:8px 10px;line-height:1.5;resize:vertical}
.affix{display:flex;align-items:stretch;max-width:440px;border:1px solid var(--border-strong);border-radius:var(--r-1);background:var(--surface);overflow:hidden}
.affix:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.affix > span{display:flex;align-items:center;padding:0 10px;background:var(--surface-2);color:var(--fg-3);font-family:var(--font-mono);font-size:12px;border-right:1px solid var(--border);white-space:nowrap}
.affix input{flex:1;min-width:0;height:calc(var(--ctl) - 2px);border:0;outline:0;padding:0 10px;font-family:var(--font-mono);font-size:12.5px;background:transparent}
.sel{position:relative;display:inline-flex;align-items:center;width:100%;max-width:300px}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:var(--ctl);padding:0 34px 0 11px;border:1px solid var(--border-strong);border-radius:var(--r-1);background:var(--surface);font-size:13px;cursor:pointer}
.sel select:focus-visible{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sel select:disabled{color:var(--fg-3);background:var(--surface-2);cursor:default}
.sel .ic{position:absolute;right:11px;width:15px;height:15px;color:var(--fg-2);pointer-events:none}

/* A checkbox is a value in a form about to be saved. */
.cbx{position:relative;display:inline-flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:13px;color:var(--fg)}
.cbx input{position:absolute;opacity:0;width:1px;height:1px}
.cbx .bx{width:16px;height:16px;flex:none;margin-top:1px;border:1px solid var(--border-strong);border-radius:4px;display:grid;place-items:center;color:transparent;background:var(--surface)}
.cbx .bx .ic{width:12px;height:12px;stroke-width:2.6}
.cbx input:checked + .bx{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cbx input:focus-visible + .bx{outline:2px solid var(--accent);outline-offset:2px}
.cbx input:disabled + .bx{background:var(--surface-2);border-color:var(--border)}
.cbx input:disabled:checked + .bx{background:var(--fg-3);border-color:var(--fg-3)}
.cbx:has(input:disabled){cursor:default}
.cbx:has(input:disabled) .tx > span{color:var(--fg-3)}
.cbx .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.cbx .tx small{font-size:12px;color:var(--fg-3);line-height:1.5}
.cbx .tx small code{font-size:11.5px;color:var(--fg-2)}
/* Switch: track, knob and an On/Off word, so state is never color alone. */
.swf{display:flex;flex-direction:column;gap:6px;min-width:0}
.swr{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;align-self:flex-start}
.swr input{position:absolute;opacity:0;width:1px;height:1px}
.swr .sw{width:34px;height:20px;border-radius:99px;background:var(--border-strong);position:relative;flex:none;transition:background .15s}
.swr .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:99px;background:var(--knob);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.swr input:checked + .sw{background:var(--accent)}
.swr input:checked + .sw::after{left:16px}
.swr input:focus-visible + .sw{outline:2px solid var(--accent);outline-offset:2px}
.swr .st{font-size:12.5px;font-weight:600;color:var(--fg-2);min-width:24px}
.swr input:checked ~ .st{color:var(--fg)}
.swr:has(input:disabled){cursor:default}
.swr input:disabled + .sw{opacity:.45}
.swr input:disabled ~ .st{color:var(--fg-3)}
.swd{font-size:12.5px;color:var(--fg-3);line-height:1.55;max-width:66ch}
.swd code{font-size:11.5px;color:var(--fg-2)}
.swd b{color:var(--fg-2);font-weight:600}
.fedit .swf{justify-content:flex-start}
.rdo .bx{border-radius:99px}
.rdo input:checked + .bx{background:var(--surface);border:5px solid var(--accent)}
.cblist{display:flex;flex-direction:column;gap:var(--s-3)}
.cbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:var(--s-3) var(--s-4);max-width:620px}

/* ---- notices: neutral explains; warn and bad are states ---- */
.notice{display:flex;gap:var(--s-3);align-items:flex-start;padding:var(--s-3) var(--s-4);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-2);font-size:13px;color:var(--fg-2);line-height:1.6}
.notice > .ic{color:var(--fg-3);margin-top:3px}
.notice .tx{flex:1;min-width:0}
.notice b{color:var(--fg);font-weight:600}
.notice code{font-size:12px;color:var(--fg)}
.notice .acts{display:flex;gap:var(--s-2);flex:none;align-self:center}
.notice.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn-dot) 35%,transparent);color:var(--warn)}
.notice.warn > .ic{color:var(--warn-dot)} .notice.warn b,.notice.warn code{color:var(--warn)}
.notice.bad{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger-dot) 35%,transparent);color:var(--danger)}
.notice.bad > .ic{color:var(--danger-dot)} .notice.bad b{color:var(--danger)}
.notice.big{padding:var(--s-4) var(--s-5);border-radius:var(--r-3)}
.notice ul{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.notice ul li{display:flex;gap:6px;align-items:baseline}
.notice ul li::before{content:"";width:4px;height:4px;border-radius:9px;background:currentColor;flex:none;transform:translateY(-2px)}
@media (max-width:640px){.notice{flex-wrap:wrap}.notice .acts{width:100%}}

/* ---- page head ---- */
.ph{display:flex;flex-direction:column;gap:var(--s-2)}
.ph-back{display:inline-flex;align-items:center;gap:var(--s-1);font-size:12.5px;color:var(--fg-2);align-self:flex-start}
.ph-back:hover{color:var(--accent)}
.ph-back .ic{width:14px;height:14px}

/* ---- panels ---- */

/* ---- the list ---- */
.ltools{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;padding:var(--s-4) var(--pad-x);border-bottom:1px solid var(--border)}

.tbl-shell{overflow-x:auto}

.tname{display:flex;gap:var(--s-3);align-items:flex-start;min-width:0}

.fph .rk{width:28px;height:28px;border-radius:var(--r-1);background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;color:var(--fg-2)}
.fph .rk .ic{width:14px;height:14px}
.fph code{font-size:12px;color:var(--fg-3)}
.lempty{padding:var(--s-7) var(--s-5);text-align:center;color:var(--fg-2);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px}

/* ---- settings rows: label left, control right ---- */
.srow{display:grid;grid-template-columns:minmax(150px,32%) minmax(0,1fr);gap:var(--s-2) var(--s-5);padding:var(--s-4) var(--pad-x);border-bottom:1px solid var(--border);align-items:start}

.after{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border-radius:var(--r-1);background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;color:var(--fg-2);line-height:1.55;max-width:560px}

.grp-gap{border-bottom:1px solid var(--border)}
.absent{padding:var(--s-3) var(--pad-x) var(--s-4);font-size:12.5px;color:var(--fg-3);display:flex;gap:8px;align-items:flex-start;line-height:1.55;border-bottom:1px solid var(--border)}

.absent:last-child{border-bottom:0}
@media (max-width:760px){.srow{grid-template-columns:minmax(0,1fr)}.srow > .lbl{padding-top:0}.srow .val{padding-top:0}}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-3)}

.choice{display:flex;flex-direction:column;gap:8px;padding:var(--s-4);border:1px solid var(--border-strong);border-radius:var(--r-2);background:var(--surface);cursor:pointer;position:relative;text-align:left}

.choice .chk{flex:none;margin-left:auto;width:18px;height:18px;border-radius:99px;border:1px solid var(--border-strong);display:grid;place-items:center;color:transparent;background:var(--surface)}

.choice p{font-size:12.5px;color:var(--fg-2);line-height:1.55}
.choice .eg{font-size:12px;color:var(--fg-3)}
.choice .plus{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--fg-2);border-top:1px dashed var(--border-strong);padding-top:8px;margin-top:2px;line-height:1.5}
.choice .plus .ic{width:13px;height:13px;margin-top:2px;color:var(--fg-3)}

/* ---- icon picker ---- */
.icpick{display:flex;flex-direction:column;gap:var(--s-2);max-width:440px}

.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;max-height:142px;overflow-y:auto;padding:6px;border:1px solid var(--border-strong);border-radius:var(--r-1);background:var(--surface)}

/* ---- the wizard ---- */

.picker{margin:var(--s-3) var(--pad-x);border:1px solid var(--border-strong);border-radius:var(--r-2);background:var(--surface);padding:var(--s-3);display:flex;flex-direction:column;gap:var(--s-2);box-shadow:var(--shadow-2)}

/* ---- the type page ---- */
/* No in-page sidebar: panels take the full width. One line of section links

.jumps{display:flex;flex-wrap:wrap;gap:6px;margin-top:calc(var(--s-1) * -1)}
.jumps a{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--fg-2)}

.tp-body{display:flex;flex-direction:column;gap:var(--s-5);min-width:0}
.sec{scroll-margin-top:var(--s-4)}

/* relationships */
.rels li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:var(--s-3);align-items:center;padding:13px var(--pad-x);border-bottom:1px solid var(--border)}
.rels li:last-child{border-bottom:0}

.rels .end .ic{width:14px;height:14px}
@media (max-width:640px){.rels li{grid-template-columns:28px minmax(0,1fr)}.rels .end{grid-column:2}}

/* addresses */
.routes{width:100%;border-collapse:collapse;min-width:640px}
.routes th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);padding:11px var(--pad-x);border-bottom:1px solid var(--border)}

.routes .ph-l code.need{color:var(--fg)}

.ptoks{display:none;flex-direction:column;gap:7px}

.savebar{position:sticky;bottom:0;z-index:20;margin-top:calc(var(--s-5) * -1 + var(--s-3));padding-bottom:max(var(--s-4),env(safe-area-inset-bottom,0px))}

.mdl-b .lst li .end{margin-left:auto}
.mdl-f{display:flex;gap:var(--s-2);justify-content:flex-end;padding:var(--s-4) var(--s-5);border-top:1px solid var(--border);flex-wrap:wrap}
.toasts{position:fixed;right:max(24px,env(safe-area-inset-right,0px));bottom:max(24px,env(safe-area-inset-bottom,0px));z-index:75;display:flex;flex-direction:column;gap:var(--s-2);align-items:flex-end;max-width:calc(100vw - 32px)}

<script>
const NOTES = `
<h2>Notes <button type="button" class="btn ghost sm" data-close>Close</button></h2>
<p>A sketch from the brief <i>Content types: a design brief</i>. It is a target, not a record. Saving is pretend; everything else works on invented data. The shell and the list follow the running admin in the owner's screenshots.</p>
<h3>The Three Screens</h3>
<ol>
<li><i>T1</i><span><b>The list keeps its shape and says more per row.</b> Kind tabs only for kinds the site has. Name over key and address in mono. Kind says what a taxonomy files and that a tree nests. Defined In names the plugin, not “A plugin”, and says whether anything was changed here. Fields counts the featured image.</span></li>
<li><i>T2</i><span><b>New Content Type is the type's page, empty.</b> Same sections, same order, same section links, same rows and controls. Only three things differ: the kind and the name can still be chosen, nothing marks unsaved changes because nothing is saved yet, and the bar at the foot says what Create will make and carries Cancel and Create where Save would be. Learning one screen teaches the other.</span></li>
<li><i>T3</i><span><b>A type's page is one long page of panels</b>, in the brief's order, full width, with one line of section links under the title (a dot marks a section with unsaved changes; no sidebar, which took too much room) and one save bar that counts every change.</span></li>
</ol>
<h3>The Brief's Open Questions</h3>
<ol>
<li><i>T4</i><span><b>Taxonomy is a kind on its card, and says once what it adds.</b> The card has a line under a dashed rule: a collection plus its relationship, made together. The summary then lists the relationship as a thing Create makes. After that, the type's page shows Kind: Taxonomy with one hint naming its relationship. No one needs the word “classify”.</span></li>
<li><i>T5</i><span><b>A taxonomy's entries are called by the type's own singular.</b> “Genre Page”, “Genre Feeds”, “Genre's Movies”, never “Term”. The admin only says “entries” where it means every type at once.</span></li>
<li><i>T6</i><span><b>Settings that don't apply follow three rules.</b> Ruled out by the kind: hidden, with one quiet line per group saying what the kind lacks (“No feed: a tree has no listing to feed from”). Ruled out by a fact of the site (one workflow, no profiles, a database): shown as a value with the reason. Ruled out by another setting on the page (Sitemap, llms.txt and Feed while not visible): shown off and disabled, with the setting that controls it named.</span></li>
<li><i>T7</i><span><b>Locks are one notice at the top, then values instead of boxes.</b> A plugin's type is editable, and each setting that differs from the plugin carries a dashed Changed Here tag and a line saying what the plugin sets. A built-in type and the config locks show values as text, with a lock only beside things that are fixed forever (key, kind). Nothing is greyed out wholesale, so nothing looks broken.</span></li>
<li><i>T8</i><span><b>What a change won't do is said under the control, as it's made</b>: file names and folders apply to new entries and Site Health can move the old ones; pages move to new addresses and old ones need redirects; entries keep their status. The save bar repeats it in one line (“Saving moves 951 pages to new addresses”), and the toasts after saving offer Add Redirects and Open Site Health.</span></li>
<li><i>T9</i><span><b>Deleting says where the entries go and leaves a trail back to them.</b> The confirm names the folder; the list then carries a notice naming the folder, Site Health's Content Files, and that a type with the same key brings them back, until it's dismissed. Delete is disabled, with the relationships to remove listed, while any relationship names the type, so the refusal is never a surprise after the click.</span></li>
</ol>
<h3>Other Calls</h3>
<ol>
<li><i>T10</i><span><b>Everything has one home.</b> The featured image is a field, in Fields, with Remove and Add Featured Image. Authors (credits, the authors list page and the byline) and nesting are relationships, so they sit at the top of Relationships, above the list. The URL prefix is in Addresses. None of them appears anywhere else.</span></li>
<li><i>T11</i><span><b>Names follow until typed.</b> Singular follows the plural made singular, and the name follows the singular; each hint says whether it's following. A field's name follows its label the same way.</span></li>
<li><i>T12</i><span><b>Address paths show their placeholders and the whole address.</b> Each route says what it needs and what it may hold; a missing or foreign placeholder is an error under the field and blocks the save.</span></li>
<li><i>T13</i><span><b>A clash with another type is the server's check</b>, so it's reported at Create or Save, says nothing changed, and points at the field.</span></li>
<li><i>T14</i><span><b>Who can use a new type is part of what Create makes.</b> Roles that grant every type get it; a role that names types doesn't, and the summary says where to add it.</span></li>
</ol>
<h3>Version 4</h3>
<ol>
<li><i>T15</i><span><b>Every setting names its <code>ContentType</code> option</b> under its label in mono (<code>public</code>, <code>urls</code>, <code>listing</code>, <code>dateArchives</code>, <code>filename</code>, <code>folders</code>, <code>closed</code>, <code>labels</code>…). Settings that are relationships (hierarchy, author credits) say so instead. Copy uses the technical terms: routes, front matter, patterns, defaults.</span></li>
<li><i>T16</i><span><b><code>public</code> and <code>urls</code> are separate.</b> Public is in Behavior; Routes (<code>urls: false</code>) is in Addresses. A public type with no routes can still be in <code>llms.txt</code>; sitemap and feeds need routes and say so when forced off.</span></li>
<li><i>T17</i><span><b>Labels</b> is its own panel: every derived string (menu name, New, Edit, View, Search, Not Found, empty heading, archive title, lowercase forms, and Parent or Add Inline where they apply) with its default as the placeholder and where it's used. A plugin's label shows Overridden and its default.</span></li>
<li><i>T18</i><span><b><code>folders</code> is a pattern</b> (<code>{year}</code>, <code>{year}/{month}</code>), typed or picked from presets, with the next file path previewed. <b><code>closed</code></b> is in Fields: reject undeclared front matter.</span></li>
</ol>
<h3>Version 5: From the Code</h3>
<ol>
<li><i>T19</i><span><b>Labels are <code>TypeLabels::KEYS</code>:</b> singular and plural (in General), then menu, item, items, newItem, editItem, searchItems in the Labels panel.</span></li>
<li><i>T20</i><span><b>Routes are <code>TypeUrls::DEFAULT_PATHS</code>,</b> grouped Collection, Single, Date Archives, each key in mono with its default path as the placeholder. No resolved-path column: as in Settings › Media, a pattern field shows an example and its tokens only while it's focused, and a token chip inserts at the caret (a dot marks a required one). File Names and Folders work the same way. <code>{name}</code>, not <code>{slug}</code>. Every date level has a paged route. A single that lists entries (a taxonomy's, a profile's) gets paged and feed routes. Relationship archives are those singles, not routes of their own. An empty prefix is <code>null</code>: the type's folder.</span></li>
<li><i>T21</i><span><b>Listing is <code>orderBy</code>, <code>order</code>, <code>perPage</code></b>: order by a built-in or a field, never a file name; per page a number or <code>all</code>. A feed has its own Listing and <code>categories</code> (the taxonomy whose terms become item categories; every taxonomy but <code>author</code> when unset).</span></li>
<li><i>T22</i><span><b>File names are a <code>FileName</code> pattern</b>: presets <code>{slug}</code> (PLAIN) and <code>{date}.{slug}</code> (DATED), and tokens slug, date, time, year … second.</span></li>
</ol>
<h3>Version 7</h3>
<ol>
<li><i>T23</i><span><b>Simple on/off settings are switches</b> with an On/Off word, as on Settings › Media, whether they apply at once or save with the page (the owner's call, recorded in the decisions log under Controls, revisited; the old “a switch takes effect now” rule was wrong). The sentence about what it controls sits under the switch. Lists of several choices, such as the types a taxonomy classifies, stay checkboxes.</span></li>
</ol>
<h3>Version 8: From the Reference</h3>
<ol>
<li><i>T24</i><span><b>Fields come from the field library.</b> A type places library fields, in order, each changeable for this type only in label, help and required (tagged Changed for This Type, with Use the Library's). Sections are headings over fields, one level. Add Field opens a search of the library; a field the type already declares (built in, a relationship's key, its setup) is listed but can't be placed. A plugin's PHP fields show read-only, first. Every type can be given fields, Pages and Profiles included.</span></li>
<li><i>T25</i><span><b>The featured image is the built-in <code>image</code> field</b>, listed with the other built-ins, not a setting. Field sets are gone; sections replace them.</span></li>
<li><i>T26</i><span><b>Order and Listing are separate:</b> <code>order</code> (date or position) is how entries sort everywhere; <code>listing</code> is the listing page's query (type, orderBy, order, perPage with 0 for all, and a JSON <code>query</code>). Feeds are off by default.</span></li>

function getPath(o, p) { return p.split(".").reduce((a, k) => a == null ? a : a[k], o); }

/* A row: label (and hint) left, control right. In "ed" mode it carries two

function row(c, o) {
  const k = o.k;

    if (keys.some(x => JSON.stringify(getPath(c, x)) !== JSON.stringify(getPath(c.orig, x)))) marks += `<span class="dot" title="Not saved yet" aria-label="Not saved yet"></span>`;

      codeLine = `<span class="why">${ic("code")}<span>Plugin default: <code>${esc(addrOf(c.code.prefix || c.key))}</code></span></span>`;
    }
    if (c.code && keys.every(x => x.startsWith("s.")) && keys.some(x => JSON.stringify(getPath(c, x)) !== JSON.stringify(c.code.s[x.slice(2)]))) {

    <div class="ctl">${o.ctl}${o.small || o.hint ? `<p class="hint">${[o.small, o.hint].filter(Boolean).map(x => /[.:)!?]$/.test(x.replace(/<[^>]+>/g, "").trim()) ? x : x + ".").join(" ")}</p>` : ""}${codeLine}${o.after || ""}</div></div>`;

function saveType() {
  const c = E, t = c.t;
  const errs = routeErrs(c) + fieldsErrCount(c) + (c.plural.trim() ? 0 : 1);
  if (errs) { c.saveErr = `Not saved. ${plural(errs, "thing needs", "things need")} a fix first.`; render(); const el = $(".srow .err-t, .routes .err-t, .tag[style*=danger]"); el && el.scrollIntoView({ block: "center" }); return; }
  const np = edPrefix(c);
  const clash = c.s.visible && TYPES.find(o => o !== t && o.s.visible && pfx(o) === np && np);
  if (clash) { c.saveErr = `Not saved. <code>/${esc(np)}</code> is where ${esc(clash.plural)} answers. Nothing was changed.`; render(); return; }
  const cons = consequences(c);
  const wasCredits = t.s.credits;
  t.plural = c.plural.trim(); t.singular = c.singular.trim() || singularize(t.plural); t.desc = c.desc; t.icon = c.icon;
  if (t.key !== "page") t.prefix = np; t.routes = Object.fromEntries(Object.entries(c.routes).filter(([, v]) => v));
  t.fields = c.fields.map(stripF); t.s = clone(c.s); t.labels = Object.fromEntries(Object.entries(c.labels).filter(([, v]) => v));
  if (t.s.index && !t.index) t.index = { title: t.plural, status: "Draft" };
  if (t.s.authorsPage && t.s.credits && !t.authorsIndex) t.authorsIndex = { title: "Authors", status: "Draft" };
  t.s.index = false; t.s.authorsPage = false;
  const au = RELS.find(r => r.key === "authors");
  if (t.s.credits && !wasCredits && !au.on.includes(t.key)) au.on.push(t.key);
  if (!t.s.credits && wasCredits) au.on = au.on.filter(k => k !== t.key);
  editState(t); render();
  toast(`Saved ${t.plural}.`);
  cons.filter(x => x.toast).forEach(x => toast(x.toast, { act: x.act, kind: "info" }));
}

/* ========================================================= navigation == */
let VIEW = { name: "list" };
function go(v, force) {
  if (!force && leaving(v)) return;
  VIEW = v;
  if (v.name === "new") newWizard();
  if (v.name === "type") editState(typeBy(v.key));
  if (v.name !== "type") E = null;
  if (v.name !== "new") W = null;
  render(); $("#work").scrollTop = 0;
}
function leaving(next) {
  if (VIEW.name === "new" && W && W.touched && !W.run) {
    modal({ title: "Leave New Content Type?", icon: "warn", body: `<p>Nothing has been made yet, so what's filled in here will be lost.</p>`,
      buttons: [["Keep Editing", "", null], ["Discard", "danger-fill", () => go(next, true)]] });
    return true;
  }
  if (VIEW.name === "type" && E && changes(E)) {
    const n = changes(E);
    modal({ title: `Save Changes to ${esc(E.t.plural)}?`, icon: "warn", body: `<p>${plural(n, "change hasn't", "changes haven't")} been saved.</p>`,
      buttons: [["Keep Editing", "", null], ["Discard Changes", "danger", () => go(next, true)], ["Save Changes", "primary", () => { saveType(); if (!E.saveErr && !changes(E)) go(next, true); }]] });
    return true;
  }
  return false;
}

/* =============================================================== render == */
function render() {
  const a = document.activeElement, id = a && a.id, ss = a && "selectionStart" in a ? [a.selectionStart, a.selectionEnd] : null;
  let html = "";
  if (VIEW.name === "list") html = viewList();
  else if (VIEW.name === "new") html = viewType(W);
  else html = viewType(E);
  $("#page").innerHTML = html;
  const crumbs = [`<a href="#" class="sec" data-info="the Structure panel">Structure</a>`];
  if (VIEW.name === "list") crumbs.push(`<span aria-current="page">Content Types</span>`);
  else crumbs.push(`<a href="#" data-go="list">Content Types</a>`, `<span aria-current="page">${VIEW.name === "new" ? "New" : esc(E.t.plural)}</span>`);
  $("#crumbs").innerHTML = crumbs.join(`<span class="sep">/</span>`);
  $$("#labScreen button").forEach(b => b.setAttribute("aria-pressed", String(VIEW.name === b.dataset.v)));

  if (id) { const el = document.getElementById(id); if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); if (ss && el.setSelectionRange) try { el.setSelectionRange(ss[0], ss[1]); } catch (e) {} } }

}
const focusSoon = sel => requestAnimationFrame(() => { const el = $(sel); if (el) { el.focus(); if (el.select && el.tagName === "INPUT") el.select(); } });
function syncToc() {
  const links = $$(".toc a"); if (!links.length) return;
  const top = $("#work").getBoundingClientRect().top + 90;
  let cur = links[0].dataset.toc;
  links.forEach(l => { const s = $("#sec-" + l.dataset.toc); if (s && s.getBoundingClientRect().top < top) cur = l.dataset.toc; });

/* ======================================================= toasts, modal == */
function toast(msg, o = {}) {
  const host = $("#toasts"), el = document.createElement("div");
  el.className = "toast" + (o.kind === "info" ? " info" : "");
  el.innerHTML = `${ic(o.kind === "info" ? "info" : "done")}<span class="m">${esc(msg)}</span>${o.undo || o.act ? `<span class="div"></span>` : ""}${o.undo ? `<button type="button" class="act" data-t="undo">${ic("undo")}Undo</button>` : ""}${o.act ? `<button type="button" class="act" data-t="act">${esc(o.act[0])}</button>` : ""}`;
  host.appendChild(el); while (host.children.length > 3) host.firstElementChild.remove();
  $("#live").textContent = msg;
  let left = o.undo || o.act ? 7000 : 3200, hold = 0, t0 = Date.now(), timer;
  const run = () => { t0 = Date.now(); timer = setTimeout(() => el.remove(), left); };
  const pause = () => { if (hold++ === 0) { clearTimeout(timer); left -= Date.now() - t0; } };
  const resume = () => { if (--hold === 0) run(); };
  el.addEventListener("pointerenter", pause); el.addEventListener("pointerleave", resume);
  el.addEventListener("focusin", pause); el.addEventListener("focusout", resume);
  el.addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (!b) return; el.remove(); (b.dataset.t === "undo" ? o.undo : o.act[1])(); });
  run();
}
let modalReturn = null;

    <div class="mdl-b">${body}</div><div class="mdl-f">${buttons.map(([l, cls], i) => `<button type="button" class="btn ${cls}" data-mb="${i}">${l}</button>`).join("")}</div></div></div>`;
  const host = $("#modalHost");
  host.onclick = e => {
    const b = e.target.closest("[data-mb]");
    if (b) { closeModal(); const fn = buttons[+b.dataset.mb][2]; fn && fn(); return; }

  requestAnimationFrame(() => $("#modalHost [data-mb='0']").focus());
}
function closeModal() { $("#modalHost").innerHTML = ""; if (modalReturn && document.contains(modalReturn)) modalReturn.focus(); }

/* ============================================================ events == */
const ctx = () => VIEW.name === "new" ? W : VIEW.name === "type" ? E : null;

function onBind(e) {
  const el = e.target, path = el.dataset && el.dataset.b;
  if (el.id === "lq") { L.q = el.value; render(); return; }
  if (el.dataset && el.dataset.file && e.type === "change") { const k = el.dataset.file; W.files = el.checked ? [...W.files, k] : W.files.filter(x => x !== k); W.touched = true; render(); return; }
  if (el.name === "wz-kind" && e.type === "change") { setKind(el.value); W.touched = true; render(); return; }
  if (el.dataset && el.dataset.route !== undefined && e.type === "input") { const c = ctx(); c.routes[el.dataset.route] = el.value; if (c.mode === "wz") c.touched = true; else c.saveErr = ""; render(); return; }
  if (!path) return;
  const isBox = el.type === "checkbox", isText = el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && !isBox);
  if ((e.type === "input" && !isText) || (e.type === "change" && isText)) return;
  const c = ctx(); if (!c) return;
  const v = isBox ? el.checked : el.value;
  let m;
  if (c.mode === "wz") {
    if (path !== "iconQ") c.touched = true;
    if (path === "plural") { c.plural = v; if (!c.singularTyped) c.singular = singularize(v); if (!c.keyTyped) c.key = toKey(c.singular); }
    else if (path === "singular") { c.singular = v; c.singularTyped = v !== ""; if (!c.singularTyped) c.singular = singularize(c.plural); if (!c.keyTyped) c.key = toKey(c.singular); }
    else if (path === "key") { c.key = v; c.keyTyped = true; }
    else setPath(c, path, v);
    /* Supports defaults follow the kind and setup until switched by hand. */
    if (path === "s.supPosition") c.posTyped = true;
    if (path === "s.visibility") c.visTyped = true;
    if ((path === "s.nesting" || path === "s.sort") && !c.posTyped) c.s.supPosition = c.kind === "tree" || c.s.nesting || c.s.sort === "position";
    if (path === "s.visible" && !c.visTyped) c.s.visibility = v;
    if (path === "prefix") { c.prefixErr = ""; c.refusal = ""; }
  } else {
    setPath(c, path, v); c.saveErr = "";
  }
  if ((m = path.match(/^fields\.(\d+)\.(label|name|type)$/))) {
    const f = c.fields[+m[1]];
    if (m[2] === "label" && f._new && !f._named) f.name = toKey(v);
    if (m[2] === "name") f._named = true;
    if (m[2] === "type") f.opts = {};
  }
  render();
}
document.addEventListener("input", onBind);
document.addEventListener("change", onBind);

document.addEventListener("click", e => {
  const t = e.target;
  const info = t.closest("[data-info]");

  const g = t.closest("[data-go]");
  if (g) { e.preventDefault(); go({ name: g.dataset.go }); return; }
  const o = t.closest("[data-open]");
  if (o && !t.closest("button:not([data-open])")) { e.preventDefault(); go({ name: "type", key: o.dataset.open }); return; }
  const tab = t.closest("[data-tab]");
  if (tab) { L.tab = tab.dataset.tab; render(); $(`[data-tab="${L.tab}"]`).focus(); return; }
  const st = t.closest("[data-step]");
  if (st && W) { const n = +st.dataset.step; if (n === 1 || step1Ok()) { W.step = n; W.refusal = ""; render(); } else { W.tried[1] = true; render(); } return; }
  const pk = t.closest("[data-pick]");
  if (pk && !pk.disabled) { const c = ctx(); const back = pickField(c, pk.dataset.pick); if (c.mode === "wz") c.touched = true; else c.saveErr = ""; render(); focusSoon(back); return; }
  const fnp = t.closest("[data-fname]");

  const fp = t.closest("[data-folders]");
  if (fp) { const c = ctx(); c.s.folders = fp.dataset.folders; if (c.mode === "wz") c.touched = true; else c.saveErr = ""; render(); focusSoon(`[data-folders="${fp.dataset.folders}"]`); return; }
  const icn = t.closest("[data-icon]");
  if (icn) { const c = ctx(); c.icon = icn.dataset.icon; if (c.mode === "wz") c.touched = true; render(); $(`[data-icon="${c.icon}"]`)?.focus(); return; }
  const toc = t.closest("[data-toc]");
  if (toc) { e.preventDefault(); $("#sec-" + toc.dataset.toc)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); return; }
  const a = t.closest("[data-act]");
  if (!a || a.disabled) return;
  const act = a.dataset.act, c = ctx();
  if (act.startsWith("f-")) { const li = a.closest("[data-fi]"); const back = fieldAct(c, act, li ? +li.dataset.fi : null); if (c.mode === "wz") c.touched = true; render(); if (back) focusSoon(back); return; }
  switch (act) {

    case "dismiss-del": L.deleted = null; render(); break;
    case "icon-clear": W.icon = ""; render(); break;
    case "wz-next":
      if (W.step === 1) { W.tried[1] = true; if (!step1Ok()) { render(); focusSoon(!W.plural.trim() ? "#wz-plural" : "#wz-key"); return; } }
      W.step++; W.refusal = ""; render(); $("#work").scrollTop = 0; break;
    case "wz-back": W.step--; render(); break;
    case "wz-create": wzCreate(); break;
    case "ed-icon": c.iconOpen = !c.iconOpen; render(); if (c.iconOpen) focusSoon(c.mode === "wz" ? "#wz-iconq" : "#ed-iconq"); break;
    case "save": saveType(); break;
    case "revert": { const prev = E, n = changes(E); editState(E.t); render(); toast(`Reverted ${plural(n, "change", "changes")}.`, { undo: () => { E = prev; render(); } }); break; }
    case "delete": askDelete(); break;
    case "reset": askReset(); break;
  }
});

function askDelete() {
  const t = E.t;
  modal({ title: `Delete ${esc(t.plural)}?`, icon: "trash", bad: true,
    body: `<p>The type is removed from <code>user/data/types</code>. ${t.entries ? `Its <b>${plural(t.entries, "entry", "entries")}</b> ${t.entries === 1 ? "stays" : "stay"} in <code>user/content/${esc(t.key)}</code> as files without a type:` : "It has no entries, so nothing is left behind."}</p>
      ${t.entries ? `<ul class="lst"><li>${ic("eyeoff")}<span>They leave the site and the Content menu.</span></li><li>${ic("health")}<span>Site Health lists them under Content Files.</span></li><li>${ic("reset")}<span>A type with the name <code>${esc(t.key)}</code> brings them back.</span></li></ul>` : ""}
      ${t.index ? `<p>Its index page, “${esc(t.index.title)}”, is one of those files.</p>` : ""}`,
    buttons: [["Cancel", "", null], [`Delete ${esc(t.plural)}`, "danger-fill", () => {

      const kids = TYPES.filter(x => x.s.menuUnder === t.key); kids.forEach(x => x.s.menuUnder = "");
      const prevDel = L.deleted; L.deleted = t.entries ? { plural: t.plural, key: t.key, n: t.entries } : null;
      E = null; VIEW = { name: "list" }; buildLabTypes(); render(); $("#work").scrollTop = 0;
      toast(`Deleted ${t.plural}.${t.entries ? ` ${plural(t.entries, "file was", "files were")} kept.` : ""}`, { undo: () => { TYPES.splice(i, 0, t); kids.forEach(x => x.s.menuUnder = t.key); L.deleted = prevDel; buildLabTypes(); render(); } });
    }]] });

function askReset() {
  const t = E.t, ch = changedFromCode(t);
  const names = { plural: "labels.plural", singular: "labels.singular", desc: "description", icon: "icon", prefix: "urls.prefix", routes: "urls.paths", visible: "public", visibility: "supports: visibility", sitemap: "sitemap", llms: "llms", feed: "feed", feedCats: "feed.categories", nesting: "hierarchical", sort: "order", listType: "listing.type", orderBy: "listing.orderBy", orderDir: "listing.order", perPage: "listing.perPage", query: "listing.query", archives: "dateArchives", fileNames: "filename", folders: "folders", credits: "authors relationship", byline: "byline", workflow: "workflow", expire: "supports: expires", supImage: "supports: image", supSummary: "supports: summary", supSubtitle: "supports: subtitle", supPosition: "supports: position", menuUnder: "under", menuPos: "position", urls: "urls", closed: "closed" };
  modal({ title: `Reset ${esc(t.plural)}?`, icon: "reset", bad: true,
    body: `<p>${plural(ch.length, "setting goes", "settings go")} back to what the ${esc(PLUGINS[t.plugin])} sets, and <code>user/data/types/${esc(t.key)}</code> is removed:</p><ul class="lst">${ch.map(k => `<li>${ic("reset")}<code>${esc(names[k] || k)}</code></li>`).join("")}</ul><p>Entries, files and relationships aren't touched.</p>`,
    buttons: [["Cancel", "", null], ["Reset", "danger-fill", () => {
      const before = clone({ s: t.s, plural: t.plural, singular: t.singular, desc: t.desc, icon: t.icon, prefix: t.prefix, routes: t.routes });
      Object.assign(t, clone({ s: t.code.s, plural: t.code.plural, singular: t.code.singular, desc: t.code.desc, icon: t.code.icon, prefix: t.code.prefix, routes: t.code.routes }));
      editState(t); render();
      toast(`Reset ${t.plural} to the ${PLUGINS[t.plugin]}'s settings.`, { undo: () => { Object.assign(t, before); editState(t); render(); } });
    }]] });
}

/* Token chips insert at the caret without taking focus from the field. */
document.addEventListener("mousedown", e => {
  const b = e.target.closest("[data-tok]"); if (!b) return;
  e.preventDefault();
  const inp = b.closest(".pathf").querySelector("input");
  const tok = `{${b.dataset.tok}}`, st = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? st;
  const before = inp.value.slice(0, st), after = inp.value.slice(en), slashed = inp.closest("td") || /-s-folders$/.test(inp.id);
  /* Paths and folders: each token is its own segment, so the / goes in with it. */
  const sep = b.dataset.tok !== "slug" && slashed && before && !before.endsWith("/") && !before.endsWith(".") ? "/" : "";
  const tail = /-s-folders$/.test(inp.id) && after && !after.startsWith("/") ? "/" : "";
  inp.setRangeText(sep + tok + tail, st, en, "end");
  inp.dispatchEvent(new Event("input", { bubbles: true }));
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modalHost").innerHTML) { e.preventDefault(); closeModal(); return; }
  if (e.key === "Escape" && !$("#labNotes").hidden) { toggleNotes(false); return; }
  if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && $("#lq")) { e.preventDefault(); $("#lq").focus(); }
  if (e.key === "Tab" && $("#modalHost").innerHTML) {
    const f = $$("#modalHost button"); if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
$("#work").addEventListener("scroll", syncToc, { passive: true });

/* ============================================================ harness == */
function seg(id, cur, fn) {

  const paint = v => $$("button", box).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  paint(cur);
  box.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; paint(b.dataset.v); fn(b.dataset.v); });
}
function buildLabTypes() {
  $("#labType").innerHTML = `<option value="">A Type's Page…</option>` + [...TYPES].sort((a, b) => a.plural.localeCompare(b.plural)).map(t => `<option value="${t.key}">${esc(t.plural)} (${t.origin === "site" ? "site" : t.origin === "core" ? "built in" : "plugin"})</option>`).join("");
