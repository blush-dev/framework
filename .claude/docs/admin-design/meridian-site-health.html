<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian Site Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Fira+Code:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Karla:wght@400;500;600&display=swap">
<style>
/* Meridian: Site Health check pages, a sketch. Tokens are design/tokens.css verbatim.
   Anything prefixed lab- is the harness, not the admin. */
:root {
  --bg:#f5f6f9; --surface:#ffffff; --surface-2:#f0f2f6; --surface-3:#e7eaf0;
  --border:#e2e5ec; --border-strong:#ccd2dd;
  --fg:#11141b; --fg-2:#535b6b; --fg-3:#858d9d;
  --accent:#2f5fe0; --accent-hover:#2650c4; --accent-fg:#ffffff; --accent-soft:#e9effc; --accent-line:#bdcdf7;
  --good:#136b43; --good-soft:#e2f3e9; --good-dot:#1f9d5f;
  --warn:#8a5806; --warn-soft:#faf0d9; --warn-dot:#cf8d16;
  --danger:#a92420; --danger-soft:#fbeae9; --danger-dot:#d6403a;
  --shadow-1:none;
  --shadow-2:0 2px 8px rgba(17,20,27,.05), 0 1px 2px rgba(17,20,27,.04);
  --shadow-3:0 10px 28px rgba(17,20,27,.09), 0 2px 6px rgba(17,20,27,.05);
  --r-1:6px; --r-2:10px; --r-3:16px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:18px; --s-5:26px; --s-6:36px; --s-7:52px;
  --font-ui:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-title:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono:"Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --base:13px; --h1:26px; --h1-track:-.024em;
  --title-size:13.5px; --title-weight:500; --title-track:-.005em;
  --pad-row:14px; --pad-panel:17px; --pad-x:22px; --ctl:34px; --ctl-sm:30px; --stat-v:30px;
  --railbar:74px; --rail:262px; --bar:62px; --work-max:1400px; --measure:72ch;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-color-scheme="light"]):not([data-theme="light"]) {
    --bg:#0b0d12; --surface:#13161d; --surface-2:#1a1e27; --surface-3:#222733;
    --border:#242936; --border-strong:#353c4c;
    --fg:#e9ebf0; --fg-2:#a3abba; --fg-3:#747d8e;
    --accent:#7295f7; --accent-hover:#8aa8f9; --accent-fg:#0b0d12; --accent-soft:#182444; --accent-line:#2c3d68;
    --good:#5ecb92; --good-soft:#102a1e; --good-dot:#35b877;
    --warn:#e3b360; --warn-soft:#2b2312; --warn-dot:#d69f3c;
    --danger:#f28d84; --danger-soft:#301917; --danger-dot:#e0655c;
    --shadow-1:none; --shadow-2:0 2px 8px rgba(0,0,0,.3);
    --shadow-3:0 10px 28px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-color-scheme="dark"], :root[data-theme="dark"]:not([data-color-scheme="light"]) {
  --bg:#0b0d12; --surface:#13161d; --surface-2:#1a1e27; --surface-3:#222733;
  --border:#242936; --border-strong:#353c4c;
  --fg:#e9ebf0; --fg-2:#a3abba; --fg-3:#747d8e;
  --accent:#7295f7; --accent-hover:#8aa8f9; --accent-fg:#0b0d12; --accent-soft:#182444; --accent-line:#2c3d68;
  --good:#5ecb92; --good-soft:#102a1e; --good-dot:#35b877;
  --warn:#e3b360; --warn-soft:#2b2312; --warn-dot:#d69f3c;
  --danger:#f28d84; --danger-soft:#301917; --danger-dot:#e0655c;
  --shadow-1:none; --shadow-2:0 2px 8px rgba(0,0,0,.3);
  --shadow-3:0 10px 28px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  color-scheme: dark;
}
:root[data-admin-theme="editorial"] {
  --bg:#f6f2ec; --surface:#fffdfa; --surface-2:#f1ece3; --surface-3:#e7e0d4;
  --border:#e5ded2; --border-strong:#cdc3b3;
  --fg:#23201b; --fg-2:#5d564c; --fg-3:#8e867a;
  --accent:#17595e; --accent-hover:#124a4e; --accent-fg:#fffdfa; --accent-soft:#e2eded; --accent-line:#b6d3d5;
  --good:#4c6d2c; --good-soft:#edf1e2; --good-dot:#6f9b45;
  --warn:#8a5a14; --warn-soft:#f8eeda; --warn-dot:#c58a2a;
  --danger:#9c3327; --danger-soft:#f8e7e2; --danger-dot:#c2503f;
  --shadow-2:0 2px 8px rgba(60,48,32,.05), 0 1px 2px rgba(60,48,32,.04);
  --shadow-3:0 10px 28px rgba(60,48,32,.09), 0 2px 6px rgba(60,48,32,.05);
  --r-1:8px; --r-2:12px; --r-3:20px;
  --font-ui:"Karla", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display:"Newsreader", ui-serif, Georgia, "Times New Roman", serif;
  --font-title:"Newsreader", ui-serif, Georgia, "Times New Roman", serif;
  --base:13.5px; --h1:32px; --h1-track:-.014em;
  --title-size:15.5px; --title-weight:500; --title-track:0;
  --pad-row:16px; --pad-panel:19px; --pad-x:26px; --stat-v:34px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-color-scheme="light"]):not([data-theme="light"])[data-admin-theme="editorial"] {
    --bg:#15120e; --surface:#1d1915; --surface-2:#26211a; --surface-3:#322b22;
    --border:#302a21; --border-strong:#463e31;
    --fg:#f0e9dd; --fg-2:#b4a996; --fg-3:#877c6c;
    --accent:#72bec2; --accent-hover:#8bcccf; --accent-fg:#15120e; --accent-soft:#113032; --accent-line:#1d4a4d;
    --good:#9cc16b; --good-soft:#1c2413; --good-dot:#84ad55;
    --warn:#dcae63; --warn-soft:#2c2314; --warn-dot:#c79646;
    --danger:#e8897b; --danger-soft:#2f1a16; --danger-dot:#cf6a5c;
    --shadow-2:0 2px 8px rgba(0,0,0,.34);
    --shadow-3:0 10px 28px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.34);
    color-scheme: dark;
  }
}
:root[data-color-scheme="dark"][data-admin-theme="editorial"],
:root[data-theme="dark"]:not([data-color-scheme="light"])[data-admin-theme="editorial"] {
  --bg:#15120e; --surface:#1d1915; --surface-2:#26211a; --surface-3:#322b22;
  --border:#302a21; --border-strong:#463e31;
  --fg:#f0e9dd; --fg-2:#b4a996; --fg-3:#877c6c;
  --accent:#72bec2; --accent-hover:#8bcccf; --accent-fg:#15120e; --accent-soft:#113032; --accent-line:#1d4a4d;
  --good:#9cc16b; --good-soft:#1c2413; --good-dot:#84ad55;
  --warn:#dcae63; --warn-soft:#2c2314; --warn-dot:#c79646;
  --danger:#e8897b; --danger-soft:#2f1a16; --danger-dot:#cf6a5c;
  --shadow-2:0 2px 8px rgba(0,0,0,.34);
  --shadow-3:0 10px 28px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.34);
  color-scheme: dark;
}

/* ------------------------------------------------------------------ base -- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:var(--base);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol,figure{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num,td,th,time{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ============================================================ primitives == */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:var(--ctl);padding:0 14px;border-radius:var(--r-1);border:1px solid var(--border);background:var(--surface);color:var(--fg);font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn.sm{height:var(--ctl-sm);padding:0 11px;font-size:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger-soft)}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .ic{width:15px;height:15px}
a.lnk{color:var(--accent)}
a.lnk:hover{text-decoration:underline}

.avatar{width:26px;height:26px;border-radius:99px;background:var(--surface-3);color:var(--fg-2);display:grid;place-items:center;font-size:10.5px;font-weight:600;letter-spacing:.02em;flex:none}
.avatar.sm{width:20px;height:20px;font-size:9px}
.avatar.lg{width:44px;height:44px;font-size:14px}
.avatar.miss{background:transparent;border:1px dashed var(--danger-dot);color:var(--danger)}
.avatar.miss .ic{width:13px;height:13px}

.pill{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 9px 0 8px;border-radius:99px;font-size:11px;font-weight:500;white-space:nowrap;border:1px solid transparent;vertical-align:middle;margin-block:-2px}
.pill .d{width:5px;height:5px;border-radius:99px;flex:none}
.pill.published{background:var(--good-soft);color:var(--good)} .pill.published .d{background:var(--good-dot)}
.pill.draft{background:var(--surface-2);color:var(--fg-2);border-color:var(--border)} .pill.draft .d{background:var(--border-strong)}
.pill.trash{background:var(--danger-soft);color:var(--danger)} .pill.trash .d{background:var(--danger-dot)}
.pill.written{background:var(--surface-3);color:var(--fg)} .pill.written .d{background:var(--fg-2)}
.pill.inherited{background:var(--surface-2);color:var(--fg-2)} .pill.inherited .d{background:transparent;box-shadow:inset 0 0 0 1.5px var(--border-strong)}
.pill.unreach{background:transparent;color:var(--fg-2);border:1px dashed var(--border-strong)} .pill.unreach .ic{width:12px;height:12px}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.warn .d{background:var(--warn-dot)}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;background:var(--surface-2);color:var(--fg-2);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--border);flex:none}

.cbx{position:relative;display:inline-flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:12.5px;color:var(--fg)}
.cbx input{position:absolute;opacity:0;width:1px;height:1px}
.cbx .bx{width:15px;height:15px;flex:none;margin-top:2px;border:1px solid var(--border-strong);border-radius:4px;display:grid;place-items:center;color:transparent;background:var(--surface)}
.cbx .bx .ic{width:11px;height:11px;stroke-width:2.6}
.cbx input:checked + .bx{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cbx input:focus-visible + .bx{outline:2px solid var(--accent);outline-offset:2px}
.cbx .tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.cbx .tx small{font-size:11.5px;color:var(--fg-3);line-height:1.5}
.rdo .bx{border-radius:99px}
.rdo input:checked + .bx{background:var(--surface);border:5px solid var(--accent)}
/* ======================================================== lab harness == */
.lab{display:flex;flex-direction:column;height:100%}
.lab-bar{flex:none;display:flex;align-items:center;gap:var(--s-4);flex-wrap:wrap;
  padding:var(--s-2) var(--s-4);background:var(--surface-2);border-bottom:1px solid var(--border)}
.lab-mark{display:flex;align-items:baseline;gap:var(--s-2);margin-right:auto;min-width:0}
.lab-mark b{font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:-.01em}
.lab-mark span{color:var(--fg-3);font-size:11.5px}
.lab-grp{display:flex;align-items:center;gap:var(--s-2)}
.lab-grp > span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3);font-weight:600}
.lab-seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-1);padding:2px;gap:2px}
.lab-seg button{font-size:12px;color:var(--fg-2);padding:0 var(--s-3);height:24px;border-radius:calc(var(--r-1) - 2px);white-space:nowrap}
.lab-seg button:hover{color:var(--fg)}
.lab-seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.lab-notes-btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r-1);border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:500}
.lab-notes-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.lab-notes-btn .ic{width:14px;height:14px}
@media (max-width:1640px){.lab-mark span{display:none}}
@media (max-width:760px){.lab-grp > span{display:none}}

/* The rules, in a sheet over the right edge. Harness, not admin. */
.lab-notes{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface);border-left:1px solid var(--border-strong);box-shadow:var(--shadow-3);z-index:60;overflow-y:auto;padding:var(--s-5);display:none;flex-direction:column;gap:var(--s-4)}
.lab-notes.on{display:flex}
.lab-notes h2{font-family:var(--font-display);font-size:17px;font-weight:600;display:flex;align-items:center}
.lab-notes h2 button{margin-left:auto}
.lab-notes h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3);font-weight:600;margin-top:var(--s-2)}
.lab-notes p{font-size:12.5px;color:var(--fg-2);line-height:1.6}
.lab-notes ol{display:flex;flex-direction:column;gap:var(--s-3)}
.lab-notes li{display:flex;gap:var(--s-3);font-size:12.5px;color:var(--fg-2);line-height:1.6}
.lab-notes li b{color:var(--fg);font-weight:600}
.lab-notes li > i{font-style:normal;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);flex:none;padding-top:2px;width:22px}

/* ============================================================ the shell == */
.app{flex:1 1 auto;min-height:0;display:flex;background:var(--bg)}
.rail{flex:none;width:var(--railbar);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--s-3) 0}
.rail .logo{width:40px;height:40px;border-radius:var(--r-2);background:var(--fg);color:var(--surface);display:grid;place-items:center;font-weight:600;font-size:15px;margin-bottom:var(--s-3)}
.rail a{width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 7px;border-radius:var(--r-2);font-size:10.5px;color:var(--fg-2)}
.rail a .ic{width:19px;height:19px}
.rail a:hover{background:var(--surface-2);color:var(--fg)}
.rail a[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.side{flex:none;width:var(--rail);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.side-h{height:var(--bar);padding:0 var(--s-5);display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--border);box-sizing:content-box;padding-block:6px}
.side-h b{font-family:var(--font-display);font-size:15px;font-weight:600}
.side-h span{font-size:11.5px;color:var(--fg-3)}
.side nav{display:flex;flex-direction:column;gap:2px;padding:var(--s-4) var(--s-3)}
.side nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r-1);font-size:13px;color:var(--fg-2);position:relative}
.side nav a:hover{background:var(--surface-2);color:var(--fg)}
.side nav a .c{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
.side nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.side nav a[aria-current="page"] .c{color:var(--accent)}
.side nav a[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:2px;border-radius:0 2px 2px 0;background:var(--accent)}
.side .side-g{display:flex;align-items:center;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);padding:var(--s-5) var(--s-5) var(--s-1)}
.side .side-g button{margin-left:auto;font-size:10.5px;letter-spacing:.07em;color:var(--fg-3);font-weight:600}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{flex:none;height:var(--bar);box-sizing:content-box;padding-block:6px;display:flex;align-items:center;gap:var(--s-3);padding-inline:var(--s-5);background:var(--surface);border-bottom:1px solid var(--border)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2);min-width:0;margin-right:auto;white-space:nowrap;overflow:hidden}
.crumbs a:hover{color:var(--accent)}
.crumbs .sep{color:var(--fg-3)}
.crumbs [aria-current]{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.jump{display:flex;align-items:center;gap:9px;width:240px;height:var(--ctl);padding:0 10px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--bg);color:var(--fg-3);font-size:12.5px}
.jump .ic{width:14px;height:14px}
.jump kbd{margin-left:auto}
kbd{font-family:var(--font-mono);font-size:10px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--fg-3);background:var(--surface)}
.work{flex:1 1 auto;min-height:0;overflow-y:auto}
.page{max-width:var(--work-max);margin:0 auto;padding:var(--s-7) var(--s-7) 96px;display:flex;flex-direction:column;gap:var(--s-5)}
@media (max-width:1180px){.side{display:none}}
@media (max-width:760px){
  .rail{display:none}
  .jump{display:none}
  .topbar .vs span{display:none}
  .page{padding:var(--s-5) var(--s-4) 96px}
}

/* ---------------------------------------------------------- page head -- */
.ph{display:flex;flex-direction:column;gap:var(--s-2)}
.ph-back{display:inline-flex;align-items:center;gap:var(--s-1);font-size:12.5px;color:var(--fg-2);align-self:flex-start}
.ph-back:hover{color:var(--accent)}
.ph-back .ic{width:14px;height:14px}
.ph-row{display:flex;align-items:flex-start;gap:var(--s-4);flex-wrap:wrap}
.ph-row > div:first-child{flex:1 1 360px;min-width:0}
.ph h1{font-family:var(--font-display);font-size:var(--h1);letter-spacing:var(--h1-track);font-weight:600;line-height:1.2}
.ph .sub{color:var(--fg-2);font-size:13.5px;margin-top:6px}
.ph .about{color:var(--fg-2);font-size:13.5px;line-height:1.6;max-width:var(--measure);margin-top:6px}
.ph .when{display:flex;align-items:center;gap:6px;color:var(--fg-3);font-size:12px;margin-top:var(--s-2)}
.ph .when .ic{width:13px;height:13px}
.ph-acts{display:flex;gap:var(--s-2)}
.btn .spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{height:2px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin-top:var(--s-3)}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width 1.1s linear}

/* Underlined tabs with count chips, the admin's list style. */
.utabs{display:flex;gap:var(--s-1);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.utabs button{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;font-size:13.5px;color:var(--fg-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.utabs button:hover{color:var(--fg)}
.utabs button[aria-selected="true"]{color:var(--fg);font-weight:500;border-bottom-color:var(--accent)}
.utabs .c{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);background:var(--surface-3);border-radius:99px;padding:1px 8px}
.utabs button[aria-selected="true"] .c{color:var(--fg-2)}

.ltop{display:flex;flex-direction:column;gap:var(--s-4)}
.ftools{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap}
.psearch{display:flex;align-items:center;gap:10px;height:var(--ctl);padding:0 10px 0 12px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface);flex:1 1 260px;max-width:380px}
.psearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.psearch .ic{width:14px;height:14px;color:var(--fg-3)}
.psearch input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:12.5px}
.psearch input::placeholder{color:var(--fg-3)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-1);padding:2px;gap:2px}
.seg button{font-size:12px;color:var(--fg-2);padding:0 11px;height:26px;border-radius:calc(var(--r-1) - 2px)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:0 0 0 1px var(--border)}
.psearch kbd{margin-left:auto;font-size:11px;padding:0 6px;line-height:18px}
.dens{display:flex;margin-left:auto;border:1px solid var(--border);border-radius:var(--r-1);overflow:hidden;background:var(--surface)}
.dens button{width:38px;height:calc(var(--ctl) - 2px);display:grid;place-items:center;color:var(--fg-3)}
.dens button + button{border-left:1px solid var(--border)}
.dens button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.dens .ic{width:17px;height:17px}
.hrows.dense > li{padding-block:9px;align-items:center}
.hrows.dense .h-what p,.hrows.dense .h-lead .p,.hrows.dense .h-lead .m{display:none}
.sel{position:relative;display:inline-flex;align-items:center;flex:0 1 170px;min-width:150px}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:var(--ctl);padding:0 34px 0 12px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface);font-size:12.5px;color:var(--fg);cursor:pointer}
.sel select:hover{border-color:var(--border-strong)}
.sel select:focus-visible{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sel .ic{position:absolute;right:11px;width:15px;height:15px;color:var(--fg-2);pointer-events:none}
.ftools .say{margin-left:auto;font-size:12px;color:var(--fg-3)}
.ftools .lbl{font-size:12px;color:var(--fg-3)}

/* ------------------------------------------------------------ severity -- */
/* A chip that is a word and a glyph; color is the third cue, never the only. */
.sev{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px 0 7px;border-radius:99px;font-size:11.5px;font-weight:500;white-space:nowrap;flex:none}
.sev .ic{width:13px;height:13px;stroke-width:2}
.sev.error{background:var(--danger-soft);color:var(--danger)} .sev.error .ic{color:var(--danger-dot)}
.sev.warning{background:var(--warn-soft);color:var(--warn)} .sev.warning .ic{color:var(--warn-dot)}
.sev.notice{background:var(--surface-2);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--border)}
.sev.fixed{background:var(--good-soft);color:var(--good)} .sev.fixed .ic{color:var(--good-dot)}
.sev.ignored{background:transparent;color:var(--fg-3);box-shadow:inset 0 0 0 1px var(--border-strong)}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px 0 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:99px}
.pill.fail{background:var(--danger-soft);color:var(--danger)} .pill.fail .d{background:var(--danger-dot)}
.pill.check{background:var(--warn-soft);color:var(--warn)} .pill.check .d{background:var(--warn-dot)}
.pill.note{background:var(--surface-2);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--border)} .pill.note .d{background:var(--fg-3)}
.pill.clear{background:var(--good-soft);color:var(--good)} .pill.clear .d{background:var(--good-dot)}

/* ------------------------------------------------------------ overview -- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-4)}
@media (max-width:900px){.stats{grid-template-columns:minmax(0,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);padding:var(--s-5)}
.stat.bad{border-color:var(--danger-dot)}
.stat.warnb{border-color:var(--warn-dot)}
.stat .k{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.stat.bad .k{color:var(--danger)}
.stat .k .ic{width:15px;height:15px}
.stat .v{font-size:var(--stat-v);font-weight:600;margin:var(--s-3) 0 var(--s-2);font-variant-numeric:tabular-nums}
.stat .s{font-size:12.5px;color:var(--fg-3)}
.ov{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:var(--s-4);align-items:start}
@media (max-width:1000px){.ov{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);overflow:hidden}
.panel-head{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;padding:var(--pad-panel) var(--pad-x);border-bottom:1px solid var(--border)}
.panel-head h2{font-family:var(--font-display);font-size:15.5px;font-weight:600;letter-spacing:-.005em}
.panel-head .hint{font-size:12px;color:var(--fg-3)}
.irow{display:flex;align-items:center;gap:var(--s-4);padding:var(--s-4) var(--pad-x);border-bottom:1px solid var(--border)}
.irow:last-child{border-bottom:0}
.irow:hover{background:var(--surface-2)}
.irow .tx{flex:1;min-width:0}
.irow b{display:block;font-size:13.5px;font-weight:500}
.irow p{font-size:12.5px;color:var(--fg-2);margin-top:3px}
.irow small{display:block;font-size:12px;color:var(--fg-3);margin-top:3px}
.irow > .ic{color:var(--fg-3)}
.arow{display:flex;align-items:flex-start;gap:var(--s-4);padding:var(--s-4) var(--pad-x);border-bottom:1px solid var(--border)}
.arow:last-child{border-bottom:0}
.arow > .ic{margin-top:3px;color:var(--fg-2)}
.arow .tx{flex:1;min-width:0}
.arow b{display:block;font-size:13.5px;font-weight:500}
.arow p{font-size:12.5px;color:var(--fg-3);margin-top:2px}

/* ========================================================= a check page == */
/* A group: the kind of problem, what the site does about it now, and the
   one fix every row in it shares, when there is one. */
.grp{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);overflow:hidden}
.grp-h{display:flex;align-items:flex-start;gap:var(--s-3);padding:var(--pad-panel) var(--pad-x);border-bottom:1px solid var(--border);flex-wrap:wrap}
.grp-h{align-items:center}
.grp-h .tx{flex:1 1 320px;min-width:0;display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.grp-h .hint{font-size:12.5px;color:var(--fg-3);line-height:1.5}
.grp-h .hint.mono{font-family:var(--font-mono);font-size:11.5px}
.grp-h .t{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap}
.grp-h h2{font-family:var(--font-display);font-size:15.5px;font-weight:600;letter-spacing:-.005em}
.grp-h .n{font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.grp-h p{font-size:12.5px;color:var(--fg-2);margin-top:5px;line-height:1.55;max-width:var(--measure)}
.grp-h .path{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-3);margin-top:4px;display:block;overflow-wrap:anywhere}
.grp-h .end{display:flex;gap:var(--s-2);align-items:center;flex-wrap:wrap}

/* A row: where, what was found, what the site does now, and its fix. */
.hrows > li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) 300px;gap:var(--s-2) var(--s-5);align-items:start;padding:var(--pad-row) var(--pad-x);border-bottom:1px solid var(--border)}
.hrows > li:last-child{border-bottom:0}
@media (max-width:860px){.hrows > li{grid-template-columns:minmax(0,1fr)}.h-acts{justify-content:flex-start!important}}
.h-lead{min-width:0}
.h-lead a.t,.h-lead .t{font-family:var(--font-title);font-size:var(--title-size);font-weight:var(--title-weight);letter-spacing:var(--title-track);color:var(--fg);display:block}
.h-lead a.t:hover{color:var(--accent)}
.h-lead .t.none{color:var(--fg-3);font-style:italic}
.h-lead .p{display:block;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:4px;overflow-wrap:anywhere}
.h-lead .m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--fg-3);margin-top:5px}
.h-lead .m .ic{width:13px;height:13px}
.h-lead .pill{margin-bottom:6px}
.h-what{min-width:0}
.kv{display:inline-block;font-family:var(--font-mono);font-size:12px;color:var(--fg-2);background:var(--bg);border:1px solid var(--border);border-radius:var(--r-1);padding:2px 8px;overflow-wrap:anywhere;max-width:100%}
.kv .ln{color:var(--fg-3);margin-right:8px;user-select:none}
.kv mark{background:transparent;color:var(--fg);text-decoration:underline wavy var(--warn-dot);text-underline-offset:3px;text-decoration-thickness:1px}
.err .kv mark{text-decoration-color:var(--danger-dot)}
.kv.new mark{text-decoration:none;color:var(--good);font-weight:500}
.kv.miss{border-style:dashed;color:var(--fg-3)}
.h-what p{font-size:12.5px;color:var(--fg-2);line-height:1.55;margin-top:6px}
.h-what p b{color:var(--fg);font-weight:600}
.h-acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.btn.icon{width:var(--ctl-sm);padding:0}
.btn.icon .ic{width:15px;height:15px}
.btn[aria-expanded="true"] .ic{transform:rotate(180deg)}
.h-more{grid-column:1/-1;display:flex;flex-direction:column;gap:var(--s-3);padding:var(--s-3) 0 var(--s-1)}
.h-more[hidden]{display:none}
.h-more .lbl{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
.h-more .alts{display:flex;gap:var(--s-2);flex-wrap:wrap;align-items:center}
.h-more .say{font-size:12.5px;color:var(--fg-2);line-height:1.55;max-width:var(--measure)}

/* A fixed row stays where it was until the next check, quieter. */
.hrows > li.done{background:var(--surface-2)}
.hrows > li.done .h-lead a.t,.hrows > li.done .h-lead .t{color:var(--fg-2)}
.hrows > li.done .h-what p{color:var(--fg-3)}

/* An excerpt of the file around the line, numbered like the editor's source. */
.xc{border:1px solid var(--border);border-radius:var(--r-2);overflow:hidden;background:var(--bg)}
.xc-h{display:flex;align-items:center;gap:var(--s-3);padding:7px var(--s-3);border-bottom:1px solid var(--border);background:var(--surface-2);font-size:11.5px;flex-wrap:wrap}
.xc-h .mono{color:var(--fg-2);font-size:11px;overflow-wrap:anywhere;min-width:0}
.xc-h a{margin-left:auto;color:var(--accent);font-weight:500;display:inline-flex;align-items:center;gap:4px}
.xc-h a .ic{width:13px;height:13px}
.xc ol{padding:6px 0;font-family:var(--font-mono);font-size:12px;line-height:1.75;overflow-x:auto}
.xc li{display:flex;white-space:pre;padding-right:var(--s-3)}
.xc li i{font-style:normal;width:40px;flex:none;text-align:right;padding-right:14px;color:var(--fg-3);user-select:none}
.xc li.hit{background:var(--danger-soft)}
.xc li.hit i{color:var(--danger)}
.xc li.hit.w{background:var(--warn-soft)}
.xc li.hit.w i{color:var(--warn)}
.xc li.cue{color:var(--danger);font-family:var(--font-ui);font-size:11.5px;white-space:normal}

/* Two files claiming one thing: pick which keeps it. */
.pick2{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.pick2 label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface);cursor:pointer}
.pick2 label:hover{border-color:var(--border-strong)}
.pick2 label:has(input:checked){border-color:var(--accent-line);background:var(--accent-soft)}
.pick2 input{margin:3px 0 0;accent-color:var(--accent)}
.pick2 .t{font-size:12.5px;color:var(--fg);font-weight:500}
.pick2 .s{grid-column:2;font-size:11.5px;color:var(--fg-3)}
.pick2 .s .mono{color:var(--fg-2)}
.pick2 .then{grid-column:2;font-size:11.5px;color:var(--fg-2)}

/* A list of entries inside a row or a confirm, capped, never scrolling. */
.alist{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface)}
.alist li{display:flex;align-items:center;gap:var(--s-3);padding:8px var(--s-3);border-bottom:1px solid var(--border);font-size:12.5px;min-width:0}
.alist li:last-child{border-bottom:0}
.alist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alist a.nm:hover{color:var(--accent)}
.alist .via{font-size:11.5px;color:var(--fg-3);white-space:nowrap}
.alist .rest{color:var(--fg-3);font-size:11.5px}
.alist .rest a{color:var(--accent)}
.alist.chg li{flex-direction:column;align-items:stretch;gap:3px}
.alist.chg .p{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);overflow-wrap:anywhere}
.alist.chg .d{font-family:var(--font-mono);font-size:11.5px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.alist.chg .d del{color:var(--fg-3);text-decoration:line-through}
.alist.chg .d ins{text-decoration:none;color:var(--good)}
.alist.chg .d .ic{width:12px;height:12px;color:var(--fg-3)}

/* A small inline form inside a row's details. */
.mini{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px var(--s-4);align-items:center;max-width:560px}
.mini .k{font-size:12.5px;color:var(--fg-2)}
.inp{height:var(--ctl);padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--r-1);background:var(--surface);font-size:12.5px;width:100%;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mini .v{font-family:var(--font-mono);font-size:12px;color:var(--fg-2)}
@media (max-width:640px){.mini{grid-template-columns:minmax(0,1fr)}}

/* Search for another entry, capped at 6 results. */
.pk{display:flex;flex-direction:column;gap:6px;max-width:560px}
.pk .psearch{flex:none;max-width:none}
.pk .res{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface)}
.pk .res button{display:flex;align-items:center;gap:var(--s-3);padding:8px var(--s-3);border-bottom:1px solid var(--border);font-size:12.5px;text-align:left}
.pk .res button:last-child{border-bottom:0}
.pk .res button:hover{background:var(--surface-2)}
.pk .res button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.pk .res button .via{margin-left:auto;font-size:11.5px;color:var(--fg-3);white-space:nowrap}
.pk .res .more{padding:8px var(--s-3);font-size:11.5px;color:var(--fg-3)}

.h-cap{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--pad-x);border-top:1px solid var(--border);background:var(--surface-2);font-size:12px;color:var(--fg-3);flex-wrap:wrap}
.h-cap button{color:var(--accent);font-weight:500;font-size:12px}

/* Nothing left. */
.empty{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);padding:var(--s-7) var(--s-5);display:flex;flex-direction:column;align-items:center;gap:var(--s-2);text-align:center}
.empty .badge{width:40px;height:40px;border-radius:99px;display:grid;place-items:center;background:var(--good-soft);color:var(--good);margin-bottom:var(--s-2)}
.empty .badge.n{background:var(--surface-2);color:var(--fg-3)}
.empty b{font-family:var(--font-display);font-size:17px;font-weight:600}
.empty p{font-size:12.5px;color:var(--fg-2);max-width:52ch;line-height:1.6}
.empty button{color:var(--accent);font-weight:500}

/* ------------------------------------------------- menus, modals, toast -- */
.menu{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);box-shadow:var(--shadow-2);padding:6px;width:236px}
.menu button,.menu a{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:var(--r-1);font-size:12.5px;color:var(--fg-2);text-align:left}
.menu button:hover,.menu a:hover,.menu button:focus-visible{background:var(--surface-2);color:var(--fg);outline:0}
.menu .ic{width:15px;height:15px;color:var(--fg-3)}
.menu hr{border:0;height:1px;background:var(--border);margin:5px -6px}
.menu .note{padding:6px 10px;font-size:11.5px;color:var(--fg-3);line-height:1.5}
.scrim{position:fixed;inset:0;z-index:55;background:color-mix(in srgb,var(--fg) 28%,transparent);display:grid;place-items:center;padding:var(--s-4)}
.mdl{width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-3);box-shadow:var(--shadow-3);display:flex;flex-direction:column}
.mdl-h{padding:var(--s-5) var(--s-5) var(--s-3);display:flex;gap:var(--s-3);align-items:flex-start}
.mdl-h h3{font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.badge{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.badge .ic{width:15px;height:15px}
.mdl-b{padding:0 var(--s-5) var(--s-5);font-size:12.5px;color:var(--fg-2);display:flex;flex-direction:column;gap:var(--s-4);line-height:1.6}
.mdl-b b{color:var(--fg);font-weight:600}
.mdl-f{display:flex;gap:var(--s-2);justify-content:flex-end;padding:var(--s-4) var(--s-5);border-top:1px solid var(--border);flex-wrap:wrap}
.toast{position:fixed;right:24px;bottom:24px;z-index:58;display:inline-flex;align-items:center;gap:var(--s-3);background:var(--surface);border:1.5px solid var(--good-dot);border-radius:var(--r-2);box-shadow:var(--shadow-2);padding:9px 9px 9px 14px;font-size:12.5px;color:var(--fg);max-width:calc(100vw - 32px)}
.toast > .ic{color:var(--good-dot)}
.toast .div{width:1px;align-self:stretch;margin-block:3px;background:var(--border)}
.toast .undo{display:inline-flex;align-items:center;gap:6px;height:var(--ctl-sm);padding:0 11px;border-radius:var(--r-1);font-size:12px;font-weight:500;color:var(--accent)}
.toast .undo:hover{background:var(--accent-soft)}
.toast .undo .ic{width:14px;height:14px}
@media (max-width:640px){.toast{right:16px;left:16px;bottom:16px}}
</style>
</head>

<script>
/* ============================================================== data == */
/* Invented, but shaped like the site in the running build's screenshots:
   an old blog imported into the CMS, 1,218 files. */

const I = n => '<svg class="ic" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n.toLocaleString('en-US');
const plural = (n, one, many) => fmt(n) + ' ' + (n === 1 ? one : (many || one + 's'));
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const longDate = d => { const [y,m,dd] = d.split('-').map(Number); return MONTHS[m-1] + ' ' + dd + ', ' + y; };

/* A deterministic id in the shape the CMS writes (26 characters, Crockford). */
let SEED = 7;
const rnd = () => (SEED = (SEED * 16807) % 2147483647) / 2147483647;
const AB = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const newId = () => '01J' + Array.from({length:23}, () => AB[Math.floor(rnd() * 32)]).join('');

/* 212 old posts still carrying the importer's `layout: post`. */
const W1 = ['Notes on','A Week of','Thinking About','Back to','On','In Praise of','Another Look at','Letters About','Against','Remembering','Missing','Learning From','Still Thinking About','Finding','Losing','Reading About'];
const W2 = ['Mornings','the Garden','Short Fiction','Moving','Old Notebooks','Coffee','the Rain','Rewriting','Libraries','Train Rides','Winter','Bookshelves','Deadlines','Sundays','Drafts','the Porch','Typewriters','Long Walks','Index Cards','Margins'];
const slugify = t => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const OLD = [];
(function () {
  const seen = new Set();
  let i = 0;
  OLD.push({title:'Dark Circles, NaNoWriMo, More Reconstruction', path:'_posts/2005-10-29.dark-circles-nanowrimo-more-reconstruction.md'});
  OLD.push({title:'6 Weird Things About Me', path:'_posts/2007-03-05.6-weird-things-about-me.md'});
  while (OLD.length < 212 && i < 5000) {
    const t = W1[i % W1.length] + ' ' + W2[(i * 7 + Math.floor(i / W1.length)) % W2.length];
    i++;
    if (seen.has(t)) continue;
    seen.add(t);
    const y = 2004 + (OLD.length % 8), m = 1 + ((OLD.length * 5) % 12), d = 1 + ((OLD.length * 11) % 28);
    const ds = y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    OLD.push({title:t, path:'_posts/' + ds + '.' + slugify(t) + '.md', date:ds});
  }
  OLD.sort((a, b) => a.path < b.path ? -1 : 1);
})();

/* Entries a link could point at instead. */
const SERIES = ['NaNoWriMo 2006','NaNoWriMo 2007','Summer Reading 2025','Reading Lists','The Move','Notebook Experiments','Letters','Weekly Notes'].map(t => ({title:t, type:'Series'}));
const POSTS = OLD.map(p => ({title:p.title, type:'Post'})).concat([
  {title:'Ray Kurzweil on C-SPAN2', type:'Post'},{title:'Spring Cleaning', type:'Post'},{title:'Reading Plans for 2027', type:'Post'},
  {title:'A Week Without Email', type:'Post'},{title:'Moving Day', type:'Post'}]);

/* ---- helpers for rows ---- */
const kv = (k, v, cls) => '<code class="kv' + (cls ? ' ' + cls : '') + '">' + esc(k) + ': <mark>' + esc(v) + '</mark></code>';
const lead = (r) => '<a class="t" href="#/">' + esc(r.title) + '</a><span class="p">' + esc(r.path) + '</span>';
const entries = (list, total, more) => {
  const shown = list.slice(0, 8);
  return '<ul class="alist">' + shown.map(e => '<li><a class="nm" href="#/">' + esc(e.title) + '</a><span class="via">' + esc(e.via || 'Published') + '</span></li>').join('') +
    (total > shown.length ? '<li class="rest">and ' + (total - shown.length) + ' more · <a href="#/">' + esc(more) + '</a></li>' : '') + '</ul>';
};
const excerpt = (path, lines, open) => '<div class="xc"><div class="xc-h"><span class="mono">' + esc(path) + '</span><a href="#/">' + I('code') + esc(open) + '</a></div><ol>' +
  lines.map(l => l.cue ? '<li class="cue"><i></i>' + l.cue + '</li>' : '<li class="' + (l.hit ? 'hit' + (l.w ? ' w' : '') : '') + '"><i>' + l.n + '</i>' + esc(l.t) + '</li>').join('') + '</ol></div>';

/* ---- the checks ----
   A row: where (lead), what was found (found), what the site does now (now),
   and its fixes. A fix lists the lines it writes; more than one line, or any
   group fix, asks first. */

const CHECKS = {};

CHECKS.files = {
  id:'files', name:'Content Files', area:'Content',

/* ------------------------------------------------------------- fixing -- */
/* One file: done at once, with Undo. More than one, or a whole group: asked

function fix(rows, idxOf, opts) {
  const changes = rows.flatMap(r => r.fixes[idxOf(r)].changes(r));
  const go = () => {
    rows.forEach(r => { r.state = 'fixed'; r.fixedBy = idxOf(r); r.open = false; });
    const files = new Set(changes.map(c => c.path)).size, made = changes.filter(c => c.create).length;

  if (changes.length > 1 || (opts && opts.ask)) confirmBox(opts && opts.title || 'Change ' + plural(changes.length,'File') + '?', opts && opts.say, changes, opts && opts.label || 'Change ' + plural(changes.length,'File'), go);

    '<div class="mdl-h"><div class="badge">' + I('pencil') + '</div><h3 id="mdlT">' + esc(title) + '</h3></div>' +
    '<div class="mdl-b"><p>' + (say || 'Each file gets the change below and nothing else. Published entries update on the site as soon as this is done.') + '</p>' +
    '<ul class="alist chg">' + shown.map(c => '<li><span class="p">' + esc(c.path) + (c.create ? ' · new file' : '') + '</span><span class="d">' +
      (c.from ? '<del>' + esc(c.from) + '</del>' : '') + (c.from && c.to ? I('arrow-r') : '') + (c.to ? '<ins>' + esc(c.to) + '</ins>' : '<span class="via">line removed</span>') +
      (!c.from && !c.create ? '<span class="via">line added</span>' : '') + '</span></li>').join('') +
      (changes.length > 8 ? '<li class="rest">and ' + fmt(changes.length - 8) + ' more, the same change in each</li>' : '') + '</ul>' +
    '<p>Undo is offered when it’s done, and lasts until the next check.</p></div>' +
    '<div class="mdl-f"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>' + esc(label) + '</button></div></div></div>';
  const close = () => { $('#layer').innerHTML = ''; };
  $('#scrim').addEventListener('click', e => {
    if (e.target.id === 'scrim' || e.target.closest('[data-x]')) close();
    if (e.target.closest('[data-ok]')) { close(); go(); }
  });
  $('[data-ok]').focus();
}

let toastT;
function toast(msg, undo) {
  clearTimeout(toastT);
  $$('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = I('ccheck') + '<span>' + esc(msg) + '</span>' + (undo ? '<span class="div"></span><button class="undo">' + I('undo') + 'Undo</button>' : '');
  document.body.appendChild(el);
  if (undo) el.querySelector('.undo').onclick = () => { undo(); el.remove(); render(); };
  toastT = setTimeout(() => el.remove(), 6000);
}

/* -------------------------------------------------------------- menus -- */
function openMenu(btn, r) {
  closeMenu();
  const m = document.createElement('div');
  m.className = 'menu'; m.id = 'menu'; m.setAttribute('role', 'menu');
  m.innerHTML = (r.path && !r.path.includes('…') ? '<a role="menuitem" href="#/">' + I('pencil') + 'Open in Editor</a><button role="menuitem" data-copy>' + I('copy') + 'Copy File Path</button>' : '') +
    (r.sev !== 'error' ? (r.path ? '<hr>' : '') + '<button role="menuitem" data-ign="' + r.id + '">' + I('eye-off') + 'Ignore This</button><div class="note">Ignored problems move to their own tab and stop counting.</div>' : '');
  document.body.appendChild(m);
  const b = btn.getBoundingClientRect();
  m.style.top = Math.min(b.bottom + 4, innerHeight - m.offsetHeight - 8) + 'px';
  m.style.left = Math.max(8, b.right - m.offsetWidth) + 'px';
  m.addEventListener('click', e => {
    const ig = e.target.closest('[data-ign]');
    if (ig) { const rr = ROWS[ig.dataset.ign]; rr.state = 'ignored'; closeMenu(); toast('Ignored. It’s in the Ignored tab.', () => { rr.state = null; }); render(); }
    if (e.target.closest('[data-copy]')) { closeMenu(); toast('Copied ' + r.path + '.'); }
  });
  (m.querySelector('a,button') || m).focus();
}
function closeMenu() { const m = $('#menu'); if (m) m.remove(); }

/* ------------------------------------------------------------- events -- */
$('#page').addEventListener('click', e => {
  const el = e.target.closest('button,a');
  if (!el) return;
  const d = el.dataset, c = CHECKS[route()];
  if (d.tab) { S.tab[c.id] = d.tab; render(); }
  else if (d.dense) { S.dense = d.dense === '1'; render(); }
  else if (d.mode) { S.mode[c.id] = d.mode; render(); }
  else if (d.more) { S.shown[d.more] = (S.shown[d.more] || 5) + 50; render(); }
  else if (d.clear) { S.q[d.clear] = ''; render(); }
  else if (d.exp) { const r = ROWS[d.exp]; r.open = !r.open; render(); const b = $('[data-exp="' + r.id + '"]'); if (b) b.focus(); }
  else if (d.menu) { e.stopPropagation(); $('#menu') ? closeMenu() : openMenu(el, ROWS[d.menu]); }
  else if (d.undo) { ROWS[d.undo].state = null; render(); }
  else if (d.unignore) { ROWS[d.unignore].state = null; render(); }
  else if (d.fix) {
    const [id, i] = d.fix.split(':'), r = ROWS[id], f = r.fixes[+i];
    fix([r], () => +i, {label:f.pick ? 'Point ' + f.count + ' Posts at “' + r.ui.pick + '”' : f.label, title:f.pick ? 'Point ' + f.count + ' Posts at “' + r.ui.pick + '”?' : f.changes(r)[0].create ? 'Create ' + f.changes(r)[0].path + '?' : null});
  }
  else if (d.bulk) {
    const g = c.groups.find(x => x.id === d.bulk), rows = g.rows.filter(r => !r.state);
    fix(rows, () => 0, {ask:true, title:g.bulk.title(rows.length), say:g.bulk.say(rows.length), label:g.bulk.label(rows.length)});
  }
  else if (d.again) {
    S.busy = d.again; $$('.toast').forEach(t => t.remove()); render();
    requestAnimationFrame(() => requestAnimationFrame(() => { const p = $('#prog'); if (p) p.style.width = '100%'; }));
    setTimeout(() => {
      const cc = CHECKS[d.again];
      cc.groups.forEach(g => { g.rows = g.rows.filter(r => r.state !== 'fixed'); });
      cc.when = 'just now'; S.busy = null; render();
    }, 1300);
  }
  else if (d.pkv) { const r = ROWS[d.pkv]; r.ui.pick = d.v; render(); }
});
$('#page').addEventListener('change', e => {
  const sk = e.target.dataset.sel;
  if (sk) { const id = route(); (sk === 'mode' ? S.mode : S.sev)[id] = e.target.value; render(); const n = $('[data-sel="' + sk + '"]'); if (n) n.focus(); return; }
  const k = e.target.dataset.keep;
  if (k) { ROWS[k].ui.keep = e.target.value; render(); const x = $('input[data-keep="' + k + '"]:checked'); if (x) x.focus(); }
});
$('#page').addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.q) { S.q[t.dataset.q] = t.value; const pos = t.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.dataset.pk) { const r = ROWS[t.dataset.pk]; r.ui.q = t.value; const pos = t.selectionStart; render(); const n = $('[data-pk="' + r.id + '"]'); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.dataset.ttl) { ROWS[t.dataset.ttl].ui.title = t.value; }
});
document.addEventListener('click', e => { if (!e.target.closest('#menu,[data-menu]')) closeMenu(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeMenu(); $('#layer').innerHTML = ''; }
  if (e.key === '/' && route() && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); }
});
window.addEventListener('hashchange', () => { render(); $('#work').scrollTop = 0; });

/* ----------------------------------------------------------- harness -- */
$('#labScreen').addEventListener('click', e => { const b = e.target.closest('button'); if (b) location.hash = '#/health' + (b.dataset.go ? '/' + b.dataset.go : ''); });
const seg = (id, fn) => $(id).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $$(id + ' button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); fn(b.dataset.v); });
seg('#labTheme', v => v === 'neutral' ? document.documentElement.removeAttribute('data-admin-theme') : document.documentElement.setAttribute('data-admin-theme', v));
seg('#labScheme', v => v === 'auto' ? document.documentElement.removeAttribute('data-color-scheme') : document.documentElement.setAttribute('data-color-scheme', v));
$('#labNotesBtn').addEventListener('click', () => { const on = !$('#labNotes').classList.contains('on'); $('#labNotes').classList.toggle('on', on); $('#labNotesBtn').setAttribute('aria-pressed', String(on)); });
$('#labNotes').addEventListener('click', e => { if (e.target.closest('[data-close]')) $('#labNotesBtn').click(); });
$('#labNotes').innerHTML = NOTES;

if (!location.hash) location.hash = '#/health/files';
render();
</script>

</body>
