  if (c){ const n = find(c.closest(".mt-item").dataset.id).n; Object.assign(n, { path:"", derived:"", off:undefined, kind:"none" }); markDirty(); renderTree(); $("#lk-" + n.id)?.focus(); announce("Link removed"); return; }
  const ic = e.target.closest("[data-icon]"); if (ic) return pickIcon(find(ic.closest(".mt-item").dataset.id).n, ic);
  const icx = e.target.closest("[data-iconclear]"); if (icx){ const n = find(icx.closest(".mt-item").dataset.id).n; n.icon = ""; markDirty(); renderTree(); $("#ed-" + n.id + " .btn[data-icon]")?.focus(); announce("Icon reset"); }
});
/* The icon inserter, as the editor has it: a searchable grid. */
function pickIcon(n, btn){
  let q = "";
  const d = modal('<div class="modal-h"><h2 id="dlgTitle">Insert an Icon</h2></div><div class="modal-b"><label class="search">'+icon("i-search")+'<input id="iq" placeholder="Search icons" aria-label="Search icons"></label>' +
    '<div class="ico-grid" role="radiogroup" aria-label="Icons" id="ig"></div></div>' +
    '<div class="modal-f"><button class="btn" type="button" data-close>Cancel</button></div>', d => {
      const draw = () => { $("#ig", d).innerHTML = ICONS.filter(x => x.includes(q)).map(x => '<button type="button" class="ico-opt" role="radio" aria-checked="'+(n.icon === x)+'" data-ic="'+x+'">'+icon("i-" + x)+'<span>'+x+'</span></button>').join("") || '<p class="quiet">No icon matches.</p>';
        $$("[data-ic]", d).forEach(b => b.addEventListener("click", () => { n.icon = b.dataset.ic; markDirty(); d.close(); renderTree(); $("#ed-" + n.id + " [data-icon]")?.focus(); announce("Icon set to " + n.icon); })); };
      $("#iq", d).addEventListener("input", e => { q = e.target.value.toLowerCase(); draw(); });
      draw(); $("#iq", d).focus();
    }, "tall");
}
function pickFieldOption(id, key, btn){
  const n = find(id).n, fd = THEME.locations.flatMap(l => l.fields).find(f => f.key === key);
  openMenu(btn, fd.options.map(o => ({ label:o, checked:(n.f||{})[key] === o, run:()=>{ n.f = Object.assign({}, n.f, { [key]:o }); markDirty(); renderTree(); focusRow(id, '[data-lfsel="'+key+'"]'); } })));
}
function pickLink(id){ const f = $("#lk-" + id); if (f) f.focus(); }
/* Add Item from the panel head goes after the selected item; a row's menu can
   put one directly above or below that row, at the same level. */
function addItem(where, refId){
  const n = it({ kind:"none", derived:"", path:"", label:"" });
  const x = (refId && find(refId)) || (selId() && find(selId()));
  if (x) x.list.splice(x.i + (where === "above" ? 0 : 1), 0, n); else T().push(n);
  S.sel[S.list] = n.id; S.open = n.id; markDirty();
  if (!$("#tree")) renderMenu(); else renderTree();
  announce("Added an item " + (x ? (where === "above" ? "above " : "after ") + shown(x.n) : "") + ". Give it a label, then a link, or leave the link empty for plain text.");
  const f = $("#el-" + n.id); f && f.focus();
  $('#tree [data-id="'+n.id+'"]').scrollIntoView({ block:"nearest" });
}

/* ---- settings dialog ---- */
function renameNote(m){
  if (m.draft || S.draftName === m.name) return "";
  const n = m.entries.length;
  return '<div class="warn-note" role="status">'+icon("i-alert")+'<div><p><b>Renaming changes how themes and entries find this menu.</b> Its locations follow the new name on their own.' +
    (n ? ' ' + plural(n, "entry", "entries") + ' ' + (n === 1 ? "uses" : "use") + ' <code>::menu{name='+esc(m.name)+'}</code>: ' + m.entries.map(e => esc(e.t)).join(", ") + '.' : ' No entry uses the directive, so nothing else changes.') + '</p>' +
    (n ? '<label class="check"><input type="checkbox" id="dFix"'+(S.updateEntries?" checked":"")+'><span class="box">'+icon("i-check")+'</span><span class="tx"><b>Update the Directive in '+(n === 1 ? "That Entry" : "Those Entries")+'</b><span>Otherwise '+(n === 1 ? "it shows" : "they show")+' nothing where the menu was.</span></span></label>' : '') + '</div></div>';
}
function settingsDialog(){
  const m = cur();
  const was = { label:S.draftLabel, name:S.draftName, fix:S.updateEntries, locs:Object.assign({}, S.draftLocs) };
  modal('<div class="modal-h"><h2 id="dlgTitle">Menu Settings</h2><p>Saved with the items when you press '+(m.draft ? "Publish" : "Update")+'.</p></div><div class="modal-b">' +
    '<div class="field"><label for="dLabel">Label</label><input class="inp" id="dLabel" value="'+esc(S.draftLabel)+'"><span class="hint">Names the navigation for screen readers.</span></div>' +
    '<div class="field"><label for="dName">Name</label><input class="inp mono" id="dName" value="'+esc(S.draftName)+'" spellcheck="false" autocomplete="off" aria-describedby="dNameHint dNameErr"><span class="hint" id="dNameHint">Themes and the directive find the menu by its name.</span><span class="err" id="dNameErr" hidden></span><div id="dRename">'+renameNote(m)+'</div></div>' +
    '<div class="field"><span class="lab">In an Entry</span><div class="snippet"><code id="dSnip">::menu{name='+esc(S.draftName)+'}</code><button class="btn sm" type="button" id="dCopy">'+icon("i-copy")+'Copy</button></div></div>' +
    '<div class="field"><span class="lab">Locations</span><div class="loc-checks">' + THEME.locations.map(l =>
      '<label class="check"><input type="checkbox" data-dloc="'+l.key+'"'+(S.draftLocs[l.key]?" checked":"")+'><span class="box">'+icon("i-check")+'</span><span class="tx"><b>'+esc(l.name)+'</b><span>'+esc(l.depth)+'. <span class="loc-state" data-st="'+l.key+'">'+esc(locState(l))+'</span></span></span></label>').join("") + '</div></div></div>' +
    '<div class="modal-f"><button class="btn" type="button" id="dCancel">Cancel</button><button class="btn btn-primary" type="button" id="dDone">Done</button></div>', d => {
      const bindFix = () => { const f = $("#dFix", d); f && f.addEventListener("change", () => S.updateEntries = f.checked); };
      $("#dLabel", d).addEventListener("input", e => { S.draftLabel = e.target.value; });
      $("#dName", d).addEventListener("input", e => {
        const v = slugify(e.target.value); if (v !== e.target.value) e.target.value = v;
        S.draftName = v;
        const taken = v !== m.name && !!menuOf(v), bad = !v || taken;
        const err = $("#dNameErr", d); err.hidden = !bad; err.innerHTML = bad ? icon("i-alert") + (v ? "A menu named " + esc(v) + " already exists. Pick another name." : "A menu needs a name.") : "";
        e.target.classList.toggle("bad", bad); $("#dDone", d).disabled = bad;
        $("#dSnip", d).textContent = "::menu{name=" + (v || "…") + "}";
        $("#dRename", d).innerHTML = renameNote(m); bindFix();
      });
      bindFix();
      $$("[data-dloc]", d).forEach(c => c.addEventListener("change", () => { S.draftLocs[c.dataset.dloc] = c.checked; const l = locByKey(c.dataset.dloc); $('[data-st="'+l.key+'"]', d).textContent = locState(l); }));
      $("#dCopy", d).addEventListener("click", e => { navigator.clipboard?.writeText($("#dSnip", d).textContent).catch(()=>{}); e.currentTarget.innerHTML = icon("i-check")+"Copied"; });
      let ok = false;
      $("#dDone", d).addEventListener("click", () => { ok = true; d.close(); });
      $("#dCancel", d).addEventListener("click", () => d.close());
      d.addEventListener("close", () => {
        if (!ok){ S.draftLabel = was.label; S.draftName = was.name; S.updateEntries = was.fix; S.draftLocs = was.locs; }
        else if (S.draftLabel !== was.label || S.draftName !== was.name || S.updateEntries !== was.fix || JSON.stringify(S.draftLocs) !== JSON.stringify(was.locs)) S.dirty = true;
        renderMenu(); $("#openSettings").focus();
      }, { once:true });
      $("#dLabel", d).focus();
    });
}

/* ---------------------------------------------------------------- menu lifecycle */
const slugify = s => s.toLowerCase().normalize("NFKD").replace(/[^\w\s-]/g,"").trim().replace(/[\s_]+/g,"-").replace(/-+/g,"-");
function newMenu(){ menuDialog(); }
function duplicateMenu(m){
  if (S.view === "menu" && (S.dirty || cur()?.draft)) return leaveGuard(() => duplicateMenu(m));
  menuDialog(m);
}
/* New Menu and Duplicate are one dialog. The name follows the label until it is
   typed in, and can be changed later in Settings. Either way the result is a
   new, unpublished menu that opens straight away. */
function menuDialog(from){
  const label0 = from ? from.label + " (Copy)" : "";
  modal('<form id="nmForm"><div class="modal-h"><h2 id="dlgTitle">'+(from ? "Duplicate " + esc(from.label) : "New Menu")+'</h2>' +
    (from ? '<p>The copy has the same '+plural(menuItems(from),"item")+' and isn\'t in any location until you choose one.</p>' : '') + '</div><div class="modal-b">' +
    '<div class="field"><label for="nmLabel">Label</label><input class="inp" id="nmLabel" autocomplete="off" value="'+esc(label0)+'"><span class="hint">Shown here, and read out by screen readers as the name of the navigation.</span></div>' +
    '<div class="field"><label for="nmName">Name</label><input class="inp mono" id="nmName" autocomplete="off" spellcheck="false"><span class="hint">Themes and <code>::menu{name=…}</code> find the menu by it. You can change it later in Settings.</span><span class="err" id="nmErr" hidden></span></div></div>' +
    '<div class="modal-f"><button class="btn" type="button" data-close>Cancel</button><button class="btn btn-primary" type="submit" id="nmGo" disabled>'+(from ? "Create Copy" : "Create Menu")+'</button></div></form>', d => {
      const L = $("#nmLabel", d), N = $("#nmName", d), err = $("#nmErr", d); let touched = false;
      const suggest = () => { let v = slugify(L.value), base = v, i = 2; while (v && menuOf(v)) v = base + "-" + i++; return v; };
      const check = () => { const taken = !!menuOf(N.value); err.hidden = !taken; err.innerHTML = taken ? icon("i-alert") + "A menu named " + esc(N.value) + " already exists. Pick another name." : ""; N.classList.toggle("bad", taken); $("#nmGo", d).disabled = !N.value || !L.value.trim() || taken; };
      L.addEventListener("input", () => { if (!touched) N.value = suggest(); check(); });
      N.addEventListener("input", () => { touched = true; N.value = slugify(N.value); check(); });
      if (from){ N.value = suggest(); check(); }
      $("#nmForm", d).addEventListener("submit", e => { e.preventDefault();
        let tree = [];
        if (from){ tree = JSON.parse(snapTree(from.tree)); (function re(list){ list.forEach(x => { x.id = "n" + (uid++); re(x.children); }); })(tree); }
        const m = { name:N.value, label:L.value.trim(), entries:[], tree, draft:true };
        S.menus.push(m); d.close(); go("menu", m.name); });
      L.focus(); if (from) L.select();
    });
}
function confirmDelete(m){
  const at = locsOf(m.name), n = at.length + m.entries.length;
  modal('<div class="modal-h"><h2 id="dlgTitle">Delete '+esc(m.label)+'?</h2><p>'+(n ? "It's used in " + plural(n, "place") + ". Locations go back to the theme's default or show nothing, and entries show nothing where the directive was." : "It isn't in any location or entry.")+'</p></div>' +
    (n ? '<div class="modal-b">' : '') + (at.length ? '<div class="use-list"><div class="use-h">Locations</div>' + at.map(l => '<div class="use-row">'+icon("i-location")+'<span class="l">'+esc(l.name)+'</span></div>').join("") + '</div>' : '') +
    (m.entries.length ? '<div class="use-list"><div class="use-h">Entries With the Directive</div>' + m.entries.map(e => '<div class="use-row">'+icon("i-page")+'<span class="l">'+esc(e.t)+'</span><code>'+esc(e.a)+'</code></div>').join("") + '</div>' : '') + (n ? '</div>' : '') +
    '<div class="modal-f"><button class="btn" type="button" data-close>Cancel</button><button class="btn btn-danger-fill" type="button" id="delGo">'+icon("i-trash")+'Delete '+esc(m.label)+'</button></div>', d => {
      $("[data-close]", d).focus();
      $("#delGo", d).addEventListener("click", () => {
        const idx = S.menus.indexOf(m), before = Object.assign({}, S.assign);
        S.menus.splice(idx, 1); THEME.locations.forEach(l => { if (S.assign[l.key] === m.name) S.assign[l.key] = null; });
        d.close(); S.dirty = false; go("list");
        toast("Deleted " + m.label, { undo:() => { S.menus.splice(idx, 0, m); S.assign = before; if (S.view === "list") renderList(); navCount(); } });
      });
    });
}

/* ---------------------------------------------------------------- harness */
function seg(id, fn){ if (!$("#"+id)) return; $$("#"+id+" button").forEach(b => b.addEventListener("click", () => { $$("#"+id+" button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); fn(b.dataset.v); })); }
seg("labTheme", v => v === "neutral" ? document.documentElement.removeAttribute("data-admin-theme") : document.documentElement.setAttribute("data-admin-theme", v));
seg("labScheme", v => v ? document.documentElement.setAttribute("data-theme", v) : document.documentElement.removeAttribute("data-theme"));
$("#labReset").addEventListener("click", () => { uid = 1; S.menus = seed(); S.assign = seedAssign(); S.sel = {}; S.dirty = false; go("list"); toast("Everything is back to the start", { kind:"info" }); });
$("#burger").addEventListener("click", () => $("#app").classList.add("nav-open"));
$("#scrimNav").addEventListener("click", () => $("#app").classList.remove("nav-open"));
$("#navMenus").addEventListener("click", () => { $("#app").classList.remove("nav-open"); go("list"); });
document.addEventListener("click", e => { if (e.target.closest("[data-todo]")) toast("Not part of this sketch", { kind:"info" }); });
go("list");
</script>
