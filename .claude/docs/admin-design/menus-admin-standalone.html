<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menus Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Karla:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* Layout: the admin shell (labeled rail, section panel, top bar, one scrolling
   work area) under a thin lab- harness bar. Tokens are design/tokens.css; the
   two axes are data-admin-theme and data-theme (the viewer's own scheme
   attribute, which is the prototype's spelling too). */
:root{
  --bg:#f5f6f9; --surface:#ffffff; --surface-2:#f0f2f6; --surface-3:#e7eaf0;
  --border:#e2e5ec; --border-strong:#ccd2dd;
  --fg:#11141b; --fg-2:#535b6b; --fg-3:#858d9d;
  --accent:#2f5fe0; --accent-hover:#2650c4; --accent-fg:#ffffff; --accent-soft:#e9effc; --accent-line:#bdcdf7;
  --good:#136b43; --good-soft:#e2f3e9; --good-dot:#1f9d5f;
  --warn:#8a5806; --warn-soft:#faf0d9; --warn-dot:#cf8d16;
  --danger:#a92420; --danger-soft:#fbeae9; --danger-dot:#d6403a;
  --shadow-1:none;
  --shadow-2:0 2px 8px rgba(17,20,27,.05), 0 1px 2px rgba(17,20,27,.04);
  --shadow-3:0 10px 28px rgba(17,20,27,.09), 0 2px 6px rgba(17,20,27,.05);
  --r-1:6px; --r-2:10px; --r-3:16px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:18px; --s-5:26px; --s-6:36px; --s-7:52px;
  --font-ui:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-title:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono:"Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --base:13px; --h1:26px; --h1-track:-.024em; --title-size:13.5px; --title-weight:500; --title-track:-.005em;
  --pad-row:14px; --pad-panel:17px; --pad-x:22px; --ctl:34px; --ctl-sm:30px; --stat-v:30px;
  --railbar:74px; --rail:262px; --bar:62px; --work-max:1400px; --measure:72ch;
  color-scheme:light;
}
:root[data-admin-theme="editorial"]{
  --bg:#f6f2ec; --surface:#fffdfa; --surface-2:#f1ece3; --surface-3:#e7e0d4;
  --border:#e5ded2; --border-strong:#cdc3b3;
  --fg:#23201b; --fg-2:#5d564c; --fg-3:#8e867a;
  --accent:#17595e; --accent-hover:#124a4e; --accent-fg:#fffdfa; --accent-soft:#e2eded; --accent-line:#b6d3d5;
  --good:#4c6d2c; --good-soft:#edf1e2; --good-dot:#6f9b45;
  --warn:#8a5a14; --warn-soft:#f8eeda; --warn-dot:#c58a2a;
  --danger:#9c3327; --danger-soft:#f8e7e2; --danger-dot:#c2503f;
  --shadow-2:0 2px 8px rgba(60,48,32,.05), 0 1px 2px rgba(60,48,32,.04);
  --shadow-3:0 10px 28px rgba(60,48,32,.09), 0 2px 6px rgba(60,48,32,.05);
  --r-1:8px; --r-2:12px; --r-3:20px;
  --font-ui:"Karla", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display:"Newsreader", ui-serif, Georgia, "Times New Roman", serif;
  --font-title:"Newsreader", ui-serif, Georgia, "Times New Roman", serif;
  --base:13.5px; --h1:32px; --h1-track:-.014em; --title-size:15.5px; --title-track:0;
  --pad-row:16px; --pad-panel:19px; --pad-x:26px; --stat-v:34px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d12; --surface:#13161d; --surface-2:#1a1e27; --surface-3:#222733;
    --border:#242936; --border-strong:#353c4c;
    --fg:#e9ebf0; --fg-2:#a3abba; --fg-3:#747d8e;
    --accent:#7295f7; --accent-hover:#8aa8f9; --accent-fg:#0b0d12; --accent-soft:#182444; --accent-line:#2c3d68;
    --good:#5ecb92; --good-soft:#102a1e; --good-dot:#35b877;
    --warn:#e3b360; --warn-soft:#2b2312; --warn-dot:#d69f3c;
    --danger:#f28d84; --danger-soft:#301917; --danger-dot:#e0655c;
    --shadow-2:0 2px 8px rgba(0,0,0,.3);
    --shadow-3:0 10px 28px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    color-scheme:dark;
  }
  :root:not([data-theme="light"])[data-admin-theme="editorial"]{
    --bg:#15120e; --surface:#1d1915; --surface-2:#26211a; --surface-3:#322b22;
    --border:#302a21; --border-strong:#463e31;
    --fg:#f0e9dd; --fg-2:#b4a996; --fg-3:#877c6c;
    --accent:#72bec2; --accent-hover:#8bcccf; --accent-fg:#15120e; --accent-soft:#113032; --accent-line:#1d4a4d;
    --good:#9cc16b; --good-soft:#1c2413; --good-dot:#84ad55;
    --warn:#dcae63; --warn-soft:#2c2314; --warn-dot:#c79646;
    --danger:#e8897b; --danger-soft:#2f1a16; --danger-dot:#cf6a5c;
    --shadow-2:0 2px 8px rgba(0,0,0,.34);
    --shadow-3:0 10px 28px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.34);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d12; --surface:#13161d; --surface-2:#1a1e27; --surface-3:#222733;
  --border:#242936; --border-strong:#353c4c;
  --fg:#e9ebf0; --fg-2:#a3abba; --fg-3:#747d8e;
  --accent:#7295f7; --accent-hover:#8aa8f9; --accent-fg:#0b0d12; --accent-soft:#182444; --accent-line:#2c3d68;
  --good:#5ecb92; --good-soft:#102a1e; --good-dot:#35b877;
  --warn:#e3b360; --warn-soft:#2b2312; --warn-dot:#d69f3c;
  --danger:#f28d84; --danger-soft:#301917; --danger-dot:#e0655c;
  --shadow-2:0 2px 8px rgba(0,0,0,.3);
  --shadow-3:0 10px 28px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}
:root[data-theme="dark"][data-admin-theme="editorial"]{
  --bg:#15120e; --surface:#1d1915; --surface-2:#26211a; --surface-3:#322b22;
  --border:#302a21; --border-strong:#463e31;
  --fg:#f0e9dd; --fg-2:#b4a996; --fg-3:#877c6c;
  --accent:#72bec2; --accent-hover:#8bcccf; --accent-fg:#15120e; --accent-soft:#113032; --accent-line:#1d4a4d;
  --good:#9cc16b; --good-soft:#1c2413; --good-dot:#84ad55;
  --warn:#dcae63; --warn-soft:#2c2314; --warn-dot:#c79646;
  --danger:#e8897b; --danger-soft:#2f1a16; --danger-dot:#cf6a5c;
  --shadow-2:0 2px 8px rgba(0,0,0,.34);
  --shadow-3:0 10px 28px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.34);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:var(--base);line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
code{font-family:var(--font-mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ================= lab harness (not part of the design) ================= */
.lab-bar{flex:none;display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;padding:7px var(--s-4);
  background:var(--surface-3);border-bottom:1px solid var(--border-strong);font-size:11.5px;color:var(--fg-2)}
.lab-bar b{font-weight:600;color:var(--fg);letter-spacing:.02em}
.lab-grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lab-grp > span{color:var(--fg-3)}
.lab-seg{display:flex;flex-wrap:wrap;border:1px solid var(--border-strong);border-radius:var(--r-1);overflow:hidden;background:var(--surface)}
.lab-seg button{padding:3px 9px;font-size:11.5px;color:var(--fg-2);white-space:nowrap}
.lab-seg button + button{border-left:1px solid var(--border)}
.lab-seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.lab-note{margin-left:auto;color:var(--fg-3)}
@media (max-width:900px){.lab-note{display:none}}

/* ================= shell ================= */
.app{display:flex;flex:1;min-height:0}
.railbar{width:var(--railbar);flex:none;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding:var(--s-3) 0;gap:var(--s-1);z-index:2}
.rb-mark{width:34px;height:34px;border-radius:var(--r-2);background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:600;font-size:15px;letter-spacing:-.02em;margin-bottom:var(--s-3);flex:none}
.rb{width:60px;padding:10px 2px 8px;border-radius:var(--r-2);display:flex;flex-direction:column;align-items:center;gap:6px;
  color:var(--fg-3);font-size:9.5px;font-weight:500;line-height:1.2;text-align:center}
.rb .ic{width:19px;height:19px;stroke-width:1.5}
.rb:hover{background:var(--surface-2);color:var(--fg-2)}
.rb[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.rail{width:var(--rail);flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sec-head{display:flex;align-items:center;padding:var(--s-4);border-bottom:1px solid var(--border);min-height:var(--bar);flex:none}
.sec-head h2{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-.01em}
.sec-head .sub{display:block;font-size:11px;color:var(--fg-3);font-weight:400;font-family:var(--font-ui);letter-spacing:0;margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:var(--s-3);display:flex;flex-direction:column;gap:3px;min-height:0}
.nav-group-label{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);padding:var(--s-5) var(--s-2) var(--s-2)}
.nav-group-label:first-child{padding-top:var(--s-1)}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-1);color:var(--fg-2);width:100%;text-align:left;font-size:13px;position:relative}
.nav-item:hover{background:var(--surface-2);color:var(--fg)}
.nav-item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item[aria-current="page"]{background:var(--surface-2);color:var(--fg);font-weight:500}
.nav-item[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:2px;border-radius:0 2px 2px 0;background:var(--accent)}
.nav-count{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.nav-count.alert{color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:99px;font-weight:500}

.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.topbar{height:var(--bar);flex:none;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:var(--s-2);padding:0 var(--s-4)}
.icon-btn{width:32px;height:32px;border-radius:var(--r-1);display:grid;place-items:center;color:var(--fg-2);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.burger{display:none}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;font-size:13px;color:var(--fg-3)}
.crumbs .sep{color:var(--border-strong);flex:none;padding:0 2px}
.crumbs .crumb{flex:0 1 auto;min-width:0;padding:4px 7px;border-radius:var(--r-1);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs .crumb:hover{background:var(--surface-2);color:var(--fg)}
.crumbs .here{flex:none;padding:4px 2px;color:var(--fg);font-weight:500;white-space:nowrap}
.topbar .spacer{flex:1}
.kbar{display:flex;align-items:center;gap:8px;height:var(--ctl);padding:0 12px;border:1px solid var(--border);border-radius:var(--r-1);color:var(--fg-3);background:var(--bg);min-width:220px}
.kbar span{flex:1;text-align:left;font-size:12.5px}
kbd{font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 4px;color:var(--fg-3);background:var(--surface)}
.avatar{width:29px;height:29px;border-radius:99px;background:var(--surface-3);color:var(--fg-2);display:grid;place-items:center;font-size:10.5px;font-weight:600;flex:none}
.work{flex:1;overflow-y:auto;min-height:0}
.wrap{padding:var(--s-6) var(--s-6) 96px;max-width:var(--work-max);margin:0 auto}
.scrim-nav{display:none}

/* ================= page parts (as in the prototype) ================= */
.page-head{display:flex;align-items:flex-start;gap:var(--s-4);flex-wrap:wrap;margin-bottom:var(--s-6)}
.page-head h1{font-family:var(--font-display);font-size:var(--h1);font-weight:600;letter-spacing:var(--h1-track);text-wrap:balance;line-height:1.2}
.page-head .sub{color:var(--fg-2);font-size:13px;margin-top:7px;max-width:70ch;line-height:1.6}
.page-head .sub code{font-size:12px}
.page-head .sub.facts{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap}
.page-head .acts{margin-left:auto;display:flex;gap:var(--s-2);flex-wrap:wrap;align-items:center;padding-top:3px}
.unsaved{font-size:11.5px;color:var(--fg-3);display:inline-flex;align-items:center;gap:6px}
.unsaved .d{width:6px;height:6px;border-radius:99px;background:var(--warn-dot)}

.btn{display:inline-flex;align-items:center;gap:7px;height:var(--ctl);padding:0 14px;border-radius:var(--r-1);border:1px solid var(--border);background:var(--surface);color:var(--fg);font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent;color:var(--fg)}
.btn-danger{color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger-soft)}
.btn-danger-fill{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn-danger-fill:hover{background:var(--danger);opacity:.9}
.btn.sm{height:var(--ctl-sm);padding:0 11px;font-size:12px}
.btn.icon{width:var(--ctl-sm);padding:0;justify-content:center}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3)}
.panel-head{display:flex;align-items:center;gap:var(--s-3);padding:var(--pad-panel) var(--pad-x);border-bottom:1px solid var(--border);min-height:58px;flex-wrap:wrap}
.panel-head h2{font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:-.005em}
.panel-head .hint{font-size:11.5px;color:var(--fg-3)}
.panel-head .end{margin-left:auto;display:flex;align-items:center;gap:8px}
.panel-body{padding:var(--s-4) var(--pad-x) var(--s-5);display:flex;flex-direction:column;gap:var(--s-4)}
.stack{display:flex;flex-direction:column;gap:var(--s-4)}
.link{color:var(--accent);font-weight:500}
.link:hover{text-decoration:underline}

.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 8px;border-radius:99px;font-size:11px;font-weight:500;white-space:nowrap;border:1px solid transparent;vertical-align:middle}
.pill .d{width:5px;height:5px;border-radius:99px;flex:none}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.good .d{background:var(--good-dot)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.warn .d{background:var(--warn-dot)}
.pill.danger{background:var(--danger-soft);color:var(--danger)} .pill.danger .d{background:var(--danger-dot)}
.pill.neutral{background:var(--surface-2);color:var(--fg-2);border-color:var(--border)} .pill.neutral .d{background:var(--border-strong)}
/* A location chip is a label, not a status: no dot. */
.loc{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--r-1);font-size:11px;color:var(--fg-2);background:var(--surface-2);border:1px solid var(--border);white-space:nowrap}
.loc .ic{width:12px;height:12px;color:var(--fg-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:640px}
thead th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3);padding:13px var(--pad-x);border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:var(--pad-row) var(--pad-x);border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.t-title{font-family:var(--font-title);font-size:var(--title-size);font-weight:var(--title-weight);letter-spacing:var(--title-track);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-title:hover{color:var(--accent)}
.t-slug{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-3);margin-top:4px}
.quiet{color:var(--fg-3);font-size:12px}
.row-more{opacity:0;width:30px;height:30px;border-radius:var(--r-1);display:grid;place-items:center;color:var(--fg-3)}
tr:hover .row-more,.row-more[aria-expanded="true"],.row-more:focus-visible{opacity:1}
.row-more:hover{background:var(--surface-3);color:var(--fg)}
@media (hover:none){.row-more{opacity:1}}

/* Location rows: label and depth on the left, the drawn select on the right. */
.lrows{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,260px);gap:var(--s-2) var(--s-5);align-items:center;padding:var(--pad-row) var(--pad-x);border-bottom:1px solid var(--border)}
.lrow:last-child{border-bottom:0}
.lrow .nm{font-family:var(--font-title);font-size:var(--title-size);font-weight:var(--title-weight)}
.lrow .meta{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;margin-top:4px;font-size:11.5px;color:var(--fg-3)}
.lrow .meta code{font-size:10.5px}
.lrow .meta .dot-sep{color:var(--border-strong)}
@media (max-width:640px){.lrow{grid-template-columns:minmax(0,1fr)}}

/* The drawn select: a button that names the value and opens a .menu. */
.xs{display:flex;align-items:center;gap:var(--s-2);width:100%;height:var(--ctl);padding:0 10px 0 12px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface);font-size:12.5px;color:var(--fg);text-align:left}
.xs:hover{border-color:var(--border-strong)}
.xs .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xs .v.def{color:var(--fg-2)}
.xs .ic{color:var(--fg-3)}
.xs[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* Menus and popovers */
.menu{position:fixed;z-index:60;min-width:212px;max-width:320px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);box-shadow:var(--shadow-2);padding:7px}
.menu button{display:flex;align-items:center;gap:11px;width:100%;padding:8px 11px;border-radius:var(--r-1);font-size:12.5px;color:var(--fg-2);text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--surface-2);color:var(--fg);outline:0}
.menu button.danger{color:var(--danger)}
.menu button.danger:hover{background:var(--danger-soft)}
.menu button[aria-checked="true"]{background:var(--accent-soft);color:var(--accent)}
.menu button .l{flex:1;min-width:0}
.menu button .ds{display:block;font-size:11px;color:var(--fg-3);line-height:1.45;margin-top:1px}
.menu button[aria-checked="true"] .ds{color:var(--accent)}
.menu button .tail{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-3);flex:none}
.menu.wide{min-width:288px}
.menu.wide button{align-items:flex-start;padding:9px 11px}
.menu.wide .ic{margin-top:2px}
.menu .div{height:1px;background:var(--border);margin:7px -7px}
.menu .sec{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);padding:10px 11px 4px}
.menu .sec:first-child{padding-top:4px}

/* Forms */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field > label,.field > .lab{font-size:12px;color:var(--fg-2);font-weight:500;display:flex;align-items:center;gap:var(--s-2)}
.field .hint{font-size:11.5px;color:var(--fg-3);line-height:1.5}
.inp{height:var(--ctl);border:1px solid var(--border);border-radius:var(--r-1);background:var(--bg);padding:0 12px;font-size:12.5px;outline:none;width:100%;color:var(--fg)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.inp::placeholder{color:var(--fg-3)}
.inp.mono{font-size:12px}
textarea.inp{height:auto;padding:9px 12px;resize:vertical;min-height:64px;line-height:1.5}
.inp[readonly]{background:var(--surface-2);color:var(--fg-2)}
.inp-row{display:flex;gap:var(--s-2);align-items:center}
.inp-row .inp{flex:1;min-width:0}
.lang{display:inline-flex;margin-left:auto;border:1px solid var(--border);border-radius:var(--r-1);overflow:hidden}
.lang button{font-family:var(--font-mono);font-size:10.5px;padding:1px 7px;color:var(--fg-3)}
.lang button + button{border-left:1px solid var(--border)}
.lang button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.lang button .fill{display:inline-block;width:4px;height:4px;border-radius:99px;background:var(--accent);margin-left:4px;vertical-align:2px}
.ref{display:flex;align-items:center;gap:var(--s-3);padding:9px 10px 9px 12px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--bg)}
.ref .ic{color:var(--fg-3)}
.ref .rt{flex:1;min-width:0}
.ref .rt b{display:block;font-weight:500;font-size:12.5px}
.ref .rt code{display:block;font-size:10.5px;color:var(--fg-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check{display:flex;align-items:flex-start;gap:11px;cursor:pointer;padding:3px 0}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.check .box{width:16px;height:16px;border:1px solid var(--border-strong);border-radius:4px;display:grid;place-items:center;background:var(--surface);flex:none;margin-top:1px;color:transparent}
.check .box .ic{width:11px;height:11px;stroke-width:2.6}
.check input:checked + .box{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.check input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.check .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.check .tx b{font-weight:500;font-size:12.5px}
.check .tx span{font-size:11.5px;color:var(--fg-3);line-height:1.45}
.fold{border-top:1px solid var(--border);padding-top:var(--s-3)}
.fold > summary{cursor:pointer;font-size:12px;font-weight:500;color:var(--fg-2);display:flex;align-items:center;gap:6px;list-style:none}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary .ic{width:12px;height:12px;transition:transform .12s}
.fold[open] > summary .ic{transform:rotate(90deg)}
.fold > .fold-body{display:flex;flex-direction:column;gap:var(--s-4);padding-top:var(--s-4)}
.fgroup{border:1px solid var(--border);border-radius:var(--r-2);padding:var(--s-3) var(--s-4) var(--s-4);display:flex;flex-direction:column;gap:var(--s-3)}
.fgroup-h{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);display:flex;align-items:center;gap:6px}
.fgroup-h .ic{width:12px;height:12px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
@media (max-width:520px){.two-col{grid-template-columns:1fr}}
.snippet{display:flex;align-items:center;gap:var(--s-2);padding:6px 6px 6px 12px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface-2)}
.snippet code{flex:1;min-width:0;font-size:12px;overflow-x:auto;white-space:nowrap}

/* ================= menu detail ================= */
.mdetail{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:var(--s-4);align-items:start}
@media (max-width:1100px){.mdetail{grid-template-columns:minmax(0,1fr)}}
.mdetail > .stack:last-child{position:sticky;top:0}
@media (max-width:1100px){.mdetail > .stack:last-child{position:static}}

/* The depth notice sits between the panel head and the tree. */
.depth-bar{display:flex;align-items:flex-start;gap:var(--s-2);padding:11px var(--pad-x);border-bottom:1px solid var(--border);background:var(--surface-2);font-size:12px;color:var(--fg-2)}
.depth-bar .ic{width:14px;height:14px;margin-top:2px;color:var(--fg-3)}
.depth-bar.over{background:var(--warn-soft);color:var(--warn)}
.depth-bar.over .ic{color:var(--warn-dot)}

/* --- the item tree: the one new component. Rows are flat; aria-level and the
   indent carry the nesting, the way the Pages tree does. --- */
.mtree{position:relative;padding:var(--s-2) 0;--limit:99;--indent:22px;--lead:calc(var(--pad-x) - 8px + 18px + var(--s-2))}
.mt-item{position:relative;outline:0}
.mt-row{display:flex;align-items:center;gap:var(--s-2);padding:10px var(--pad-x) 10px calc(var(--pad-x) - 8px);min-height:54px;position:relative;cursor:default;user-select:none}
.mt-item:hover > .mt-row{background:var(--surface-2)}
.mt-item[aria-selected="true"] > .mt-row{background:var(--accent-soft)}
.mt-item:focus-visible > .mt-row{box-shadow:inset 0 0 0 2px var(--accent)}
.mt-grip{width:18px;height:28px;display:grid;place-items:center;color:var(--fg-3);cursor:grab;flex:none;opacity:.55}
.mt-item:hover .mt-grip,.mt-item[aria-selected="true"] .mt-grip{opacity:1}
.mt-ind{flex:none;width:calc(var(--d) * var(--indent))}
.twist{width:18px;height:18px;flex:none;display:grid;place-items:center;color:var(--fg-3);border-radius:4px}
.twist:hover{background:var(--surface-3);color:var(--fg)}
.twist .ic{width:12px;height:12px;transition:transform .12s}
.twist[aria-expanded="true"] .ic{transform:rotate(90deg)}
.twist.leaf{visibility:hidden}
.mt-kind{width:26px;height:26px;border-radius:var(--r-1);display:grid;place-items:center;color:var(--fg-2);background:var(--surface-2);border:1px solid var(--border);flex:none}
.mt-item[aria-selected="true"] .mt-kind{background:var(--surface);border-color:var(--accent-line);color:var(--accent)}
.mt-kind .ic{width:14px;height:14px}
.mt-main{flex:1;min-width:0}
.mt-t{display:flex;align-items:baseline;gap:var(--s-2);min-width:0}
.mt-t .tt{font-family:var(--font-title);font-size:var(--title-size);font-weight:var(--title-weight);letter-spacing:var(--title-track);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-t .tt.heading{text-transform:uppercase;font-family:var(--font-ui);font-size:11px;letter-spacing:.07em;font-weight:600;color:var(--fg-2)}
.mt-t .ovr{flex:none;font-size:10.5px;color:var(--fg-3);border:1px dashed var(--border-strong);border-radius:4px;padding:0 5px;white-space:nowrap}
.mt-s{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-3);margin-top:2px;min-width:0}
.mt-s code{font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mt-s s{text-decoration-thickness:1px}
.mt-chips{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
/* The cut. A row past the shallowest assigned location's depth carries a
   dashed mark in its own indent, at the level where that location stops, and
   a "Past Level N" chip. A full-height rule would cross every shallower label. */
.mt-ind{position:relative;align-self:stretch}
.mt-item.past .mt-ind::after{content:"";position:absolute;top:4px;bottom:4px;left:calc(var(--limit) * var(--indent) - 8px);border-left:2px dashed var(--warn-dot)}
.mt-item.past .mt-main{opacity:.72}
.foot-note{flex-basis:100%;font-size:11.5px;color:var(--warn);display:flex;align-items:center;gap:6px;padding:2px 2px 0}
.foot-note .ic{width:13px;height:13px}
/* Drop indication while dragging. */
.mt-item.drop-before > .mt-row::before,.mt-item.drop-after > .mt-row::after{content:"";position:absolute;left:calc(var(--lead) + var(--dd,0) * var(--indent));right:var(--pad-x);height:2px;background:var(--accent);border-radius:2px}
.mt-item.drop-before > .mt-row::before{top:-1px}
.mt-item.drop-after > .mt-row::after{bottom:-1px}
.mt-item.drop-in > .mt-row{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.mt-item.dragging{opacity:.4}
@media (max-width:640px){.mt-chips{display:none}.mtree{--indent:16px}}

.tree-foot{display:flex;align-items:center;gap:var(--s-1);padding:var(--s-3) var(--pad-x);border-top:1px solid var(--border);flex-wrap:wrap}
.tree-foot .div{width:1px;height:18px;background:var(--border);margin:0 var(--s-2)}
.tree-foot .end{margin-left:auto;font-size:11px;color:var(--fg-3);display:flex;gap:var(--s-2);align-items:center}
@media (max-width:640px){.tree-foot .end{display:none}}

/* Problems: Site Health's row-per-problem shape. */
.prow{display:flex;gap:var(--s-3);padding:var(--s-4) var(--pad-x);border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:0}
.sev{width:3px;align-self:stretch;border-radius:2px;flex:none}
.sev.warn{background:var(--warn-dot)} .sev.danger{background:var(--danger-dot)} .sev.info{background:var(--border-strong)}
.prow .pm{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.prow .pt{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;font-size:12.5px;font-weight:500}
.prow .pt button{font-weight:500}
.prow .pt button:hover{color:var(--accent);text-decoration:underline}
.prow .pd{font-size:12px;color:var(--fg-2);line-height:1.5}
.prow .pd code{font-size:11px}
.prow .pf{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-top:2px}
.p-foot{padding:var(--s-3) var(--pad-x);border-top:1px solid var(--border);font-size:11.5px;color:var(--fg-3);display:flex;gap:var(--s-2);align-items:flex-start}
.p-foot .ic{width:14px;height:14px;margin-top:1px}

.none-yet{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-4) var(--pad-x);font-size:12.5px;color:var(--fg-2)}
.none-yet .ic{color:var(--good-dot)}

/* Empty states */
.empty{padding:72px var(--s-5) 64px;text-align:center;color:var(--fg-2);display:flex;flex-direction:column;align-items:center}
.empty > .ic{width:26px;height:26px;color:var(--fg-3);margin-bottom:var(--s-4)}
.empty h3{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--fg);margin-bottom:7px}
.empty p{font-size:12.5px;color:var(--fg-3);max-width:48ch;line-height:1.6}
.empty .acts{display:flex;gap:var(--s-2);flex-wrap:wrap;justify-content:center;margin-top:var(--s-5)}
.empty .or{margin-top:var(--s-6);padding-top:var(--s-4);border-top:1px solid var(--border);width:min(440px,100%);display:flex;flex-direction:column;gap:var(--s-2);align-items:stretch}
.empty .or .k{font-size:11.5px;color:var(--fg-3)}
.seed{display:flex;align-items:center;gap:var(--s-3);padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-2);text-align:left;background:var(--surface)}
.seed:hover{border-color:var(--border-strong);background:var(--surface-2)}
.seed .ic{color:var(--fg-3)}
.seed .l{flex:1;min-width:0}
.seed .l b{display:block;font-size:12.5px;font-weight:500;color:var(--fg)}
.seed .l span{font-size:11.5px;color:var(--fg-3)}
.empty.compact{padding:var(--s-6) var(--s-5)}
.empty.compact h3{font-size:14.5px}

/* Notice line (theme details on an inactive theme) */
.notice{display:flex;gap:var(--s-2);align-items:flex-start;padding:12px var(--pad-x);background:var(--surface-2);border-bottom:1px solid var(--border);font-size:12px;color:var(--fg-2)}
.notice .ic{width:14px;height:14px;margin-top:2px;color:var(--fg-3)}

.theme-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:var(--s-4);align-items:start}
@media (max-width:1100px){.theme-grid{grid-template-columns:minmax(0,1fr)}}
.kv{display:flex;gap:var(--s-3);padding:10px 0;font-size:12.5px;color:var(--fg-2);border-bottom:1px solid var(--border)}
.kv:last-child{border-bottom:0}
.kv .k{width:110px;flex:none;color:var(--fg-3)}
.swatch{height:120px;border-bottom:1px solid var(--border);background:var(--surface-2);display:grid;place-items:center;color:var(--fg-3);font-size:11.5px;border-radius:var(--r-3) var(--r-3) 0 0}
.arrow{color:var(--fg-3)}

/* Modal */
dialog.modal{border:0;padding:0;background:var(--surface);color:var(--fg);border-radius:var(--r-3);box-shadow:var(--shadow-3);width:min(480px,calc(100vw - 32px));max-height:calc(100% - 48px)}
dialog.modal::backdrop{background:rgba(17,20,27,.32)}
.modal-h{padding:var(--s-5) var(--s-5) var(--s-2)}
.modal-h h2{font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.modal-h p{font-size:12.5px;color:var(--fg-2);margin-top:6px;line-height:1.55}
.modal-b{padding:var(--s-3) var(--s-5) var(--s-5);display:flex;flex-direction:column;gap:var(--s-4)}
.modal-f{display:flex;gap:var(--s-2);justify-content:flex-end;padding:var(--s-4) var(--s-5);border-top:1px solid var(--border);background:var(--bg);border-radius:0 0 var(--r-3) var(--r-3);flex-wrap:wrap}
.use-list{border:1px solid var(--border);border-radius:var(--r-2)}
.use-h{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);padding:10px 14px 6px}
.use-row{display:flex;align-items:center;gap:var(--s-3);padding:9px 14px;border-top:1px solid var(--border);font-size:12.5px}
.use-h + .use-row{border-top:0}
.use-row .ic{color:var(--fg-3)}
.use-row .l{flex:1;min-width:0}
.use-row code{font-size:10.5px;color:var(--fg-3)}
.pick-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-2);max-height:280px;overflow:auto}
.pick-row{display:flex;align-items:center;gap:var(--s-3);padding:10px 12px;border-top:1px solid var(--border);text-align:left;width:100%}
.pick-row:first-child{border-top:0}
.pick-row:hover{background:var(--surface-2)}
.pick-row[aria-checked="true"]{background:var(--accent-soft)}
.pick-row .ic{color:var(--fg-3)}
.pick-row .l{flex:1;min-width:0}
.pick-row .l b{display:block;font-weight:500;font-size:12.5px}
.pick-row .l code{font-size:10.5px;color:var(--fg-3)}
.search{display:flex;align-items:center;gap:9px;height:var(--ctl);padding:0 12px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface);color:var(--fg-3)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:12.5px;color:var(--fg)}

/* Toasts: the border is the countdown. */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:var(--s-2);align-items:flex-end;pointer-events:none}
.toast{position:relative;pointer-events:auto;display:flex;align-items:center;gap:var(--s-3);background:var(--surface);border-radius:var(--r-2);box-shadow:var(--shadow-2);padding:11px 11px 11px 15px;font-size:12.5px;max-width:min(420px,calc(100vw - 32px))}
.toast > .ic{color:var(--good-dot)}
.toast.info > .ic{color:var(--accent)}
.toast .msg{min-width:0;flex:1;line-height:1.45}
.toast .div{flex:none;width:1px;align-self:stretch;margin-block:3px;background:var(--border)}
.toast .undo{flex:none;display:inline-flex;align-items:center;gap:6px;height:var(--ctl-sm);padding:0 11px;border-radius:var(--r-1);font-size:12px;font-weight:500;color:var(--accent)}
.toast .undo:hover{background:var(--accent-soft)}
.toast-ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.toast-ring rect{x:.75px;y:.75px;width:calc(100% - 1.5px);height:calc(100% - 1.5px);rx:calc(var(--r-2) - .75px);fill:none;stroke-width:1.5}
.toast-ring .track{stroke:var(--border)}
.toast-ring .run{stroke:var(--good-dot);stroke-dasharray:100;stroke-dashoffset:0}
.toast.info .toast-ring .run{stroke:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:rise .16s ease-out}
  .toast-ring .run{animation:toast-run var(--life,2600ms) linear forwards}
  .toast.held .toast-ring .run{animation-play-state:paused}
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes toast-run{to{stroke-dashoffset:100}}

@media (max-width:860px){
  .railbar,.rail{position:fixed;top:0;bottom:0;z-index:52;transform:translateX(-100%);transition:transform .18s ease}
  .railbar{left:0}
  .rail{left:var(--railbar);box-shadow:var(--shadow-3);transform:translateX(calc(-100% - var(--railbar)))}
  .app.nav-open .railbar,.app.nav-open .rail{transform:translateX(0)}
  .app.nav-open .scrim-nav{display:block;position:fixed;inset:0;z-index:51;background:rgba(17,20,27,.28)}
  .burger{display:grid}
}
@media (max-width:640px){
  .wrap{padding:var(--s-5) var(--s-4) 80px}
  .kbar{min-width:0;width:var(--ctl);padding:0;justify-content:center}
  .kbar span,.kbar kbd{display:none}
  .crumbs .crumb-sec,.crumbs .crumb-sec + .sep{display:none}
  .page-head h1{font-size:22px}
  .panel-head .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ================= A, refined: controls and editing in the row ================= */
.menu{max-height:min(440px,70vh);overflow:auto}
.lab-reset{margin-left:auto;padding:3px 10px;border:1px solid var(--border-strong);border-radius:var(--r-1);background:var(--surface);font-size:11.5px;color:var(--fg-2)}
.lab-reset:hover{color:var(--fg)}
.lab-brief{border:1px dashed var(--border-strong);border-radius:var(--r-2);padding:var(--s-3) var(--s-4);margin-bottom:var(--s-5);display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px var(--s-3);font-size:12.5px;color:var(--fg-2);line-height:1.55}
.lab-brief b{color:var(--fg);font-weight:600}
.lab-brief .lab-k{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding-top:2px}

/* One line per row. No address: the kind tile says what it is, the Item fields say where. */
.mt-row{min-height:50px;padding-block:8px}
.mt-pick{flex:1;min-width:0;display:flex;align-items:center;gap:var(--s-2);text-align:left;border-radius:var(--r-1);padding:2px 0;cursor:pointer}
.mt-pick:focus-visible{outline:none}
.mt-item:has(> .mt-row .mt-pick:focus-visible) > .mt-row,
.mt-item:has(> .mt-row .rn-inp:focus) > .mt-row{box-shadow:inset 0 0 0 2px var(--accent)}
.mt-item.sel > .mt-row{background:var(--accent-soft)}
.mt-item.sel .mt-kind{background:var(--surface);border-color:var(--accent-line);color:var(--accent)}
.mt-item:hover > .mt-row{background:var(--surface-2)}
.mt-item.sel:hover > .mt-row{background:var(--accent-soft)}
.mt-t{align-items:center;flex-wrap:nowrap}
.mt-sub{flex:none;font-size:11.5px;color:var(--fg-3);white-space:nowrap}
.mt-item.editing > .mt-row{background:var(--surface-2);border-bottom:1px dashed var(--border)}

/* Row buttons, with names that show on hover and on keyboard focus. */
.rowctl{display:flex;gap:2px;flex:none;align-items:center}
.rowctl .sp{width:1px;height:18px;background:var(--border);margin:0 4px}

dialog.modal .modal-h + .modal-f{border-top:0}

/* The overflow trigger: vertical ellipsis, after Save, background only on hover and focus. */
.kebab{width:var(--ctl);height:var(--ctl);display:grid;place-items:center;border-radius:var(--r-1);color:var(--fg-2);background:transparent;border:0}
.kebab:hover,.kebab:focus-visible,.kebab[aria-expanded="true"]{background:var(--surface-3);color:var(--fg)}
.save-btn[disabled]{opacity:.5;cursor:default}

/* The last row's ground follows the panel's rounded corners. */
.mtree > .mt-item:last-child{border-radius:0 0 calc(var(--r-3) - 1px) calc(var(--r-3) - 1px)}
.mtree > .mt-item:last-child:not(.editing) > .mt-row{border-radius:0 0 calc(var(--r-3) - 1px) calc(var(--r-3) - 1px)}
.mtree > .mt-item:last-child.editing{border-bottom:0}

/* Icon and Image are buttons, sized to their words. */
.ed-pick{width:auto;align-self:flex-start}
/* A rename's consequences, said where the name is changed. */
.warn-note{display:flex;gap:var(--s-2);align-items:flex-start;margin-top:var(--s-2);padding:var(--s-3);border-radius:var(--r-1);background:var(--warn-soft);color:var(--warn);font-size:12px;line-height:1.5}
.warn-note > .ic{width:14px;height:14px;margin-top:2px;flex:none;color:var(--warn-dot)}
.warn-note > div{display:flex;flex-direction:column;gap:var(--s-2)}
.warn-note b{font-weight:600}
.warn-note code{font-size:11px}
.warn-note .check .tx b{color:var(--fg);font-weight:500}
.warn-note .check .tx span{color:var(--fg-2)}
.inp.bad{border-color:var(--danger-dot)}
.err{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--danger)}
.err .ic{width:12px;height:12px}

/* Link: the admin's existing picker, as on Redirects' To. */
.cbx{position:relative}
.cb-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);box-shadow:var(--shadow-2);padding:6px;max-height:300px;overflow:auto}
.cb-list li{display:flex;align-items:center;gap:var(--s-3);padding:9px 10px;border-radius:var(--r-1);font-size:13px;color:var(--fg);cursor:pointer}
.cb-list li .ic{color:var(--fg-3)}
.cb-list li .op-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-list li code{font-size:11px;color:var(--fg-3);flex:none;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-list li[aria-selected="true"],.cb-list li:hover{background:var(--surface-2)}
.cb-list .op-none{cursor:default;color:var(--fg-3);font-size:12px;line-height:1.5}
.cb-list .op-none:hover{background:transparent}
.lnk-set{display:flex;align-items:center;gap:var(--s-2);height:var(--ctl);padding:0 4px 0 12px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface);min-width:0}
.lnk-set .ic{color:var(--fg-3)}
.lnk-set b{font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;max-width:55%}
.lnk-set code{font-size:11px;color:var(--fg-3);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk-x{width:28px;height:28px;border-radius:var(--r-1);display:grid;place-items:center;color:var(--fg-3);flex:none}
.lnk-x:hover{background:var(--surface-3);color:var(--fg)}
.lnk-note{display:flex;align-items:center;gap:var(--s-2);padding:9px 12px;border-radius:var(--r-1);background:var(--surface-3);font-size:12px;color:var(--fg-2)}
.lnk-note .ic{width:14px;height:14px;color:var(--fg-3)}
.lnk-note b{color:var(--fg);font-weight:600}
/* Icon, once one is chosen */
.ico-set{display:flex;align-items:center;gap:var(--s-2);height:var(--ctl);padding:0 4px 0 6px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface);align-self:stretch}
.ico-prev{width:24px;height:24px;border-radius:var(--r-1);display:grid;place-items:center;background:var(--surface-2);color:var(--fg)}
.ico-set code{flex:1;font-size:12px;color:var(--fg-2)}
.ico-set .btn.sm{height:calc(var(--ctl) - 8px)}
.ico-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:var(--s-2);max-height:320px;overflow:auto}
.ico-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 9px;border:1px solid var(--border);border-radius:var(--r-1);font-size:11px;color:var(--fg-2)}
.ico-opt .ic{width:20px;height:20px;color:var(--fg)}
.ico-opt:hover{border-color:var(--border-strong);background:var(--surface-2)}
.ico-opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* Icon: a preview tile you press to change, its name, and quiet actions. */
.ico-pick{display:flex;align-items:center;gap:var(--s-2);min-height:var(--ctl)}
.ico-tile{width:var(--ctl);height:var(--ctl);flex:none;border-radius:var(--r-1);display:grid;place-items:center;border:1px dashed var(--border-strong);color:var(--fg-3);background:transparent;position:relative}
.ico-tile:hover{border-color:var(--fg-3);color:var(--fg)}
.ico-tile.set{border-style:solid;border-color:var(--border);background:var(--surface);color:var(--fg)}
.ico-tile.set .ic{width:18px;height:18px}
.ico-tile.set:hover{border-color:var(--accent);color:var(--accent)}
.ico-name{font-family:var(--font-mono);font-size:12px;color:var(--fg);margin:0 var(--s-1) 0 2px}
.ico-pick .btn-ghost.sm{padding:0 8px}

/* Rows: grip, disclosure and kind sit close; the disclosure column stays so
   titles at one level still line up. */
.mt-row{gap:var(--s-2)}
.mt-grip{width:16px}
.mt-ind{margin-left:calc(var(--s-2) * -1)}
.twist{width:16px;margin-right:calc(var(--s-1) - var(--s-2))}
.mtree{--lead:calc(var(--pad-x) - 8px + 16px + var(--s-2))}

/* Row buttons take their ground from the row: a translucent fill reads on
   white, on the gray hover and on the selected blue alike. Pressed (Edit open,
   menu open) is a stronger fill in the same ink, not the accent. */
.rb2:hover,.rb2:focus-visible{background:color-mix(in srgb, var(--fg) 8%, transparent);color:var(--fg)}
.rb2[aria-expanded="true"]{background:color-mix(in srgb, var(--fg) 12%, transparent);color:var(--fg)}
.mt-item.sel .rb2{color:var(--accent)}
.mt-item.sel .rb2[disabled]{color:var(--accent)}
.mt-item.sel .rb2:hover,.mt-item.sel .rb2:focus-visible{background:color-mix(in srgb, var(--accent) 14%, transparent);color:var(--accent)}
.mt-item.sel .rb2[aria-expanded="true"]{background:color-mix(in srgb, var(--accent) 22%, transparent);color:var(--accent)}
.kebab[aria-expanded="true"]{background:color-mix(in srgb, var(--fg) 10%, transparent)}
.kebab:hover,.kebab:focus-visible{background:color-mix(in srgb, var(--fg) 8%, transparent)}
.loc-text{font-size:12.5px;color:var(--fg-2)}

/* One line per row, always. The row's buttons never wrap; the title area
   measures itself and gives way: first the sub-items count, then the pills,
   then the title truncates with an ellipsis. */
@media (max-width:640px){
  .mt-row{flex-wrap:nowrap}
  .mt-row > .rowctl{flex-basis:auto;justify-content:flex-start;margin-left:0}
  .rowctl .rb2{width:28px;height:28px}
  .rowctl .sp{margin:0 2px}
}
.mt-pick{container-type:inline-size;container-name:rowtitle}
.mt-main,.mt-t{min-width:0}
.mt-t .tt{min-width:0;flex:0 1 auto}
@container rowtitle (max-width: 240px){ .mt-sub{display:none} }
@container rowtitle (max-width: 170px){ .mt-t .pill{display:none} }

/* Narrow screens: the grip goes (dragging is a pointer gesture; the arrows do
   the same job by touch), buttons tighten, and the title keeps a floor. */
@media (max-width:640px){
  .mt-row{padding-right:10px;gap:6px}
  .mt-grip{display:none}
  .mt-ind{margin-left:-6px}
  .mtree{--indent:14px}
  .rowctl{gap:0}
  .rowctl .rb2{width:27px;height:30px}
  .rowctl .sp{margin:0 1px}
  .mt-pick{min-width:64px}
  .ph-ref .ph-main{flex-basis:100%}
  .ph-ref .acts{width:100%;justify-content:flex-end}
}
@container rowtitle (max-width: 120px){ .mt-kind{display:none} }
@media (max-width:640px){ .mtree{--indent:12px} .mt-pick{min-width:44px} }

/* Plain-text items show their label as written, like any other item. */
.mt-t .tt.heading{text-transform:none;letter-spacing:var(--title-track);font-family:var(--font-title);font-size:var(--title-size);font-weight:var(--title-weight);color:var(--fg)}
</style>
</head>

<script>
/* Menus admin. The list of menus with the active theme's locations, and each
   menu's screen in the settled design: the Roles frame, a meta line, Settings
   in a dialog, and an item tree whose rows carry their own moves and open their
   fields underneath. Invented data; nothing leaves the page. */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = (n, cls="") => '<svg class="ic '+cls+'" aria-hidden="true"><use href="#'+n+'"/></svg>';
const plural = (n, one, many) => n + " " + (n === 1 ? one : (many || one + "s"));

/* Link kinds are a registry (D-019): each kind names itself and draws its own
   Link control. A plugin adds a kind by adding an entry. */
const KINDS = {
  entry:      { label:"Entry",      icon:"i-page",    desc:"A page or any other entry" },
  term:       { label:"Term",       icon:"i-tag",     desc:"A topic or a tag" },
  collection: { label:"Collection", icon:"i-folder",  desc:"Everything of one type, at its index page" },
  route:      { label:"Route",      icon:"i-route",   desc:"A named address, such as the archive" },
  url:        { label:"URL",        icon:"i-globe",   desc:"Any address, here or on another site" },
  none:       { label:"Plain Text", icon:"i-plaintext", desc:"No link. Shown as text, often over its sub-items" },
  link:       { label:"Link",       icon:"i-link",    desc:"Not chosen yet" }
};
const ENTRIES = [
  { t:"About", path:"page/about" }, { t:"Masthead", path:"page/about/masthead" }, { t:"Contact", path:"page/contact" },
  { t:"Colophon", path:"page/colophon" }, { t:"Privacy", path:"page/privacy" }, { t:"Press Kit", path:"page/press-kit" },
  { t:"Site Map", path:"page/site-map" }, { t:"What I'm Doing Now", path:"page/now" }, { t:"Style Guide", path:"page/style-guide", off:"Draft" }
];
const TERMS = [
  { t:"Tables", path:"topic/tables" }, { t:"Typography", path:"topic/typography" }, { t:"Layout", path:"topic/layout" },
  { t:"Accessibility", path:"topic/accessibility", off:"Draft" }, { t:"Color", path:"topic/color" }
];
const COLLECTIONS = [ { t:"Posts", path:"type:post" }, { t:"Topics", path:"type:topic" }, { t:"Releases", path:"type:release" } ];
const ROUTES = [ { t:"Archive", path:"route:archive" }, { t:"Feed", path:"route:feed" }, { t:"Search", path:"route:search" } ];

/* ---------------------------------------------------------------- data */
let uid = 1;
const it = (o, kids) => Object.assign({ id:"n"+(uid++), label:"", open:true, children:kids||[], f:{} }, o);
const E = (t, path, kids, extra) => it(Object.assign({ kind:"entry", derived:t, path }, extra||{}), kids);
const H = (t, kids) => it({ kind:"none", label:t, path:"" }, kids);
const U = (label, url, extra) => it(Object.assign({ kind:"url", derived:url.replace(/^https?:\/\//,"").split("/")[0], label, path:url }, extra||{}));
function seed(){
  const P = (t, slug, kids, x) => E(t, "page/handbook/"+slug, kids, x);
  return [
    { name:"footer", label:"Footer", entries:[], tree:[ E("About","page/about"), E("Colophon","page/colophon"), E("Contact","page/contact"),
        E("Privacy","page/privacy"), it({ kind:"route", derived:"Feed", path:"route:feed" }), U("GitHub","https://github.com/meridian-review") ] },
    { name:"handbook", label:"Handbook Sidebar", entries:[], tree:[
      H("Getting Started", [ P("Installation","installation"), P("Requirements","requirements"),
        P("Configuration","configuration",[ P("Environment Files","environment"), P("Databases","databases"), P("Caching","caching") ]), P("Your First Site","first-site") ]),
      H("Content", [ P("Entries","entries"), P("Content Types","content-types"), P("Fields","fields"), P("Relationships","relationships"),
        P("Media","media",[ P("Uploads","uploads"), P("Image Sizes","image-sizes") ]), P("Menus","menus"), P("Redirects","redirects") ]),
      H("Templates", [ P("How Templates Work","templates"), P("Template Tags","template-tags"), P("Partials","partials"), P("Pagination","pagination") ]),
      H("Themes", [ P("Theme Structure","theme-structure"), P("theme.json","theme-json"), P("Menu Locations","menu-locations"), P("Admin Themes","admin-themes") ]),
      H("Plugins", [ P("Writing a Plugin","writing-a-plugin"), P("Hooks","hooks"), P("Link Kinds","link-kinds", null, { off:"Draft" }),
        P("Settings Screens","settings-screens"), P("Capabilities","plugin-capabilities") ]),
      H("Reference", [ P("CLI","cli",[ P("content:terms","cli-content-terms"), P("menu:refs","cli-menu-refs"), P("site:health","cli-site-health") ]),
        P("Config Keys","config-keys"), P("Capabilities","capabilities"), P("Directives","directives"), P("Glossary","glossary") ]),
      it({ kind:"collection", derived:"Releases", label:"Changelog", path:"type:release" }) ] },
    { name:"main", label:"Main Navigation", entries:[{ t:"Site Map", a:"/site-map" }], tree:[
      it({ kind:"collection", derived:"Posts", label:"Writing", path:"type:post" }),
      it({ kind:"route", derived:"Archive", path:"route:archive" }),
      it({ kind:"collection", derived:"Topics", path:"type:topic" }, [
        it({ kind:"term", derived:"Tables", path:"topic/tables" }), it({ kind:"term", derived:"Typography", path:"topic/typography" }),
        it({ kind:"term", derived:"Accessibility", path:"topic/accessibility", off:"Draft" }) ]),
      E("About", "page/about", [ E("Masthead", "page/about/masthead"), E("Contact", "page/contact"), E("Press", "page/press", null, { off:"Trash" }) ]),
      E("What I'm Doing Now", "page/now", null, { label:"Now" }),
      it({ kind:"route", derived:"Feed", path:"route:feed", f:{ button:true } }) ] },
    { name:"social", label:"Social", entries:[{ t:"Contact", a:"/contact" }], tree:[
      U("Mastodon","https://mastodon.social/@meridian", { rel:"me", f:{ network:"Mastodon" } }),
      U("Bluesky","https://bsky.app/profile/meridianreview.org", { f:{ network:"Bluesky" } }),
      U("GitHub","https://github.com/meridian-review", { rel:"me", f:{ network:"GitHub" } }) ] }
  ];
}
/* The active theme declares its locations. Assignments live with the theme. */
const THEME = { name:"Madder", locations:[
  { key:"primary", name:"Header Navigation", depth:"Up to 2 levels", defaults:5,
    fields:[{ key:"button", type:"check", label:"Show as a Button", hint:"Madder draws this item as a button at the end of the bar." }] },
  { key:"footer", name:"Footer Links", depth:"One level", defaults:4, fields:[] },
  { key:"social", name:"Social Links", depth:"One level", defaults:0,

const S = { view:"list", list:null, menus:seed(), assign:seedAssign(), sel:{}, open:null, ed:"expand", btn:"hover", renaming:null,

/* ---------------------------------------------------------------- tree ops */
function flat(list=T(), d=0, parent=null, out=[]){ list.forEach((n,i) => { out.push({ n, d, parent, list, i }); flat(n.children, d+1, n, out); }); return out; }
function visible(){ const out = []; (function w(list, d, parent){ list.forEach((n,i) => { out.push({ n, d, parent, list, i }); if (n.open) w(n.children, d+1, n); }); })(T(), 0, null); return out; }
const find = id => flat().find(x => x.n.id === id);
const shown = n => n.label || n.derived || "Untitled";
const selId = () => S.sel[S.list];
const inside = (id, other) => flat([find(id).n]).some(y => y.n.id === other);
function ensureSel(){ if (!T().length){ S.sel[S.list] = null; return; } if (!selId() || !find(selId())) S.sel[S.list] = (flat().find(x => x.n.kind !== "none") || flat()[0]).n.id; }
function can(id, a){ const x = find(id); if (!x) return false; return a === "up" || a === "in" ? x.i > 0 : a === "down" ? x.i < x.list.length-1 : a === "out" ? !!x.parent : false; }
function move(id, a){
  if (!can(id, a)) return false;
  const { n, list, i, parent } = find(id);
  if (a === "up"){ list.splice(i,1); list.splice(i-1,0,n); }
  else if (a === "down"){ list.splice(i,1); list.splice(i+1,0,n); }
  else if (a === "in"){ const p = list[i-1]; list.splice(i,1); p.children.push(n); p.open = true; }
  else { const pp = find(parent.id); list.splice(i,1); pp.list.splice(pp.i+1,0,n); }
  markDirty(); return true;
}
function moveTo(id, targetId, pos){
  const x = find(id); x.list.splice(x.i, 1);
  const t = find(targetId);
  if (pos === "first"){ t.n.children.unshift(x.n); t.n.open = true; } else t.list.splice(t.i + (pos === "after" ? 1 : 0), 0, x.n);
  markDirty();
}
const where = id => { const x = find(id); return "level " + (x.d+1) + ", " + (x.i+1) + " of " + x.list.length + (x.parent ? " inside " + shown(x.parent) : " at the top"); };
function announce(m){ $("#live").textContent = ""; requestAnimationFrame(() => $("#live").textContent = m); }
function markDirty(){ const was = S.dirty; S.dirty = true; if (!was && typeof updateSave === "function") updateSave(); }
const LBL = { up:n => "Move " + n + " up", down:n => "Move " + n + " down", out:n => "Outdent " + n, in:n => "Indent " + n };
const TIP = { up:"Move Up ⌥↑", down:"Move Down ⌥↓", out:"Outdent ⌥←", in:"Indent ⌥→" };
const ICO = { up:"i-arr-up", down:"i-arr-dn", out:"i-outdent", in:"i-indent" };
const SAID = { up:"Moved up", down:"Moved down", in:"Indented", out:"Outdented" };
const snapTree = t => JSON.stringify(t);

let openMenuEl = null, openTrigger = null;
function openMenu(trigger, entries, opts={}){
  if (openMenuEl && openTrigger === trigger){ closeMenu(true); return; }
  closeMenu();
  const m = document.createElement("div"); m.className = "menu" + (opts.wide ? " wide" : ""); m.setAttribute("role", "menu");
  m.innerHTML = entries.map((e,i) => e.div ? '<div class="div" role="separator"></div>' : e.sec ? '<div class="sec">'+esc(e.sec)+'</div>' :
    '<button type="button" role="'+(e.checked!==undefined?"menuitemradio":"menuitem")+'" data-i="'+i+'"'+(e.checked!==undefined?' aria-checked="'+e.checked+'"':'')+(e.danger?' class="danger"':'')+'>'+
    (e.icon?icon(e.icon):'')+'<span class="l">'+esc(e.label)+(e.desc?'<span class="ds">'+esc(e.desc)+'</span>':'')+'</span>'+(e.tail?'<span class="tail">'+esc(e.tail)+'</span>':'')+'</button>').join("");
  document.body.appendChild(m);
  const r = trigger.getBoundingClientRect();
  m.style.minWidth = Math.max(212, Math.min(r.width, 320)) + "px";
  const mh = m.offsetHeight, mw = m.offsetWidth;
  let top = r.bottom + 6; if (top + mh > innerHeight - 8 && r.top - mh - 6 > 8) top = r.top - mh - 6;
  m.style.top = Math.max(8, Math.min(top, innerHeight - mh - 8)) + "px";
  m.style.left = Math.max(8, Math.min(opts.alignLeft ? r.left : r.right - mw, innerWidth - mw - 8)) + "px";
  m.addEventListener("click", ev => { const b = ev.target.closest("button[data-i]"); if (!b) return; const e = entries[+b.dataset.i]; closeMenu(true); e.run && e.run(); });
  m.addEventListener("keydown", ev => { const items = $$("button", m), i = items.indexOf(document.activeElement);
    if (ev.key === "ArrowDown"){ ev.preventDefault(); items[(i+1) % items.length].focus(); }
    if (ev.key === "ArrowUp"){ ev.preventDefault(); items[(i-1+items.length) % items.length].focus(); }
    if (ev.key === "Tab") closeMenu(true); });
  openMenuEl = m; openTrigger = trigger; trigger.setAttribute("aria-expanded", "true");
  (m.querySelector('[aria-checked="true"]') || m.querySelector("button")).focus();
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && openMenuEl){ e.stopPropagation(); e.preventDefault(); closeMenu(true); } }, true);
function closeMenu(refocus){
  if (!openMenuEl) return; openMenuEl.remove(); openMenuEl = null;
  if (openTrigger){ openTrigger.setAttribute("aria-expanded", "false"); if (refocus && document.contains(openTrigger)) openTrigger.focus(); }
  openTrigger = null;
}
document.addEventListener("pointerdown", e => { if (openMenuEl && !openMenuEl.contains(e.target) && !openTrigger?.contains(e.target)) closeMenu(); });
function toast(msg, o={}){
  const host = $("#toasts"), life = o.undo ? 7000 : 2600;
  if (!o.undo) $$(".toast:not(.has-undo)", host).forEach(t => t.remove());
  while (host.children.length >= 3) host.firstElementChild.remove();
  const t = document.createElement("div"); t.className = "toast " + (o.kind || "good") + (o.undo ? " has-undo" : ""); t.style.setProperty("--life", life + "ms");
  t.innerHTML = '<svg class="toast-ring" aria-hidden="true"><rect class="track" pathLength="100"/><rect class="run" pathLength="100"/></svg>' +
    icon(o.kind === "info" ? "i-info" : "i-check-circle") + '<span class="msg">'+esc(msg)+'</span>' + (o.undo ? '<span class="div"></span><button class="undo" type="button">'+icon("i-undo")+'Undo</button>' : '');
  host.appendChild(t); announce(msg);
  let left = life, start = Date.now(), timer = null, holds = 0;
  const run = () => { start = Date.now(); timer = setTimeout(() => t.remove(), left); };
  const hold = () => { if (holds++ === 0){ clearTimeout(timer); left -= Date.now() - start; t.classList.add("held"); } };
  const free = () => { if (--holds === 0){ t.classList.remove("held"); run(); } };
  t.addEventListener("pointerenter", hold); t.addEventListener("pointerleave", free); t.addEventListener("focusin", hold); t.addEventListener("focusout", free);
  if (o.undo) $(".undo", t).addEventListener("click", () => { o.undo(); t.remove(); });
  run();
}

/* ---------------------------------------------------------------- page */
/* The page frame follows the running admin's detail screens (Roles): a back
   link above the title, a meta line under it, actions at the right. What
   varies is how the menu's own settings (label, name, directive, locations)

function chips(n){ if (n.kind === "none" && !n.label) return '<span class="pill neutral"><span class="d"></span>Empty</span>'; return n.off ? '<span class="pill '+(n.off==="Draft"?"warn":"danger")+'"><span class="d"></span>'+(n.off==="Draft"?"Draft":"Not on the Site")+'</span>' : ''; }
function kindTile(n){ const k = KINDS[n.kind]; return '<span class="mt-kind" title="'+k.label+'">'+icon(k.icon)+'<span class="sr">'+k.label+'</span></span>'; }
function subs(n){ return n.children.length && !n.open ? '<span class="mt-sub">'+plural(flat(n.children).length, "sub-item")+'</span>' : ''; }
function titleBits(n){
  return '<span class="mt-t"><span class="tt'+(n.kind==="none"?" heading":"")+'">'+esc(shown(n))+'</span>' + chips(n) + '</span>';
}
function rb(attr, ic, tip, label, dis, extra, tab){ return '<button class="rb2" type="button" '+(tab?'':'tabindex="-1" ')+attr+' data-tip="'+esc(tip)+'" aria-label="'+esc(label)+'"'+(dis?' disabled':'')+(extra||'')+'>'+icon(ic)+'</button>'; }
function controls(n){
  const name = shown(n), open = S.open === n.id, tab = selId() === n.id || open;
  return '<span class="rowctl">' + ["up","down","out","in"].map(a => rb('data-act="'+a+'"', ICO[a], TIP[a], LBL[a](name), !can(n.id,a), '', tab)).join("") +
    '<span class="sp" aria-hidden="true"></span>' +
    (S.ed === "every" ? rb('data-edit', "i-chev-ud", open ? "Fewer Fields" : "More Fields", (open ? "Hide" : "Show") + " more fields for " + name, false, ' aria-expanded="'+open+'" aria-controls="ed-'+n.id+'"', tab)
                      : rb('data-edit', "i-pencil", open ? "Close" : "Edit F2", "Edit " + name, false, ' aria-expanded="'+open+'" aria-controls="ed-'+n.id+'"', tab)) +
    rb('data-more aria-haspopup="menu" aria-expanded="false"', "i-dots-v", "More Actions", "More actions for " + name, false, '', tab) + '</span>';
}
function twist(n){
  return n.children.length ? '<button class="twist" type="button" data-twist tabindex="-1" aria-expanded="'+n.open+'" aria-label="'+(n.open?"Hide":"Show")+' sub-items of '+esc(shown(n))+'">'+icon("i-chev-r")+'</button>' : '<span class="twist leaf"></span>';
}
function row(x){

    middle = kindTile(n) + '<span class="ev"><span class="ev-lab"><input class="ev-inp'+(n.kind==="none"?" heading":"")+'" data-lab value="'+esc(n.label)+'" placeholder="'+esc(n.kind==="none" ? "Heading label" : n.derived)+'" aria-label="Label for '+name+', '+esc(where(n.id))+'">'+chips(n)+'</span>'+linkBtn+'</span>' + subs(n);
  } else if (S.ed === "rename" && S.renaming === n.id){
    middle = kindTile(n) + '<input class="rn-inp" data-rn value="'+esc(n.label)+'" placeholder="'+esc(n.derived || "Heading label")+'" aria-label="Label for '+name+'">'+chips(n)+'<span class="rn-hint">Enter saves · Esc cancels</span>';
  } else {

      '<span class="sr">, '+esc(where(n.id))+(S.ed==="rename"?". Press Enter to rename.":"")+'</span></button>';
  }
  return '<li class="mt-item'+(sel?" sel":"")+(open?" editing":"")+'" data-id="'+n.id+'"><div class="mt-row" draggable="'+(S.renaming!==n.id)+'" style="--d:'+d+'">' +
    '<span class="mt-grip" aria-hidden="true">'+icon("i-grip")+'</span><span class="mt-ind"></span>' + twist(n) + middle +

function select(id, focus){
  if (S.open && S.open !== id && S.ed !== "every") S.open = null;
  S.sel[S.list] = id; renderTree(); if (focus) focusRow(id, focus);
}
function focusRow(id, what){
  const li = $('#tree [data-id="'+id+'"]'); if (!li) return;
  let el = what && what !== true ? (li.querySelector(":scope > .mt-row " + what + ":not([disabled])") ||
    (what.startsWith("[data-act") ? li.querySelector(":scope > .mt-row [data-act]:not([disabled])") : null)) : null;
  el = el || li.querySelector(":scope > .mt-row [data-pick], :scope > .mt-row [data-lab], :scope > .mt-row [data-rn]");
  el && el.focus({ preventScroll:true }); li.scrollIntoView({ block:"nearest" });
}
function act(id, a, refocus){
  if (!move(id, a)){ announce("Can't do that from here"); return; }
  announce(SAID[a] + ". " + shown(find(id).n) + " is " + where(id) + "."); renderTree(); if (refocus) focusRow(id, refocus);
}
function removeItem(id){
  const x = find(id), total = flat([x.n]).length;
  x.list.splice(x.i, 1); markDirty(); if (S.open === id) S.open = null;
  const next = x.list[x.i] || x.list[x.i-1] || x.parent; S.sel[S.list] = next ? next.id : null; ensureSel();
  render(); focusRow(selId(), true);
  toast("Removed " + shown(x.n) + (total > 1 ? " and its " + plural(total-1, "sub-item") : ""), { undo:() => { x.list.splice(x.i, 0, x.n); render(); select(x.n.id, true); } });
}
function duplicate(id){
  const x = find(id), copy = JSON.parse(JSON.stringify(x.n));
  (function re(n){ n.id = "n" + (uid++); n.children.forEach(re); })(copy);
  copy.label = shown(x.n) + " (Copy)"; x.list.splice(x.i+1, 0, copy); markDirty(); render(); select(copy.id, true);
  toast("Duplicated " + shown(x.n), { undo:() => { const y = find(copy.id); y.list.splice(y.i, 1); render(); select(id, true); } });
}
function openFields(id){
  S.open = id; S.sel[S.list] = id; renderTree();
  const f = $("#el-" + id); if (f){ f.focus(); f.select(); } $('#tree [data-id="'+id+'"]').scrollIntoView({ block:"nearest" });
  announce("Editing " + shown(find(id).n));
}
function setLabel(n, v){
  n.label = v; markDirty();
  const row = $('#tree [data-id="'+n.id+'"] > .mt-row'); if (!row) return;
  const t = $(".tt", row); if (t) t.textContent = shown(n);
  const p = $(".mt-t .pill", row), want = chips(n);
  if (p && !want) p.remove(); else if (!p && want) $(".mt-t", row).insertAdjacentHTML("beforeend", want);
}
function startRename(id){ S.renaming = id; S.renameWas = find(id).n.label; renderTree(); const i = $('#tree [data-rn]'); i.focus(); i.select(); }
function endRename(keep){
  const id = S.renaming; if (!id) return; const n = find(id).n;
  if (!keep) n.label = S.renameWas; else markDirty();
  S.renaming = null; renderTree(); focusRow(id, true);
  announce(keep ? "Renamed to " + shown(n) : "Kept " + shown(n));
}

function bindTree(){
  const tree = $("#tree");
  tree.onclick = e => {
    const li = e.target.closest(".mt-item"); if (!li) return;
    const id = li.dataset.id, n = find(id).n;
    const hit = s => e.target.closest(s);
    if (hit("[data-twist]")){
      n.open = !n.open;
      if (!n.open && selId() !== id && inside(id, selId())){ S.sel[S.list] = id; if (S.open && inside(id, S.open)) S.open = null; }
      renderTree(); focusRow(selId(), true); return;
    }
    if (hit("[data-act]")) return act(id, hit("[data-act]").dataset.act, '[data-act="'+hit("[data-act]").dataset.act+'"]');
    if (hit("[data-edit]")){
      S.open = S.open === id ? null : id; S.sel[S.list] = id; renderTree();
      if (S.open){ const f = $('#el-'+id) || $('#ed-'+id+' input, #ed-'+id+' textarea'); f && f.focus(); li.scrollIntoView({ block:"nearest" }); announce((S.ed==="every"?"More fields for ":"Editing ") + shown(n)); }
      else focusRow(id, "[data-edit]");
      return;
    }
    if (hit("[data-done]")){ S.open = null; renderTree(); focusRow(id, "[data-edit]"); return; }
    if (hit("[data-more]")){ if (selId() !== id) select(id);
      return openMenu($('#tree [data-id="'+id+'"] > .mt-row [data-more]'), [
        ...(S.ed === "rename" ? [{ label:"Rename", icon:"i-pencil", tail:"Enter", run:()=>startRename(id) }] : []),
        { label:"Add Item Above", icon:"i-arr-up", run:()=>addItem("above", id) }, { label:"Add Item Below", icon:"i-arr-dn", run:()=>addItem("below", id) }, { div:true },
        { label:"Duplicate", icon:"i-copy", run:()=>duplicate(id) }, { div:true }, { label:"Remove", icon:"i-trash", danger:true, run:()=>removeItem(id) } ]); }
    if (hit("[data-pickref]")) return pickLink(id);
    if (hit("[data-lfsel]")){ const b = hit("[data-lfsel]"); return pickFieldOption(id, b.dataset.lfsel, b); }
    if (hit(".mt-edit") || hit("[data-lab]") || hit("[data-rn]")) { if (selId() !== id && hit("[data-lab]")){ S.sel[S.list] = id; $$(".mt-item.sel", tree).forEach(x => x.classList.remove("sel")); li.classList.add("sel"); } return; }
    if (selId() !== id) select(id, true); else focusRow(id, true);
  };
  tree.ondblclick = e => { const li = e.target.closest(".mt-item"); if (li && e.target.closest("[data-pick]")) openFields(li.dataset.id); };
  tree.oninput = e => {
    const li = e.target.closest(".mt-item"); if (!li) return; const n = find(li.dataset.id).n;
    if (e.target.matches("[data-lab],[data-elab]")) setLabel(n, e.target.value);
    if (e.target.matches("[data-rn]")) n.label = e.target.value;
  };
  tree.onfocusin = e => {
    const li = e.target.closest(".mt-item"); if (!li || S.ed !== "every" || !e.target.matches("[data-lab]")) return;
    if (selId() !== li.dataset.id){ S.sel[S.list] = li.dataset.id; $$(".mt-item.sel", tree).forEach(x => x.classList.remove("sel")); li.classList.add("sel");
      $$(".rb2", tree).forEach(b => b.setAttribute("tabindex", b.closest(".mt-item") === li ? "0" : "-1")); }
  };
  tree.onkeydown = e => {
    const li = e.target.closest(".mt-item"); if (!li) return;
    const id = li.dataset.id, vis = visible(), idx = vis.findIndex(v => v.n.id === id), cur = vis[idx];
    if (e.target.matches("[data-rn]")){
      if (e.key === "Enter"){ e.preventDefault(); endRename(true); }
      if (e.key === "Escape"){ e.preventDefault(); endRename(false); }
      return;
    }
    if (e.key === "Escape" && S.open === id && e.target.closest(".mt-edit")){ e.preventDefault(); S.open = null; renderTree(); focusRow(id, "[data-edit]"); return; }
    if (e.target.closest(".mt-edit")) return;
    const moveKeys = { ArrowUp:"up", ArrowDown:"down", ArrowRight:"in", ArrowLeft:"out" };
    if (e.altKey && moveKeys[e.key]){ e.preventDefault(); act(id, moveKeys[e.key], e.target.matches("[data-act]") ? '[data-act="'+e.target.dataset.act+'"]' : true); return; }
    const isRow = e.target.matches("[data-pick]"), isLab = e.target.matches("[data-lab]");
    if (!isRow && !isLab) return;
    const to = j => { e.preventDefault(); select(vis[j].n.id, true); };
    if (e.key === "ArrowDown" && idx < vis.length-1) to(idx+1);
    else if (e.key === "ArrowUp" && idx > 0) to(idx-1);
    else if (isRow && e.key === "Home") to(0);
    else if (isRow && e.key === "End") to(vis.length-1);
    else if (isRow && e.key === "ArrowRight" && cur.n.children.length){ e.preventDefault(); if (!cur.n.open){ cur.n.open = true; renderTree(); focusRow(id, true); } else to(idx+1); }
    else if (isRow && e.key === "ArrowLeft"){ e.preventDefault(); if (cur.n.children.length && cur.n.open){ cur.n.open = false; renderTree(); focusRow(id, true); } else if (cur.parent) select(cur.parent.id, true); }
    else if (isRow && e.key === "F2"){ e.preventDefault(); openFields(id); }
  };
  let dragId = null;
  $$(".mt-item", tree).forEach(li => {
    const r = $(":scope > .mt-row", li);
    r.addEventListener("dragstart", e => { if (e.target.closest("input,textarea")) { e.preventDefault(); return; } dragId = li.dataset.id; li.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId); });
    r.addEventListener("dragend", () => { $$(".mt-item", tree).forEach(x => x.classList.remove("dragging","drop-before","drop-after","drop-in")); dragId = null; });
    r.addEventListener("dragover", e => {
      if (!dragId || dragId === li.dataset.id || inside(dragId, li.dataset.id)) return; e.preventDefault();
      const b = r.getBoundingClientRect(), y = (e.clientY - b.top) / b.height, pos = y < .3 ? "before" : y > .7 ? "after" : "in";
      $$(".mt-item", tree).forEach(x => x.classList.remove("drop-before","drop-after","drop-in"));
      li.classList.add("drop-" + pos); li.style.setProperty("--dd", find(li.dataset.id).d + (pos === "in" ? 1 : 0)); li.dataset.pos = pos;
    });
    r.addEventListener("drop", e => { e.preventDefault(); const pos = li.dataset.pos; if (!dragId || !pos) return; const id = dragId; dragId = null;
      moveTo(id, li.dataset.id, pos === "in" ? "first" : pos); select(id, true); announce("Moved " + shown(find(id).n) + ", " + where(id)); });
  });
}

/* ---------------------------------------------------------------- shell */

}
