<!doctype html>
<html lang="en" data-admin-theme="neutral">
<!--
  Blush admin — Config › Extensions
  Three screens that share one shell: Themes, Plugins and Icon Packs, each with
  a list and a detail screen. Click anything in the Config panel to move.

  To see the other theme states, change the two attributes above:
    data-admin-theme="neutral" | "editorial"
    data-color-scheme="light" | "dark"        (omit to follow the OS)

  Source map:
    <style>   1 tokens · 2 base · 3 shell · 4 controls · 5 theme card
              6 theme preview · 7 extension row · 8 icon pack · 9 detail
              10 overlays · 11 narrow widths
    <body>    icon sprite · shell · screen mount · overlays
    <script>  data (themes, plugins, packs) · shared parts · themes ·
              plugins · icon packs · router · actions · installing · menu · wiring

  The uploader is simulated. Which state you get is read off the file you pick:
    anything.zip                      installs
    quill.zip / weather.zip …         already installed — offers to replace
    shop.zip on the Themes screen     wrong kind — offers the right screen
    anything-broken.zip               unpacks with no manifest
    anything.png                      refused before anything is sent
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extensions — Blush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Fira+Code:wght@400;500&family=Karla:wght@400;500;600&family=Newsreader:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* == 1. TOKENS ==============================================================
   Copy of design/tokens.css. Component CSS below reads tokens only — the sole
   literal colors are a site theme's own declared values, applied as inline
   custom properties on a preview (see §6).
   ========================================================================= */
:root {
  --bg:#f5f6f9; --surface:#ffffff; --surface-2:#f0f2f6; --surface-3:#e7eaf0;
  --border:#e2e5ec; --border-strong:#ccd2dd;
  --fg:#11141b; --fg-2:#535b6b; --fg-3:#858d9d;
  --accent:#2f5fe0; --accent-hover:#2650c4; --accent-fg:#ffffff;
  --accent-soft:#e9effc; --accent-line:#bdcdf7;
  --good:#136b43; --good-soft:#e2f3e9; --good-dot:#1f9d5f;
  --warn:#8a5806; --warn-soft:#faf0d9; --warn-dot:#cf8d16;
  --danger:#a92420; --danger-soft:#fbeae9; --danger-dot:#d6403a;
  --shadow-1:none;
  --shadow-2:0 2px 8px rgba(17,20,27,.05), 0 1px 2px rgba(17,20,27,.04);
  --shadow-3:0 10px 28px rgba(17,20,27,.09), 0 2px 6px rgba(17,20,27,.05);
  --r-1:6px; --r-2:10px; --r-3:16px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:18px; --s-5:26px; --s-6:36px; --s-7:52px;
  --font-ui:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-title:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono:"Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --base:13px; --h1:26px; --h1-track:-.024em;
  --title-size:13.5px; --title-weight:500; --title-track:-.005em;
  --pad-row:14px; --pad-panel:17px; --pad-x:22px;
  --ctl:34px; --ctl-sm:30px; --stat-v:30px;
  --railbar:74px; --rail:262px; --bar:62px; --work-max:1400px; --measure:72ch;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-color-scheme="light"]) {
  --bg:#0b0d12; --surface:#13161d; --surface-2:#1a1e27; --surface-3:#222733;
  --border:#242936; --border-strong:#353c4c;
  --fg:#e9ebf0; --fg-2:#a3abba; --fg-3:#747d8e;
  --accent:#7295f7; --accent-hover:#8aa8f9; --accent-fg:#0b0d12;
  --accent-soft:#182444; --accent-line:#2c3d68;
  --good:#5ecb92; --good-soft:#102a1e; --good-dot:#35b877;
  --warn:#e3b360; --warn-soft:#2b2312; --warn-dot:#d69f3c;
  --danger:#f28d84; --danger-soft:#301917; --danger-dot:#e0655c;
  --shadow-1:none; --shadow-2:0 2px 8px rgba(0,0,0,.3);
  --shadow-3:0 10px 28px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  color-scheme: dark;
} }
:root[data-color-scheme="dark"] {
  --bg:#0b0d12; --surface:#13161d; --surface-2:#1a1e27; --surface-3:#222733;
  --border:#242936; --border-strong:#353c4c;
  --fg:#e9ebf0; --fg-2:#a3abba; --fg-3:#747d8e;
  --accent:#7295f7; --accent-hover:#8aa8f9; --accent-fg:#0b0d12;
  --accent-soft:#182444; --accent-line:#2c3d68;
  --good:#5ecb92; --good-soft:#102a1e; --good-dot:#35b877;
  --warn:#e3b360; --warn-soft:#2b2312; --warn-dot:#d69f3c;
  --danger:#f28d84; --danger-soft:#301917; --danger-dot:#e0655c;
  --shadow-1:none; --shadow-2:0 2px 8px rgba(0,0,0,.3);
  --shadow-3:0 10px 28px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  color-scheme: dark;
}
:root[data-admin-theme="editorial"] {
  --bg:#f6f2ec; --surface:#fffdfa; --surface-2:#f1ece3; --surface-3:#e7e0d4;
  --border:#e5ded2; --border-strong:#cdc3b3;
  --fg:#23201b; --fg-2:#5d564c; --fg-3:#8e867a;
  --accent:#17595e; --accent-hover:#124a4e; --accent-fg:#fffdfa;
  --accent-soft:#e2eded; --accent-line:#b6d3d5;
  --good:#4c6d2c; --good-soft:#edf1e2; --good-dot:#6f9b45;
  --warn:#8a5a14; --warn-soft:#f8eeda; --warn-dot:#c58a2a;
  --danger:#9c3327; --danger-soft:#f8e7e2; --danger-dot:#c2503f;
  --shadow-1:none;
  --shadow-2:0 2px 8px rgba(60,48,32,.05), 0 1px 2px rgba(60,48,32,.04);
  --shadow-3:0 10px 28px rgba(60,48,32,.09), 0 2px 6px rgba(60,48,32,.05);
  --r-1:8px; --r-2:12px; --r-3:20px;
  --font-ui:"Karla", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display:"Newsreader", ui-serif, Georgia, "Times New Roman", serif;
  --font-title:"Newsreader", ui-serif, Georgia, "Times New Roman", serif;
  --base:13.5px; --h1:32px; --h1-track:-.014em;
  --title-size:15.5px; --title-weight:500; --title-track:0;
  --pad-row:16px; --pad-panel:19px; --pad-x:26px; --stat-v:34px;
}
@media (prefers-color-scheme: dark) { :root:not([data-color-scheme="light"])[data-admin-theme="editorial"] {
  --bg:#15120e; --surface:#1d1915; --surface-2:#26211a; --surface-3:#322b22;
  --border:#302a21; --border-strong:#463e31;
  --fg:#f0e9dd; --fg-2:#b4a996; --fg-3:#877c6c;
  --accent:#72bec2; --accent-hover:#8bcccf; --accent-fg:#15120e;
  --accent-soft:#113032; --accent-line:#1d4a4d;
  --good:#9cc16b; --good-soft:#1c2413; --good-dot:#84ad55;
  --warn:#dcae63; --warn-soft:#2c2314; --warn-dot:#c79646;
  --danger:#e8897b; --danger-soft:#2f1a16; --danger-dot:#cf6a5c;
  --shadow-1:none; --shadow-2:0 2px 8px rgba(0,0,0,.34);
  --shadow-3:0 10px 28px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.34);
  color-scheme: dark;
} }
:root[data-color-scheme="dark"][data-admin-theme="editorial"] {
  --bg:#15120e; --surface:#1d1915; --surface-2:#26211a; --surface-3:#322b22;
  --border:#302a21; --border-strong:#463e31;
  --fg:#f0e9dd; --fg-2:#b4a996; --fg-3:#877c6c;
  --accent:#72bec2; --accent-hover:#8bcccf; --accent-fg:#15120e;
  --accent-soft:#113032; --accent-line:#1d4a4d;
  --good:#9cc16b; --good-soft:#1c2413; --good-dot:#84ad55;
  --warn:#dcae63; --warn-soft:#2c2314; --warn-dot:#c79646;
  --danger:#e8897b; --danger-soft:#2f1a16; --danger-dot:#cf6a5c;
  --shadow-1:none; --shadow-2:0 2px 8px rgba(0,0,0,.34);
  --shadow-3:0 10px 28px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.34);
  color-scheme: dark;
}

/* == 2. BASE =============================================================== */
*, *::before, *::after { box-sizing:border-box }
html, body { height:100% }
body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-ui);
  font-size:var(--base); line-height:1.45; -webkit-font-smoothing:antialiased }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px }
.mono, td, th, time { font-variant-numeric:tabular-nums }
.mono { font-family:var(--font-mono) }
.ic { width:16px; height:16px; flex:none; stroke:currentColor; fill:none;
  stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round }
.ic-lg { width:20px; height:20px }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0) }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.01ms !important;
    animation-iteration-count:1 !important; transition-duration:.01ms !important }
}

/* == 3. SHELL ============================================================== */
/* minmax(0,1fr) on the row, and min-height:0 on every flex child below it:
   without those, a column that holds a scroll pane refuses to shrink under
   its content, so the pane never scrolls and the overflow is clipped instead. */
.app { display:grid; grid-template-columns:var(--railbar) var(--rail) 1fr;
  grid-template-rows:minmax(0, 1fr);
  height:100%; background:var(--surface); position:relative; overflow:hidden }

.railbar { border-right:1px solid var(--border); display:flex; flex-direction:column;
  align-items:center; padding-top:var(--s-3); gap:var(--s-1); background:var(--surface); z-index:3 }
.brand { width:40px; height:40px; border-radius:var(--r-2); background:var(--fg); color:var(--bg);
  display:grid; place-items:center; font-family:var(--font-display); font-weight:600;
  font-size:17px; margin-bottom:var(--s-4) }
.rail-btn { width:56px; border:0; background:none; color:var(--fg-2); cursor:pointer;
  border-radius:var(--r-2); padding:9px 0 7px; display:grid; justify-items:center; gap:5px;
  font:inherit; font-size:10.5px; line-height:1 }
.rail-btn:hover { background:var(--surface-2); color:var(--fg) }
.rail-btn[aria-current="true"] { background:var(--accent-soft); color:var(--accent) }

.panel { border-right:1px solid var(--border); display:flex; flex-direction:column;
  min-width:0; min-height:0; background:var(--surface); z-index:3 }
.panel-head { padding:var(--s-4) var(--s-5); border-bottom:1px solid var(--border) }
.panel-head h2 { margin:0; font-family:var(--font-display); font-size:16px; font-weight:600;
  letter-spacing:-.01em }
.panel-head p { margin:2px 0 0; color:var(--fg-3); font-size:11.5px }
.panel-body { padding:var(--s-4) var(--s-3); overflow-y:auto; flex:1; min-height:0 }
.grp { margin-bottom:var(--s-5) }
.grp h3 { margin:0 0 var(--s-2); padding:0 var(--s-3); font-size:11px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--fg-3); font-weight:600 }
.nav-item { display:flex; align-items:center; gap:var(--s-3); padding:7px var(--s-3);
  border-radius:var(--r-1); color:var(--fg-2); text-decoration:none; font-size:13px; position:relative }
.nav-item:hover { background:var(--surface-2); color:var(--fg) }
.nav-item[aria-current="page"] { background:var(--accent-soft); color:var(--accent); font-weight:500 }
.nav-item[aria-current="page"]::before { content:""; position:absolute; left:-12px; top:6px;
  bottom:6px; width:3px; border-radius:0 2px 2px 0; background:var(--accent) }
.nav-item .n { margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--fg-3) }

.main { display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--bg) }
.topbar { height:var(--bar); flex:none; display:flex; align-items:center; gap:var(--s-3);
  padding:0 var(--s-5); border-bottom:1px solid var(--border); background:var(--surface) }
.topbar .burger { display:none; flex:none }
.topbar > .btn, .topbar .avatar { flex:none }
.trail { display:flex; align-items:center; gap:var(--s-2); font-size:12.5px; color:var(--fg-3);
  min-width:0; white-space:nowrap; overflow:hidden }
.trail a { color:var(--fg-2); text-decoration:none }
.trail a:hover { color:var(--fg) }
.trail b { color:var(--fg); font-weight:500; text-overflow:ellipsis; overflow:hidden }
.topbar .sp { margin-left:auto }
.tsearch { display:flex; align-items:center; gap:var(--s-2); height:var(--ctl); width:300px;
  padding:0 var(--s-3); border:1px solid var(--border); border-radius:var(--r-1);
  background:var(--surface-2); color:var(--fg-3); font-size:12.5px; cursor:text }
.tsearch kbd { margin-left:auto; font-family:var(--font-mono); font-size:10.5px;
  border:1px solid var(--border-strong); border-radius:4px; padding:1px 5px }
.avatar { width:30px; height:30px; border-radius:50%; background:var(--surface-3); color:var(--fg-2);
  display:grid; place-items:center; font-size:11px; font-weight:600 }

/* The work area is the only scroll container, and it only scrolls down. */
.work { overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain;
  padding:var(--s-6); flex:1; min-height:0; position:relative }
.wrap { max-width:1180px; min-width:0 }
.scrim { position:absolute; inset:0; background:rgba(17,20,27,.42); z-index:10; display:none }
:root[data-color-scheme="dark"] .scrim { background:rgba(0,0,0,.6) }

/* == 4. CONTROLS =========================================================== */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:var(--s-1);
  height:var(--ctl); padding:0 var(--s-3); border-radius:var(--r-1);
  border:1px solid var(--border-strong); background:var(--surface); color:var(--fg);
  font:inherit; font-size:12.5px; cursor:pointer; text-decoration:none;
  box-shadow:var(--shadow-1); white-space:nowrap; transition:background .14s ease-out }
.btn:hover { background:var(--surface-2) }
.btn[disabled] { opacity:.55; cursor:default }
.btn[disabled]:hover { background:var(--surface) }
.btn-sm { height:var(--ctl-sm); padding:0 10px; font-size:12px }
.btn-primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg) }
.btn-primary:hover { background:var(--accent-hover); border-color:var(--accent-hover) }
.btn-danger { color:var(--danger); border-color:var(--danger-dot) }
.btn-danger:hover { background:var(--danger-soft) }
.btn-ghost { background:none; border-color:transparent; color:var(--fg-2) }
.btn-ghost:hover { background:var(--surface-2); color:var(--fg) }
.btn-icon { width:var(--ctl-sm); height:var(--ctl-sm); padding:0 }
/* The spinner has two homes in the whole admin. A working button is one. */
.spin { width:13px; height:13px; border-radius:50%; flex:none; border:2px solid currentColor;
  border-top-color:transparent; animation:spin .7s linear infinite }
@keyframes spin { to { transform:rotate(360deg) } }

/* Status is never color alone: every pill is a dot and a word. */
.pill { display:inline-flex; align-items:center; gap:5px; height:20px; padding:0 9px 0 7px;
  border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap;
  border:1px solid transparent; margin-block:-2px; vertical-align:middle }
.pill .dot { width:6px; height:6px; border-radius:50%; flex:none }
.pill-active  { background:var(--good-soft); color:var(--good); border-color:var(--good-dot) }
.pill-active  .dot { background:var(--good-dot) }
.pill-builtin { background:var(--surface-2); color:var(--fg-2); border-color:var(--border-strong) }
.pill-builtin .dot { background:var(--border-strong) }
.pill-broken  { background:var(--warn-soft); color:var(--warn); border-color:var(--warn-dot) }
.pill-broken  .dot { background:var(--warn-dot) }

.page-head { display:flex; align-items:flex-start; gap:var(--s-4); margin-bottom:var(--s-6) }
.page-head h1 { margin:0; font-family:var(--font-display); font-size:var(--h1);
  letter-spacing:var(--h1-track); font-weight:600; text-wrap:balance }
.page-head .lede { margin:var(--s-2) 0 0; color:var(--fg-2); font-size:13.5px; max-width:62ch }
.page-head .lede a, .inline-link { color:var(--accent); text-decoration:none;
  border-bottom:1px solid var(--accent-line) }
.page-head .lede a:hover, .inline-link:hover { border-bottom-color:currentColor }
.page-head .acts { margin-left:auto; flex:none; padding-top:4px; display:flex; gap:var(--s-2) }
.back { display:inline-flex; align-items:center; gap:var(--s-1); color:var(--fg-2);
  text-decoration:none; font-size:12.5px; margin-bottom:var(--s-3) }
.back:hover { color:var(--fg) }
.count-row { display:flex; align-items:center; gap:var(--s-3); margin-bottom:var(--s-4);
  font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--fg-3); font-weight:600 }
.count-row .rule { flex:1; height:1px; background:var(--border) }

/* Neutral inline explanation. Not warn — §5 reserves amber for state. */
.notice { display:flex; gap:var(--s-3); align-items:flex-start; margin-top:var(--s-6);
  padding:var(--s-4) var(--pad-x); background:var(--surface); border:1px solid var(--border);
  border-left:3px solid var(--border-strong); border-radius:var(--r-2); color:var(--fg-2);
  font-size:12.5px }
.notice .ic { margin-top:1px; color:var(--fg-3) }
.notice p { margin:0; min-width:0; overflow-wrap:anywhere }
code { font-family:var(--font-mono); font-size:11.5px; color:var(--fg);
  background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:1px 5px }


/* == 5. THEME CARD ========================================================= */
.themes { display:grid; gap:var(--s-4); grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)) }
.tcard { display:flex; flex-direction:column; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r-3); overflow:hidden;
  box-shadow:var(--shadow-1); transition:border-color .14s ease-out }
.tcard:hover { border-color:var(--border-strong) }
.tcard[data-active="true"] { border-color:var(--accent-line); box-shadow:0 0 0 1px var(--accent-line) }
.tcard[data-busy="true"] { opacity:.72 }

.tbody { padding:var(--s-4) var(--pad-x) var(--s-3); display:flex; flex-direction:column;
  gap:var(--s-2); flex:1 }
.tname { display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap }
.tname a { font-family:var(--font-title); font-size:15px; font-weight:600;
  letter-spacing:var(--title-track); color:var(--fg); text-decoration:none }
.tname a:hover { color:var(--accent) }
.tname .ver { font-family:var(--font-mono); font-size:11px; color:var(--fg-3);
  margin-left:auto; padding-left:var(--s-2) }
.tdesc { margin:0; color:var(--fg-2); font-size:12.5px; line-height:1.5 }
.tfacts { margin:var(--s-1) 0 0; padding:0; list-style:none; display:grid; gap:5px;
  font-size:11.5px; color:var(--fg-3) }
.tfacts li { display:flex; align-items:center; gap:var(--s-2); min-width:0 }
.tfacts li.warn { color:var(--warn) }
.tfacts .ic { width:13px; height:13px; opacity:.9 }
.tfacts .mono { color:var(--fg-2); min-width:0; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap }
.tfacts a { color:var(--fg-2); text-decoration:none; border-bottom:1px solid var(--border-strong) }
.tfacts a:hover { color:var(--accent); border-bottom-color:var(--accent-line) }

/* A failure is reported where the action lives, and leads with what is safe. */
.tmsg { display:flex; gap:var(--s-2); align-items:flex-start; margin:var(--s-2) 0 0;
  padding:var(--s-3); border-radius:var(--r-1); font-size:11.5px; line-height:1.45 }
.tmsg .ic { width:14px; height:14px; margin-top:1px }
.tmsg-danger { background:var(--danger-soft); color:var(--danger) }
.tmsg-warn   { background:var(--warn-soft);   color:var(--warn) }

.tfoot { display:flex; align-items:center; gap:var(--s-2); padding:var(--s-3) var(--pad-x);
  border-top:1px solid var(--border); background:var(--surface) }
.tfoot .sp { margin-left:auto }

/* skeleton: the card's own shape, so nothing shifts when the data lands */
.skel { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-3);
  overflow:hidden }
.skel .pv { background:var(--surface-2) }
.skel .b { padding:var(--s-4) var(--pad-x) var(--s-5); display:grid; gap:11px }
.sb { height:11px; border-radius:4px; background:var(--surface-2); position:relative; overflow:hidden }
.sb::after { content:""; position:absolute; inset:0;
  background:linear-gradient(90deg, transparent, var(--surface-3), transparent);
  animation:shim 1.4s ease-in-out infinite }
.skel:nth-child(2) .sb::after { animation-delay:.07s }
.skel:nth-child(3) .sb::after { animation-delay:.14s }
@keyframes shim { to { transform:translateX(100%) } }
@media (prefers-reduced-motion: reduce) { .sb::after { display:none } }

/* == 6. PREVIEW ============================================================
   Drawn from what the theme declares: six colors and a layout keyword. Each
   color is one light-dark() pair, so the preview shows the theme's light
   palette in a light admin and its dark palette in a dark one — the same
   mechanism the admin's own tokens use. No screenshot to go stale, and no
   webfont fetched to render a face the admin cannot honestly promise.
   ========================================================================= */
.pv { aspect-ratio:16/10; width:100%; overflow:hidden; position:relative;
  border-bottom:1px solid var(--border); background:var(--surface-2) }
.pv-in { position:absolute; inset:0; width:1200px; height:750px; transform-origin:0 0 }

.mini { width:100%; height:100%; background:var(--t-bg); display:flex; flex-direction:column }
.mini .bar { background:var(--t-surface); border-bottom:2px solid var(--t-border); height:86px;
  display:flex; align-items:center; gap:30px; padding:0 64px; flex:none }
.mini .mark { width:120px; height:19px; border-radius:4px; background:var(--t-text) }
.mini .lk { width:58px; height:12px; border-radius:3px; background:var(--t-muted); opacity:.55 }
.mini .lk:first-of-type { background:var(--t-accent); opacity:1 }
.mini .body { flex:1; display:flex; gap:44px; padding:54px 64px 0; min-height:0 }
.mini .col { display:flex; flex-direction:column; gap:22px; min-width:0; flex:1 }
.mini .h { height:46px; border-radius:7px; background:var(--t-text) }
.mini .h.s { width:62% }
.mini .acc { height:14px; width:140px; border-radius:4px; background:var(--t-accent) }
.mini .ln { height:14px; border-radius:4px; background:var(--t-muted); opacity:.42 }
.mini .ln.a { width:96% } .mini .ln.b { width:88% } .mini .ln.c { width:60% }
.mini .card { background:var(--t-surface); border:2px solid var(--t-border); border-radius:12px;
  flex:1; min-height:0; display:flex; flex-direction:column; gap:16px; padding:22px }
.mini .card .ph { height:52%; border-radius:8px; background:var(--t-accent); opacity:.22 }
.mini .side { width:270px; flex:none; background:var(--t-surface); border:2px solid var(--t-border);
  border-radius:12px; padding:24px; display:flex; flex-direction:column; gap:18px }
.mini .hero { height:168px; border-radius:12px; background:var(--t-accent); flex:none;
  margin:0 64px 34px; display:flex; align-items:center; padding:0 34px }
.mini .hero i { display:block; height:22px; width:46%; border-radius:5px; background:var(--t-bg);
  opacity:.85 }
.mini .row3 { display:flex; gap:26px; padding:0 64px 40px; flex:1; min-height:0 }

/* a theme that will not load gets no picture, because there is nothing to draw */
.pv-none { width:100%; height:100%; display:grid; place-items:center; gap:10px;
  align-content:center; background:var(--surface-2); color:var(--fg-3) }
.pv-none .ic { width:26px; height:26px }
.pv-none span { font-size:12px }

/* == 7. EXTENSION ROW ======================================================
   Plugins are a list, not a card grid. A plugin has nothing to look at — what
   you want to know is what it is and whether it is on — so the card's photo
   slot would be dead space repeated down the page, and §2 says the table is
   the product. Icon packs get cards (§8) because their contents *are* a
   picture, and are readable off disk without running anything.
   ========================================================================= */
.rows { border:1px solid var(--border); border-radius:var(--r-3); background:var(--surface);
  overflow:hidden }
.row { display:grid; grid-template-columns:38px minmax(0,1fr) auto; gap:var(--s-4);
  padding:var(--s-4) var(--pad-x); align-items:start;
  border-top:1px solid var(--border); transition:background .14s ease-out }
.row:first-child { border-top:0 }
.row:hover { background:var(--surface-2) }
.row[data-off="true"] .badge, .row[data-off="true"] .rname a,
.row[data-off="true"] .rdesc { opacity:.62 }

.badge { width:38px; height:38px; border-radius:var(--r-2); background:var(--surface-2);
  border:1px solid var(--border); display:grid; place-items:center; color:var(--fg-2) }
.row:hover .badge { background:var(--surface-3) }

.rname { display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap; margin-bottom:3px }
.rname a { font-family:var(--font-title); font-size:var(--title-size); font-weight:600;
  letter-spacing:var(--title-track); color:var(--fg); text-decoration:none }
.rname a:hover { color:var(--accent) }
.rname .pkg { font-family:var(--font-mono); font-size:11px; color:var(--fg-3) }
.rdesc { margin:0 0 var(--s-3); color:var(--fg-2); font-size:12.5px; max-width:70ch }

.ract { display:flex; align-items:center; gap:var(--s-2); padding-top:2px }

/* A switch is a setting that takes effect when it moves, so it carries a word
   as well as a fill and it raises a toast. A checkbox would do neither. */
.switch { display:inline-flex; align-items:center; gap:var(--s-2); cursor:pointer;
  user-select:none }
.switch input { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0) }
.switch .track { width:34px; height:20px; border-radius:999px; background:var(--surface-3);
  border:1px solid var(--border-strong); position:relative; flex:none;
  transition:background .14s ease-out, border-color .14s ease-out }
.switch .knob { position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%;
  background:var(--surface); box-shadow:var(--shadow-2); transition:transform .14s ease-out }
.switch input:checked + .track { background:var(--good-dot); border-color:var(--good-dot) }
.switch input:checked + .track .knob { transform:translateX(14px) }
.switch input:focus-visible + .track { outline:2px solid var(--accent); outline-offset:2px }
.switch .word { font-size:11.5px; font-weight:600; color:var(--fg-3); width:22px }
.switch input:checked ~ .word { color:var(--good) }
.switch[data-locked="true"] { cursor:default }
.switch[data-locked="true"] .track { opacity:.5 }
.switch[data-locked="true"] .word { opacity:.6 }

/* == 8. ICON PACK ==========================================================
   A pack's icons are its preview, so the card shows the glyphs themselves
   rather than a list of their names — a name tells you nothing about the mark.
   ========================================================================= */
.glyphs { display:grid; grid-template-columns:repeat(6, 1fr); gap:1px;
  background:var(--border); border-bottom:1px solid var(--border) }
.glyphs div { aspect-ratio:1; background:var(--surface-2); display:grid; place-items:center;
  color:var(--fg-2) }
.glyphs .ic { width:20px; height:20px }
.glyphs .more { font-family:var(--font-mono); font-size:11px; color:var(--fg-3) }

/* the detail screen's browser: every glyph, at a size you can judge */
.browse { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));
  gap:var(--s-2) }
.gcell { display:grid; justify-items:center; gap:var(--s-2); padding:var(--s-4) var(--s-2);
  border:1px solid var(--border); border-radius:var(--r-2); background:var(--surface);
  font:inherit; cursor:pointer; color:var(--fg-2); text-align:center; min-width:0 }
.gcell:hover { background:var(--surface-2); border-color:var(--border-strong); color:var(--fg) }
.gcell .ic { width:24px; height:24px }
.gcell code { font-size:10.5px; max-width:100%; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; background:none; border:0; padding:0; color:var(--fg-3) }
.gcell:hover code { color:var(--fg-2) }

.browse-bar { display:flex; align-items:center; gap:var(--s-3); margin-bottom:var(--s-4) }
.field { display:flex; align-items:center; gap:var(--s-2); height:var(--ctl); flex:1;
  max-width:320px; padding:0 var(--s-3); border:1px solid var(--border-strong);
  border-radius:var(--r-1); background:var(--surface); color:var(--fg-3) }
.field input { border:0; background:none; font:inherit; font-size:12.5px; color:var(--fg);
  width:100%; outline:none }
.browse-count { font-size:11.5px; color:var(--fg-3) }

/* == 8b. SHARED DETAIL BITS ================================================ */
.req { margin:0; padding:0; list-style:none; display:grid; gap:6px; font-size:12.5px }
.req li { display:flex; align-items:center; gap:var(--s-2); flex-wrap:wrap }
.req a { color:var(--accent); text-decoration:none }
.req a:hover { text-decoration:underline }
.req span:last-child { color:var(--fg-3) }
.req .ic { width:14px; height:14px }
.req .ok  { color:var(--good) }
.req .bad { color:var(--danger) }
.req .mono { color:var(--fg-2) }

.addlist { display:grid; gap:var(--s-4) }
.addgroup h3 { margin:0 0 var(--s-2); font-size:11px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--fg-3); font-weight:600;
  display:flex; align-items:center; gap:var(--s-2) }
.addgroup h3 .ic { width:13px; height:13px }
.addgroup ul { margin:0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:6px }
.addgroup li { font-family:var(--font-mono); font-size:11.5px; color:var(--fg-2);
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-1);
  padding:3px 8px }
.addgroup li .plain { font-family:var(--font-ui) }

/* == 9. DETAIL SCREENS ====================================================== */
.detail-stack { display:grid; gap:var(--s-5) }
.detail { display:grid; gap:var(--s-5); grid-template-columns:minmax(0,1fr) 380px;
  align-items:start }
/* two panels of equal weight — what a plugin's manifest honestly holds */
.detail-2up { display:grid; gap:var(--s-5); grid-template-columns:1fr 1fr; align-items:start }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-3);
  box-shadow:var(--shadow-1); overflow:hidden }
.card > h2 { margin:0; padding:var(--pad-panel) var(--pad-x); font-family:var(--font-display);
  font-size:14px; font-weight:600; display:flex; align-items:center; gap:var(--s-2) }
.card > h2 .hint { color:var(--fg-3); font-weight:400; font-size:11.5px }
.card-in { padding:0 var(--pad-x) var(--s-5) }

/* two previews side by side: this is where both halves of light-dark() show */
.pv-pair { display:grid; grid-template-columns:1fr 1fr; gap:var(--s-4) }
.pv-pair figure { margin:0 }
.pv-pair figcaption { margin-top:var(--s-2); font-size:11px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--fg-3); font-weight:600 }
.pv-pair .pv { border:1px solid var(--border); border-radius:var(--r-2) }

/* key/value rows */
.kv { margin:0; display:grid; grid-template-columns:auto 1fr; gap:var(--s-3) var(--s-4);
  font-size:12.5px; align-items:baseline }
.kv dt { color:var(--fg-3) }
.kv dd { margin:0; color:var(--fg); min-width:0; overflow-wrap:anywhere }
.kv dd a { color:var(--accent); text-decoration:none }
.kv dd a:hover { text-decoration:underline }
.warn-ink { color:var(--warn) }

/* Palette: the two halves side by side, each a specimen rather than a legend.
   The role and the exact value sit on the swatch, inked in whichever of the
   theme's own text or background colors clears it (see inkOn). The frame is
   admin chrome, so a white tile on a white card still has an edge. */
.pal-pair { display:grid; grid-template-columns:1fr 1fr; gap:var(--s-6) }
/* Each half is bounded by its own heading rule, so the two groups do not read
   as one six-column grid where a dark Light tile meets a dark Dark tile. */
.pal-pair h3 { margin:0 0 var(--s-3); padding-bottom:var(--s-2);
  border-bottom:1px solid var(--border); font-size:11px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--fg-3); font-weight:600 }
.pal-grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:var(--s-2) }
.sw { aspect-ratio:3/2; border-radius:var(--r-2); border:1px solid var(--border-strong);
  padding:var(--s-3); display:flex; flex-direction:column; justify-content:flex-end; gap:1px;
  min-width:0; overflow:hidden }
.sw b { font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; font-weight:600;
  opacity:.72 }
.sw span { font-size:11.5px; font-variant-numeric:tabular-nums }

.danger-zone { display:flex; align-items:center; gap:var(--s-4); padding:var(--s-4) var(--pad-x);
  border:1px solid var(--border); border-radius:var(--r-3); background:var(--surface) }
.danger-zone p { margin:0; font-size:12.5px; color:var(--fg-2) }
.danger-zone .btn { margin-left:auto; flex:none }

/* == 10. OVERLAYS =========================================================== */
.menu { position:fixed; z-index:120; min-width:190px; max-width:320px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r-2); box-shadow:var(--shadow-2);
  padding:5px; display:none }
.menu[data-open="true"] { display:block }
.menu button { display:flex; align-items:center; gap:var(--s-2); width:100%; text-align:left;
  font:inherit; font-size:12.5px; color:var(--fg); background:none; border:0; padding:7px var(--s-2);
  border-radius:var(--r-1); cursor:pointer }
.menu button:hover, .menu button:focus-visible { background:var(--surface-2); outline:none }
.menu button.danger { color:var(--danger) }
.menu button.danger:hover, .menu button.danger:focus-visible { background:var(--danger-soft) }
.menu hr { border:0; border-top:1px solid var(--border); margin:5px -1px }

dialog.modal { border:0; padding:0; background:transparent; max-width:none; max-height:none }
dialog.modal::backdrop { background:rgba(17,20,27,.42) }
:root[data-color-scheme="dark"] dialog.modal::backdrop { background:rgba(0,0,0,.6) }
.modal-card { width:min(470px, calc(100vw - 48px)); background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r-3); box-shadow:var(--shadow-3);
  overflow:hidden }
.modal-card h2 { margin:0; padding:var(--s-5) var(--s-5) 0; font-family:var(--font-display);
  font-size:17px; font-weight:600 }
.modal-body { padding:0 var(--s-5); margin-top:var(--s-3); color:var(--fg-2); font-size:13px }
.modal-body p { margin:0 0 var(--s-3) }
.modal-body p:last-child { margin-bottom:0 }
.modal-foot { display:flex; justify-content:flex-end; gap:var(--s-2); padding:var(--s-5);
  margin-top:var(--s-2) }
/* The uploader, same anatomy as the media library's Upload tab: a drop zone
   and a button, in that order, with the limits stated before anyone tries.
   The button carries no icon — there is a large upload glyph right above it,
   and a second one reads as a different action rather than the same one. */
.drop { margin-top:var(--s-4); border:1px dashed var(--border-strong); border-radius:var(--r-2);
  padding:var(--s-6) var(--s-5); text-align:center; background:var(--surface-2);
  transition:border-color .14s ease-out, background .14s ease-out }
.drop[data-over="true"] { border-color:var(--accent); background:var(--accent-soft) }
.drop > .ic { color:var(--fg-3); margin-bottom:var(--s-3) }
.drop h3 { margin:0 0 var(--s-2); font-family:var(--font-display); font-size:14px; font-weight:600;
  color:var(--fg) }
.drop p { margin:0 auto var(--s-4); max-width:40ch; color:var(--fg-2); font-size:12.5px }
.drop .limits { margin:var(--s-3) 0 0; color:var(--fg-3); font-size:11.5px }

/* working, done and failed all replace the zone — one thing in that slot */
.slab { margin-top:var(--s-4); border:1px solid var(--border); border-radius:var(--r-2);
  padding:var(--s-5); background:var(--surface-2) }
.slab-good { background:var(--good-soft); border-color:var(--good-dot) }
.slab-bad  { background:var(--danger-soft); border-color:var(--danger-dot) }
.slab-warn { background:var(--warn-soft); border-color:var(--warn-dot) }
.slab-head { display:flex; align-items:center; gap:var(--s-2); font-weight:600; font-size:13px;
  margin-bottom:var(--s-2) }
.slab-good .slab-head { color:var(--good) }
.slab-bad  .slab-head { color:var(--danger) }
.slab-warn .slab-head { color:var(--warn) }
.slab p { margin:0 0 var(--s-2); font-size:12.5px; color:var(--fg-2) }
.slab p:last-child { margin-bottom:0 }
.slab dl { margin:var(--s-3) 0 0; display:grid; grid-template-columns:auto 1fr;
  gap:5px var(--s-4); font-size:12px }
.slab dt { color:var(--fg-3) } .slab dd { margin:0; color:var(--fg) }

.bar { height:5px; border-radius:999px; background:var(--surface-3); overflow:hidden;
  margin:var(--s-3) 0 var(--s-2) }
.bar i { display:block; height:100%; background:var(--accent); border-radius:999px;
  transition:width .3s ease-out }

.modal-foot .status { margin-right:auto; color:var(--fg-3); font-size:12.5px; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.modal-foot .status b { color:var(--fg); font-weight:500 }

.toasts { position:absolute; right:var(--s-5); bottom:var(--s-5); z-index:130 }
.toast { display:flex; align-items:center; gap:var(--s-2); background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r-2); box-shadow:var(--shadow-2);
  padding:10px var(--s-4); font-size:12.5px; color:var(--fg); animation:tin .16s ease-out }
.toast .ic { color:var(--good) }
.toast.bad .ic { color:var(--danger) }
@keyframes tin { from { opacity:0; transform:translateY(6px) } }

/* == 11. NARROW WIDTHS ====================================================== */
@media (max-width:1180px) { .detail, .detail-2up { grid-template-columns:minmax(0,1fr) } }
@media (max-width:760px) { .pal-pair { grid-template-columns:1fr } }
@media (max-width:1100px) {
  .app { grid-template-columns:var(--railbar) 1fr }
  /* the drawer sits above the scrim, the scrim above everything else */
  .panel { position:absolute; left:var(--railbar); top:0; bottom:0; width:var(--rail);
    transform:translateX(-110%); transition:transform .16s ease-out; z-index:11 }
  .app[data-drawer="open"] .panel { transform:none }
  .app[data-drawer="open"] .scrim { display:block }
}
@media (max-width:860px) {
  /* Once the rail and panel are an off-canvas drawer there is no second column
     to hold still, so the document scrolls instead of a pane inside it. That is
     what a touch device expects, and it survives a short viewport. */
  html, body { height:auto }
  .app { grid-template-columns:1fr; grid-template-rows:auto;
    height:auto; min-height:100%; overflow:visible }
  .work { overflow:visible; padding:var(--s-5) }
  .topbar { position:sticky; top:0; z-index:5 }
  .railbar, .panel, .scrim, .toasts { position:fixed }
  .railbar { left:0; top:0; height:100%; width:var(--railbar); z-index:11;
    transform:translateX(-100%); transition:transform .16s ease-out }
  .panel { left:var(--railbar); top:0; height:100%;
    transform:translateX(calc(-100% - var(--railbar))) }
  .app[data-drawer="open"] .railbar { transform:none }
  .scrim { inset:0 }
  .toasts { right:var(--s-4); bottom:var(--s-4) }
  .topbar .burger { display:inline-flex }
  .tsearch { width:auto; padding:0 10px; flex:none }
  .tsearch span, .tsearch kbd { display:none }
  .pv-pair { grid-template-columns:1fr }
}
@media (max-width:640px) {
  .themes { grid-template-columns:1fr }
  .work { padding:var(--s-4) }
  .trail a, .trail span { display:none }          /* breadcrumb root drops first */
  .topbar > .btn:not(.burger) { width:var(--ctl); padding:0 }
  .topbar > .btn:not(.burger) .lbl { display:none }
  .page-head { flex-wrap:wrap }
  .page-head .acts { margin-left:0; width:100% }
  .page-head h1 { font-size:22px }
  .toasts { left:var(--s-4); right:var(--s-4) }
  .danger-zone { flex-wrap:wrap }
  .danger-zone .btn { margin-left:0 }
}

/* grid shared by theme cards and icon-pack cards */
.cards { display:grid; gap:var(--s-4); grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)) }
@media (max-width:640px) { .cards { grid-template-columns:1fr }
  .glyphs { grid-template-columns:repeat(4, 1fr) }
  .row { grid-template-columns:30px minmax(0,1fr); }
  .row .ract { grid-column:2; justify-content:flex-start }
}

</style>
</head>

     ['php', range]               the PHP version
