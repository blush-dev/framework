/* == STATE AND SHARED PARTS ================================================ */
const state = { screen:'themes', detail:null, active:'justin-tadlock',
                loading:true, busy:null, failed:null, query:'', filter:'',
                /* the filter row: a name to type, and two axes to narrow by */
                status:'all', src:'all',
                /* cards or a compact list, on the two screens that have a picture */
                view:'cards' };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const getTheme  = s => THEMES.find(t => t.slug === s);
const getPlugin = s => PLUGINS.find(p => p.slug === s);
const getPack   = s => PACKS.find(p => p.slug === s);
const live = list => list.filter(x => !x.removed);

THEMES.forEach(t  => t.kind = 'theme');
PLUGINS.forEach(p => p.kind = 'plugin');
PACKS.forEach(k   => k.kind = 'pack');

const KIND = { theme:{ screen:'themes', noun:'theme' },
               plugin:{ screen:'plugins', noun:'plugin' },
               pack:{ screen:'packs', noun:'icon pack' } };

const everything = () => [...live(THEMES), ...live(PLUGINS), ...live(PACKS)];
const byPkg = p => everything().find(x => x.pkg === p);

const deletable = x =>
  x.install === 'folder' && !(x.kind === 'theme' && x.slug === state.active);
const removeHint = x => `composer remove ${x.pkg}`;

function originFact(x) {
  if (x.install === 'builtin')  return `<li><svg class="ic"><use href="#i-package"/></svg>Ships with Blush</li>`;
  if (x.install === 'composer') return `<li><svg class="ic"><use href="#i-composer"/></svg>Composer ·
    <span class="mono">${esc(x.pkg)}</span></li>`;
  return `<li><svg class="ic"><use href="#i-folder"/></svg><span class="mono">${esc(x.source)}/${esc(x.slug)}</span></li>`;
}
function originRow(x) {
  if (x.install === 'builtin')  return 'Blush';
  if (x.install === 'composer') return `Composer`;
  return `A folder you added`;
}

function composerNotice(x, noun) {
  return `<div class="notice" style="margin-top:0"><svg class="ic"><use href="#i-composer"/></svg>
    <p>Composer manages this ${noun}, so it cannot be deleted here. Remove it from the project
      with <code>${esc(removeHint(x))}</code>, and it leaves this list on the next install.</p></div>`;
}

function dangerZone(x, noun, extra = '') {
  if (x.install === 'composer') return composerNotice(x, noun);
  if (!deletable(x)) return '';
  return `<div class="danger-zone">
    <p>Deleting removes the folder from the server.${extra}</p>
    <button class="btn btn-danger" type="button" data-delete="${x.kind}:${x.slug}">
      <svg class="ic"><use href="#i-trash"/></svg>Delete ${noun}</button></div>`;
}

/* A switch is a setting that takes effect the moment it moves, so it carries a
   word as well as a fill, and flipping it raises a toast. */
function switchCtl(kind, x, on, locked, why) {
  return `<label class="switch" data-locked="${!!locked}"${why ? ` title="${esc(why)}"` : ''}>
    <input type="checkbox" ${on ? 'checked' : ''} ${locked ? 'disabled' : ''}
      data-toggle="${kind}:${x.slug}" aria-label="${on ? 'On' : 'Off'} — ${esc(x.name)}">
    <span class="track"><span class="knob"></span></span>
    <span class="word">${on ? 'On' : 'Off'}</span></label>`;
}

function menuItems(kind, x) {
  const noun = KIND[kind].noun;
  const Noun = noun[0].toUpperCase() + noun.slice(1);
  const items = [['open', 'i-arrow', `${Noun} details`]];
  if (x.install === 'folder' || x.install === 'composer')
    items.push(['copy', 'i-copy', 'Copy folder path']);
  if (deletable({ ...x, kind })) items.push(['delete', 'i-trash', `Delete ${noun}`, true]);
  return items;
}
/* In a row the controls line up in a column down the right edge, so an item
   with nothing in its menu — the built-in theme and the core icon pack — must
   still take up the trigger's width, or its button sits a button-width off
   from every other one. An empty slot, not a disabled button: a dead control
   is worse than a gap. */
const menuSlot = (kind, x) => menuTrigger(kind, x)
  || `<span class="menu-slot" aria-hidden="true"></span>`;

/* A row's badge: the kind's glyph, or for an icon pack its own first icon,
   since a pack's icons are files on disk and cost nothing to read. */
const rowBadge = (x, inner) =>
  `<div class="badge${isOn(x) ? ' badge-on' : ''}">${inner}</div>`;

function menuTrigger(kind, x) {
  if (menuItems(kind, x).length < 2) return '';
  return `<button class="btn btn-ghost btn-sm btn-icon" type="button" data-menu="${kind}:${x.slug}"
    aria-haspopup="menu" aria-expanded="false" aria-label="More actions for ${esc(x.name)}">
    <svg class="ic"><use href="#i-more"/></svg></button>`;
}

/* The status chip belongs to the name, not to the buttons: it says what this
   thing IS, while the controls beside it say what you can DO. Parked in the
   action row it read as a third button and collided with View Site. */
function pageHead(title, lede, actions, badge = '') {
  return `<div class="page-head"><div class="page-head-main">
    <div class="title-row"><h1>${title}</h1>${badge}</div>
    <p class="lede">${lede}</p></div><div class="acts">${actions}</div></div>`;
}
const backTo = (screen, label) =>
  `<a class="back" href="#" data-go="${screen}"><svg class="ic"><use href="#i-left"/></svg>${label}</a>`;

/* A named block inside a card, divided by a hairline from the one above. */
const sect = (title, hint, body) => `<div class="sect">
  ${title ? `<div class="sect-head"><h3>${esc(title)}</h3>${hint ? `<span>${esc(hint)}</span>` : ''}</div>` : ''}
  <div class="sect-body">${body}</div></div>`;

function detailRows(pairs) {
  return `<dl class="kv">${pairs.filter(Boolean)
    .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}

function skeletonCard() {
  return `<div class="skel"><div class="pv"></div><div class="b">
    <div class="sb" style="width:48%;height:14px"></div>
    <div class="sb" style="width:88%"></div><div class="sb" style="width:64%"></div></div></div>`;
}
function skeletonRows() {
  return `<div class="rows">${`<div class="row"><div class="badge"></div>
    <div><div class="sb" style="width:34%;height:13px;margin-bottom:10px"></div>
    <div class="sb" style="width:70%"></div></div><div></div></div>`.repeat(4)}</div>`;
}

/* == RELATIONSHIPS =========================================================
   Five lists, one resolver, one panel. They differ only in what a pass means:
   a requirement must be met, a conflict must not be, a replacement must not
   be installed alongside, and provides and suggests are statements rather
   than tests. Rendering them as five panels made the screen mostly headings.
   ========================================================================= */
const major = v => parseInt(String(v).replace(/^\D*/, ''), 10) || 0;
const satisfies = (range, version) => !range || major(range) === major(version);

const GROUPS = {
  requires:  { label:'Requires',  hint:'must be installed and on' },
  conflicts: { label:'Conflicts', hint:'must not be on at the same time' },
  replaces:  { label:'Replaces',  hint:'stands in for these' },
  provides:  { label:'Provides',  hint:'meets these requirements for others' },
  suggests:  { label:'Suggests',  hint:'optional' },
};

/* Is this extension actually running? Guarded, because A can require B while
   B conflicts with A. */
const _seen = new Set();
function running(x) {
  if (!x || x.removed) return false;
  if (x.kind === 'theme') return x.slug === state.active;
  if (!x.on || x.broken) return false;
  if (_seen.has(x.slug)) return true;
  _seen.add(x.slug);
  const ok = !failures(x).length;
  _seen.delete(x.slug);
  return ok;
}

/* Anything running that says it provides this package counts as satisfying it. */
const providerOf = pkg => everything().find(x =>
  (x.rel?.provides || []).some(p => p.pkg === pkg) && running(x));

function resolve(ref, group) {
  if (ref.core) return { text:`Blush ${ref.core}`, ok:satisfies(ref.core, SITE.blush),
    note:`this site runs ${SITE.blush}` };
  if (ref.php)  return { text:`PHP ${ref.php}`, ok:satisfies(ref.php, SITE.php),
    note:`this site runs ${SITE.php}` };
  if (ref.ext)  return { text:`PHP Extension: ${ref.ext}`, ok:SITE.ext.includes(ref.ext),
    note:SITE.ext.includes(ref.ext) ? '' : 'not loaded' };

  const target = byPkg(ref.pkg);
  const cons = [ref.pkg, ref.range].filter(Boolean).join(' ');

  if (group === 'provides') return { text:cons, neutral:true, target };
  if (group === 'suggests') return { text:cons, hint:ref.why, soft:true, target,
    ok:running(target), missing:!target, want:'plugin',
    note: target ? (running(target) ? '' : 'installed but off') : 'not installed' };
  if (group === 'replaces') return { text:cons, target,
    ok: !target, note: target ? 'also installed, so both are present' : "isn't installed" };
  if (group === 'conflicts') return { text:cons, target,
    ok: !running(target), note: !target ? "isn't installed"
      : running(target) ? `version ${target.version} is on` : 'installed but off' };

  /* requires */
  if (target) return { text:cons, target,
    ok: running(target) && satisfies(ref.range, target.version),
    note: !satisfies(ref.range, target.version) ? `version ${target.version} is installed`
      : running(target) ? '' : 'installed but off' };
  const prov = providerOf(ref.pkg);
  if (prov) return { text:cons, target:prov, ok:true, note:`provided by ${prov.name}` };
  return { text:cons, ok:false, note:"isn't installed", missing:true, want:'plugin' };
}

/* A theme's fallback is a dependency like any other, so it is resolved here
   rather than kept as a fact of its own. */
function groupsFor(x) {
  const out = [];
  if (x.kind === 'theme' && x.fallback && !x.root) {
    const t = getTheme(x.fallback);
    out.push(['Falls back to', 'the theme it inherits from', [{
      text:x.fallback, target:(t && !t.removed) ? t : null,
      ok:!!(t && !t.removed), note:(t && !t.removed) ? '' : "isn't installed" }]]);
  }
  for (const [key, g] of Object.entries(GROUPS)) {
    const refs = x.rel?.[key] || [];
    if (refs.length) out.push([g.label, g.hint, refs.map(r => ({ ...resolve(r, key), hint:r.why }))]);
  }
  return out;
}

/* What others say about this one. */
function reverseFor(x) {
  const out = [];
  const needs = everything().filter(o => o !== x &&
    (o.rel?.requires || []).some(r => r.pkg === x.pkg));
  const fallbacks = x.kind === 'theme' ? live(THEMES).filter(t => t.fallback === x.slug) : [];
  const clashes = everything().filter(o => o !== x &&
    (o.rel?.conflicts || []).some(r => r.pkg === x.pkg));

  if (x.root) out.push(['Used as fallback by', '', [{ text:'Every theme', neutral:true }]]);
  else if (fallbacks.length) out.push(['Used as fallback by', '',
    fallbacks.map(t => ({ text:t.pkg, target:t, neutral:true }))]);
  if (needs.length) out.push(['Required by', '',
    needs.map(o => ({ text:o.pkg, target:o, neutral:true }))]);
  if (clashes.length) out.push(['Conflicted by', '',
    clashes.map(o => ({ text:o.pkg, target:o, ok:!running(o),
      note:running(o) ? 'and it is on' : 'and it is off' }))]);
  return out;
}

function depRow(r) {
  const mark = r.neutral ? `<svg class="ic dim"><use href="#i-package"/></svg>`
    : r.soft && !r.ok ? `<svg class="ic dim"><use href="#i-bulb"/></svg>`
    : `<svg class="ic ${r.ok ? 'ok' : 'bad'}"><use href="#i-${r.ok ? 'ok' : 'no'}"/></svg>`;

  const ref = r.target
    ? `<a href="#" data-go="${KIND[r.target.kind].screen}:${r.target.slug}">${esc(r.target.name)}</a>
       <span class="mono dim">${esc(r.text)}</span>`
    : `<span class="mono">${esc(r.text)}</span>`;

  /* The slot an Install button will sit in once the admin can fetch a missing
     package. It is only ever offered for something that is not here at all —
     installed-but-off is fixed with the switch, not with another copy. */
  const act = r.missing
    ? `<button class="btn btn-sm" type="button" data-install="${r.want}">Install</button>` : '';

  return `<li>${mark}
    <div class="dep-main">
      <div class="dep-ref">${ref}${r.note
        ? `<span class="note${r.ok === false ? ' warn-ink' : ''}">${esc(r.note)}</span>` : ''}</div>
      ${r.hint ? `<div class="dep-why">${esc(r.hint)}</div>` : ''}
    </div>
    <div class="dep-act">${act}</div></li>`;
}

function depsPanel(x) {
  const own = groupsFor(x), rev = reverseFor(x);
  if (!own.length && !rev.length)
    return `<div class="card"><h2>Dependencies</h2>${sect('', '',
      `<p class="dep-none">This ${KIND[x.kind].noun} declares none, and nothing depends on it.</p>`)}</div>`;

  const block = list => list.map(([label, hint, rows]) =>
    sect(label, hint, `<ul class="dep-rows">${rows.map(depRow).join('')}</ul>`)).join('');

  return `<div class="card">
    <h2>Dependencies <span class="hint">resolved against this site</span></h2>
    ${block(own)}
    ${rev.length ? `<div class="sect sect-turn"><div class="sect-head">
        <h3>What others say about it</h3></div></div>${block(rev)}` : ''}
  </div>`;
}

/* Why this cannot be turned on, or null. Requirements and conflicts are the
   only two that gate; the rest are statements. */
function failures(x) {
  const out = [];
  if (x.kind === 'theme' && x.fallback && !x.root) {
    const t = getTheme(x.fallback);
    if (!t || t.removed) out.push(`the ${x.fallback} theme it falls back to, which isn't installed`);
  }
  for (const r of x.rel?.requires || []) {
    const v = resolve(r, 'requires');
    if (!v.ok) out.push(`${v.text}${v.note ? ` (${v.note})` : ''}`);
  }
  for (const r of x.rel?.conflicts || []) {
    const v = resolve(r, 'conflicts');
    if (!v.ok) out.push(`it conflicts with ${v.target ? v.target.name : v.text}, which is on`);
  }
  return out;
}

function blocker(x) {
  if (x.broken) return x.broken;
  const f = failures(x);
  return f.length ? `Needs ${f.join(', and ')}.` : null;
}
const pluginBlocker = blocker;          // kept: the install receipt calls both names
const pluginBlockerSafe = blocker;

const dependents = slug => live(THEMES).filter(t => t.fallback === slug);

/* == IDENTITY PANEL ========================================================
   Facts, then where to go, then how to pay for it. Nine links wrapping as
   chips in a key/value row read as a tag cloud; as a list with the glyph that
   names each kind they read as destinations. Funding is a different kind of
   ask, so it is not in the same list.
   ========================================================================= */
const LINK_ICON = { Homepage:'i-globe', Documentation:'i-reading', Source:'i-composer',
  Issues:'i-bug', Forum:'i-chat', Chat:'i-chat', Wiki:'i-reading', IRC:'i-chat',
  RSS:'i-rss', Security:'i-shield', Download:'i-upload' };

function identityPanel(x, extra = []) {
  const authors = (x.authors || []).length
    ? (x.authors || []).map(([name, role, uri]) =>
        `<div class="who">${uri ? `<a href="${esc(uri)}">${esc(name)}</a>` : esc(name)}
         <span>${esc(role)}</span></div>`).join('')
    : '—';
  const links = Object.entries(x.links || {});
  const fund = Object.entries(x.sponsor || {});

  const facts = detailRows([
    ['Name', `<span class="mono">${esc(x.pkg || '—')}</span>`],
    ['Version', x.version ? `<span class="mono">${esc(x.version)}</span>` : '—'],
    ['Authors', authors],
    ['License', x.license ? `<span class="mono">${esc(x.license)}</span>` : '—'],
    ...extra,
    ['Installed by', originRow(x)],
    ['Folder', x.install === 'builtin' ? 'Ships with Blush'
      : `<span class="mono">${esc(x.source)}/${esc(x.slug)}</span>`],
  ]);

  return `<div class="card"><h2>Details</h2>
    ${sect('', '', facts)}
    ${links.length ? sect('Links', '', `<div class="links">${links.map(([t, u]) =>
      `<a href="${esc(u)}"><svg class="ic"><use href="#${LINK_ICON[t] || 'i-external'}"/></svg>
         <span>${esc(t)}</span></a>`).join('')}</div>`) : ''}
    ${fund.length ? sect('Funding', 'the people who maintain it', `<div class="fund">
      ${fund.map(([t, u]) => `<a class="btn btn-sm" href="${esc(u)}">
        <svg class="ic"><use href="#i-heart"/></svg>${esc(t)}</a>`).join('')}</div>`) : ''}
  </div>`;
}

/* == LIST FILTER ===========================================================
   Keywords are only worth declaring if something searches them, so the three
   lists gained one field that matches a name, a package, a description or a
   keyword. Clicking a keyword anywhere sets it.
   ========================================================================= */
/* The two axes a person actually narrows by. Status is worded per kind, because
   a theme is Active and a plugin is On, and calling both "enabled" would be the
   data model talking. Source is the same everywhere, and it is the fact that
   decides whether a thing can be deleted. */
const STATUS = {
  themes:  [['all','Any status'], ['on','Active'], ['off','Inactive'], ['bad','Needs attention']],
  plugins: [['all','Any status'], ['on','On'],     ['off','Off'],      ['bad','Needs attention']],
  packs:   [['all','Any status'], ['on','On'],     ['off','Off'],      ['bad','Needs attention']],
};
const SRC = [['all','Any source'], ['composer','Composer'],
             ['folder','A folder you added'], ['builtin','Ships with Blush']];

const isOn = x => x.kind === 'theme' ? x.slug === state.active : !!(x.on && !blocker(x));
const anyFilter = () => !!state.filter.trim() || state.status !== 'all' || state.src !== 'all';

function matches(x) {
  if (state.status === 'bad') { if (!blocker(x)) return false; }
  else if (state.status !== 'all' && isOn(x) !== (state.status === 'on')) return false;
  if (state.src !== 'all' && x.install !== state.src) return false;

  const q = state.filter.trim();
  if (!q) return true;
  // Keywords are not shown — they are an API field with nothing to link to —
  // but the filter still reads them, so a search finds what they are for.
  // At a word boundary, so filtering by "ai" does not also match "mailing".
  const re = new RegExp('\\b' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
  return re.test([x.name, x.pkg, x.desc, ...(x.keywords || [])].filter(Boolean).join(' '));
}

function selCtl(key, options) {
  const cur = options.find(([v]) => v === state[key]) || options[0];
  return `<button class="sel" type="button" data-menu="sel:${key}" aria-haspopup="menu"
    aria-expanded="false" data-set="${state[key] !== 'all'}">
    <span>${esc(cur[1])}</span><svg class="ic"><use href="#i-caret"/></svg></button>`;
}

/* Cards or a compact list. Only the two screens with a picture offer it:
   plugins are already a list, and a second density for them would be a
   control that changes nothing anyone asked about. */
const viewToggle = () => `<div class="vtoggle" role="group" aria-label="View">
  <button class="vbtn" type="button" data-view="cards" title="Cards"
    aria-label="Cards" aria-pressed="${state.view === 'cards'}">
    <svg class="ic"><use href="#i-grid"/></svg></button>
  <button class="vbtn" type="button" data-view="list" title="Compact list"
    aria-label="Compact list" aria-pressed="${state.view === 'list'}">
    <svg class="ic"><use href="#i-rows"/></svg></button></div>`;

function filterBar(noun, shown, total, sub = '', dense = false) {
  const inForce = [
    state.status !== 'all' && STATUS[state.screen].find(([v]) => v === state.status)[1],
    state.src !== 'all' && SRC.find(([v]) => v === state.src)[1],
    state.filter.trim() && `“${esc(state.filter.trim())}”`,
  ].filter(Boolean);

  return `<div class="toolbar">
      <div class="field"><svg class="ic"><use href="#i-search"/></svg>
        <input type="search" id="lf" placeholder="Filter ${noun}" value="${esc(state.filter)}"
          aria-label="Filter ${noun}"></div>
      ${selCtl('status', STATUS[state.screen])}${selCtl('src', SRC)}
      ${dense ? `<span class="sp"></span>${viewToggle()}` : ''}
    </div>
    <div class="filter-report">
      <span class="browse-count">${anyFilter() ? `${shown} of ${total} ${noun}`
        : `${total} ${noun}`}${sub && !anyFilter() ? ` · ${sub}` : ''}${
        inForce.length ? ` · ${inForce.join(' · ')}` : ''}</span>
      ${anyFilter() ? `<button class="btn btn-sm" type="button" data-clearfilter>Clear filters</button>` : ''}
    </div>`;
}
const emptyFilter = noun => `<div class="slab" style="margin:0">
  <p>No ${noun} match these filters.</p>
  <p><button class="btn btn-sm" type="button" data-clearfilter>Clear filters</button></p></div>`;

/* == THEMES ================================================================ */
const ROLES = ['bg','surface','text','muted','accent','border'];
/* The key is the contract — it names the CSS custom property and the field in
   the theme's manifest, so it never changes and is never shown. The label is
   copy: a whole word, Title Case because it labels rather than says, and the
   string a translation file would carry. */
const ROLE_NAME = { bg:'Background', surface:'Surface', text:'Text',
  muted:'Muted', accent:'Accent', border:'Border' };
const paletteVars = t => ROLES.map(r => `--t-${r}:light-dark(${t.pal[r][0]},${t.pal[r][1]})`).join(';');

function miniBody(t) {
  const ln = m => `<div class="pv-ln pv-ln-${m}"></div>`;
  const col = `<div class="pv-col"><div class="pv-h"></div><div class="pv-h pv-h-s"></div>
    <div class="pv-acc"></div>${ln('a')}${ln('b')}${ln('a')}${ln('c')}
    <div class="pv-card"><div class="pv-ph"></div>${ln('a')}${ln('c')}</div></div>`;
  const tile = `<div class="pv-card"><div class="pv-ph"></div>${ln('a')}${ln('c')}</div>`;
  if (t.layout === 'sidebar') return `<div class="pv-page">${col}
    <div class="pv-side">${ln('a')}${ln('b')}${ln('a')}${ln('c')}${ln('b')}${ln('a')}</div></div>`;
  if (t.layout === 'wide') return `<div class="pv-hero"><i></i></div>
    <div class="pv-row3">${tile}${tile}${tile}</div>`;
  return `<div class="pv-page" style="padding-inline:170px">${col}</div>`;
}

function preview(t, scheme) {
  if (t.broken || !t.pal) return `<div class="pv"><div class="pv-none">
    <svg class="ic"><use href="#i-alert"/></svg><span>No preview</span></div></div>`;
  return `<div class="pv" style="${scheme ? `color-scheme:${scheme};` : ''}${paletteVars(t)}">
    <div class="pv-in"><div class="mini">
      <div class="pv-hd"><div class="pv-mark"></div>
        <div class="pv-lk"></div><div class="pv-lk"></div><div class="pv-lk"></div></div>
      ${miniBody(t)}</div></div></div>`;
}

function fitPreviews() {
  document.querySelectorAll('.pv').forEach(pv => {
    const inner = pv.querySelector('.pv-in');
    if (inner) inner.style.transform = `scale(${pv.clientWidth / 1200})`;
  });
}

function themeCard(t) {
  const active = t.slug === state.active, busy = t.slug === state.busy,
        failed = t.slug === state.failed, blocked = blocker(t);
  const parent = t.fallback ? getTheme(t.fallback) : null;

  const badge = active ? `<span class="pill pill-active"><span class="dot"></span>Active</span>`
    : blocked ? `<span class="pill pill-broken"><span class="dot"></span>Can't activate</span>`
    : t.builtin ? `<span class="pill pill-builtin"><span class="dot"></span>Built in</span>` : '';

  let action;
  if (active)       action = `<a class="btn btn-sm" href="#"><svg class="ic"><use href="#i-external"/></svg>View site</a>`;
  else if (busy)    action = `<button class="btn btn-sm" type="button" disabled><span class="spin"></span>Activating…</button>`;
  else if (blocked) action = `<button class="btn btn-sm" type="button" disabled>Activate</button>`;
  else if (failed)  action = `<button class="btn btn-sm btn-danger" type="button" data-activate="${t.slug}">Try again</button>`;
  else              action = `<button class="btn btn-sm" type="button" data-activate="${t.slug}">Activate</button>`;

  const message = failed
    ? `<div class="tmsg tmsg-danger"><svg class="ic"><use href="#i-alert"/></svg><span>Your site is
        still serving ${esc(getTheme(state.active).name)} — nothing changed. The theme folder could
        not be read.</span></div>`
    : blocked ? `<div class="tmsg tmsg-warn"><svg class="ic"><use href="#i-alert"/></svg>
        <span>${esc(blocked)}</span></div>` : '';

  const fb = t.root ? `<li><svg class="ic"><use href="#i-fallback"/></svg>Every theme falls back to this one</li>`
    : !t.fallback ? ''
    : (parent && !parent.removed)
      ? `<li><svg class="ic"><use href="#i-fallback"/></svg>Falls back to
          <a href="#" data-go="themes:${parent.slug}">${esc(parent.name)}</a></li>`
      : `<li class="warn"><svg class="ic"><use href="#i-alert"/></svg><span>Falls back to
          <span class="mono">${esc(t.fallback)}</span>, which is not installed</span></li>`;

  return `<article class="tcard" data-active="${active}" data-busy="${busy}">
    ${preview(t)}
    <div class="tbody">
      <div class="tname"><a href="#" data-go="themes:${t.slug}">${esc(t.name)}</a>${badge}
        ${t.version ? `<span class="ver">${esc(t.version)}</span>` : ''}</div>
      ${t.desc ? `<p class="tdesc">${esc(t.desc)}</p>` : ''}
      <ul class="tfacts">${originFact(t)}
        ${t.type ? `<li><svg class="ic"><use href="#i-type"/></svg>${esc(t.type)}</li>` : ''}
        ${fb}</ul>
      ${message}
    </div>
    <div class="tfoot">${action}<span class="sp"></span>${menuTrigger('theme', t)}</div>
  </article>`;
}

/* The same theme, one line high. The picture shrinks rather than disappears,
   because the picture is why this screen is a grid in the first place. */
function themeRow(t) {
  const active = t.slug === state.active, busy = t.slug === state.busy,
        failed = t.slug === state.failed, blocked = blocker(t);
  const parent = t.fallback ? getTheme(t.fallback) : null;

  const badge = active ? `<span class="pill pill-active"><span class="dot"></span>Active</span>`
    : blocked ? `<span class="pill pill-broken"><span class="dot"></span>Can't activate</span>`
    : t.builtin ? `<span class="pill pill-builtin"><span class="dot"></span>Built in</span>` : '';

  let action;
  if (active)       action = `<a class="btn btn-sm" href="#"><svg class="ic"><use href="#i-external"/></svg>View site</a>`;
  else if (busy)    action = `<button class="btn btn-sm" type="button" disabled><span class="spin"></span>Activating…</button>`;
  else if (blocked) action = `<button class="btn btn-sm" type="button" disabled>Activate</button>`;
  else if (failed)  action = `<button class="btn btn-sm btn-danger" type="button" data-activate="${t.slug}">Try again</button>`;
  else              action = `<button class="btn btn-sm" type="button" data-activate="${t.slug}">Activate</button>`;

  const fb = t.root ? 'Every theme falls back to this one'
    : !t.fallback ? ''
    : (parent && !parent.removed)
      ? `Falls back to <a href="#" data-go="themes:${parent.slug}">${esc(parent.name)}</a>`
      : `<span class="warn-ink">Falls back to ${esc(t.fallback)}, which isn't installed</span>`;

  return `<div class="row">
    ${rowBadge(t, `<svg class="ic"><use href="#i-theme"/></svg>`)}
    <div>
      <div class="rname"><a href="#" data-go="themes:${t.slug}">${esc(t.name)}</a>${badge}
        <span class="pkg">${esc(t.version || '')}</span></div>
      <div class="rfacts"><span>${originRow(t)}</span>${t.type ? `<span>${esc(t.type)}</span>` : ''}
        ${fb ? `<span>${fb}</span>` : ''}</div>
      ${blocked ? `<div class="tmsg tmsg-warn" style="margin:var(--s-2) 0 0;max-width:70ch">
          <svg class="ic"><use href="#i-alert"/></svg><span>${esc(blocked)}</span></div>` : ''}
    </div>
    <div class="ract">${action}${menuSlot('theme', t)}</div>
  </div>`;
}

function themesList() {
  const all = live(THEMES);
  const hits = all.filter(matches)
    .sort((a, b) => (b.slug === state.active) - (a.slug === state.active));
  return pageHead('Themes',
      `The theme visitors see. The admin's own appearance is yours alone and is set on
       <a href="#">Your Account</a>.`,
      `<button class="btn btn-primary" type="button" data-install="theme">
         <svg class="ic"><use href="#i-upload"/></svg>Install Theme</button>`)
    + (state.loading ? '' : filterBar('themes', hits.length, all.length,
        `${getTheme(state.active) ? '1 active' : 'none active'}`, true))
    + (state.loading
        ? `<div class="cards">${skeletonCard().repeat(3)}</div>`
        : !hits.length ? emptyFilter('themes')
        : state.view === 'list'
          ? `<div class="rows">${hits.map(themeRow).join('')}</div>`
          : `<div class="cards">${hits.map(themeCard).join('')}</div>`)
    + `<div class="notice"><svg class="ic"><use href="#i-info"/></svg>
        <p>Themes live in <code>user/themes/</code> or come from Composer. One can also be
          activated from the command line: <code>bin/blush theme:activate {slug}</code>, and the
          active theme is recorded in <code>config/theme.php</code>.</p></div>`;
}

/* The preview IS the palette rendered, so each scheme shows its own six
   colors directly beneath the picture they drew. A separate Palette section
   made you look back and forth to pair a swatch with what it did. */
function appearanceHalf(t, half, label) {
  const rows = ROLES.map(role => {
    const fill = t.pal[role][half];
    return `<div><i style="background:${fill}"></i><b>${ROLE_NAME[role]}</b>` +
      `<span class="mono">${fill}</span></div>`;
  }).join('');
  return `<figure>${preview(t, half ? 'dark' : 'light')}
    <figcaption>${label}</figcaption>
    <div class="pal">${rows}</div></figure>`;
}

const appearancePanel = t => `<div class="card">
  <h2>Appearance <span class="hint">the six colors it declares, rendered and listed</span></h2>
  <div class="sect"><div class="sect-body">
    <div class="pv-pair">${appearanceHalf(t, 0, 'Light')}${appearanceHalf(t, 1, 'Dark')}</div>
  </div></div>
</div>`;

function themeDetail(t) {
  const active = t.slug === state.active, blocked = blocker(t);
  const badge = active
    ? `<span class="pill pill-active"><span class="dot"></span>Active</span>`
    : blocked
      ? `<span class="pill pill-broken"><span class="dot"></span>Can't activate</span>` : '';
  const action = active
    ? `<a class="btn" href="#"><svg class="ic"><use href="#i-external"/></svg>View site</a>`
    : blocked
      ? `<button class="btn" type="button" disabled>Activate</button>`
      : `<button class="btn btn-primary" type="button" data-activate="${t.slug}">Activate ${esc(t.name)}</button>`;

  const feature = (t.broken || !t.pal)
    ? `<div class="card"><h2>Appearance</h2>${sect('', '',
        `<div class="tmsg tmsg-warn" style="margin:0"><svg class="ic"><use href="#i-alert"/></svg>
          <span>${esc(t.broken || 'This theme declares no palette.')}</span></div>`)}</div>`
    : appearancePanel(t);

  const deps = dependents(t.slug).length;
  return detailShell(t, {
    action, badge, blocked, feature,
    identity: identityPanel(t, [['Type', esc(t.type || '—')]]),
    danger: dangerZone(t, 'theme', deps
      ? ` ${deps} theme${deps > 1 ? 's fall' : ' falls'} back to this one.` : ''),
  });
}

/* == ONE DETAIL SHELL ======================================================
   Every kind lays out the same: what it looks like (if it has a look), then
   Details beside Dependencies, then anything kind-specific, then deleting.
   ========================================================================= */
function detailShell(x, { action = '', badge = '', blocked, feature = '', identity, danger = '' }) {
  return backTo(KIND[x.kind].screen, `All ${KIND[x.kind].noun}s`)
    + pageHead(esc(x.name), esc(x.desc || `This ${KIND[x.kind].noun} has no description.`),
        action, badge)
    + `<div class="detail-stack">
        ${blocked ? `<div class="tmsg tmsg-warn" style="margin:0"><svg class="ic"><use href="#i-alert"/></svg>
          <span>${esc(blocked)} ${x.kind === 'theme'
            ? 'It cannot be activated until that is fixed.'
            : 'Nothing it registers runs, and it cannot be turned on.'}</span></div>` : ''}
        ${feature}
        <div class="detail-2up">${identity}${depsPanel(x)}</div>
        ${danger}
      </div>`;
}

/* == PLUGINS ===============================================================
   Rows, not cards: a plugin has no picture, and the list has only what the
   manifest says — a name, a package, a version, a sentence, and a switch.
   ========================================================================= */
function pluginRow(p) {
  const blocked = blocker(p);
  const on = p.on && !blocked;
  const badge = blocked
    ? `<span class="pill pill-broken"><span class="dot"></span>Can't turn on</span>` : '';

  return `<div class="row" data-off="${!on}">
    ${rowBadge(p, `<svg class="ic"><use href="#i-extension"/></svg>`)}
    <div>
      <div class="rname"><a href="#" data-go="plugins:${p.slug}">${esc(p.name)}</a>${badge}
        <span class="pkg">${esc(p.pkg)} ${esc(p.version)}</span></div>
      <p class="rdesc"${blocked ? '' : ' style="margin-bottom:0"'}>${esc(p.desc)}</p>
      ${blocked ? `<div class="tmsg tmsg-warn" style="margin:0;max-width:70ch">
          <svg class="ic"><use href="#i-alert"/></svg><span>${esc(blocked)}</span></div>` : ''}
    </div>
    <div class="ract">${switchCtl('plugin', p, on, !!blocked, blocked || '')}${menuSlot('plugin', p)}</div>
  </div>`;
}

function pluginsList() {
  const all = live(PLUGINS), hits = all.filter(matches);
  const on = all.filter(p => p.on && !blocker(p)).length;
  return pageHead('Plugins',
      'Code that adds content types, components, icons and actions to the site.',
      `<button class="btn btn-primary" type="button" data-install="plugin">
         <svg class="ic"><use href="#i-upload"/></svg>Install Plugin</button>`)
    + (state.loading ? '' : filterBar('plugins', hits.length, all.length, `${on} on`))
    + (state.loading ? skeletonRows()
        : hits.length ? `<div class="rows">${hits.map(pluginRow).join('')}</div>`
                      : emptyFilter('plugins'))
    + `<div class="notice"><svg class="ic"><use href="#i-info"/></svg>
        <p>Plugins live in <code>user/plugins/</code> or come from Composer. Turning one off
          writes to <code>config/plugins.php</code>, so a deploy keeps the same answer.</p></div>`;
}

function pluginDetail(p) {
  const blocked = blocker(p);
  const badge = blocked
    ? `<span class="pill pill-broken"><span class="dot"></span>Can't turn on</span>` : '';
  const action = blocked ? '' : switchCtl('plugin', p, p.on && !blocked, false);
  return detailShell(p, { action, badge, blocked, identity: identityPanel(p),
    danger: dangerZone(p, 'plugin') });
}

/* == ICON PACKS ============================================================
   Cards, because a pack's icons are its preview, and they are files on disk —
   readable without running anything, which is why this screen can show them.
   ========================================================================= */
const glyph = (g, cls = 'ic') => `<svg class="${cls}" viewBox="0 0 24 24">${g.d}</svg>`;
const packOn = k => k.on && !blocker(k);
const CELLS = 12;

function packCard(k) {
  const on = packOn(k);
  const blocked = blocker(k);
  const over = k.icons.length > CELLS;
  const shown = k.icons.slice(0, over ? CELLS - 1 : CELLS);
  const pad = CELLS - shown.length - (over ? 1 : 0);
  const locked = k.install === 'builtin' || !!blocked;
  const why = k.install === 'builtin' ? 'The core set is always on.' : (blocked || '');

  return `<article class="tcard" data-active="false">
    <div class="glyphs">${shown.map(g => `<div>${glyph(g)}</div>`).join('')}
      ${over ? `<div><span class="more">+${k.icons.length - shown.length}</span></div>` : ''}
      ${'<div></div>'.repeat(pad)}</div>
    <div class="tbody">
      <div class="tname"><a href="#" data-go="packs:${k.slug}">${esc(k.name)}</a>
        ${blocked ? `<span class="pill pill-broken"><span class="dot"></span>Can't turn on</span>`
          : k.install === 'builtin' ? `<span class="pill pill-builtin"><span class="dot"></span>Built in</span>` : ''}
        ${k.version ? `<span class="ver">${esc(k.version)}</span>` : ''}</div>
      <p class="tdesc">${esc(k.desc)}</p>
      <ul class="tfacts">${originFact(k)}
        <li><svg class="ic"><use href="#i-icons"/></svg>${k.icons.length} icons in
          <span class="mono">${esc(k.ns)}/</span></li></ul>
      ${blocked ? `<div class="tmsg tmsg-warn"><svg class="ic"><use href="#i-alert"/></svg>
        <span>${esc(blocked)}</span></div>` : ''}
    </div>
    <div class="tfoot">${switchCtl('pack', k, on, locked, why)}<span class="sp"></span>${menuTrigger('pack', k)}</div>
  </article>`;
}

/* A pack's contents are its face, so the compact row keeps three of them. */
function packRow(k) {
  const on = packOn(k), blocked = blocker(k);
  const locked = k.install === 'builtin' || !!blocked;
  const why = k.install === 'builtin' ? 'The core set is always on.' : (blocked || '');

  return `<div class="row" data-off="${!on}">
    ${rowBadge(k, k.icons[0] ? glyph(k.icons[0]) : `<svg class="ic"><use href="#i-icons"/></svg>`)}
    <div>
      <div class="rname"><a href="#" data-go="packs:${k.slug}">${esc(k.name)}</a>
        ${blocked ? `<span class="pill pill-broken"><span class="dot"></span>Can't turn on</span>`
          : k.install === 'builtin' ? `<span class="pill pill-builtin"><span class="dot"></span>Built in</span>` : ''}
        <span class="pkg">${esc(k.version || '')}</span></div>
      <div class="rfacts"><span class="mono">${esc(k.ns)}/</span>
        <span>${k.icons.length} icons</span><span>${originRow(k)}</span></div>
      ${blocked ? `<div class="tmsg tmsg-warn" style="margin:var(--s-2) 0 0;max-width:70ch">
          <svg class="ic"><use href="#i-alert"/></svg><span>${esc(blocked)}</span></div>` : ''}
    </div>
    <div class="ract">${switchCtl('pack', k, on, locked, why)}${menuSlot('pack', k)}</div>
  </div>`;
}

function packsList() {
  const all = live(PACKS), hits = all.filter(matches);
  const total = all.filter(packOn).reduce((n, k) => n + k.icons.length, 0);
  return pageHead('Icon Packs',
      'Sets of icons for content, menus and buttons, each in a namespace of its own.',
      `<button class="btn btn-primary" type="button" data-install="pack">
         <svg class="ic"><use href="#i-upload"/></svg>Install Icon Pack</button>`)
    + (state.loading ? '' : filterBar('packs', hits.length, all.length,
        `${total} icons available`, true))
    + (state.loading
        ? `<div class="cards">${skeletonCard().repeat(3)}</div>`
        : !hits.length ? emptyFilter('packs')
        : state.view === 'list'
          ? `<div class="rows">${hits.map(packRow).join('')}</div>`
          : `<div class="cards">${hits.map(packCard).join('')}</div>`)
    + `<div class="notice"><svg class="ic"><use href="#i-info"/></svg>
        <p>Icon packs live in <code>user/icons/</code> or come from Composer. An icon is
          referenced as <code>pack/name</code>, and the namespace is what lets two packs use the
          same name.</p></div>`;
}

function packDetail(k) {
  const blocked = blocker(k);
  const on = packOn(k);
  const locked = k.install === 'builtin' || !!blocked;
  const why = k.install === 'builtin' ? 'The core set is always on.' : (blocked || '');
  const q = state.query.trim().toLowerCase();
  const hits = k.icons.filter(g => g.n.includes(q));

  const browser = `<div class="card">
    <h2>Icons <span class="hint">click one to copy its reference</span></h2>
    <div class="sect"><div class="sect-body" style="padding-top:var(--s-4)">
      <div class="browse-bar">
        <div class="field"><svg class="ic"><use href="#i-search"/></svg>
          <input type="search" id="gq" placeholder="Filter icons" value="${esc(state.query)}"
            aria-label="Filter icons"></div>
        <span class="browse-count">${hits.length === k.icons.length
          ? `${k.icons.length} icons` : `${hits.length} of ${k.icons.length}`}</span>
      </div>
      ${hits.length ? `<div class="browse">${hits.map(g =>
        `<button class="gcell" type="button" data-copy="${esc(k.ns)}/${esc(g.n)}">
           ${glyph(g)}<code>${esc(k.ns)}/${esc(g.n)}</code></button>`).join('')}</div>`
      : `<p class="rdesc" style="margin:0">No icon in this pack matches “${esc(state.query)}”.</p>`}
    </div></div></div>`;

  return detailShell(k, {
    action: blocked ? '' : switchCtl('pack', k, on, locked, why),
    badge: blocked
      ? `<span class="pill pill-broken"><span class="dot"></span>Can't turn on</span>` : '',
    blocked,
    feature: browser,
    identity: identityPanel(k, [['Namespace', `<span class="mono">${esc(k.ns)}/</span>`],
                                ['Icons', `${k.icons.length}`]]),
    danger: dangerZone(k, 'icon pack'),
  });
}

/* == ROUTER ================================================================ */
const SCREENS = {
  themes:  { label:'Themes',     list:themesList,  detail:themeDetail,  get:getTheme },
  plugins: { label:'Plugins',    list:pluginsList, detail:pluginDetail, get:getPlugin },
  packs:   { label:'Icon Packs', list:packsList,   detail:packDetail,   get:getPack },
};

function render() {
  const s = SCREENS[state.screen];
  const item = state.detail ? s.get(state.detail) : null;
  $('#screen').innerHTML = item ? s.detail(item) : s.list();

  $('#trail').innerHTML = `<a href="#">Config</a><span>/</span>` + (item
    ? `<a href="#" data-go="${state.screen}">${s.label}</a><span>/</span><b>${esc(item.name)}</b>`
    : `<b>${s.label}</b>`);

  document.querySelectorAll('[data-nav]').forEach(a =>
    a.toggleAttribute('aria-current', a.dataset.nav === state.screen) ||
    a.setAttribute('aria-current', a.dataset.nav === state.screen ? 'page' : 'false'));
  document.querySelectorAll('[data-nav]').forEach(a => {
    if (a.dataset.nav === state.screen) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });

  $('#n-themes').textContent  = live(THEMES).length;
  $('#n-plugins').textContent = live(PLUGINS).length;
  $('#n-packs').textContent   = live(PACKS).length;
  fitPreviews();
}

/* "themes" goes to a list, "themes:quill" to a detail screen. */
function go(target, keepFilter) {
  const [screen, slug] = String(target).split(':');
  if (SCREENS[screen]) { state.screen = screen; state.detail = slug || null; }
  state.failed = null;
  state.query = '';
  // The view is a preference and survives; the filters belong to the screen.
  if (!keepFilter) { state.filter = ''; state.status = 'all'; state.src = 'all'; }
  $('#work').scrollTop = 0;       // the pane scrolls on desktop…
  scrollTo(0, 0);                 // …the document scrolls on a phone
  render();
}
/* == ACTIONS =============================================================== */
function activate(slug) {
  state.busy = slug; state.failed = null; render();
  setTimeout(() => {
    state.busy = null;
    // Atlas stands in for an activation the server refuses.
    if (slug === 'atlas') { state.failed = slug; render(); toast(`Could not activate ${getTheme(slug).name}`, false); }
    else { state.active = slug; render(); toast(`Activated ${getTheme(slug).name}`); }
  }, 1000);
}

/* A switch takes effect the moment it moves, so this says what happened in the
   past tense rather than asking first. Turning a plugin off takes the icons it
   contributed with it, which the toast names so nobody has to notice. */
function togglePlugin(slug) {
  const p = getPlugin(slug);
  p.on = !p.on;
  // Anything that required it is now blocked; requirements() picks that up.
  const hit = live(PLUGINS).filter(o => o !== p && pluginBlocker(o) && o.on).length;
  render();
  toast(p.on ? `Turned on ${p.name}` : `Turned off ${p.name}`);
}

function togglePack(slug) {
  const k = getPack(slug);
  k.on = !k.on;
  render();
  toast(k.on ? `Turned on ${k.name}` : `Turned off ${k.name} — ${k.icons.length} icons are no longer available`);
}

function remove(kind, slug) {
  const x = kind === 'theme' ? getTheme(slug) : kind === 'plugin' ? getPlugin(slug) : getPack(slug);
  x.removed = true;
  // A deleted theme's dependents keep pointing at a name that is now gone,
  // which blocks them rather than silently re-parenting them. blocker() sees it.
  if (state.detail === slug) go(kind === 'theme' ? 'themes' : kind === 'plugin' ? 'plugins' : 'packs');
  else render();
  toast(`Deleted ${x.name}`);
}

let toastTimer;
function toast(msg, good = true) {
  $('#toasts').innerHTML = `<div class="toast ${good ? '' : 'bad'}" role="status">
    <svg class="ic"><use href="#i-${good ? 'check' : 'alert'}"/></svg>${esc(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toasts').innerHTML = '', 2600);
}

/* == MODALS ================================================================ */
const modal = $('#modal');
function openModal(title, body, foot) {
  $('#m-title').textContent = title;
  $('#m-body').innerHTML = body;
  $('#m-foot').innerHTML = foot;
  modal.showModal();
  modal.querySelector('[data-focus]')?.focus();
}
modal.addEventListener('click', e => { if (e.target.closest('[data-close]')) modal.close(); });

/* Nobody aims for the dashed rectangle, so a file dropped anywhere on the
   modal counts. The zone lights up wherever the pointer is. */
const over = on => $('#drop')?.setAttribute('data-over', String(on));
modal.addEventListener('dragover', e => { e.preventDefault(); over(true); });
modal.addEventListener('dragleave', e => { if (!modal.contains(e.relatedTarget)) over(false); });
modal.addEventListener('drop', e => {
  e.preventDefault(); over(false);
  if (IN.phase === 'working') return;
  choose(e.dataTransfer?.files?.[0]);
});

function confirmActivate(t) {
  openModal(`Activate ${t.name}`,
    `<p>Visitors will see the ${esc(t.name)} theme the moment this is saved. Your content,
      URLs and settings are unchanged, and you can switch back at any time.</p>`,
    `<button class="btn" type="button" data-close data-focus>Cancel</button>
     <button class="btn btn-primary" type="button" data-close data-confirm-activate="${t.slug}">Activate ${esc(t.name)}</button>`);
}

function confirmDelete(kind, slug) {
  const x = kind === 'theme' ? getTheme(slug) : kind === 'plugin' ? getPlugin(slug) : getPack(slug);
  const noun = kind === 'icon pack' ? 'icon pack' : kind;
  let extra = '';
  if (kind === 'theme') {
    const deps = dependents(slug);
    if (deps.length) extra = `<p>${deps.map(d => esc(d.name)).join(' and ')}
      fall${deps.length > 1 ? '' : 's'} back to ${esc(x.name)}, and will not be activatable until
      ${deps.length > 1 ? 'they are' : 'it is'} pointed at a theme that is installed.</p>`;
  }
  if (kind === 'plugin') {
    const needs = everything().filter(o => o !== x &&
      (o.rel?.requires || []).some(r => r.pkg === x.pkg));
    extra = `<p>Everything it registered stops existing. Content that used it keeps its text
      and loses the rendering.</p>`
      + (needs.length ? `<p>${needs.map(o => esc(o.name)).join(' and ')} require${needs.length > 1 ? '' : 's'}
          it, and will not be able to turn on.</p>` : '');
  }
  if (kind === 'pack') extra = `<p>${x.icons.length} icons in
    <span class="mono">${esc(x.ns)}/</span> stop resolving. Anywhere one is referenced falls back
    to no icon.</p>`;

  openModal(`Delete ${x.name}`,
    `<p>The folder <code>${esc(x.source)}/${esc(x.slug)}</code> and everything in it is removed
      from the server. This cannot be undone.</p>${extra}`,
    `<button class="btn" type="button" data-close data-focus>Cancel</button>
     <button class="btn btn-danger" type="button" data-close data-confirm-delete="${kind}:${slug}">Delete ${esc(x.name)}</button>`);
}

/* == INSTALLING ============================================================
   The same two routes for all three kinds: a folder under user/{kind}/, or a
   Composer package. The uploader covers the first one.

   Nothing is really uploaded here, so the outcome is read off the file you
   choose, which keeps every state reachable:
     anything.zip                 installs
     <an installed slug>.zip      already installed — offers to replace it
     <a slug from another screen> wrong kind — offers the screen it belongs to
     a name containing "broken"   unpacks, but has no manifest
     not a .zip                   refused before anything is sent
   ========================================================================= */
const INSTALL = {
  theme:  { title:'Install Theme',     noun:'theme',     dir:'user/themes',  list:THEMES,
            drag:'Drag a Theme Here',  next:'Activate',  screen:'themes',
            blurb:'A .zip of the theme folder. It is unpacked into user/themes/ and nothing is activated.' },
  plugin: { title:'Install Plugin',    noun:'plugin',    dir:'user/plugins', list:PLUGINS,
            drag:'Drag a Plugin Here', next:'Turn on',   screen:'plugins',
            blurb:'A .zip of the plugin folder. It is unpacked into user/plugins/ and arrives turned off.' },
  pack:   { title:'Install Icon Pack', noun:'icon pack', dir:'user/icons',   list:PACKS,
            drag:'Drag an Icon Pack Here', next:'Turn on', screen:'packs',
            blurb:'A .zip of the pack folder. It is unpacked into user/icons/ and arrives turned off.' },
};

const IN = { kind:null, phase:'idle', file:null, err:null, clash:null, made:null, pct:0, step:'' };

const kb = n => n < 1024 * 1024 ? `${Math.max(1, Math.round(n / 1024))} KB`
                                : `${(n / 1048576).toFixed(1)} MB`;
const titleCase = s => s.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

function installModal(kind) {
  Object.assign(IN, { kind, phase:'idle', file:null, err:null, clash:null, made:null, pct:0 });
  renderInstall();
  modal.showModal();
}

/* What the chosen file turns out to be. In the real admin this is the server
   answering; here it is the file name. */
function inspect(file) {
  const i = INSTALL[IN.kind];
  const base = file.name.replace(/\.[^.]+$/, '').toLowerCase();
  if (!/\.zip$/i.test(file.name))
    return { err:'type', say:`${esc(file.name)} is not a .zip file.` };

  const here = live(i.list).find(x => x.slug === base);
  if (here) return { clash:here };

  for (const [k, other] of Object.entries(INSTALL)) {
    if (k === IN.kind) continue;
    const found = live(other.list).find(x => x.slug === base);
    if (found) return { err:'kind', wrong:k, say:`${esc(file.name)} is a ${other.noun}, not a ${i.noun}.` };
  }
  if (/broken|bad/.test(base))
    return { err:'manifest', say:`${esc(file.name)} unpacked, but there is no
      <span class="mono">blush.json</span> in it, so it is not a ${i.noun}.` };

  return { ok:base };
}

function choose(file) {
  if (!file) return;
  IN.file = file;
  const v = inspect(file);
  if (v.err)        Object.assign(IN, { phase:'error', err:v });
  else if (v.clash) Object.assign(IN, { phase:'clash', clash:v.clash });
  else              Object.assign(IN, { phase:'chosen', err:null, clash:null });
  renderInstall();
}

/* Build what the manifest would have said. */
function makeExtension(slug, version) {
  const i = INSTALL[IN.kind], name = titleCase(slug);
  const common = { slug, name, version, install:'folder', source:i.dir, kind:IN.kind,
                   pkg:`example/${slug}`, authors:[['Unknown','Developer',null]], license:'MIT',
                   links:{}, keywords:[], rel:{ requires:[{ core:'^2.0' }] } };
  if (IN.kind === 'theme') return { ...common, fallback:'default', layout:'centered',
    type:'Sans throughout', desc:`Installed from ${esc(IN.file.name)}.`,
    pal:{ bg:['#fdfdfc','#101214'], surface:['#ffffff','#181b1e'], text:['#17191c','#eceef0'],
          muted:['#6b7075','#8f959b'], accent:['#7a4bd0','#b490f5'], border:['#e7e8ea','#24282c'] } };
  if (IN.kind === 'plugin') return { ...common, on:false, desc:`Installed from ${esc(IN.file.name)}.` };
  return { ...common, ns:slug, on:false,
    desc:`Installed from ${esc(IN.file.name)}.`,
    icons: pk(slug, ['star','tag','bookmark','link','bell','pin','mail','play']) };
}

function runInstall(replacing) {
  IN.phase = 'working'; IN.pct = 0; IN.step = `Uploading ${IN.file.name}`;
  renderInstall();
  const steps = [[35, 'Unpacking'], [70, 'Reading blush.json'], [100, 'Writing files']];
  steps.forEach(([pct, step], n) => setTimeout(() => {
    if (IN.phase !== 'working') return;
    IN.pct = pct; IN.step = step; renderInstall();
  }, 380 * (n + 1)));

  setTimeout(() => {
    if (IN.phase !== 'working') return;
    const i = INSTALL[IN.kind];
    if (replacing) {
      replacing.version = bump(replacing.version);
      IN.made = replacing; IN.phase = 'done'; IN.replaced = true;
    } else {
      const made = makeExtension(inspect(IN.file).ok, '1.0.0');
      i.list.push(made);
      IN.made = made; IN.phase = 'done'; IN.replaced = false;
    }
    renderInstall();
    render();
  }, 380 * 4);
}
const bump = v => { const n = v.split('.').map(Number); n[1] += 1; n[2] = 0; return n.join('.'); };

function renderInstall() {
  const i = INSTALL[IN.kind];
  $('#m-title').textContent = i.title;

  const intro = `<p>${i.noun[0].toUpperCase()}${i.noun.slice(1)}s are folders under
    <code>${i.dir}/</code>. One published as a package is installed with
    <code>composer require vendor/name</code> instead, and Composer owns it from then on.</p>`;

  let body, foot;

  if (IN.phase === 'idle' || IN.phase === 'chosen') {
    body = intro + `<div class="drop" id="drop">
        <svg class="ic ic-lg"><use href="#i-upload"/></svg>
        <h3>${i.drag}</h3>
        <p>${i.blurb}</p>
        <button class="btn btn-primary" type="button" data-pick>Choose file</button>
        <p class="limits">Up to 25 MB · ZIP</p>
      </div>
      <input type="file" id="pickfile" accept=".zip" hidden>`;
    foot = `<span class="status">${IN.file
        ? `<b>${esc(IN.file.name)}</b> · ${kb(IN.file.size)}` : 'Choose a file.'}</span>
      <button class="btn" type="button" data-close data-focus>Cancel</button>
      <button class="btn btn-primary" type="button" ${IN.file ? 'data-run' : 'disabled'}>Install</button>`;
  }

  else if (IN.phase === 'working') {
    body = intro + `<div class="slab">
        <div class="slab-head"><span class="spin"></span>${esc(IN.step)}…</div>
        <div class="bar"><i style="width:${IN.pct}%"></i></div>
        <p><b>${esc(IN.file.name)}</b> · ${kb(IN.file.size)}</p></div>`;
    foot = `<span class="status">Installing…</span>
      <button class="btn" type="button" disabled>Cancel</button>
      <button class="btn btn-primary" type="button" disabled><span class="spin"></span>Install</button>`;
  }

  else if (IN.phase === 'done') {
    const m = IN.made;
    body = `<div class="slab slab-good">
        <div class="slab-head"><svg class="ic"><use href="#i-ok"/></svg>
          ${IN.replaced ? 'Updated' : 'Installed'} ${esc(m.name)} ${esc(m.version)}</div>
        <p>${IN.replaced
            ? `The folder was replaced. Nothing else changed — it is still
               ${IN.kind === 'theme' ? (m.slug === state.active ? 'the active theme' : 'inactive')
                                     : (m.on ? 'turned on' : 'turned off')}.`
            : `It is in the list below, ${IN.kind === 'theme' ? 'inactive' : 'turned off'},
               until you say otherwise.`}</p>
        <dl><dt>Folder</dt><dd class="mono">${esc(m.source)}/${esc(m.slug)}</dd>
            <dt>From</dt><dd>${esc(IN.file.name)} · ${kb(IN.file.size)}</dd></dl>
      </div>`;
    const canNext = !blocker(m);
    foot = `<span class="status"></span>
      <button class="btn" type="button" data-close data-focus>Done</button>
      ${canNext ? `<button class="btn btn-primary" type="button"
        data-next="${IN.kind}:${m.slug}">${i.next} ${esc(m.name)}</button>` : ''}`;
  }

  else if (IN.phase === 'clash') {
    const c = IN.clash;
    body = intro + `<div class="slab slab-warn">
        <div class="slab-head"><svg class="ic"><use href="#i-alert"/></svg>
          ${esc(c.name)} is already installed</div>
        <p>Replacing overwrites <span class="mono">${esc(c.source)}/${esc(c.slug)}</span>.
          Nothing else changes${IN.kind === 'theme' && c.slug === state.active
            ? ' — it stays the active theme, and the site serves the new files immediately' : ''}.</p>
        <dl><dt>Installed</dt><dd class="mono">${esc(c.version)}</dd>
            <dt>This file</dt><dd class="mono">${esc(bump(c.version))}</dd></dl>
      </div>`;
    foot = `<span class="status"><b>${esc(IN.file.name)}</b> · ${kb(IN.file.size)}</span>
      <button class="btn" type="button" data-close data-focus>Cancel</button>
      <button class="btn btn-primary" type="button" data-run="replace">Replace ${esc(c.version)}
        with ${esc(bump(c.version))}</button>`;
  }

  else { /* error — lead with what is safe, then the way out */
    const e = IN.err, other = e.wrong ? INSTALL[e.wrong] : null;
    body = intro + `<div class="slab slab-bad">
        <div class="slab-head"><svg class="ic"><use href="#i-alert"/></svg>Nothing was installed</div>
        <p>${e.say}</p>
        ${other ? `<p>Install it on the ${other.title.replace('Install ', '')}s screen instead.</p>` : ''}
      </div>`;
    foot = `<span class="status"></span>
      <button class="btn" type="button" data-close>Cancel</button>
      ${other ? `<button class="btn" type="button" data-hop="${e.wrong}">Go to ${other.noun}s</button>` : ''}
      <button class="btn btn-primary" type="button" data-pick data-focus>Choose another file</button>`;
  }

  $('#m-body').innerHTML = body;
  $('#m-foot').innerHTML = foot;
  $('#m-body').querySelector('[data-focus]')?.focus() ?? $('#m-foot').querySelector('[data-focus]')?.focus();
}

/* == ROW MENU ============================================================== */
const menu = $('#menu');
let menuFor = null;

function closeMenu(restoreFocus) {
  if (!menuFor) return;
  const btn = document.querySelector(`[data-menu="${menuFor}"]`);
  menu.dataset.open = 'false';
  if (btn) { btn.setAttribute('aria-expanded', 'false'); if (restoreFocus) btn.focus(); }
  menuFor = null;
}

function openMenu(ref, btn) {
  const [kind, slug] = ref.split(':');

  // A select borrows the menu: same surface, same keys, same dismissal.
  if (kind === 'sel') {
    const opts = slug === 'status' ? STATUS[state.screen] : SRC;
    menu.innerHTML = opts.map(([v, label]) =>
      `<button type="button" role="menuitemradio" aria-checked="${state[slug] === v}"
        data-mi="opt:${v}">${state[slug] === v
          ? `<svg class="ic"><use href="#i-check"/></svg>`
          : `<span class="ic"></span>`}${esc(label)}</button>`).join('');
    menu.dataset.open = 'true';
    menuFor = ref;
    btn.setAttribute('aria-expanded', 'true');
    menu.dataset.screen = state.screen;
    placeMenu(btn, true);
    menu.querySelector('button').focus();
    return;
  }

  const x = kind === 'theme' ? getTheme(slug) : kind === 'plugin' ? getPlugin(slug) : getPack(slug);
  const screen = kind === 'theme' ? 'themes' : kind === 'plugin' ? 'plugins' : 'packs';

  const items = [];
  menuItems(kind, x).forEach(([mi, icon, label, danger], i, all) => {
    // Delete is last and always behind a rule: it never sits next to a safe action.
    if (danger) items.push('<hr>');
    items.push(`<button type="button" role="menuitem"${danger ? ' class="danger"' : ''} data-mi="${mi}">
      <svg class="ic"><use href="#${icon}"/></svg>${label}</button>`);
  });

  menu.innerHTML = items.join('');
  menu.dataset.open = 'true';
  menuFor = ref;
  btn.setAttribute('aria-expanded', 'true');
  menu.dataset.screen = screen;
  menu.style.minWidth = '';
  placeMenu(btn);
  menu.querySelector('button').focus();
}

/* A row's ⋯ menu hangs from the button's right edge; a select's list opens
   under its own left edge and is never narrower than the control it came
   from, because it has to read as that control opening. */
function placeMenu(btn, alignLeft) {
  if (alignLeft) menu.style.minWidth = `${btn.getBoundingClientRect().width}px`;
  const r = btn.getBoundingClientRect(), m = menu.getBoundingClientRect();
  let top = r.bottom + 6;
  if (top + m.height > innerHeight - 8) top = r.top - m.height - 6;   // flip above
  const left = alignLeft ? r.left : r.right - m.width;
  menu.style.top = `${top}px`;
  menu.style.left = `${Math.max(8, Math.min(left, innerWidth - m.width - 8))}px`;
}

menu.addEventListener('keydown', e => {
  const items = [...menu.querySelectorAll('button')];
  const i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  if (e.key === 'ArrowUp')   { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  if (e.key === 'Escape')    { e.preventDefault(); closeMenu(true); }
});

menu.addEventListener('click', e => {
  const item = e.target.closest('[data-mi]'); if (!item) return;
  const ref = menuFor, [kind, slug] = ref.split(':');

  if (kind === 'sel') {
    state[slug] = item.dataset.mi.slice(4);
    closeMenu(false);
    render();
    return;
  }

  const x = kind === 'theme' ? getTheme(slug) : kind === 'plugin' ? getPlugin(slug) : getPack(slug);
  const screen = menu.dataset.screen;
  closeMenu(false);
  if (item.dataset.mi === 'open')   go(`${screen}:${slug}`);
  if (item.dataset.mi === 'copy')   { navigator.clipboard?.writeText(`${x.source}/${x.slug}`);
                                      toast(`Copied ${x.source}/${x.slug}`); }
  if (item.dataset.mi === 'delete') confirmDelete(kind, slug);
});

/* == WIRING ================================================================ */
document.addEventListener('click', e => {
  const menuBtn = e.target.closest('[data-menu]');
  if (!menuBtn && !e.target.closest('#menu')) closeMenu(false);

  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); go(nav.dataset.nav); return; }

  const link = e.target.closest('[data-go]');
  if (link) { e.preventDefault(); go(link.dataset.go); return; }

  if (menuBtn) { e.preventDefault();
    menuFor === menuBtn.dataset.menu ? closeMenu(true) : openMenu(menuBtn.dataset.menu, menuBtn); return; }

  const act = e.target.closest('[data-activate]');
  if (act) { e.preventDefault(); confirmActivate(getTheme(act.dataset.activate)); }

  const del = e.target.closest('[data-delete]');
  if (del) { e.preventDefault(); const [k, s] = del.dataset.delete.split(':'); confirmDelete(k, s); }

  const ins = e.target.closest('[data-install]');
  if (ins) { e.preventDefault(); installModal(ins.dataset.install); }

  // the uploader
  if (e.target.closest('[data-pick]')) {
    if (IN.phase === 'error') { Object.assign(IN, { phase:'idle', file:null, err:null }); renderInstall(); }
    $('#pickfile')?.click();
  }
  const run = e.target.closest('[data-run]');
  if (run) runInstall(run.dataset.run === 'replace' ? IN.clash : null);

  if (e.target.closest('[data-clearfilter]')) {
    state.filter = ''; state.status = 'all'; state.src = 'all'; render(); return; }

  const vb = e.target.closest('[data-view]');
  if (vb) { state.view = vb.dataset.view; render(); return; }

  const hop = e.target.closest('[data-hop]');
  if (hop) { modal.close(); installModal(hop.dataset.hop); }

  // the one next step the receipt offers
  const next = e.target.closest('[data-next]');
  if (next) {
    const [kind, slug] = next.dataset.next.split(':');
    modal.close();
    if (kind === 'theme') { go('themes'); activate(slug); }
    else { go(kind === 'plugin' ? 'plugins' : 'packs');
           kind === 'plugin' ? togglePlugin(slug) : togglePack(slug); }
  }

  const copy = e.target.closest('[data-copy]');
  if (copy) { navigator.clipboard?.writeText(copy.dataset.copy); toast(`Copied ${copy.dataset.copy}`); }

  const okA = e.target.closest('[data-confirm-activate]');
  if (okA) activate(okA.dataset.confirmActivate);

  const okD = e.target.closest('[data-confirm-delete]');
  if (okD) { const [k, s] = okD.dataset.confirmDelete.split(':'); remove(k, s); }
});

document.addEventListener('change', e => {
  if (e.target.id === 'pickfile') { choose(e.target.files[0]); return; }
  const sw = e.target.closest('[data-toggle]'); if (!sw) return;
  const [kind, slug] = sw.dataset.toggle.split(':');
  if (kind === 'plugin') togglePlugin(slug); else togglePack(slug);
});

/* The icon filter keeps focus across the re-render, so typing is continuous. */
/* Both filters keep focus and caret across the re-render, so typing is
   continuous rather than one character per click. */
function keepCaret(id, set) {
  return e => {
    if (e.target.id !== id) return;
    set(e.target.value);
    render();
    const f = $('#' + id);
    if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
  };
}
document.addEventListener('input', keepCaret('gq', v => state.query = v));
document.addEventListener('input', keepCaret('lf', v => state.filter = v));

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(true); });
addEventListener('resize', fitPreviews);

$('#burger').addEventListener('click', () => {
  const open = $('#app').dataset.drawer === 'open';
  $('#app').dataset.drawer = open ? '' : 'open';
  $('#burger').setAttribute('aria-expanded', String(!open));
});
$('#scrim').addEventListener('click', () => {
  $('#app').dataset.drawer = ''; $('#burger').setAttribute('aria-expanded', 'false');
});

render();
setTimeout(() => { state.loading = false; render(); }, 900);   // skeletons, then data

</script>
</body>
</html>
