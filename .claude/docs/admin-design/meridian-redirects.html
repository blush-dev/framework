.toast-ring rect{x:.75px;y:.75px;width:calc(100% - 1.5px);height:calc(100% - 1.5px);rx:calc(var(--r-2) - .75px);fill:none;stroke-width:1.5;stroke-linecap:butt}
.toast-ring .track{stroke:var(--border)}
.toast-ring .run{stroke:var(--good-dot);stroke-dasharray:100;stroke-dashoffset:0}
.toast.danger .toast-ring .run{stroke:var(--danger-dot)}
.toast.warn .toast-ring .run{stroke:var(--warn-dot)}
.toast.info .toast-ring .run{stroke:var(--accent)}
.toast.info{border:0}
@media (prefers-reduced-motion:no-preference){
  .toast-ring .run{animation:toast-run var(--life,2600ms) linear forwards}
  .toast.held .toast-ring .run{animation-play-state:paused}
}
@keyframes toast-run{to{stroke-dashoffset:100}}
.rtype .tw-s{display:none}
table.tbl.rd.dense .rtype{white-space:nowrap}
table.tbl.rd.dense .rtype .tw{display:none}
table.tbl.rd.dense .rtype .tw-s{display:inline}
</style>

<script>
/* ============================================================ helpers == */
const I = n => '<svg class="ic" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Number(n).toLocaleString('en-US');
const plural = (n, one, many) => fmt(n) + ' ' + (n === 1 ? one : (many || one + 's'));
const slug = s => String(s).toLowerCase().normalize('NFKD').replace(/[^\w\s-]/g, '').trim().replace(/[\s_]+/g, '-').replace(/-+/g, '-');
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const TODAY = '2026-10-09';
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); if (!m) return s; return MON[+m[2] - 1] + ' ' + (+m[3]) + ', ' + m[1]; };
const code = s => '<code class="mono">' + esc(s) + '</code>';
const HOST = 'meridianreview.org';

/* ============================================================ the site == */
/* What answers an address on its own. A redirect never hides one of these. */
const ENTRIES = [];
let eid = 0;
const ent = (title, path, kind, o) => { const e = Object.assign({id:'e' + (++eid), title, path, kind}, o || {}); ENTRIES.push(e); return e; };
ent('Home', '/', 'Page');
const ABOUT = ent('About', '/about', 'Page');
const CONTACT = ent('Contact', '/contact', 'Page');
ent('Colophon', '/colophon', 'Page');
const NEWS = ent('Newsletter', '/newsletter', 'Page');
const WORKS = ent('Workshops', '/workshops', 'Page');
const SPRING = ent('Spring 2027 Workshop', '/workshops/spring-2027', 'Page');
ent('Writing', '/blog', 'Index Page');
const TYPO = ent('Typography', '/topics/typography', 'Topic');
ent('Interfaces', '/topics/interfaces', 'Topic');
ent('Craft', '/topics/craft', 'Topic');
ent('Every Dash, Ranked', '/blog/every-dash-ranked', 'Post');
const TABLE = ent('The Long Table', '/blog/the-long-table', 'Post');
const SMALL = ent('Reading on Small Screens', '/blog/reading-on-small-screens', 'Post');
const MARG = ent('Margins Are Content', '/blog/margins-are-content', 'Post');
ent('Notes on Measure', '/blog/notes-on-measure', 'Post');
const TEN = ent('Ten Ideas for Margins', '/blog/ten-ideas-for-margins', 'Post', {deleted:'2026-09-30'});
ent('Feed', '/feed.xml', 'System');
ent('Sitemap', '/sitemap.xml', 'System');
ent('Change Password', '/account/password', 'System');
ent('Subscribe Endpoint', '/api/v2/subscribe', 'System');
const ADJ = ['Quiet','Honest','Narrow','Loose','Second','Plain','Small','Slow'];
const NOUN = ['Tables','Captions','Footnotes','Grids','Margins','Headings','Buttons','Forms'];
const GEN = [];
ADJ.forEach(a => NOUN.forEach(n => GEN.push(ent(a + ' ' + n, '/blog/' + slug(a + ' ' + n), 'Post'))));
const byId = id => ENTRIES.find(e => e.id === id);

/* The developer's redirects. They come first and are not editable here. */
const CODE = [
  {from:'/rss', to:'/feed.xml', code:301},
  {from:'/sitemap', to:'/sitemap.xml', code:301},
  {from:'/.well-known/change-password', to:'/account/password', code:302}
];

const TYPES = {
  301:{name:'Permanent', say:'The new address replaces the old one for good. Search engines move the old address’s standing to it, and browsers may remember the move.'},
  302:{name:'Temporary', say:'For a while. Search engines keep the old address, and nothing is remembered.'},
  303:{name:'See Other', say:'For a form or a program, sending it to another address to read the result.'},
  307:{name:'Temporary, Same Method', say:'Temporary, and a form sent here is sent on as it was. For programs more than people.'},
  308:{name:'Permanent, Same Method', say:'Permanent, and a form sent here is sent on as it was. For programs more than people.'}
};
const isPerm = c => c === 301 || c === 308;

/* ============================================================== rows == */
let rid = 0;
const row = (from, to, code, added, how, o) => Object.assign({id:'r' + (++rid), from, to:typeof to === 'string' ? to : '', entry:to && typeof to === 'object' ? to.id : null, code, added, how}, o || {});
function seedNormal() {
  const r = [
    row('/old-about', ABOUT, 301, '2025-11-04', 'you'),
    row('/about-us', ABOUT, 301, '2025-11-04', 'you'),
    row('/team', ABOUT, 301, '2026-02-18', 'other', {who:'zadie'}),
    row('/contact-us', CONTACT, 301, '2025-11-04', 'you'),
    row('/subscribe', NEWS, 301, '2026-01-12', 'you'),
    row('/news/{name}', '/blog/{name}', 301, '2025-11-04', 'you'),
    row('/blog/category/{topic}', '/topics/{topic}', 301, '2025-11-04', 'you'),
    row('/tag/{tag}', '/topics/{tag}', 301, '2025-11-04', 'you'),
    row('/{year}/{month}/{name}.html', '/blog/{name}', 301, '2026-03-03', 'you'),
    row('/sale', 'https://shop.example.com/autumn', 302, '2026-10-01', 'other', {who:'zadie'}),
    row('/podcast', 'https://podcasts.example.com/meridian-review', 302, '2026-06-20', 'you'),
    row('/jobs', 'https://jobs.example.com/meridian', 302, '2026-08-02', 'other', {who:'zadie'}),
    row('/colophon', ABOUT, 301, '2025-11-04', 'you'),
    row('/blog/margin-notes', MARG, 301, '2026-07-14', 'rename'),
    row('/blog/the-long-table-2', TABLE, 301, '2026-09-03', 'rename'),
    row('/reading-on-phones', SMALL, 301, '2026-05-22', 'move'),
    row('/topics/type', TYPO, 301, '2026-04-30', 'rename'),
    row('/workshops/autumn-2026', '/workshops/autumn-2026-recap', 301, '2026-09-28', 'other', {who:'zadie'}),
    row('/events', '/workshops-old', 301, '2025-12-01', 'you'),
    row('/workshops-old', WORKS, 301, '2026-02-10', 'move'),
    row('/rss', '/blog', 301, '2025-11-04', 'you'),
    row('/blog/draft-ideas', TEN, 301, '2026-08-19', 'rename'),
    row('/spring', SPRING, 302, '2026-09-15', 'you'),
    row('/api/v1/subscribe', '/api/v2/subscribe', 308, '2026-04-02', 'other', {who:'zadie'})
  ];
  /* After a move: 112 old addresses, imported at once. */
  for (let i = 0; i < 112; i++) {
    const e = GEN[i % GEN.length], y = 2016 + (i % 6), m = String(1 + (i * 5) % 12).padStart(2, '0');
    r.push(row('/journal/' + y + '/' + m + '/' + e.path.split('/').pop() + (i >= GEN.length ? '-' + (i - GEN.length + 2) : '') + '.php', e, 301, '2025-11-04', 'paste', {n:112}));
  }
  return r;
}
function seedLarge() {
  const r = seedNormal();
  const more = 4212 - r.length;
  for (let i = 0; i < more; i++) {
    const e = GEN[(i * 7) % GEN.length];
    r.push(row('/archive/' + (10000 + i), e, 301, '2025-11-04', 'paste', {n:more}));
  }
  return r;
}
const DATA = {normal:seedNormal(), large:null, empty:[]};

/* ============================================================== state == */
const S = {open:new Set(), act:-1, from:null, v:'', rail:'config', state:'normal', rows:DATA.normal, q:'', tab:'all', goes:'', page:0, per:20, dense:false, sel:new Set(),
  edit:null, draft:null, pick:false, pq:'', test:'', codeOpen:false, flash:null};

/* ========================================================== matching == */
/* Paths compare without case and without a trailing slash. */
const key = p => { let k = String(p || '').toLowerCase(); if (k.length > 1) k = k.replace(/\/+$/, ''); return k; };
const hasPh = s => /\{[a-z_][a-z0-9_]*\}/i.test(s);
const phNames = s => (String(s).match(/\{([a-z_][a-z0-9_]*)\}/gi) || []).map(x => x.slice(1, -1).toLowerCase());
const isUrl = s => /^https?:\/\//i.test(s || '');
const compiled = new Map();
function compile(from) {
  if (compiled.has(from)) return compiled.get(from);
  const names = [];
  const src = key(from).split(/(\{[a-z_][a-z0-9_]*\})/i).map(part => {
    const m = /^\{([a-z_][a-z0-9_]*)\}$/i.exec(part);
    if (m) { names.push(m[1].toLowerCase()); return '([^/]+)'; }
    return part.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }).join('');
  const c = {re:new RegExp('^' + src + '$'), names, lit:from.replace(/\{[^}]*\}/g, '').length};
  compiled.set(from, c);
  return c;
}
const fill = (to, params) => to.replace(/\{([a-z_][a-z0-9_]*)\}/gi, (m, n) => params && params[n.toLowerCase()] != null ? params[n.toLowerCase()] : m);

let IDX = null;
function index() {
  const lit = new Map(), pat = [];
  S.rows.forEach(r => { if (hasPh(r.from)) pat.push(r); else lit.set(key(r.from), r); });
  pat.sort((a, b) => compile(b.from).lit - compile(a.from).lit);
  IDX = {lit, pat,
    pages:new Map(ENTRIES.filter(e => !e.deleted).map(e => [key(e.path), e])),
    code:new Map(CODE.map(c => [key(c.from), c]))};
}
/* An exact row first, then the most specific pattern. */
function matchRow(path, extra, skip) {
  const k = key(path);
  if (extra && extra.has(k)) return {r:extra.get(k), params:{}};
  const l = IDX.lit.get(k);
  if (l && l !== skip) return {r:l, params:{}};
  for (const r of IDX.pat) {
    if (r === skip) continue;
    const c = compile(r.from), m = c.re.exec(k);
    if (m) { const params = {}; c.names.forEach((n, i) => { params[n] = m[i + 1]; }); return {r, params}; }
  }
  return null;
}
function targetOf(r, params) {
  if (r.entry) { const e = byId(r.entry); return e.deleted ? {kind:'gone', entry:e} : {kind:'entry', entry:e, path:e.path}; }
  if (isUrl(r.to)) return {kind:'url', url:fill(r.to, params)};
  return {kind:'path', path:fill(r.to, params)};
}
/* Follow an address the way the site would: a page, then the code, then this list. */
function resolve(path, extra, skip) {
  const steps = [], seen = new Set();
  for (let i = 0; i < 8; i++) {
    const k = key(path);
    const pg = IDX.pages.get(k);
    if (pg) { steps.push({t:'page', e:pg, path}); return steps; }
    if (seen.has(k)) { steps.push({t:'loop', path}); return steps; }
    seen.add(k);
    const c = IDX.code.get(k);
    if (c) { steps.push({t:'code', c, path}); if (isUrl(c.to)) { steps.push({t:'away', url:c.to}); return steps; } path = c.to; continue; }
    const m = matchRow(path, extra, skip);
    if (m) {
      const tg = targetOf(m.r, m.params);
      steps.push({t:'row', r:m.r, params:m.params, path, tg});
      if (tg.kind === 'url') { steps.push({t:'away', url:tg.url}); return steps; }
      if (tg.kind === 'gone') { steps.push({t:'nf', path:tg.entry.path, gone:tg.entry}); return steps; }
      path = tg.path; continue;
    }
    steps.push({t:'nf', path}); return steps;
  }
  steps.push({t:'loop', path}); return steps;
}
const finalOf = steps => steps[steps.length - 1];

/* What is wrong with a row, if anything. Loops and duplicates never get this far. */
function problemOf(r) {
  if (!hasPh(r.from)) {
    const k = key(r.from);
    if (IDX.code.has(k)) return {k:'code', say:'Overruled by a redirect in the site’s code.', fix:['Show It', 'showcode']};
    const pg = IDX.pages.get(k);
    if (pg) return {k:'live', say:'Does nothing: the ' + kindWord(pg) + ' <b>' + esc(pg.title) + '</b> answers this address.', fix:['Delete Redirect', 'del']};
  }
  const tg = targetOf(r, {});
  if (tg.kind === 'gone') return {k:'gone', say:'Leads nowhere: <b>' + esc(tg.entry.title) + '</b> was deleted on ' + fmtDate(tg.entry.deleted) + '.', fix:['Choose Another Page', 'repick']};
  if (tg.kind === 'path' && !hasPh(tg.path)) {
    const k = key(tg.path);
    if (IDX.pages.has(k) || IDX.code.has(k)) return null;
    const m = matchRow(tg.path, null, r);
    if (m) {

const looksLikeAddress = q => /^(\/|https?:\/\/|(www\.)?meridianreview\.org)/i.test(q.trim());
function traceHtml() {
  const q = S.q.trim();
  if (!q || !looksLikeAddress(q)) return '';
  const a = readAddr(q, 'test');
  const lead = '<span class="lbl">' + I('test') + 'Where it goes</span>';
  if (a.err) return '<div class="trace">' + lead + '<span class="tk nf">' + I('ban') + (a.other ? 'Another site, ' + esc(a.other) : 'Not an address') + '</span>' + (a.other ? '<span class="say">Only addresses on ' + HOST + ' can be redirected here.</span>' : '') + '</div>';
  const steps = resolve(a.path);
  const tk = (cls, icon, label) => '<span class="tk ' + cls + '">' + (icon ? I(icon) : '') + label + '</span>';
  const arr = (c, by) => '<span class="arr" title="' + esc(TYPES[c].name + ' ' + c + ', by ' + by) + '">' + I('arrow-r') + '<small>' + c + '</small></span>';

    if (st.t === 'row' || st.t === 'code') {
      const c = st.t === 'row' ? st.r.code : st.c.code;
      h += arr(c, st.t === 'row' ? 'the row ' + st.r.from : 'the site’s code');
      const tg = st.t === 'row' ? st.tg : (isUrl(st.c.to) ? {kind:'url', url:st.c.to} : {kind:'path', path:st.c.to});
      if (tg.kind === 'entry') { h += tk('pg', 'page', esc(tg.entry.title)); shown = tg.entry.id; }
      else if (tg.kind === 'gone') h += tk('gone', 'page', esc(tg.entry.title));
      else if (tg.kind === 'url') { let host = tg.url; try { host = new URL(tg.url).host; } catch (e) {} h += tk('', 'ext', esc(host)); }
      else h += tk('mono', '', esc(tg.path));
      if (st.t === 'code' && i === 0 && IDX.lit.has(key(st.path))) say = 'The site’s code overrules the row for this address.';
    }
    if (st.t === 'page' && st.e.id !== shown) {
      h += '<span class="arr eq">is</span>' + tk('pg', st.e.kind === 'System' ? 'code' : 'page', esc(st.e.title));

}

    if (v === 'del') del([id]);
  });
}
/* The admin's toast (§7 Toasts): a glyph for its kind, one line in the past
   tense, Undo where the change can be put back, and a border that is the
   countdown. Pointer or focus inside holds it; both have to let go. */
function toast(msg, undo, kind) {
  clearTimeout(toastT);
  $$('.toast').forEach(t => t.remove());
  const life = undo ? 7000 : 2600;
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.style.setProperty('--life', life + 'ms');
  el.innerHTML = I(kind === 'danger' || kind === 'warn' ? 'alert' : kind === 'info' ? 'info' : 'ccheck') +
    '<span class="msg" role="status">' + msg + '</span>' +
    (undo ? '<span class="div"></span><button class="undo">' + I('undo') + 'Undo</button>' : '') +
    '<svg class="toast-ring" aria-hidden="true"><rect class="track" pathLength="100"/><rect class="run" pathLength="100"/></svg>';
  document.body.appendChild(el);
  let left = life, since = Date.now(), holds = 0;
  const go = () => { since = Date.now(); toastT = setTimeout(() => el.remove(), left); };
  const hold = () => { if (holds++ === 0) { clearTimeout(toastT); left -= Date.now() - since; el.classList.add('held'); } };
  const free = () => { if (holds > 0 && --holds === 0) { el.classList.remove('held'); go(); } };
  el.addEventListener('pointerenter', hold); el.addEventListener('pointerleave', free);
  el.addEventListener('focusin', hold); el.addEventListener('focusout', free);
  el.addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); el.remove(); } });
  if (undo) el.querySelector('.undo').onclick = () => { clearTimeout(toastT); undo(); el.remove(); render(); };
  go();
}

/* ============================================================= render == */
function render() {
  const a = document.activeElement, id = a && a.id;
  let pos = null; try { pos = a && 'selectionStart' in a ? a.selectionStart : null; } catch (e) {}
  prepare();
  $('#rail').innerHTML = railHtml();
  $('#side').innerHTML = sideHtml();
  const crumbs = '<a href="#redirects" data-scope="config">Config</a><span class="sep">/</span><span aria-current="page">Redirects</span>';
  $('#crumbs').innerHTML = crumbs;
  $('#page').innerHTML = renderList();
  renderDialog();
  $$('[data-mixed]').forEach(c => { c.indeterminate = true; });
  document.title = 'Redirects · Meridian';
  if (id) { const n = document.getElementById(id); if (n && n !== document.activeElement) { n.focus({preventScroll:true}); if (pos != null && n.setSelectionRange && /^(text|search|textarea)$/.test(n.type || '')) try { n.setSelectionRange(pos, pos); } catch (e) {} } }
}
function go() {
  const v = 'list';
  if (v !== S.v) { S.edit = null; S.draft = null; S.pick = false; S.rail = 'config'; $('#work').scrollTop = 0; }
  S.v = v;
  render();
}

/* ============================================================= events == */
function onClick(e) {
  const t = e.target.closest('button, a, input[type=checkbox]'); if (!t) return;
  const ds = t.dataset;
  if (S.pick && !t.closest('.combo')) S.pick = false;
  if ('add' in ds) return openAdd();
  if (ds.pnote) { S.open.has(ds.pnote) ? S.open.delete(ds.pnote) : S.open.add(ds.pnote); render(); const b = $('[data-pnote="' + ds.pnote + '"]'); if (b) b.focus({preventScroll:true}); return; }
  if (ds.showrow) { S.edit = null; S.q = ''; showRow(ds.showrow); return; }
  if (ds.addfrom) return openAdd(ds.addfrom);
  if (ds.tab) { S.tab = ds.tab; S.page = 0; S.sel.clear(); render(); const n = $('#tab-' + S.tab); if (n) n.focus(); return; }
  if (ds.dense) { S.dense = ds.dense === '1'; render(); return; }
  if ('clear' in ds) { S.q = ''; S.goes = ''; S.page = 0; render(); const n = $('#rq'); if (n) n.focus(); return; }
  if (ds.pg) { S.page += +ds.pg; render(); $('.tcap').scrollIntoView({block:'start'}); const b = $('[data-pg="' + ds.pg + '"]') || $('[data-pg]'); if (b) b.focus({preventScroll:true}); return; }
  if ('codetoggle' in ds) { S.codeOpen = !S.codeOpen; render(); return; }
  if (ds.rmenu) { e.stopPropagation(); return rowMenu(t, ds.rmenu); }
  if (ds.fix) {
    const id = ds.id;
    if (ds.fix === 'del') return del([id]);
    if (ds.fix === 'edit') return openEdit(id);
    if (ds.fix === 'repick') return openEdit(id, true);
    if (ds.fix === 'straight') return straight(id);
    if (ds.fix === 'showcode') { S.codeOpen = true; render(); $('.coded').scrollIntoView({block:'center'}); return; }
  }
  if (ds.pick) { ds.pick && (t.checked ? S.sel.add(ds.pick) : S.sel.delete(ds.pick)); S.bulkIn = S.sel.size === 1 && t.checked; render(); return; }
  if ('selall' in ds) { const ids = $$('[data-pick]').map(x => x.dataset.pick); const on = t.checked; const was = S.sel.size; ids.forEach(i => on ? S.sel.add(i) : S.sel.delete(i)); S.bulkIn = !was && S.sel.size; render(); return; }
  if (ds.bulk) {
    const ids = [...S.sel];
    if (ds.bulk === 'clear') { S.sel.clear(); render(); return; }
    if (ds.bulk === 'del') return del(ids);
    if (ds.bulk === 'perm') return setCode(ids, 301);
    if (ds.bulk === 'temp') return setCode(ids, 302);
  }
  if ('cancel' in ds) return cancelEdit();
  if ('delEdit' in ds) { const id = S.edit; return del([id]); }
  if (ds.pickent) { pickPage(ds.pickent); return; }
  if ('unpick' in ds) { S.draft.entry = null; render(); const n = $('#ed-to'); if (n) n.focus(); return; }
  if (ds.dfix) {
    const d = S.draft, f = ds.dfix;
    if (f === 'slashfrom') { d.from = '/' + d.from.trim(); render(); $('#ed-from').focus(); }
    if (f === 'slashto') { d.to = '/' + d.to.trim(); render(); $('#ed-to').focus(); }
    if (f.startsWith('editother:')) openEdit(f.split(':')[1]);
    if (f === 'straightdraft') {
      const st = resolve(readAddr(d.to, 'to').path), fin = finalOf(st);
      if (fin.t === 'page') { if (fin.e.kind !== 'System') { d.entry = fin.e.id; d.to = ''; } else d.to = fin.e.path; }
      else if (fin.t === 'away') d.to = fin.url;
      render();
    }
    return;
  }
  if (ds.noopEntry) { e.preventDefault(); toast('In the admin this opens ' + esc(byId(ds.noopEntry).title) + ' in the editor.', null, 'info'); }
}
function pickPage(id) {
  S.draft.entry = id; S.draft.to = ''; S.draft.touched.to = true; S.pick = false; S.act = -1;
  render(); const n = $('#ed-code'); if (n) n.focus();
}
function onInput(e) {
  const t = e.target;
  if (t.id === 'rq') { S.q = t.value; S.page = 0; render(); return; }
  if (t.dataset.ed && t.tagName !== 'SELECT') {
    S.draft[t.dataset.ed] = t.value; S.draft.touched[t.dataset.ed] = true;
    if (t.id === 'ed-to') { S.pick = !!t.value.trim() && !isUrl(t.value.trim()); S.act = -1; }
    render();
  }
}
function onChange(e) {
  const t = e.target;
  if (t.dataset.f) { S[t.dataset.f] = t.value; S.page = 0; render(); return; }
  if ('per' in t.dataset) { S.per = +t.value; S.page = 0; render(); return; }
  if (t.dataset.ed === 'code') { S.draft.code = +t.value; render(); }
}
function onKey(e) {
  const t = e.target;
  /* The combobox keeps focus in the box; arrows move the highlighted page. */
  if (t.id === 'ed-to') {
    const n = $$('[data-pickent]').length;
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!S.pick) { S.pick = true; S.act = 0; } else S.act = Math.min(n - 1, S.act + 1); render(); return; }
    if (e.key === 'ArrowUp' && S.pick) { e.preventDefault(); S.act = Math.max(-1, S.act - 1); render(); return; }
    if (e.key === 'Enter' && S.pick && S.act > -1) { e.preventDefault(); const b = $$('[data-pickent]')[S.act]; if (b) pickPage(b.dataset.pickent); return; }
  }
  if ((t.id === 'ed-chosen' || t.id === 'ed-unpick') && e.key === 'Backspace') { e.preventDefault(); S.draft.entry = null; render(); const i = $('#ed-to'); if (i) i.focus(); }
}
function wire(el) {
  el.addEventListener('click', onClick);
  el.addEventListener('input', onInput);
  el.addEventListener('change', onChange);
  el.addEventListener('submit', e => { e.preventDefault(); saveEdit(); });
  el.addEventListener('keydown', onKey);
}
wire($('#page'));
$('#rail').addEventListener('click', e => { const b = e.target.closest('[data-rail]'); if (!b) return; S.rail = b.dataset.rail; render(); const n = $('[data-rail="' + S.rail + '"]'); if (n) n.focus(); });
$('#side').addEventListener('click', e => { if (e.target.closest('[data-noop]')) { e.preventDefault(); toast('That screen isn’t part of this sketch.', null, 'info'); } });
$('#crumbs').addEventListener('click', e => { const a = e.target.closest('[data-scope]'); if (a) { e.preventDefault(); S.rail = a.dataset.scope; render(); } });
document.addEventListener('keydown', e => {
  if (DLG && DLG.open) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing && $('#rq')) { e.preventDefault(); $('#rq').focus(); return; }
  if (e.key === 'Escape') {
    if ($('.menu')) { closeMenu(true); return; }
    if ($('#labNotes').classList.contains('on')) { $('#labNotesBtn').click(); return; }
    if (S.sel.size && !typing) { S.sel.clear(); render(); return; }
  }
});
document.addEventListener('mousedown', e => { if ($('.menu') && !e.target.closest('.menu') && !e.target.closest('[aria-haspopup="menu"]')) closeMenu(); });
$('#work').addEventListener('scroll', () => { if (Date.now() - menuAt > 250) closeMenu(); });

/* ============================================================ harness == */
const labSeg = (id, fn) => $(id).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $$(id + ' button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); fn(b.dataset.v); });
labSeg('#labState', v => {
  S.state = v;
  if (v === 'large' && !DATA.large) DATA.large = seedLarge();
  S.rows = v === 'loading' ? DATA.normal : DATA[v];
  S.sel.clear(); S.edit = null; S.draft = null; S.pick = false; S.page = 0; S.q = ''; S.goes = ''; S.tab = 'all';
  render();
});
labSeg('#labTheme', v => v === 'neutral' ? document.documentElement.removeAttribute('data-admin-theme') : document.documentElement.setAttribute('data-admin-theme', v));
labSeg('#labScheme', v => v === 'auto' ? document.documentElement.removeAttribute('data-color-scheme') : document.documentElement.setAttribute('data-color-scheme', v));
$('#labNotesBtn').addEventListener('click', () => { const on = !$('#labNotes').classList.contains('on'); $('#labNotes').classList.toggle('on', on); $('#labNotesBtn').setAttribute('aria-pressed', String(on)); });
$('#labNotes').addEventListener('click', e => { if (e.target.closest('[data-close]')) $('#labNotesBtn').click(); });
$('#labNotes').innerHTML = NOTES;
window.addEventListener('hashchange', go);
if (!location.hash) history.replaceState(null, '', '#redirects');
go();
