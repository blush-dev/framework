<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meridian Redirects — sketch</title>
<style>html,body{margin:0;padding:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Fira+Code:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Karla:wght@400;500;600&display=swap">
<style>
/* Meridian: the Redirects screen, a sketch. Shell and controls from the Forms sketch. Tokens are design/tokens.css verbatim.
   Anything prefixed lab- is the harness, not the admin. */
:root {
  --bg:#f5f6f9; --surface:#ffffff; --surface-2:#f0f2f6; --surface-3:#e7eaf0;
  --border:#e2e5ec; --border-strong:#ccd2dd;
  --fg:#11141b; --fg-2:#535b6b; --fg-3:#858d9d;
  --accent:#2f5fe0; --accent-hover:#2650c4; --accent-fg:#ffffff; --accent-soft:#e9effc; --accent-line:#bdcdf7;
  --good:#136b43; --good-soft:#e2f3e9; --good-dot:#1f9d5f;
  --warn:#8a5806; --warn-soft:#faf0d9; --warn-dot:#cf8d16;
  --danger:#a92420; --danger-soft:#fbeae9; --danger-dot:#d6403a;
  --shadow-1:none;
  --shadow-2:0 2px 8px rgba(17,20,27,.05), 0 1px 2px rgba(17,20,27,.04);
  --shadow-3:0 10px 28px rgba(17,20,27,.09), 0 2px 6px rgba(17,20,27,.05);
  --r-1:6px; --r-2:10px; --r-3:16px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:18px; --s-5:26px; --s-6:36px; --s-7:52px;
  --font-ui:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-title:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono:"Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --base:13px; --h1:26px; --h1-track:-.024em;
  --title-size:13.5px; --title-weight:500; --title-track:-.005em;
  --pad-row:14px; --pad-panel:17px; --pad-x:22px; --ctl:34px; --ctl-sm:30px; --stat-v:30px;
  --railbar:74px; --rail:262px; --bar:62px; --work-max:1400px; --measure:72ch;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-color-scheme="light"]):not([data-theme="light"]) {
    --bg:#0b0d12; --surface:#13161d; --surface-2:#1a1e27; --surface-3:#222733;
    --border:#242936; --border-strong:#353c4c;
    --fg:#e9ebf0; --fg-2:#a3abba; --fg-3:#747d8e;
    --accent:#7295f7; --accent-hover:#8aa8f9; --accent-fg:#0b0d12; --accent-soft:#182444; --accent-line:#2c3d68;
    --good:#5ecb92; --good-soft:#102a1e; --good-dot:#35b877;
    --warn:#e3b360; --warn-soft:#2b2312; --warn-dot:#d69f3c;
    --danger:#f28d84; --danger-soft:#301917; --danger-dot:#e0655c;
    --shadow-1:none; --shadow-2:0 2px 8px rgba(0,0,0,.3);
    --shadow-3:0 10px 28px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-color-scheme="dark"], :root[data-theme="dark"]:not([data-color-scheme="light"]) {
  --bg:#0b0d12; --surface:#13161d; --surface-2:#1a1e27; --surface-3:#222733;
  --border:#242936; --border-strong:#353c4c;
  --fg:#e9ebf0; --fg-2:#a3abba; --fg-3:#747d8e;
  --accent:#7295f7; --accent-hover:#8aa8f9; --accent-fg:#0b0d12; --accent-soft:#182444; --accent-line:#2c3d68;
  --good:#5ecb92; --good-soft:#102a1e; --good-dot:#35b877;
  --warn:#e3b360; --warn-soft:#2b2312; --warn-dot:#d69f3c;
  --danger:#f28d84; --danger-soft:#301917; --danger-dot:#e0655c;
  --shadow-1:none; --shadow-2:0 2px 8px rgba(0,0,0,.3);
  --shadow-3:0 10px 28px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  color-scheme: dark;
}
:root[data-admin-theme="editorial"] {
  --bg:#f6f2ec; --surface:#fffdfa; --surface-2:#f1ece3; --surface-3:#e7e0d4;
  --border:#e5ded2; --border-strong:#cdc3b3;
  --fg:#23201b; --fg-2:#5d564c; --fg-3:#8e867a;
  --accent:#17595e; --accent-hover:#124a4e; --accent-fg:#fffdfa; --accent-soft:#e2eded; --accent-line:#b6d3d5;
  --good:#4c6d2c; --good-soft:#edf1e2; --good-dot:#6f9b45;
  --warn:#8a5a14; --warn-soft:#f8eeda; --warn-dot:#c58a2a;
  --danger:#9c3327; --danger-soft:#f8e7e2; --danger-dot:#c2503f;
  --shadow-2:0 2px 8px rgba(60,48,32,.05), 0 1px 2px rgba(60,48,32,.04);
  --shadow-3:0 10px 28px rgba(60,48,32,.09), 0 2px 6px rgba(60,48,32,.05);
  --r-1:8px; --r-2:12px; --r-3:20px;
  --font-ui:"Karla", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display:"Newsreader", ui-serif, Georgia, "Times New Roman", serif;
  --font-title:"Newsreader", ui-serif, Georgia, "Times New Roman", serif;
  --base:13.5px; --h1:32px; --h1-track:-.014em;
  --title-size:15.5px; --title-weight:500; --title-track:0;
  --pad-row:16px; --pad-panel:19px; --pad-x:26px; --stat-v:34px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-color-scheme="light"]):not([data-theme="light"])[data-admin-theme="editorial"] {
    --bg:#15120e; --surface:#1d1915; --surface-2:#26211a; --surface-3:#322b22;
    --border:#302a21; --border-strong:#463e31;
    --fg:#f0e9dd; --fg-2:#b4a996; --fg-3:#877c6c;
    --accent:#72bec2; --accent-hover:#8bcccf; --accent-fg:#15120e; --accent-soft:#113032; --accent-line:#1d4a4d;
    --good:#9cc16b; --good-soft:#1c2413; --good-dot:#84ad55;
    --warn:#dcae63; --warn-soft:#2c2314; --warn-dot:#c79646;
    --danger:#e8897b; --danger-soft:#2f1a16; --danger-dot:#cf6a5c;
    --shadow-2:0 2px 8px rgba(0,0,0,.34);
    --shadow-3:0 10px 28px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.34);
    color-scheme: dark;
  }
}
:root[data-color-scheme="dark"][data-admin-theme="editorial"],
:root[data-theme="dark"]:not([data-color-scheme="light"])[data-admin-theme="editorial"] {
  --bg:#15120e; --surface:#1d1915; --surface-2:#26211a; --surface-3:#322b22;
  --border:#302a21; --border-strong:#463e31;
  --fg:#f0e9dd; --fg-2:#b4a996; --fg-3:#877c6c;
  --accent:#72bec2; --accent-hover:#8bcccf; --accent-fg:#15120e; --accent-soft:#113032; --accent-line:#1d4a4d;
  --good:#9cc16b; --good-soft:#1c2413; --good-dot:#84ad55;
  --warn:#dcae63; --warn-soft:#2c2314; --warn-dot:#c79646;
  --danger:#e8897b; --danger-soft:#2f1a16; --danger-dot:#cf6a5c;
  --shadow-2:0 2px 8px rgba(0,0,0,.34);
  --shadow-3:0 10px 28px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.34);
  color-scheme: dark;
}

/* ------------------------------------------------------------------ base -- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:var(--base);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol,figure{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num,td,th,time{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ============================================================ primitives == */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:var(--ctl);padding:0 14px;border-radius:var(--r-1);border:1px solid var(--border);background:var(--surface);color:var(--fg);font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn.sm{height:var(--ctl-sm);padding:0 11px;font-size:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger-soft)}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .ic{width:15px;height:15px}
a.lnk{color:var(--accent)}
a.lnk:hover{text-decoration:underline}

.avatar{width:26px;height:26px;border-radius:99px;background:var(--surface-3);color:var(--fg-2);display:grid;place-items:center;font-size:10.5px;font-weight:600;letter-spacing:.02em;flex:none}
.avatar.sm{width:20px;height:20px;font-size:9px}
.avatar.lg{width:44px;height:44px;font-size:14px}
.avatar.miss{background:transparent;border:1px dashed var(--danger-dot);color:var(--danger)}
.avatar.miss .ic{width:13px;height:13px}

.pill{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 9px 0 8px;border-radius:99px;font-size:11px;font-weight:500;white-space:nowrap;border:1px solid transparent;vertical-align:middle;margin-block:-2px}
.pill .d{width:5px;height:5px;border-radius:99px;flex:none}
.pill.published{background:var(--good-soft);color:var(--good)} .pill.published .d{background:var(--good-dot)}
.pill.draft{background:var(--surface-2);color:var(--fg-2);border-color:var(--border)} .pill.draft .d{background:var(--border-strong)}
.pill.trash{background:var(--danger-soft);color:var(--danger)} .pill.trash .d{background:var(--danger-dot)}
.pill.written{background:var(--surface-3);color:var(--fg)} .pill.written .d{background:var(--fg-2)}
.pill.inherited{background:var(--surface-2);color:var(--fg-2)} .pill.inherited .d{background:transparent;box-shadow:inset 0 0 0 1.5px var(--border-strong)}
.pill.unreach{background:transparent;color:var(--fg-2);border:1px dashed var(--border-strong)} .pill.unreach .ic{width:12px;height:12px}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.warn .d{background:var(--warn-dot)}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;background:var(--surface-2);color:var(--fg-2);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--border);flex:none}

.cbx{position:relative;display:inline-flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:12.5px;color:var(--fg)}
.cbx input{position:absolute;opacity:0;width:1px;height:1px}
.cbx .bx{width:15px;height:15px;flex:none;margin-top:2px;border:1px solid var(--border-strong);border-radius:4px;display:grid;place-items:center;color:transparent;background:var(--surface)}
.cbx .bx .ic{width:11px;height:11px;stroke-width:2.6}
.cbx input:checked + .bx{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cbx input:focus-visible + .bx{outline:2px solid var(--accent);outline-offset:2px}
.cbx .tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.cbx .tx small{font-size:11.5px;color:var(--fg-3);line-height:1.5}
.rdo .bx{border-radius:99px}
.rdo input:checked + .bx{background:var(--surface);border:5px solid var(--accent)}
/* ======================================================== lab harness == */
.lab{display:flex;flex-direction:column;height:100%}
.lab-bar{flex:none;display:flex;align-items:center;gap:var(--s-4);flex-wrap:wrap;
  padding:var(--s-2) var(--s-4);background:var(--surface-2);border-bottom:1px solid var(--border)}
.lab-mark{display:flex;align-items:baseline;gap:var(--s-2);margin-right:auto;min-width:0}
.lab-mark b{font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:-.01em}
.lab-mark span{color:var(--fg-3);font-size:11.5px}
.lab-grp{display:flex;align-items:center;gap:var(--s-2)}
.lab-grp > span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3);font-weight:600}
.lab-seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-1);padding:2px;gap:2px}
.lab-seg button{font-size:12px;color:var(--fg-2);padding:0 var(--s-3);height:24px;border-radius:calc(var(--r-1) - 2px);white-space:nowrap}
.lab-seg button:hover{color:var(--fg)}
.lab-seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.lab-notes-btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r-1);border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:500}
.lab-notes-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.lab-notes-btn .ic{width:14px;height:14px}
@media (max-width:1640px){.lab-mark span{display:none}}
@media (max-width:760px){.lab-grp > span{display:none}}

/* The rules, in a sheet over the right edge. Harness, not admin. */
.lab-notes{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface);border-left:1px solid var(--border-strong);box-shadow:var(--shadow-3);z-index:60;overflow-y:auto;padding:var(--s-5);display:none;flex-direction:column;gap:var(--s-4)}
.lab-notes.on{display:flex}
.lab-notes h2{font-family:var(--font-display);font-size:17px;font-weight:600;display:flex;align-items:center}
.lab-notes h2 button{margin-left:auto}
.lab-notes h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3);font-weight:600;margin-top:var(--s-2)}
.lab-notes p{font-size:12.5px;color:var(--fg-2);line-height:1.6}
.lab-notes ol{display:flex;flex-direction:column;gap:var(--s-3)}
.lab-notes li{display:flex;gap:var(--s-3);font-size:12.5px;color:var(--fg-2);line-height:1.6}
.lab-notes li b{color:var(--fg);font-weight:600}
.lab-notes li > i{font-style:normal;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);flex:none;padding-top:2px;width:22px}

/* ============================================================ the shell == */
.app{flex:1 1 auto;min-height:0;display:flex;background:var(--bg)}
.rail{flex:none;width:var(--railbar);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--s-3) 0}
.rail .logo{width:40px;height:40px;border-radius:var(--r-2);background:var(--fg);color:var(--surface);display:grid;place-items:center;font-weight:600;font-size:15px;margin-bottom:var(--s-3)}
.rail a{width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 7px;border-radius:var(--r-2);font-size:10.5px;color:var(--fg-2)}
.rail a .ic{width:19px;height:19px}
.rail a:hover{background:var(--surface-2);color:var(--fg)}
.rail a[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.side{flex:none;width:var(--rail);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.side-h{height:var(--bar);padding:0 var(--s-5);display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--border);box-sizing:content-box;padding-block:6px}
.side-h b{font-family:var(--font-display);font-size:15px;font-weight:600}
.side-h span{font-size:11.5px;color:var(--fg-3)}
.side nav{display:flex;flex-direction:column;gap:2px;padding:var(--s-4) var(--s-3)}
.side nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r-1);font-size:13px;color:var(--fg-2);position:relative}
.side nav a:hover{background:var(--surface-2);color:var(--fg)}
.side nav a .c{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
.side nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.side nav a[aria-current="page"] .c{color:var(--accent)}
.side nav a[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:2px;border-radius:0 2px 2px 0;background:var(--accent)}
.side .side-g{display:flex;align-items:center;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);padding:var(--s-5) var(--s-5) var(--s-1)}
.side .side-g button{margin-left:auto;font-size:10.5px;letter-spacing:.07em;color:var(--fg-3);font-weight:600}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{flex:none;height:var(--bar);box-sizing:content-box;padding-block:6px;display:flex;align-items:center;gap:var(--s-3);padding-inline:var(--s-5);background:var(--surface);border-bottom:1px solid var(--border)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2);min-width:0;margin-right:auto;white-space:nowrap;overflow:hidden}
.crumbs a:hover{color:var(--accent)}
.crumbs .sep{color:var(--fg-3)}
.crumbs [aria-current]{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.jump{display:flex;align-items:center;gap:9px;width:240px;height:var(--ctl);padding:0 10px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--bg);color:var(--fg-3);font-size:12.5px}
.jump .ic{width:14px;height:14px}
.jump kbd{margin-left:auto}
kbd{font-family:var(--font-mono);font-size:10px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--fg-3);background:var(--surface)}
.work{flex:1 1 auto;min-height:0;overflow-y:auto}
.page{max-width:var(--work-max);margin:0 auto;padding:var(--s-7) var(--s-7) 96px;display:flex;flex-direction:column;gap:var(--s-5)}
@media (max-width:1180px){.side{display:none}}
@media (max-width:760px){
  .rail{display:none}
  .jump{display:none}
  .topbar .vs span{display:none}
  .page{padding:var(--s-5) var(--s-4) 96px}
}

/* ---------------------------------------------------------- page head -- */
.ph{display:flex;flex-direction:column;gap:var(--s-2)}
.ph-back{display:inline-flex;align-items:center;gap:var(--s-1);font-size:12.5px;color:var(--fg-2);align-self:flex-start}
.ph-back:hover{color:var(--accent)}
.ph-back .ic{width:14px;height:14px}
.ph-row{display:flex;align-items:flex-start;gap:var(--s-4);flex-wrap:wrap}
.ph-row > div:first-child{flex:1 1 360px;min-width:0}
.ph h1{font-family:var(--font-display);font-size:var(--h1);letter-spacing:var(--h1-track);font-weight:600;line-height:1.2}
.ph .sub{color:var(--fg-2);font-size:13.5px;margin-top:6px}
.ph .about{color:var(--fg-2);font-size:13.5px;line-height:1.6;max-width:var(--measure);margin-top:6px}
.ph .when{display:flex;align-items:center;gap:6px;color:var(--fg-3);font-size:12px;margin-top:var(--s-2)}
.ph .when .ic{width:13px;height:13px}
.ph-acts{display:flex;gap:var(--s-2)}
.btn .spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{height:2px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin-top:var(--s-3)}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width 1.1s linear}

/* Underlined tabs with count chips, the admin's list style. */
.utabs{display:flex;gap:var(--s-1);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.utabs button{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;font-size:13.5px;color:var(--fg-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.utabs button:hover{color:var(--fg)}
.utabs button[aria-selected="true"]{color:var(--fg);font-weight:500;border-bottom-color:var(--accent)}
.utabs .c{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);background:var(--surface-3);border-radius:99px;padding:1px 8px}
.utabs button[aria-selected="true"] .c{color:var(--fg-2)}

.ltop{display:flex;flex-direction:column;gap:var(--s-4)}
.ftools{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap}
.psearch{display:flex;align-items:center;gap:10px;height:var(--ctl);padding:0 10px 0 12px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface);flex:1 1 260px;max-width:380px}
.psearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.psearch .ic{width:14px;height:14px;color:var(--fg-3)}
.psearch input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:12.5px}
.psearch input::placeholder{color:var(--fg-3)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-1);padding:2px;gap:2px}
.seg button{font-size:12px;color:var(--fg-2);padding:0 11px;height:26px;border-radius:calc(var(--r-1) - 2px)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:0 0 0 1px var(--border)}
.psearch kbd{margin-left:auto;font-size:11px;padding:0 6px;line-height:18px}
.dens{display:flex;margin-left:auto;border:1px solid var(--border);border-radius:var(--r-1);overflow:hidden;background:var(--surface)}
.dens button{width:38px;height:calc(var(--ctl) - 2px);display:grid;place-items:center;color:var(--fg-3)}
.dens button + button{border-left:1px solid var(--border)}
.dens button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.dens .ic{width:17px;height:17px}
.hrows.dense > li{padding-block:9px;align-items:center}
.hrows.dense .h-what p,.hrows.dense .h-lead .p,.hrows.dense .h-lead .m{display:none}
.sel{position:relative;display:inline-flex;align-items:center;flex:0 1 170px;min-width:150px}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:var(--ctl);padding:0 34px 0 12px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface);font-size:12.5px;color:var(--fg);cursor:pointer}
.sel select:hover{border-color:var(--border-strong)}
.sel select:focus-visible{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sel .ic{position:absolute;right:11px;width:15px;height:15px;color:var(--fg-2);pointer-events:none}
.ftools .say{margin-left:auto;font-size:12px;color:var(--fg-3)}
.ftools .lbl{font-size:12px;color:var(--fg-3)}

/* ------------------------------------------------------------ severity -- */
/* A chip that is a word and a glyph; color is the third cue, never the only. */
.sev{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px 0 7px;border-radius:99px;font-size:11.5px;font-weight:500;white-space:nowrap;flex:none}
.sev .ic{width:13px;height:13px;stroke-width:2}
.sev.error{background:var(--danger-soft);color:var(--danger)} .sev.error .ic{color:var(--danger-dot)}
.sev.warning{background:var(--warn-soft);color:var(--warn)} .sev.warning .ic{color:var(--warn-dot)}
.sev.notice{background:var(--surface-2);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--border)}
.sev.fixed{background:var(--good-soft);color:var(--good)} .sev.fixed .ic{color:var(--good-dot)}
.sev.ignored{background:transparent;color:var(--fg-3);box-shadow:inset 0 0 0 1px var(--border-strong)}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px 0 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:99px}
.pill.fail{background:var(--danger-soft);color:var(--danger)} .pill.fail .d{background:var(--danger-dot)}
.pill.check{background:var(--warn-soft);color:var(--warn)} .pill.check .d{background:var(--warn-dot)}
.pill.note{background:var(--surface-2);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--border)} .pill.note .d{background:var(--fg-3)}
.pill.clear{background:var(--good-soft);color:var(--good)} .pill.clear .d{background:var(--good-dot)}

/* ------------------------------------------------------------ overview -- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-4)}
@media (max-width:900px){.stats{grid-template-columns:minmax(0,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);padding:var(--s-5)}
.stat.bad{border-color:var(--danger-dot)}
.stat.warnb{border-color:var(--warn-dot)}
.stat .k{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.stat.bad .k{color:var(--danger)}
.stat .k .ic{width:15px;height:15px}
.stat .v{font-size:var(--stat-v);font-weight:600;margin:var(--s-3) 0 var(--s-2);font-variant-numeric:tabular-nums}
.stat .s{font-size:12.5px;color:var(--fg-3)}
.ov{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:var(--s-4);align-items:start}
@media (max-width:1000px){.ov{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);overflow:hidden}
.panel-head{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;padding:var(--pad-panel) var(--pad-x);border-bottom:1px solid var(--border)}
.panel-head h2{font-family:var(--font-display);font-size:15.5px;font-weight:600;letter-spacing:-.005em}
.panel-head .hint{font-size:12px;color:var(--fg-3)}
.irow{display:flex;align-items:center;gap:var(--s-4);padding:var(--s-4) var(--pad-x);border-bottom:1px solid var(--border)}
.irow:last-child{border-bottom:0}
.irow:hover{background:var(--surface-2)}
.irow .tx{flex:1;min-width:0}
.irow b{display:block;font-size:13.5px;font-weight:500}
.irow p{font-size:12.5px;color:var(--fg-2);margin-top:3px}
.irow small{display:block;font-size:12px;color:var(--fg-3);margin-top:3px}
.irow > .ic{color:var(--fg-3)}
.arow{display:flex;align-items:flex-start;gap:var(--s-4);padding:var(--s-4) var(--pad-x);border-bottom:1px solid var(--border)}
.arow:last-child{border-bottom:0}
.arow > .ic{margin-top:3px;color:var(--fg-2)}
.arow .tx{flex:1;min-width:0}
.arow b{display:block;font-size:13.5px;font-weight:500}
.arow p{font-size:12.5px;color:var(--fg-3);margin-top:2px}

/* ========================================================= a check page == */
/* A group: the kind of problem, what the site does about it now, and the
   one fix every row in it shares, when there is one. */
.grp{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);overflow:hidden}
.grp-h{display:flex;align-items:flex-start;gap:var(--s-3);padding:var(--pad-panel) var(--pad-x);border-bottom:1px solid var(--border);flex-wrap:wrap}
.grp-h{align-items:center}
.grp-h .tx{flex:1 1 320px;min-width:0;display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.grp-h .hint{font-size:12.5px;color:var(--fg-3);line-height:1.5}
.grp-h .hint.mono{font-family:var(--font-mono);font-size:11.5px}
.grp-h .t{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap}
.grp-h h2{font-family:var(--font-display);font-size:15.5px;font-weight:600;letter-spacing:-.005em}
.grp-h .n{font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.grp-h p{font-size:12.5px;color:var(--fg-2);margin-top:5px;line-height:1.55;max-width:var(--measure)}
.grp-h .path{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-3);margin-top:4px;display:block;overflow-wrap:anywhere}
.grp-h .end{display:flex;gap:var(--s-2);align-items:center;flex-wrap:wrap}

/* A row: where, what was found, what the site does now, and its fix. */
.hrows > li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) 300px;gap:var(--s-2) var(--s-5);align-items:start;padding:var(--pad-row) var(--pad-x);border-bottom:1px solid var(--border)}
.hrows > li:last-child{border-bottom:0}
@media (max-width:860px){.hrows > li{grid-template-columns:minmax(0,1fr)}.h-acts{justify-content:flex-start!important}}
.h-lead{min-width:0}
.h-lead a.t,.h-lead .t{font-family:var(--font-title);font-size:var(--title-size);font-weight:var(--title-weight);letter-spacing:var(--title-track);color:var(--fg);display:block}
.h-lead a.t:hover{color:var(--accent)}
.h-lead .t.none{color:var(--fg-3);font-style:italic}
.h-lead .p{display:block;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:4px;overflow-wrap:anywhere}
.h-lead .m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--fg-3);margin-top:5px}
.h-lead .m .ic{width:13px;height:13px}
.h-lead .pill{margin-bottom:6px}
.h-what{min-width:0}
.kv{display:inline-block;font-family:var(--font-mono);font-size:12px;color:var(--fg-2);background:var(--bg);border:1px solid var(--border);border-radius:var(--r-1);padding:2px 8px;overflow-wrap:anywhere;max-width:100%}
.kv .ln{color:var(--fg-3);margin-right:8px;user-select:none}
.kv mark{background:transparent;color:var(--fg);text-decoration:underline wavy var(--warn-dot);text-underline-offset:3px;text-decoration-thickness:1px}
.err .kv mark{text-decoration-color:var(--danger-dot)}
.kv.new mark{text-decoration:none;color:var(--good);font-weight:500}
.kv.miss{border-style:dashed;color:var(--fg-3)}
.h-what p{font-size:12.5px;color:var(--fg-2);line-height:1.55;margin-top:6px}
.h-what p b{color:var(--fg);font-weight:600}
.h-acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.btn.icon{width:var(--ctl-sm);padding:0}
.btn.icon .ic{width:15px;height:15px}
.btn[aria-expanded="true"] .ic{transform:rotate(180deg)}
.h-more{grid-column:1/-1;display:flex;flex-direction:column;gap:var(--s-3);padding:var(--s-3) 0 var(--s-1)}
.h-more[hidden]{display:none}
.h-more .lbl{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
.h-more .alts{display:flex;gap:var(--s-2);flex-wrap:wrap;align-items:center}
.h-more .say{font-size:12.5px;color:var(--fg-2);line-height:1.55;max-width:var(--measure)}

/* A fixed row stays where it was until the next check, quieter. */
.hrows > li.done{background:var(--surface-2)}
.hrows > li.done .h-lead a.t,.hrows > li.done .h-lead .t{color:var(--fg-2)}
.hrows > li.done .h-what p{color:var(--fg-3)}

/* An excerpt of the file around the line, numbered like the editor's source. */
.xc{border:1px solid var(--border);border-radius:var(--r-2);overflow:hidden;background:var(--bg)}
.xc-h{display:flex;align-items:center;gap:var(--s-3);padding:7px var(--s-3);border-bottom:1px solid var(--border);background:var(--surface-2);font-size:11.5px;flex-wrap:wrap}
.xc-h .mono{color:var(--fg-2);font-size:11px;overflow-wrap:anywhere;min-width:0}
.xc-h a{margin-left:auto;color:var(--accent);font-weight:500;display:inline-flex;align-items:center;gap:4px}
.xc-h a .ic{width:13px;height:13px}
.xc ol{padding:6px 0;font-family:var(--font-mono);font-size:12px;line-height:1.75;overflow-x:auto}
.xc li{display:flex;white-space:pre;padding-right:var(--s-3)}
.xc li i{font-style:normal;width:40px;flex:none;text-align:right;padding-right:14px;color:var(--fg-3);user-select:none}
.xc li.hit{background:var(--danger-soft)}
.xc li.hit i{color:var(--danger)}
.xc li.hit.w{background:var(--warn-soft)}
.xc li.hit.w i{color:var(--warn)}
.xc li.cue{color:var(--danger);font-family:var(--font-ui);font-size:11.5px;white-space:normal}

/* Two files claiming one thing: pick which keeps it. */
.pick2{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.pick2 label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface);cursor:pointer}
.pick2 label:hover{border-color:var(--border-strong)}
.pick2 label:has(input:checked){border-color:var(--accent-line);background:var(--accent-soft)}
.pick2 input{margin:3px 0 0;accent-color:var(--accent)}
.pick2 .t{font-size:12.5px;color:var(--fg);font-weight:500}
.pick2 .s{grid-column:2;font-size:11.5px;color:var(--fg-3)}
.pick2 .s .mono{color:var(--fg-2)}
.pick2 .then{grid-column:2;font-size:11.5px;color:var(--fg-2)}

/* A list of entries inside a row or a confirm, capped, never scrolling. */
.alist{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface)}
.alist li{display:flex;align-items:center;gap:var(--s-3);padding:8px var(--s-3);border-bottom:1px solid var(--border);font-size:12.5px;min-width:0}
.alist li:last-child{border-bottom:0}
.alist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alist a.nm:hover{color:var(--accent)}
.alist .via{font-size:11.5px;color:var(--fg-3);white-space:nowrap}
.alist .rest{color:var(--fg-3);font-size:11.5px}
.alist .rest a{color:var(--accent)}
.alist.chg li{flex-direction:column;align-items:stretch;gap:3px}
.alist.chg .p{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);overflow-wrap:anywhere}
.alist.chg .d{font-family:var(--font-mono);font-size:11.5px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.alist.chg .d del{color:var(--fg-3);text-decoration:line-through}
.alist.chg .d ins{text-decoration:none;color:var(--good)}
.alist.chg .d .ic{width:12px;height:12px;color:var(--fg-3)}

/* A small inline form inside a row's details. */
.mini{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px var(--s-4);align-items:center;max-width:560px}
.mini .k{font-size:12.5px;color:var(--fg-2)}
.inp{height:var(--ctl);padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--r-1);background:var(--surface);font-size:12.5px;width:100%;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mini .v{font-family:var(--font-mono);font-size:12px;color:var(--fg-2)}
@media (max-width:640px){.mini{grid-template-columns:minmax(0,1fr)}}

/* Search for another entry, capped at 6 results. */
.pk{display:flex;flex-direction:column;gap:6px;max-width:560px}
.pk .psearch{flex:none;max-width:none}
.pk .res{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface)}
.pk .res button{display:flex;align-items:center;gap:var(--s-3);padding:8px var(--s-3);border-bottom:1px solid var(--border);font-size:12.5px;text-align:left}
.pk .res button:last-child{border-bottom:0}
.pk .res button:hover{background:var(--surface-2)}
.pk .res button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.pk .res button .via{margin-left:auto;font-size:11.5px;color:var(--fg-3);white-space:nowrap}
.pk .res .more{padding:8px var(--s-3);font-size:11.5px;color:var(--fg-3)}

.h-cap{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--pad-x);border-top:1px solid var(--border);background:var(--surface-2);font-size:12px;color:var(--fg-3);flex-wrap:wrap}
.h-cap button{color:var(--accent);font-weight:500;font-size:12px}

/* Nothing left. */
.empty{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);padding:var(--s-7) var(--s-5);display:flex;flex-direction:column;align-items:center;gap:var(--s-2);text-align:center}
.empty .badge{width:40px;height:40px;border-radius:99px;display:grid;place-items:center;background:var(--good-soft);color:var(--good);margin-bottom:var(--s-2)}
.empty .badge.n{background:var(--surface-2);color:var(--fg-3)}
.empty b{font-family:var(--font-display);font-size:17px;font-weight:600}
.empty p{font-size:12.5px;color:var(--fg-2);max-width:52ch;line-height:1.6}
.empty button{color:var(--accent);font-weight:500}

/* ------------------------------------------------- menus, modals, toast -- */
.menu{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);box-shadow:var(--shadow-2);padding:6px;width:236px}
.menu button,.menu a{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:var(--r-1);font-size:12.5px;color:var(--fg-2);text-align:left}
.menu button:hover,.menu a:hover,.menu button:focus-visible{background:var(--surface-2);color:var(--fg);outline:0}
.menu .ic{width:15px;height:15px;color:var(--fg-3)}
.menu hr{border:0;height:1px;background:var(--border);margin:5px -6px}
.menu .note{padding:6px 10px;font-size:11.5px;color:var(--fg-3);line-height:1.5}
.scrim{position:fixed;inset:0;z-index:55;background:color-mix(in srgb,var(--fg) 28%,transparent);display:grid;place-items:center;padding:var(--s-4)}
.mdl{width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-3);box-shadow:var(--shadow-3);display:flex;flex-direction:column}
.mdl-h{padding:var(--s-5) var(--s-5) var(--s-3);display:flex;gap:var(--s-3);align-items:flex-start}
.mdl-h h3{font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.badge{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.badge .ic{width:15px;height:15px}
.mdl-b{padding:0 var(--s-5) var(--s-5);font-size:12.5px;color:var(--fg-2);display:flex;flex-direction:column;gap:var(--s-4);line-height:1.6}
.mdl-b b{color:var(--fg);font-weight:600}
.mdl-f{display:flex;gap:var(--s-2);justify-content:flex-end;padding:var(--s-4) var(--s-5);border-top:1px solid var(--border);flex-wrap:wrap}
.toast{position:fixed;right:24px;bottom:24px;z-index:58;display:inline-flex;align-items:center;gap:var(--s-3);background:var(--surface);border:1.5px solid var(--good-dot);border-radius:var(--r-2);box-shadow:var(--shadow-2);padding:9px 9px 9px 14px;font-size:12.5px;color:var(--fg);max-width:calc(100vw - 32px)}
.toast > .ic{color:var(--good-dot)}
.toast .div{width:1px;align-self:stretch;margin-block:3px;background:var(--border)}
.toast .undo{display:inline-flex;align-items:center;gap:6px;height:var(--ctl-sm);padding:0 11px;border-radius:var(--r-1);font-size:12px;font-weight:500;color:var(--accent)}
.toast .undo:hover{background:var(--accent-soft)}
.toast .undo .ic{width:14px;height:14px}
@media (max-width:640px){.toast{right:16px;left:16px;bottom:16px}}
/* ===================================================== content types == */

/* ---- notices: neutral explains, warn and bad are states ---- */
.notice{display:flex;gap:var(--s-3);align-items:flex-start;padding:var(--s-4) var(--s-5);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-3);font-size:13px;color:var(--fg-2);line-height:1.6}
.notice > .ic{color:var(--fg-3);margin-top:3px}
.notice b{color:var(--fg);font-weight:600}
.notice .mono,.notice code{font-family:var(--font-mono);font-size:12px;color:var(--fg)}
.notice a{color:var(--accent);font-weight:500}
.notice .acts{margin-left:auto;display:flex;gap:var(--s-2);flex:none;align-self:center}
.notice.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.notice.warn > .ic{color:var(--warn-dot)} .notice.warn b,.notice.warn code{color:var(--warn)}
.notice.bad{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.notice.bad > .ic{color:var(--danger-dot)} .notice.bad b{color:var(--danger)}
.notice.slim{padding:var(--s-3) var(--s-4);border-radius:var(--r-2);font-size:12.5px}
@media (max-width:640px){.notice{flex-wrap:wrap}.notice .acts{margin-left:0}}

/* ---- the admin table ---- */
.tcap{display:flex;align-items:baseline;gap:var(--s-3);padding:var(--pad-panel) var(--pad-x);border-bottom:1px solid var(--border)}
.tcap b{font-family:var(--font-display);font-size:15.5px;font-weight:600}
.tcap span{font-size:12.5px;color:var(--fg-3)}
.tcap .clear{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:500}
.tbl-shell{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:720px}
table.tbl th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:12px var(--pad-x);border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl th.r,table.tbl td.r{text-align:right}
table.tbl td{padding:var(--pad-row) var(--pad-x);border-bottom:1px solid var(--border);vertical-align:top;font-size:13px}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover td{background:var(--surface-2)}
table.tbl td.num{font-family:var(--font-mono);font-size:12px;color:var(--fg-2);padding-top:calc(var(--pad-row) + 2px)}
table.tbl td.num.zero{color:var(--fg-3)}
.tname{display:flex;gap:var(--s-3);align-items:flex-start;min-width:0}
.tname > .ic{margin-top:2px;color:var(--fg-2);width:17px;height:17px}
.tname a,.tname .t{font-family:var(--font-title);font-size:var(--title-size);font-weight:var(--title-weight);letter-spacing:var(--title-track);color:var(--fg)}
.tname a:hover{color:var(--accent)}
.tname .sl{display:block;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:4px}
.tname .flag{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--warn)}
.tname .flag .ic{width:13px;height:13px;color:var(--warn-dot)}
.tname .flag a{font-family:var(--font-ui);font-size:12px;color:var(--accent);font-weight:500;letter-spacing:0}
.kindc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:2px}
.tag{text-transform:none;letter-spacing:0;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;background:var(--surface-2);color:var(--fg-2);font-size:11px;font-weight:500;border:1px solid var(--border);white-space:nowrap}
.tag .ic{width:12px;height:12px}
.tag.acc{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.src{font-size:12.5px;color:var(--fg);padding-top:2px;display:block}
.src.mono{font-family:var(--font-mono);font-size:12px}
.src small{display:block;font-family:var(--font-ui);font-size:11.5px;color:var(--fg-3);margin-top:3px}
tr.old td{background:color-mix(in srgb,var(--warn-soft) 55%,transparent)}
.sk{display:inline-block;height:10px;border-radius:4px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.4s linear infinite;vertical-align:middle}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.lempty{padding:var(--s-7) var(--s-5);text-align:center;color:var(--fg-2);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px}
.lempty b{font-family:var(--font-display);font-size:16px;color:var(--fg);font-weight:600}
.lempty button{color:var(--accent);font-weight:500;margin-top:4px}
.ftools .clear{font-size:12.5px;color:var(--accent);font-weight:500}

/* ---- the detail head ---- */
.ph-id{display:flex;align-items:center;gap:var(--s-4);min-width:0}
.ticon{width:44px;height:44px;border-radius:var(--r-2);background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--fg-2);flex:none}
.ticon .ic{width:21px;height:21px}
.ph .facts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--fg-2)}
.ph .facts .sep{color:var(--fg-3)}
.ph .facts .mono{font-family:var(--font-mono);font-size:12px}
.ph .desc{color:var(--fg-2);font-size:13.5px;margin-top:var(--s-3);max-width:var(--measure);line-height:1.6}
.ph .desc.none{color:var(--fg-3);font-style:italic}
.pill.changed{background:var(--accent-soft);color:var(--accent)} .pill.changed .d{background:var(--accent)}

/* ---- settings panels: label left, control right ---- */
.spanel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);overflow:hidden}
.spanel + .spanel{margin-top:0}
.spanel-h{display:flex;align-items:baseline;gap:var(--s-3);flex-wrap:wrap;padding:var(--pad-panel) var(--pad-x);border-bottom:1px solid var(--border)}
.spanel-h h2{font-family:var(--font-display);font-size:15.5px;font-weight:600}
.spanel-h .hint{font-size:12.5px;color:var(--fg-3)}
.spanel-h .end{margin-left:auto;display:flex;gap:var(--s-2);align-self:center}
.srow{display:grid;grid-template-columns:minmax(160px,30%) minmax(0,1fr);gap:var(--s-2) var(--s-5);padding:var(--s-5) var(--pad-x);border-bottom:1px solid var(--border);align-items:start}
.srow:last-child{border-bottom:0}
.srow > .lbl{font-size:13px;color:var(--fg);font-weight:500;padding-top:8px}
.srow > .lbl.flat{padding-top:0}
.srow > .lbl small{display:block;font-weight:400;color:var(--fg-3);font-size:12px;margin-top:3px;line-height:1.5}
.srow > .ctl{display:flex;flex-direction:column;gap:var(--s-2);min-width:0}
.srow .hint{font-size:12.5px;color:var(--fg-3);line-height:1.55}
.srow .hint .mono,.srow .hint code{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-2)}
.srow .val{font-size:13px;color:var(--fg);padding-top:8px}
.srow .val.mono{font-family:var(--font-mono);font-size:12.5px}
.srow .why{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3)}
.srow .why .ic{width:13px;height:13px}
.err-t{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--danger)}
.err-t .ic{width:14px;height:14px;color:var(--danger-dot)}
.srow.sub{padding-left:calc(var(--pad-x) + 24px);background:var(--bg)}
@media (max-width:760px){.srow{grid-template-columns:minmax(0,1fr)}.srow > .lbl{padding-top:0}.srow .val{padding-top:0}}
.inp{height:var(--ctl);padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--r-1);background:var(--surface);font-size:13px;width:100%;max-width:440px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.mono{font-family:var(--font-mono);font-size:12.5px}
.inp.bad{border-color:var(--danger-dot)}
.inp.bad:focus{box-shadow:0 0 0 3px var(--danger-soft)}
.inp[readonly]{background:var(--surface-2);color:var(--fg-2)}
.inp.sm{max-width:120px}
.affix{display:flex;align-items:stretch;max-width:440px;border:1px solid var(--border-strong);border-radius:var(--r-1);background:var(--surface);overflow:hidden}
.affix:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.affix.bad{border-color:var(--danger-dot)}
.affix > span{display:flex;align-items:center;padding:0 10px;background:var(--surface-2);color:var(--fg-3);font-family:var(--font-mono);font-size:12px;border-right:1px solid var(--border);white-space:nowrap}
.affix input{flex:1;min-width:0;height:calc(var(--ctl) - 2px);border:0;outline:0;padding:0 10px;font-family:var(--font-mono);font-size:12.5px;background:transparent}
.affix input[readonly]{background:var(--surface-2);color:var(--fg-2)}
.addr{font-family:var(--font-mono);font-size:12px;color:var(--fg-2);overflow-wrap:anywhere}
.addr b{color:var(--fg);font-weight:500}
.sel.wide{flex:none;width:100%;max-width:440px}

/* A switch is a setting that takes effect in the form; the label says what it is. */
.swrow{display:flex;align-items:flex-start;gap:var(--s-3);cursor:pointer}
.swrow input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:32px;height:18px;border-radius:99px;background:var(--border-strong);position:relative;flex:none;margin-top:2px;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:99px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.swrow input:checked + .sw{background:var(--accent)}
.swrow input:checked + .sw::after{left:16px}
.swrow input:focus-visible + .sw{outline:2px solid var(--accent);outline-offset:2px}
.swrow .tx{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--fg)}
.swrow .tx small{font-size:12px;color:var(--fg-3);line-height:1.5}
.swrow .tx small code{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-2)}
.swrow .state{font-size:12px;color:var(--fg-3);font-weight:400;margin-left:6px}
.swlist{display:flex;flex-direction:column;gap:var(--s-4)}
.swlist .nest{padding-left:44px}

/* Choice cards: a kind, with what it's for. */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:var(--s-3);max-width:640px}
.choice{display:flex;gap:var(--s-3);align-items:flex-start;padding:var(--s-4);border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface);cursor:pointer;position:relative}
.choice:hover{border-color:var(--border-strong)}
.choice input{position:absolute;opacity:0;width:1px;height:1px}
.choice:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.choice:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.choice > .ic{width:20px;height:20px;color:var(--fg-2);margin-top:1px}
.choice:has(input:checked) > .ic{color:var(--accent)}
.choice b{display:block;font-size:13.5px;font-weight:600}
.choice span{display:block;font-size:12.5px;color:var(--fg-2);line-height:1.5;margin-top:3px}
.choice code{font-family:var(--font-mono);font-size:11.5px}

/* A radio list, with an example per option. */
.rlist{display:flex;flex-direction:column;gap:2px;max-width:560px}
.rlist label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start;padding:7px 10px;border-radius:var(--r-1);cursor:pointer}
.rlist label:hover{background:var(--surface-2)}
.rlist input{margin:3px 0 0;accent-color:var(--accent)}
.rlist .t{font-size:13px}
.rlist .x{grid-column:2;font-family:var(--font-mono);font-size:11.5px;color:var(--fg-3);overflow-wrap:anywhere}
.rlist .x.ui{font-family:var(--font-ui);font-size:12px}

/* Token choices for which types a terms type files. */
.picks{display:flex;flex-wrap:wrap;gap:6px;max-width:560px}
.picks label{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px 0 9px;border:1px solid var(--border);border-radius:99px;background:var(--surface);font-size:12.5px;cursor:pointer;color:var(--fg-2)}
.picks label:hover{border-color:var(--border-strong)}
.picks input{position:absolute;opacity:0;width:1px;height:1px}
.picks label .ic{width:14px;height:14px}
.picks label:has(input:checked){border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
.picks label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

/* ---- the wizard ---- */
.steps{display:flex;gap:0;align-items:center;flex-wrap:wrap;counter-reset:st}
.steps li{display:flex;align-items:center}
.steps li + li::before{content:"";width:40px;height:1px;background:var(--border-strong);margin:0 var(--s-3)}
.steps button{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--fg-3);padding:4px 2px}
.steps button:not([disabled]):hover{color:var(--fg)}
.steps button[disabled]{cursor:default}
.steps .n{width:24px;height:24px;border-radius:99px;display:grid;place-items:center;font-size:11.5px;font-weight:600;border:1px solid var(--border-strong);background:var(--surface);color:var(--fg-3);font-family:var(--font-mono)}
.steps .n .ic{width:13px;height:13px;stroke-width:2.4}
.steps [aria-current="step"]{color:var(--fg);font-weight:500}
.steps [aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.steps .done{color:var(--fg-2)}
.steps .done .n{background:var(--good-soft);border-color:transparent;color:var(--good)}
@media (max-width:640px){.steps li + li::before{width:14px;margin:0 6px}.steps .w{display:none}.steps [aria-current="step"] .w{display:inline}}
.wiz{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s-5);align-items:start}
@media (max-width:1180px){.wiz{grid-template-columns:minmax(0,1fr)}}
.wiz-main{display:flex;flex-direction:column;gap:var(--s-5);min-width:0}
.sum{position:sticky;top:var(--s-5);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);overflow:hidden}
.sum h2{font-family:var(--font-display);font-size:15px;font-weight:600;padding:var(--pad-panel) var(--s-5);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:var(--s-2)}
.sum h2 .ic{color:var(--fg-3)}
.sum dl{display:flex;flex-direction:column}
.sum dl > div{padding:10px var(--s-5);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.sum dl > div:last-child{border-bottom:0}
.sum dt{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.sum dd{margin:0;font-size:13px;color:var(--fg);overflow-wrap:anywhere;line-height:1.5}
.sum dd .mono{font-family:var(--font-mono);font-size:12px;color:var(--fg-2)}
.sum dd.none{color:var(--fg-3)}
.sum .lit{animation:lit .9s ease-out}
@keyframes lit{from{background:var(--accent-soft)}to{background:transparent}}
.wbar{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;padding-top:var(--s-2)}
.wbar .grow{flex:1}
.wbar .say{font-size:12.5px;color:var(--danger);display:flex;align-items:center;gap:6px}
.wbar .say .ic{width:14px;height:14px}

/* ---- tabs on a type ---- */
.utabs .dot{width:6px;height:6px;border-radius:99px;background:var(--accent)}

/* ---- the save bar, at the bottom of the work area ---- */
.savebar{position:sticky;bottom:0;z-index:5;margin:0 calc(var(--s-7) * -1) -96px;padding:var(--s-3) var(--s-7);background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;box-shadow:0 -6px 16px rgba(0,0,0,.04)}
.savebar .n{font-size:13px;color:var(--fg)}
.savebar .n b{font-weight:600}
.savebar .grow{flex:1}
.savebar .fail{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--danger);flex-basis:100%}
.savebar .fail .ic{width:14px;height:14px;color:var(--danger-dot)}
@media (max-width:760px){.savebar{margin:0 calc(var(--s-4) * -1) -96px;padding:var(--s-3) var(--s-4)}}

/* ---- rows in a panel: relationships, fields, sets, archives ---- */
.rrows > li{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto;gap:var(--s-2) var(--s-5);padding:var(--pad-row) var(--pad-x);border-bottom:1px solid var(--border);align-items:center}
.rrows > li:last-child{border-bottom:0}
.rrows > li.g{display:block;padding:var(--s-3) var(--pad-x) 6px;background:var(--bg);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.rrows .say{font-size:13.5px;color:var(--fg)}
.rrows .say b{font-weight:600}
.rrows .say a{color:var(--fg)}
.rrows .say a:hover{color:var(--accent)}
.rrows .k{display:block;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:3px}
.rrows .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--fg-2)}
.rrows .note{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3);margin-top:5px}
.rrows .note .ic{width:13px;height:13px}
.rrows .acts{display:flex;gap:4px;justify-content:flex-end}
@media (max-width:860px){.rrows > li{grid-template-columns:minmax(0,1fr)}.rrows .acts{justify-content:flex-start}}
.pempty{padding:var(--s-6) var(--pad-x);color:var(--fg-2);font-size:13px}
.pnote{padding:var(--s-3) var(--pad-x);border-top:1px solid var(--border);background:var(--bg);font-size:12.5px;color:var(--fg-2);display:flex;gap:8px;align-items:flex-start;line-height:1.55}
.pnote .ic{width:14px;height:14px;color:var(--fg-3);margin-top:2px}
.pnote a{color:var(--accent);font-weight:500}

/* Fields: a table that reorders, and opens a field in place. */
.frows > li{display:grid;grid-template-columns:22px minmax(0,1.3fr) minmax(0,1fr) minmax(0,.8fr) 90px;gap:var(--s-2) var(--s-4);padding:12px var(--pad-x);border-bottom:1px solid var(--border);align-items:center}
.frows > li:last-child{border-bottom:0}
.frows > li.hd{padding-block:10px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.frows > li.on{background:var(--accent-soft)}
.frows .mv{display:flex;flex-direction:column}
.frows .mv button{width:22px;height:15px;display:grid;place-items:center;color:var(--fg-3);border-radius:4px}
.frows .mv button:hover{background:var(--surface-3);color:var(--fg)}
.frows .mv button[disabled]{opacity:.3;pointer-events:none}
.frows .mv .ic{width:13px;height:13px}
.frows .lb{font-size:13.5px;font-weight:500}
.frows .lb small{display:block;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);font-weight:400;margin-top:2px}
.frows .ty{font-size:12.5px;color:var(--fg-2)}
.frows .ty small{display:block;font-size:11.5px;color:var(--fg-3)}
.frows .rq{font-size:12.5px;color:var(--fg-2)}
.frows .acts{display:flex;gap:4px;justify-content:flex-end}
.frows.ro > li{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.9fr)}
@media (max-width:760px){.frows > li,.frows.ro > li{grid-template-columns:auto minmax(0,1fr) auto}.frows .ty,.frows .rq{grid-column:2}.frows > li.hd{display:none}}
.builtins{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* The field editor, opened in place under its row. */
.fed{border-top:1px solid var(--accent-line);border-bottom:1px solid var(--border);background:var(--bg)}
.fed .srow{background:transparent}
.fed .srow:last-of-type{border-bottom:1px solid var(--border)}
.fed-f{display:flex;gap:var(--s-2);align-items:center;flex-wrap:wrap;padding:var(--s-4) var(--pad-x)}
.fed-f .grow{flex:1}
.optlist{display:flex;flex-direction:column;gap:6px;max-width:440px}
.optlist > div{display:flex;gap:6px;align-items:center}
.optlist .inp{flex:1}
.two{display:flex;gap:var(--s-3);flex-wrap:wrap;align-items:flex-end}
.two label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg-2)}
.two .inp{width:140px}

/* Addresses: one row per address, its result and what it needs. */
.arows > li{display:grid;grid-template-columns:minmax(150px,22%) minmax(0,1fr);gap:var(--s-2) var(--s-5);padding:var(--s-4) var(--pad-x);border-bottom:1px solid var(--border);align-items:start}
.arows > li:last-child{border-bottom:0}
.arows .lb{font-size:13px;font-weight:500;padding-top:8px}
.arows .ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.arows .ph-r{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--fg-3)}
.ph-chip{font-family:var(--font-mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border);color:var(--fg-2)}
.ph-chip.need{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
@media (max-width:760px){.arows > li{grid-template-columns:minmax(0,1fr)}.arows .lb{padding-top:0}}

/* Facts for a type that can only be viewed. */
.facts-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.facts-g > div{padding:var(--s-4) var(--pad-x);border-bottom:1px solid var(--border);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:3px;min-width:0}
.facts-g dt{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.facts-g dd{margin:0;font-size:13px;color:var(--fg);overflow-wrap:anywhere}
.facts-g dd .mono{font-family:var(--font-mono);font-size:12px}
.facts-g dd.no{color:var(--fg-3)}

/* The icon picker. */
.ipick{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap}
.ipick .cur{width:38px;height:38px;border-radius:var(--r-2);border:1px solid var(--border-strong);display:grid;place-items:center;background:var(--surface)}
.ipick .cur .ic{width:19px;height:19px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,38px);gap:4px;max-width:440px;padding:var(--s-2);border:1px solid var(--border);border-radius:var(--r-2);background:var(--surface)}
.igrid button{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r-1);color:var(--fg-2)}
.igrid button:hover{background:var(--surface-2);color:var(--fg)}
.igrid button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-line)}
.igrid .ic{width:18px;height:18px}

.mdl-b .alist .via{margin-left:auto}
.mdl-b ul.plain{display:flex;flex-direction:column;gap:4px;padding-left:2px}
.lnk{color:var(--accent);font-weight:500}
.lnk:hover{text-decoration:underline}
.side-g2{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);padding:var(--s-4) var(--s-5) var(--s-1)}
.side{overflow-y:auto}

body:has(.savebar) .toast{bottom:84px}
.srow .val .ic{width:15px;height:15px;vertical-align:-3px;color:var(--fg-2)}
.srow .val.no{color:var(--fg-3)}
.lab-grp{min-width:0;max-width:100%}.lab-seg{overflow-x:auto;max-width:100%;scrollbar-width:none}
.srow.ro{padding-block:12px}.srow.ro .val{padding-top:0}

/* ========================================================= submissions == */
/* The rail scopes the panel; it never changes the screen. */
.rail button{width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 7px;border-radius:var(--r-2);font-size:10.5px;color:var(--fg-2)}
.rail button .ic{width:19px;height:19px}
.rail button:hover{background:var(--surface-2);color:var(--fg)}
.rail button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.rail .ri{position:relative;display:grid}
.rail .rdot{position:absolute;top:-2px;right:-4px;width:7px;height:7px;border-radius:99px;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.side nav a .c.cnew{font-family:var(--font-mono);color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:0 7px}

.pill.newp{background:var(--accent-soft);color:var(--accent)} .pill.newp .d{background:var(--accent)}
.pill.trash{background:var(--danger-soft);color:var(--danger)} .pill.trash .d{background:var(--danger-dot)}

table.tbl.subs td{vertical-align:top}
table.tbl.subs th:first-child,table.tbl.subs td:first-child{padding-right:0}
table.tbl.subs .cbx{margin-top:1px}
table.tbl.subs tr.selr td{background:var(--accent-soft)}
table.tbl.subs .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
table.tbl.subs .who .t{font-family:var(--font-title);font-size:var(--title-size);font-weight:var(--title-weight);letter-spacing:var(--title-track);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
table.tbl.subs .who .t:hover{color:var(--accent)}
table.tbl.subs tr.is-new .who .t{font-weight:600}
table.tbl.subs .sl{display:block;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv{font-size:12.5px;color:var(--fg-2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
tr.is-new .pv{color:var(--fg)}
.pv .tag{margin-right:4px;vertical-align:1px}
.pv .k{color:var(--fg-3)}
.pv .sep{color:var(--fg-3)}
.pg{font-size:11.5px;color:var(--fg-2)}
table.tbl.subs td.num{padding-top:var(--pad-row);font-family:var(--font-ui);font-size:12.5px;color:var(--fg-2)}
.rowmenu{opacity:0}
tr:hover .rowmenu,.rowmenu:focus-visible,.rowmenu[aria-expanded="true"]{opacity:1}
@media (hover:none){.rowmenu{opacity:1}}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:var(--s-3) var(--pad-x);border-top:1px solid var(--border);font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.pager span{margin-right:var(--s-2)}
.btn[disabled]{opacity:.4}
.ftools .say .clear{margin-left:4px}

.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 18px;background:var(--surface);border:1px solid var(--border-strong);border-radius:99px;box-shadow:var(--shadow-2);font-size:12.5px;max-width:calc(100vw - 32px);overflow-x:auto;white-space:nowrap}
.bulk b{font-weight:600;font-variant-numeric:tabular-nums}
.bulk .div{width:1px;height:20px;background:var(--border);flex:none;margin:0 4px}
@media (prefers-reduced-motion:no-preference){.bulk.enter{animation:bulkin .16s ease-out}}
@keyframes bulkin{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* One submission. */
.ph-top{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap}
.nav2{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.nav2 span:first-child{margin-right:6px}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.ph-acts{flex-wrap:wrap;align-items:center}
.vdiv{width:1px;height:22px;background:var(--border);margin:0 4px}
.ans{font-size:13.5px;color:var(--fg);line-height:1.6;padding-top:7px;overflow-wrap:anywhere}
.ans.long{white-space:pre-wrap;max-width:var(--measure)}
.ans.mono{font-family:var(--font-mono);font-size:12.5px}
.ans.none{color:var(--fg-3);font-style:italic}
.with-btn .ans{padding-top:0;align-self:center;flex:1;min-width:0}
.filer{display:flex;align-items:center;gap:var(--s-3);max-width:560px;padding:8px var(--s-3);border:1px solid var(--border);border-radius:var(--r-2);font-size:13px}
.filer > .ic{color:var(--fg-3)}
.filer > span{flex:1;min-width:0;overflow-wrap:anywhere}
.filer small{display:block;font-size:11.5px;color:var(--fg-3)}
.srow .lbl small.mono{font-family:var(--font-mono);font-size:11px}
.alist.nl{border:0;border-radius:0}
.alist.nl li{padding:var(--s-3) var(--pad-x);gap:var(--s-3);flex-wrap:wrap}
.alist.nl .nm{flex:0 1 auto;font-weight:500}
.alist.nl .via{white-space:normal}
.alist.nl .via .mono{font-size:11.5px;color:var(--fg-2)}
@media (max-width:760px){.nav2{margin-left:0}}
.toast.info{border-color:var(--accent)} .toast.info > .ic{color:var(--accent)}
table.tbl.subs td.num time{white-space:nowrap}
.srow.arow2{padding-block:var(--s-4)}
.fm{display:block;font-size:12.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ========================================================= redirects == */
/* Everything below is new for the Redirects sketch. Everything above it is the
   Forms sketch's shell and controls, unchanged. */

.side nav a .c.alert{color:var(--warn);background:var(--warn-soft);border-radius:99px;padding:0 7px}

/* A path is machine data. A placeholder is the one part of it that varies. */
.rpath{font-family:var(--font-mono);font-size:12.5px;color:var(--fg);overflow-wrap:anywhere;line-height:1.55}
.phd{color:var(--accent);background:var(--accent-soft);border-radius:3px;padding:0 2px;white-space:nowrap}

/* Where it goes: a path, an entry by name, or another site with its host plain. */
.rto{display:flex;flex-direction:column;gap:3px;min-width:0}
.rto .ent{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-title);font-size:var(--title-size);font-weight:var(--title-weight);letter-spacing:var(--title-track);color:var(--fg);align-self:flex-start;text-align:left}
.rto .ent .ic{width:14px;height:14px;color:var(--fg-3)}
.rto .ent:hover{color:var(--accent)}
.rto .at{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);overflow-wrap:anywhere}
.rto .gone{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-title);font-size:var(--title-size);color:var(--fg-3);text-decoration:line-through;text-decoration-color:var(--border-strong)}
.rto .gone .ic{width:14px;height:14px}
.xurl{font-family:var(--font-mono);font-size:12.5px;color:var(--fg-3);overflow-wrap:anywhere;line-height:1.55}
.xurl b{color:var(--fg);font-weight:500}
.xurl .ic{width:13px;height:13px;vertical-align:-2px;margin-left:5px;color:var(--fg-3)}
.rtype{font-size:12.5px;color:var(--fg);display:block;padding-top:1px}
.rtype .code{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-left:6px;white-space:nowrap}
.radd{font-size:12.5px;color:var(--fg-2);white-space:nowrap;display:block;padding-top:1px}
.radd small{display:block;font-size:11.5px;color:var(--fg-3);margin-top:2px;white-space:normal}

/* A problem is a marker and a sentence on the row, never a blocked screen. */
.rflag{display:flex;align-items:flex-start;gap:6px;margin-top:7px;font-size:12px;color:var(--warn);line-height:1.5;font-family:var(--font-ui)}
.rflag .ic{width:13px;height:13px;margin-top:2px;color:var(--warn-dot)}
.rflag .fx{color:var(--accent);font-weight:500;font-size:12px;white-space:nowrap}
.rflag .fx:hover{text-decoration:underline}

table.tbl.rd{table-layout:fixed;min-width:720px}
table.tbl.rd td{vertical-align:top}
table.tbl.rd th:first-child,table.tbl.rd td:first-child{padding-right:0}
table.tbl.rd .cbx{margin-top:1px}
table.tbl.rd tr.selr td{background:var(--accent-soft)}
table.tbl.rd .arrow{color:var(--fg-3)}
table.tbl.rd tr.flash td{animation:lit 1.6s ease-out}
.sk-row td{padding-block:calc(var(--pad-row) + 3px)}

/* Add and edit happen in place, in the row. */
tr.redit > td{background:var(--bg);padding:var(--s-5) var(--pad-x) var(--s-4);border-bottom:1px solid var(--border)}
table.tbl.rd tbody tr.redit:hover td{background:var(--bg)}
tr.redit.first > td{border-top:0}
.rf-h{display:flex;align-items:baseline;gap:var(--s-3);margin-bottom:var(--s-4)}
.rf-h b{font-family:var(--font-display);font-size:15px;font-weight:600}
.rf-h span{font-size:12.5px;color:var(--fg-3)}
.rform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,230px);gap:var(--s-4) var(--s-5);align-items:start}
@media (max-width:1080px){.rform{grid-template-columns:minmax(0,1fr)}}
.fld2{display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.fld2 > label,.fld2 > .lb{font-size:12.5px;font-weight:500;color:var(--fg)}
.fld2 .inp,.fld2 .sel.wide,.fld2 .affix{max-width:none}
.fld2 .hint{font-size:12px;color:var(--fg-3);line-height:1.5}
.fld2 .hint code{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-2)}
.with{display:flex;gap:6px;min-width:0}
.with > .inp,.with > .chosen{flex:1;min-width:0}
.chosen{display:flex;align-items:center;gap:8px;height:var(--ctl);padding:0 4px 0 10px;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r-1);min-width:0}
.chosen > .ic{width:15px;height:15px;color:var(--accent)}
.chosen b{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.chosen .at{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.chosen .btn.icon{flex:none;height:26px;width:26px}
.msg{display:flex;gap:7px;font-size:12px;line-height:1.5;align-items:flex-start}
.msg .ic{width:13px;height:13px;margin-top:2px;flex:none}
.msg.bad{color:var(--danger)} .msg.bad .ic{color:var(--danger-dot)}
.msg.warn{color:var(--warn)} .msg.warn .ic{color:var(--warn-dot)}
.msg.say{color:var(--fg-2)} .msg.say .ic{color:var(--fg-3)}
.msg code{font-family:var(--font-mono);font-size:11.5px}
.msg .fx{color:var(--accent);font-weight:500;white-space:nowrap}
.msg .fx:hover{text-decoration:underline}
.rform-f{display:flex;gap:var(--s-2);align-items:center;margin-top:var(--s-5);flex-wrap:wrap}
.rform-f .grow{flex:1}
.rform-f .say{font-size:12px;color:var(--fg-3)}

/* The page picker, the one the editor's link dialog uses. */
.pickpop{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);box-shadow:var(--shadow-2);padding:6px;display:flex;flex-direction:column;gap:6px;min-width:280px}
.pickpop .psearch{max-width:none;flex:none}
.pickpop .res{display:flex;flex-direction:column}
.pickpop .res button{display:flex;align-items:center;gap:var(--s-3);padding:7px 9px;border-radius:var(--r-1);font-size:12.5px;text-align:left;min-width:0}
.pickpop .res button:hover,.pickpop .res button:focus-visible{background:var(--surface-2);outline:0}
.pickpop .res button .ic{width:14px;height:14px;color:var(--fg-3)}
.pickpop .res button .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickpop .res button .at{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);white-space:nowrap;flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.pickpop .more{padding:4px 9px 2px;font-size:11.5px;color:var(--fg-3)}

/* Code redirects, read-only, under the table. */
.coded{border-top:1px solid var(--border)}
.coded > button{display:flex;align-items:center;gap:8px;width:100%;padding:var(--s-3) var(--pad-x);font-size:12.5px;color:var(--fg-2);text-align:left;background:var(--bg)}
.coded > button:hover{color:var(--fg)}
.coded > button .ic{width:14px;height:14px;color:var(--fg-3)}
.coded > button .chev{margin-left:auto;transition:transform .15s}
.coded > button[aria-expanded="true"] .chev{transform:rotate(180deg)}
.coded ul{border-top:1px solid var(--border)}
.coded li{display:grid;grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr) 190px;gap:var(--s-3);padding:10px var(--pad-x);border-bottom:1px solid var(--border);align-items:center;font-size:12.5px}
.coded li:last-child{border-bottom:0}
.coded li .ic{width:14px;height:14px;color:var(--fg-3)}
@media (max-width:760px){.coded li{grid-template-columns:minmax(0,1fr)}.coded li > .ic{display:none}}

.menu button.danger{color:var(--danger)}
.menu button.danger .ic{color:var(--danger-dot)}
.menu button.danger:hover{background:var(--danger-soft);color:var(--danger)}
.tbl-shell{position:relative}

/* ---- matched to the running admin's tables ---- */
/* The tri-state header box: a bar when some of the page is chosen. */
.cbx input:indeterminate + .bx{background:var(--accent);border-color:var(--accent)}
.cbx input:indeterminate + .bx .ic{display:none}
.cbx input:indeterminate + .bx::after{content:"";width:8px;height:2px;border-radius:1px;background:var(--accent-fg)}
.utabs button .ic{width:14px;height:14px;color:var(--warn-dot)}
/* Page, rows per page, and the way on. */
.pager2{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-3) var(--pad-x);border-top:1px solid var(--border);font-size:12.5px;color:var(--fg-2);flex-wrap:wrap}
.pager2 .grow{flex:1}
.pager2 .sel{flex:0 0 150px;min-width:0}
.pager2 .btn .ic{width:14px;height:14px}
.ftools .sel{flex:0 1 210px}
.ftools .dens{margin-left:auto}
/* Compact rows drop the second lines, never a problem. */
table.tbl.rd.dense td{padding-block:9px}
table.tbl.rd.dense .rto .at,table.tbl.rd.dense .radd small{display:none}
.bulk b{font-weight:500}
.bulk .btn .ic{width:15px;height:15px}
/* The Content panel nests a type's taxonomies under it. */
.side nav.side-top{padding-top:var(--s-3)}
.side-nest{position:relative;padding-left:22px;display:flex;flex-direction:column;gap:2px}
.side-nest::before{content:"";position:absolute;left:21px;top:2px;bottom:2px;width:1px;background:var(--border)}

/* ---- one notice, the shape the Themes screen uses ---- */
/* A boxed notice with a glyph: neutral explains, warn is a state. Used once in
   the form, and per row only on the Problems tab. */
.tnote{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--border);background:var(--surface-2);border-radius:var(--r-1);font-size:12.5px;color:var(--fg-2);line-height:1.55;max-width:720px}
.tnote > .ic{width:15px;height:15px;margin-top:2px;color:var(--fg-3)}
.tnote.warn{background:var(--warn-soft);border-color:var(--warn-dot);color:var(--warn)}
.tnote.warn > .ic{color:var(--warn-dot)}
.tnote .lines{display:flex;flex-direction:column;gap:3px;min-width:0}
.tnote code{font-family:var(--font-mono);font-size:11.5px}
.tnote .fx{color:var(--accent);font-weight:500;white-space:nowrap}
.tnote .fx:hover{text-decoration:underline}
.tnote.in-row{margin-top:8px;font-family:var(--font-ui)}
.tnote.in-form{margin-top:var(--s-4)}
/* Elsewhere a problem is only a mark beside the address. */
.pmark{display:inline-grid;place-items:center;width:22px;height:22px;margin-left:6px;vertical-align:-5px;border-radius:var(--r-1);color:var(--warn-dot)}
.pmark:hover{background:var(--warn-soft)}
.pmark .ic{width:14px;height:14px}
/* Where an address goes, at the top of the table while one is searched. */
.trace{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px var(--pad-x);border-bottom:1px solid var(--border);background:var(--bg);font-size:12.5px}
.trace .lbl{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.trace .lbl .ic{width:14px;height:14px}
.trace .chain{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px}
.tk{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border:1px solid var(--border);border-radius:var(--r-1);background:var(--surface);color:var(--fg);white-space:nowrap}
.tk .ic{width:13px;height:13px;color:var(--fg-3)}
.tk.mono{font-family:var(--font-mono);font-size:12px}
.tk.pg .ic{color:var(--good-dot)}
.tk.gone{color:var(--fg-3);text-decoration:line-through;text-decoration-color:var(--border-strong)}
.tk.nf{color:var(--danger);border-color:transparent;background:var(--danger-soft)}
.tk.nf .ic{color:var(--danger-dot)}
.arr{display:inline-flex;align-items:center;gap:2px;color:var(--fg-3)}
.arr .ic{width:14px;height:14px}
.arr small{font-family:var(--font-mono);font-size:10.5px}
.arr.eq{font-size:12px}
.trace .fx{color:var(--accent);font-weight:500}
.trace .fx:hover{text-decoration:underline}
.trace .say{flex-basis:100%;color:var(--fg-3);font-size:12px}
/* The notice row belongs to the redirect above it. */
table.tbl.rd tr.has-note > td{border-bottom:0;padding-bottom:10px}
table.tbl.rd tr.nrow > td{padding-top:0}
table.tbl.rd tbody tr.nrow:hover td{background:transparent}
table.tbl.rd tbody tr.nrow.selr td{background:var(--accent-soft)}
table.tbl.rd tr.has-note:hover + tr.nrow td{background:var(--surface-2)}
/* Lighter edge on the warning notice: the fill already says warn. */
.tnote.warn{border-color:color-mix(in srgb,var(--warn-dot) 35%,transparent)}
/* The problem chip: a pill with a dot and a word, pressed while its notice shows. */
.pchip{margin-left:8px;vertical-align:1px;cursor:pointer;font-family:var(--font-ui);height:20px;font-size:11px}
.pchip:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn-dot) 45%,transparent)}
.pchip[aria-expanded="true"]{box-shadow:inset 0 0 0 1px var(--warn-dot)}

/* ---- the dialog: add and edit ---- */
dialog.rdlg{padding:0;border:1px solid var(--border-strong);border-radius:var(--r-3);background:var(--surface);color:var(--fg);box-shadow:var(--shadow-3);width:min(560px,calc(100vw - 32px));max-height:calc(100% - 48px);overflow:visible}
dialog.rdlg::backdrop{background:color-mix(in srgb,var(--fg) 28%,transparent)}
.rdlg-h{display:flex;align-items:center;padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--border)}
.rdlg-h > div{flex:1;min-width:0}
.rdlg-h h2{font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.rdlg-h .sub{font-size:12.5px;color:var(--fg-3);margin-top:3px}
.rdlg-h .btn{margin:-4px -6px 0 0}
.rdlg-b{display:flex;flex-direction:column;gap:var(--s-4);padding:var(--s-5)}
.rdlg-b .lead{font-size:13.5px;color:var(--fg-2);line-height:1.6}
.rdlg-f{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;padding:var(--s-4) var(--s-5);border-top:1px solid var(--border);background:var(--bg);border-radius:0 0 calc(var(--r-3) - 1px) calc(var(--r-3) - 1px)}
.rdlg-f .grow{flex:1}
.rdlg-f .say{font-size:12px;color:var(--fg-3)}
.rdlg .tnote{max-width:none}
/* To's page list hangs from the box itself. */
.pickpop.combo{top:calc(100% + 4px);padding:4px}
.fld2:has(.combo) > .msg{display:none}
.pickpop.combo .res button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.pickpop.combo .res button[aria-selected="true"] .ic{color:var(--accent)}
.fld2 > label + .inp + .pickpop.combo{top:calc(100% + 4px)}
.chosen{outline-offset:2px}
/* A scrim darkens, so in dark it is made from the ground, not the ink.
   (The admin has no --scrim token yet; this is the case it asks for.) */
@media (prefers-color-scheme: dark){:root:not([data-color-scheme="light"]) dialog.rdlg::backdrop{background:color-mix(in srgb,var(--bg) 72%,transparent)}}
:root[data-color-scheme="dark"] dialog.rdlg::backdrop{background:color-mix(in srgb,var(--bg) 72%,transparent)}

/* The checkbox column is the box and its gutter, no more: the first data
   column starts about 20px after the box, as in the running admin's lists. */
table.tbl.rd > thead > tr > th:nth-child(2),table.tbl.rd > tbody > tr > td:nth-child(2){padding-left:var(--s-4)}

/* ---- the toast, as §7 and the running admin have it ---- */
.toast{border:0;padding:11px 11px 11px 15px;gap:var(--s-3);max-width:min(440px,calc(100vw - 32px));box-shadow:var(--shadow-2)}
.toast > .ic{flex:none;width:17px;height:17px;color:var(--good-dot)}
.toast.danger > .ic,.toast.warn > .ic{color:var(--danger-dot)}
.toast.warn > .ic{color:var(--warn-dot)}
.toast.info > .ic{color:var(--accent)}
.toast .msg{min-width:0;flex:1;line-height:1.45}
.toast .msg code{font-family:var(--font-mono);font-size:12px}
.toast-ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
